<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神貓卓CoC紀錄144.殉夢而逐</title>
<style>
:root{
  --paper:#e7e9ef; --panel:#fbfcfe; --ink:#191d29; --ink-2:#3c4759;
  --muted:#6d7689; --line:#c9cedb;
  --bar-bg:rgba(231,233,239,.93); --accent:var(--ink); --accent-ink:var(--panel);
  --secret:#6a4b9c; --secret-bg:#efeaf7; --secret-line:#b9a5d8;
  --dice:#0e6a66; --dice-bg:#e6f1f0;
  --info:#8a5a12; --info-bg:#f6efe2;
  --other:#7a8194;
  --reward:#2f6b45; --reward-bg:#eaf2ec; --reward-line:#a9c6b4;
  --tele:#6d5b9c; --recall:#8a7a52; --recall-line:#ddceac; --recall-ink:#4c4530;
  --recall-edge:rgba(176,148,86,.30);
  --note:#a24a6d; --note-bg:#f7eef2; --note-line:#dcbccb; --note-ink:#4a2233;
  --pc:#355a7a; --pc-bg:#eef2f6; --pc-line:#c3d0dd; --pc-accent:#b98a2e;
  --battle:#a83232; --battle-bg:#f6e9e7; --battle-end:#5a6472; --battle-end-bg:#eceef1;
  --epi:#8a6d3b; --epi-bg:#f5f0e5; --epi-line:#d9cca9;
  --chapter:#2a2f3a; --chapter-ink:#f2f0ea; --chapter-accent:#9a6a4a;
  --pro:#46707f; --pro-bg:#e9f0f2; --pro-line:#b5cdd5;
  --round:#8c3d3d; --round-bg:#f7ecea;
  --order:#7a5230; --order-bg:#f4ede3; --order-line:#d8c4a6;
  --mad:#8e3b63; --mad-bg:#f3e8ee; --mad-line:#d5b3c6; --mad-ink:#3d2130;
  --hidden:#2b2b38; --hidden-ink:#d8d4e2; --hidden-accent:#9d8fc4;
  --radius:3px;
  --mono:"Roboto Mono","DejaVu Sans Mono",ui-monospace,"Noto Sans TC",monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}

/* ── 風格樣板 ───────────────────────────── */
html[data-theme="ledger"]{
  --paper:#ece7d9;--panel:#f6f2e7;--ink:#3a3025;--ink-2:#5a4f3e;--muted:#8a7c64;--line:#d6ccb5;
  --bar-bg:rgba(236,231,217,.93);--accent:#8a3d2f;--accent-ink:#f6f2e7;
  --recall-edge:rgba(176,148,86,.30);--hidden:#2c2620;--hidden-ink:#e6ddca;--hidden-accent:#c9a24a;
}
html[data-theme="forest"]{
  --paper:#eef0e3;--panel:#f7f8f0;--ink:#2f3826;--ink-2:#4a543c;--muted:#79856a;--line:#d2d8c2;
  --bar-bg:rgba(238,240,227,.93);--accent:#4a7a3a;--accent-ink:#f7f8f0;
  --recall-edge:rgba(150,160,90,.28);--hidden:#26301f;--hidden-ink:#dfe6cf;--hidden-accent:#8fb56a;
}
html[data-theme="darkfantasy"]{
  --paper:#17130d;--panel:#221a12;--ink:#e9dcc0;--ink-2:#c9b284;--muted:#9a8a6a;--line:#3a3123;
  --bar-bg:rgba(23,19,13,.92);--accent:#c9a24a;--accent-ink:#221a12;
  --hidden:#0c0a06;--secret:#a988d8;--dice:#4aa39d;--reward:#5aa06f;--pro:#6f9fb0;--info:#c69a4a;
  --secret-bg:var(--panel);--dice-bg:var(--panel);--info-bg:var(--panel);--reward-bg:var(--panel);
  --note-bg:var(--panel);--pc-bg:var(--panel);--battle-bg:var(--panel);--battle-end-bg:var(--panel);
  --epi-bg:var(--panel);--pro-bg:var(--panel);--round-bg:var(--panel);--order-bg:var(--panel);--mad-bg:var(--panel);
  --secret-line:var(--line);--reward-line:var(--line);--note-line:var(--line);--pc-line:var(--line);
  --epi-line:var(--line);--pro-line:var(--line);--order-line:var(--line);--mad-line:var(--line);--recall-line:var(--line);
  --note-ink:var(--ink);--mad-ink:var(--ink);--recall-ink:var(--ink);--hidden-ink:var(--ink);
  --recall-edge:rgba(190,175,120,.16);
  --chapter:var(--panel);--chapter-ink:var(--ink);--chapter-accent:var(--accent);
  --pc-accent:var(--accent);--order:#a9824f;--pc:#5f8bb0;
  --hidden-accent:var(--accent);
}
html[data-theme="urbanhorror"]{
  --paper:#0d0d10;--panel:#17171b;--ink:#d0d3da;--ink-2:#a7abb4;--muted:#7c828e;--line:#2a2b31;
  --bar-bg:rgba(13,13,16,.92);--accent:#c0392b;--accent-ink:#ffffff;
  --hidden:#050507;--secret:#9b7fd0;--dice:#3fa39c;--reward:#4f9e6a;--pro:#5f93a8;--info:#c08a3a;--mad:#c0506f;--battle:#c0392b;
  --secret-bg:var(--panel);--dice-bg:var(--panel);--info-bg:var(--panel);--reward-bg:var(--panel);
  --note-bg:var(--panel);--pc-bg:var(--panel);--battle-bg:var(--panel);--battle-end-bg:var(--panel);
  --epi-bg:var(--panel);--pro-bg:var(--panel);--round-bg:var(--panel);--order-bg:var(--panel);--mad-bg:var(--panel);
  --secret-line:var(--line);--reward-line:var(--line);--note-line:var(--line);--pc-line:var(--line);
  --epi-line:var(--line);--pro-line:var(--line);--order-line:var(--line);--mad-line:var(--line);--recall-line:var(--line);
  --note-ink:var(--ink);--mad-ink:var(--ink);--recall-ink:var(--ink);--hidden-ink:var(--ink);
  --recall-edge:rgba(190,175,120,.16);
  --chapter:var(--panel);--chapter-ink:var(--ink);--chapter-accent:var(--accent);
  --pc-accent:var(--accent);--order:#a9824f;--pc:#5f8bb0;
  --hidden-accent:var(--accent);
}
html[data-theme="cthulhu"]{
  --paper:#0e1310;--panel:#161d18;--ink:#cdd8c9;--ink-2:#a3b3a2;--muted:#7d8c7c;--line:#263029;
  --bar-bg:rgba(14,19,16,.92);--accent:#6f9e77;--accent-ink:#0e1310;
  --hidden:#070b08;--secret:#9986c8;--dice:#4aa8a0;--reward:#5aa06f;--pro:#6f9fa8;--info:#bfa14a;
  --secret-bg:var(--panel);--dice-bg:var(--panel);--info-bg:var(--panel);--reward-bg:var(--panel);
  --note-bg:var(--panel);--pc-bg:var(--panel);--battle-bg:var(--panel);--battle-end-bg:var(--panel);
  --epi-bg:var(--panel);--pro-bg:var(--panel);--round-bg:var(--panel);--order-bg:var(--panel);--mad-bg:var(--panel);
  --secret-line:var(--line);--reward-line:var(--line);--note-line:var(--line);--pc-line:var(--line);
  --epi-line:var(--line);--pro-line:var(--line);--order-line:var(--line);--mad-line:var(--line);--recall-line:var(--line);
  --note-ink:var(--ink);--mad-ink:var(--ink);--recall-ink:var(--ink);--hidden-ink:var(--ink);
  --recall-edge:rgba(190,175,120,.16);
  --chapter:var(--panel);--chapter-ink:var(--ink);--chapter-accent:var(--accent);
  --pc-accent:var(--accent);--order:#a9824f;--pc:#5f8bb0;
  --hidden-accent:var(--accent);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.85;
  background-image:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(0deg,rgba(0,0,0,.02) 0 1px,transparent 1px 4px);}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 120px}

/* ── header ───────────────────────────────── */
header.mast{padding:52px 0 26px;border-bottom:1px solid var(--line)}
.mast .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase}
.mast h1{font-family:var(--serif);font-weight:700;font-size:var(--title-size,clamp(30px,5.5vw,46px));
  letter-spacing:.14em;margin:.28em 0 .1em;white-space:nowrap;overflow:hidden}
.mast .sub{color:var(--muted);font-size:14px;letter-spacing:.1em;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.mast .stat{font-family:var(--mono);font-size:13px;opacity:.75}
[contenteditable]{outline:none;border-bottom:1px dashed transparent;cursor:text}
[contenteditable]:hover{border-bottom-color:var(--line)}
[contenteditable]:focus{border-bottom-color:var(--ink);background:rgba(255,255,255,.5)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55}

/* ── toolbar ──────────────────────────────── */
.bar{position:sticky;top:0;z-index:20;background:var(--bar-bg);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:26px}
.bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--mono);font-size:13px;letter-spacing:.08em;padding:5px 11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:var(--radius);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--panel);background:var(--ink);border-color:var(--ink)}
#expHtml[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.style-pick{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;
  letter-spacing:.08em;color:var(--muted)}
.style-pick select{font-family:var(--mono);font-size:13px;padding:4px 8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:var(--radius);cursor:pointer}
.chip.k-secret[aria-pressed="true"]{background:var(--secret);border-color:var(--secret)}
.chip.k-dice[aria-pressed="true"]{background:var(--dice);border-color:var(--dice)}
.chip.k-info[aria-pressed="true"]{background:var(--info);border-color:var(--info)}
input[type=search],select{font-family:var(--sans);font-size:14px;padding:5px 9px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:var(--radius);min-width:150px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto}

/* ── log rows ─────────────────────────────── */
.line{display:flex;gap:12px;padding:9px 0 9px 14px;border-left:3px solid transparent;position:relative}
.line + .line{margin-top:2px}
.line.main{border-left-color:var(--ink)}
.line.other{border-left-color:transparent;color:var(--other);font-size:14.5px;line-height:1.6}
.line.other .name{color:var(--other)}
.avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--line);
  background:var(--panel);margin-top:2px}
.avatar.ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--panel)}
.line.other .avatar{flex-basis:28px;width:28px;height:28px}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:14px;letter-spacing:.06em;margin-bottom:1px}
.text{white-space:pre-wrap;word-break:break-word}
/* 心靈感應 telepathy：無框柔光心聲泡泡 */
.tele{display:flex;gap:10px;margin:18px 0;align-items:flex-start}
.tele.right{flex-direction:row-reverse}
.tele .col{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:76%}
.tele.right .col{align-items:flex-end}
.tele .who{font-size:13px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tele.right .who{justify-content:flex-end}
.tele .to{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted)}
.tele .mtag{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:#fff;background:var(--secret);
  padding:1px 6px;border-radius:2px}
.tele .bubbles{display:flex;flex-direction:column;gap:11px;width:100%}
.tele.right .bubbles{align-items:flex-end}.tele.left .bubbles{align-items:flex-start}
.tele .bubble{position:relative;max-width:100%;padding:9px 17px;border-radius:26px/17px;
  line-height:1.75;word-break:break-word;white-space:pre-wrap;
  color:var(--ink);background:var(--tbub,rgba(109,91,156,.12));
  border:1px dashed var(--tln,rgba(109,91,156,.34));box-shadow:0 0 9px 0 var(--tglow,rgba(109,91,156,.14))}
.tele .bubble:has(ruby){line-height:2.3}
.tele .bubble .q{font-style:normal;opacity:.5;padding:0 2px}
.tele.secret .bubble{background:
    repeating-linear-gradient(135deg,var(--sstripe,rgba(106,75,156,.06)) 0 6px,transparent 6px 12px),var(--tbub,rgba(109,91,156,.12))}

/* 回憶 recall（A-1：連續 recall 為一段，頻道 secret 走秘匿） */
.recall{margin:0;padding:6px 24px;background:transparent;color:var(--recall-ink);position:relative}
.recall::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(to right,var(--recall-edge),transparent 48px) no-repeat,
             linear-gradient(to left,var(--recall-edge),transparent 48px) no-repeat}
.recall > *{position:relative;z-index:1}
.recall.is-first{margin-top:42px;box-shadow:inset 0 22px 24px -16px var(--recall-edge)}
.recall.is-last{margin-bottom:42px;box-shadow:inset 0 -22px 24px -16px var(--recall-edge)}
.recall.is-first.is-last{box-shadow:inset 0 22px 24px -16px var(--recall-edge),inset 0 -22px 24px -16px var(--recall-edge)}
.recall .rc-cap{padding:4px 0 10px;margin-bottom:4px}
.recall .rc-cap .rc-title{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--recall);
  font-weight:700}
.recall .rc-line{display:flex;gap:11px;align-items:flex-start;padding:4px 0}
.recall .rc-body{flex:1;min-width:0}
.recall .rc-name{font-size:13px;font-weight:700;letter-spacing:.05em;margin-bottom:2px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.recall .rc-name .mtag{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:#fff;
  background:var(--secret);padding:1px 6px;border-radius:2px}
.recall .rc-name .to{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted)}
.recall .rc-text,.recall .rc-narr{white-space:pre-wrap;word-break:break-word;line-height:1.82}
.recall .rc-narr{font-family:var(--serif);font-style:italic;padding:4px 0 4px 14px;color:var(--recall-ink);opacity:.92}
.recall .rc-text p,.recall .rc-narr p{margin:0}
.recall .rc-text p + p,.recall .rc-narr p + p{margin-top:.6em}
.recall .rc-text.sec,.recall .rc-narr.sec{
  background:repeating-linear-gradient(135deg,var(--sstripe,rgba(106,75,156,.06)) 0 6px,transparent 6px 12px),transparent;
  border-left:2px solid var(--sac,var(--secret));padding-left:10px;border-radius:2px}

/* 聊天訊息 message */
.msg{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.msg.right{flex-direction:row-reverse}
.msg .col{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:76%}
.msg.right .col{align-items:flex-end}
.msg .who{font-size:13px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.msg.right .who{justify-content:flex-end}
.msg .to{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted)}
.msg .mtag{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:#fff;background:var(--secret);
  padding:1px 6px;border-radius:2px}
.msg .bubbles{display:flex;flex-direction:column;gap:4px;width:100%}
.msg.right .bubbles{align-items:flex-end}
.msg.left .bubbles{align-items:flex-start}
.msg .bubble{position:relative;max-width:100%;padding:8px 13px;border-radius:14px;line-height:1.75;
  word-break:break-word;white-space:pre-wrap;background:var(--bub,var(--panel));border:1px solid var(--bubln,var(--line))}
.msg.left .bubble.first{border-top-left-radius:4px}
.msg.right .bubble.first{border-top-right-radius:4px}
.msg .bubble:has(ruby){line-height:2.2}
.msg .bubble.sticker{background:none;border:0;box-shadow:none;padding:0}
.msg .bubble.sticker.first::after{content:none;display:none}
.msg .msg-sticker{display:block;max-width:min(190px,60vw);max-height:190px;width:auto;height:auto;
  border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.msg .msg-sticker.ph{display:inline-flex;align-items:center;justify-content:center;min-width:130px;min-height:90px;
  border:1px dashed var(--line);color:var(--muted);font-family:var(--mono);font-size:13px;padding:14px}
/* 尖角：只在第一顆氣泡、指向頭像側 */
.msg .bubble.first::after{content:"";position:absolute;top:9px;width:9px;height:9px;transform:rotate(45deg);
  background:var(--bub,var(--panel));border:1px solid var(--bubln,var(--line))}
.msg.left .bubble.first::after{left:-5px;border-right:0;border-top:0}
.msg.right .bubble.first::after{right:-5px;border-left:0;border-bottom:0}
/* 秘匿訊息：紫色斜紋 */
.msg.secret .bubble{background:
    repeating-linear-gradient(135deg,var(--sstripe,rgba(106,75,156,.06)) 0 6px,transparent 6px 12px),var(--sbub,var(--secret-bg));
  border-color:var(--sln,var(--secret-line))}
.msg.secret .bubble.first::after{background:var(--sbub,var(--secret-bg));border-color:var(--sln,var(--secret-line))}

.msg.secret .to{color:var(--secret);opacity:.85}

.text p,.hidden-info .tx p,.sys .tx p{margin:0}
.text p + p{margin-top:.6em}
.hidden-info .tx p + p,.sys .tx p + p{margin-top:.4em}
/* 有注音的行加大行高，讓上方小字有空間；普通行不受影響 */
.text:has(ruby),.hidden-info .tx:has(ruby){line-height:2.35}
ruby{ruby-align:space-around;ruby-position:over}
ruby rt{font-size:.68em;letter-spacing:.04em;line-height:1.25;color:#5b626f;font-weight:400;
  margin-bottom:1px;user-select:text}
.line.nameless .text{padding-left:0}

/* ── secret ───────────────────────────────── */
.line.secret{background:
    repeating-linear-gradient(135deg,var(--sstripe,rgba(106,75,156,.055)) 0 6px,transparent 6px 12px),var(--sbub,var(--secret-bg));
  border-left:3px solid var(--sac,var(--secret));border-right:1px solid var(--sln,var(--secret-line));
  border-top:1px solid var(--sln,var(--secret-line));border-bottom:1px solid var(--sln,var(--secret-line));
  padding:11px 14px 11px 16px;margin-top:4px}
.seal{position:absolute;top:-1px;right:-1px;background:var(--secret);color:#fff;font-family:var(--mono);
  font-size:13px;letter-spacing:.22em;padding:2px 7px}
.line.secret .name{color:var(--secret)}
.target{font-family:var(--mono);font-size:13px;color:var(--secret);opacity:.8;letter-spacing:.05em}

/* ── scene / dice / system / info ─────────── */
.scene{margin:46px 0 32px;text-align:center}
.scene .idx{font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--muted);display:block;margin-bottom:12px}
.scene .rulebar{display:flex;align-items:center;gap:18px}
.scene .rulebar::before,.scene .rulebar::after{content:"";flex:1;height:1px;background:var(--line)}
.scene .label{font-family:var(--serif);font-size:16px;letter-spacing:.5em;text-indent:.5em;color:var(--ink);
  flex:0 1 auto;max-width:70%}

.dice{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:14px;
  background:var(--dice-bg);border-left:3px solid var(--dice);padding:7px 12px;margin:6px 0}
.dice .who{color:var(--dice);font-weight:700;flex:0 0 auto}
.dice .whisper{flex:0 0 auto}
.dice .rolls{flex:1;min-width:0;display:flex;flex-direction:column}
.dice .roll{display:flex;gap:10px;align-items:baseline}
.dice .roll + .roll{margin-top:.5em}
.dice .expr{flex:1;word-break:break-all;color:#33414a}
.dice .res{font-weight:700;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.dice.sec{background:
    repeating-linear-gradient(135deg,var(--sstripe,rgba(106,75,156,.06)) 0 6px,transparent 6px 12px),var(--sbub,var(--secret-bg));
  border-left-color:var(--sac,var(--secret));border-top:1px dashed var(--sln,var(--secret-line));
  border-bottom:1px dashed var(--sln,var(--secret-line));border-right:1px dashed var(--sln,var(--secret-line))}
.dice.sec .who{color:var(--secret)}
.dice.sec .expr{color:#4a4159}
.dice .tag{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:#fff;background:var(--secret);
  padding:1px 6px;flex:0 0 auto;align-self:center}
.dice.sec .whisper{font-family:var(--mono);font-size:13px;color:var(--secret);opacity:.85;flex:0 0 auto}
.res.good{color:#0d6b3a}.res.bad{color:#a02020}.res.crit{color:#0b5fa5}.res.fumble{color:#6a0d0d}

.sessionmark{margin:60px 0 54px;text-align:center}
.sessionmark .frame{border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:18px 12px}
.sessionmark .glyph{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.5em;text-indent:.5em;
  color:var(--muted)}
.sessionmark .word{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.55em;text-indent:.55em;
  color:var(--muted);margin-top:6px}
.sessionmark .label{display:block;font-family:var(--serif);font-size:clamp(20px,3.4vw,26px);
  letter-spacing:.42em;text-indent:.42em;color:var(--ink);margin-top:10px}
/* start：三角朝下（團務由此展開）；end：三角朝上（收束上方內容） */

.reward{margin:26px 0;padding:18px 22px;background:var(--reward-bg);
  border:1px solid var(--reward-line);box-shadow:inset 0 0 0 3px var(--reward-bg),inset 0 0 0 4px var(--reward-line)}
.reward .head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;
  border-bottom:1px dotted var(--reward-line);padding-bottom:7px}
.reward .badge{font-family:var(--mono);font-size:13px;letter-spacing:.28em;color:var(--reward);
  border:1px solid var(--reward);padding:1px 7px}
.reward .ttl{font-family:var(--serif);font-size:17px;letter-spacing:.18em;color:var(--reward)}
.reward .text{white-space:pre-wrap;word-break:break-word;color:var(--ink)}

.note{margin:24px 0;background:var(--note-bg);border:1px solid var(--note-line);border-radius:var(--radius);
  position:relative;overflow:hidden}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--note);
  background-image:repeating-linear-gradient(0deg,var(--note) 0 8px,transparent 8px 12px)}
.note .cap{display:flex;align-items:center;gap:10px;padding:11px 20px 9px;border-bottom:1px dashed var(--note-line)}
.note .cap .mk{font-family:var(--mono);font-size:13px;letter-spacing:.26em;color:#fff;background:var(--note);padding:2px 8px}
.note .cap .who{font-family:var(--serif);font-size:16px;letter-spacing:.14em;color:var(--note)}
.note .text{white-space:pre-wrap;word-break:break-word;padding:14px 22px 18px;color:var(--note-ink);
  font-family:var(--serif);line-height:2}

/* ── 目錄（右側固定面板）──────────────────── */
html{scroll-behavior:smooth}
#toc{margin:18px 0 8px}
.toc-box{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  transition:transform .22s ease,opacity .18s ease}
.toc-head{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
  font-family:var(--serif);font-size:13.5px;letter-spacing:.14em;color:var(--ink);user-select:none}
.toc-head .n{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.toc-toggle{border:0;background:none;cursor:pointer;padding:0 2px;color:var(--muted);
  font-family:var(--mono);font-size:13px;line-height:1}
.toc-toggle:hover{color:var(--ink)}
/* 收合把手（收起後出現在右緣） */
.toc-tab{display:none;position:fixed;right:0;top:96px;z-index:16;cursor:pointer;
  border:1px solid var(--line);border-right:0;border-radius:var(--radius) 0 0 var(--radius);
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:13px;letter-spacing:.2em;
  padding:11px 6px;writing-mode:vertical-rl;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.toc-tab:hover{background:var(--paper)}
/* 拖曳寬度的握把 */
.toc-grip{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;touch-action:none}
.toc-grip::before{content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:2px;height:26px;border-radius:2px;background:var(--line)}
.toc-grip:hover::before{background:var(--muted)}
body.tocdrag{user-select:none;cursor:col-resize}
.toc-list{padding:5px;display:flex;flex-direction:column;gap:1px}
.toc-list a{display:block;padding:3px 7px;border-radius:2px;text-decoration:none;color:var(--ink);
  border-left:2px solid transparent;line-height:1.35}
.toc-list a:hover{background:var(--paper);border-left-color:var(--ink)}
.toc-list a .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;opacity:.8}
.toc-list a .t{display:block;font-size:13px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-list a.k-chp .k{color:var(--chapter-accent)}
.toc-list a.k-chp:hover{border-left-color:var(--chapter)}
.toc-list a.k-chp .t{font-weight:700}
.toc-list a.k-scene .k{color:var(--muted)}
.toc-list a.k-pro .k{color:var(--pro)}
.toc-list a.k-epi .k{color:var(--epi)}
.toc-list a.k-rwd .k{color:var(--reward)}
.toc-list a.k-pro:hover{border-left-color:var(--pro)}
.toc-list a.k-epi:hover{border-left-color:var(--epi)}
.toc-list a.k-rwd:hover{border-left-color:var(--reward)}
[data-anchor]{scroll-margin-top:96px}

/* 捲軸：項目過多時明顯提示可上下拖拉 */
.toc-list{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.toc-list::-webkit-scrollbar{width:9px}
.toc-list::-webkit-scrollbar-track{background:var(--paper);border-radius:9px}
.toc-list::-webkit-scrollbar-thumb{background:var(--muted);border-radius:9px;
  border:2px solid var(--panel)}
.toc-list::-webkit-scrollbar-thumb:hover{background:var(--ink)}

/* 寬螢幕：釘在右側，不隨捲動移動 */
@media (min-width:1220px){
  #toc{position:fixed;top:96px;right:22px;width:var(--tocw,208px);margin:0;z-index:15}
  .toc-box{box-shadow:0 1px 8px rgba(0,0,0,.06)}
  .toc-list{max-height:calc(100vh - 176px)}
  #toc.collapsed .toc-box{transform:translateX(calc(100% + 26px));opacity:0;pointer-events:none}
  #toc.collapsed .toc-tab{display:block}
}
/* 窄螢幕：回到內文流，避免蓋住團錄；不提供拖曳寬度 */
@media (max-width:1219px){
  .toc-list{max-height:46vh}
  .toc-grip{display:none}
  #toc.collapsed .toc-box{display:none}
  #toc.collapsed .toc-tab{display:inline-block;position:static;writing-mode:horizontal-tb;
    border-right:1px solid var(--line);border-radius:var(--radius);padding:6px 12px}
}

/* ── PC 隊伍資訊 ─────────────────────────── */
#pcs{margin:26px 0 8px}
.pc-section{border:1px solid var(--pc-line);border-radius:var(--radius);background:var(--panel)}
.pc-section>summary{list-style:none;cursor:pointer;padding:12px 18px;display:flex;align-items:center;gap:12px;
  font-family:var(--serif);font-size:16px;letter-spacing:.18em;color:var(--pc);
  border-bottom:1px solid transparent;user-select:none}
.pc-section[open]>summary{border-bottom-color:var(--pc-line)}
.pc-section>summary::-webkit-details-marker{display:none}
.pc-section>summary .tri{font-family:var(--mono);font-size:13px;transition:transform .15s;color:var(--pc)}
.pc-section[open]>summary .tri{transform:rotate(90deg)}
.pc-section>summary .n{font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--muted);margin-left:auto}

.pc-grid{padding:14px;display:grid;gap:14px}


.pc-card{border:1px solid var(--cline,var(--pc-line));border-radius:var(--radius);
  background:var(--cbg,var(--pc-bg));overflow:hidden}
.pc-card>summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:12px;
  padding:11px 15px;border-left:3px solid var(--c,var(--pc))}
.pc-card>summary::-webkit-details-marker{display:none}
.pc-card>summary .thumb{flex:0 0 40px;width:40px;height:40px;border-radius:4px;object-fit:cover;
  border:1px solid var(--pc-line);background:var(--panel)}
.pc-card>summary .thumb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:17px;color:#fff;background:var(--pc)}
.pc-card>summary .id{min-width:0}
.pc-card>summary .id .nm{font-family:var(--serif);font-size:17px;letter-spacing:.1em;color:var(--c,var(--pc));font-weight:700}
.pc-card>summary .id .sub{font-size:13px;color:var(--muted);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-card>summary .tri{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--c,var(--pc));transition:transform .15s}
.pc-card[open]>summary .tri{transform:rotate(90deg)}

.pc-body{display:flex;gap:16px;padding:14px;border-top:1px dashed var(--cline,var(--pc-line));align-items:flex-start}
.pc-portrait{flex:0 0 150px;width:150px;border-radius:4px;border:1px solid var(--cline,var(--pc-line));cursor:zoom-in;
  background:var(--panel) center/cover;display:block}
.pc-portrait.ph{aspect-ratio:3/5;cursor:default;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;color:var(--muted);text-align:center;padding:8px}
.pc-detail{flex:1;min-width:0}
.pc-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:10px;font-size:14px}
.pc-meta b{color:var(--c,var(--pc));font-weight:700;letter-spacing:.05em}
.pc-block{margin-top:12px}
.pc-block .h{font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--c,var(--pc-accent));
  border-bottom:1px solid var(--cline,var(--pc-line));padding-bottom:3px;margin-bottom:8px}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px}
.pc-chip{font-size:13px;font-family:var(--mono);background:var(--panel);border:1px solid var(--cline,var(--pc-line));
  border-radius:3px;padding:2px 8px;white-space:nowrap}
.pc-chip .k{color:var(--muted);margin-right:5px}
.pc-chip .v{color:var(--ink);font-weight:700}
.pc-chip.skill .v{color:var(--c,var(--pc))}
.pc-items{font-size:14px;line-height:1.9;color:var(--ink);white-space:pre-wrap}
@media (max-width:560px){.pc-body{flex-direction:column}.pc-portrait{width:60%;max-width:180px;margin:0 auto}}

.battle{display:flex;align-items:center;gap:14px;margin:30px 0;padding:9px 16px;border-radius:var(--radius)}
.battle .en{font-family:var(--mono);font-size:13px;letter-spacing:.3em;flex:0 0 auto}
.battle .txt{font-family:var(--serif);font-size:16px;letter-spacing:.4em;text-indent:.4em;flex:0 0 auto}
.battle .ln{flex:1;height:1px}
.battle.start{background:
    repeating-linear-gradient(135deg,rgba(168,50,50,.10) 0 8px,transparent 8px 16px),var(--battle-bg);
  border-left:4px solid var(--battle);border-right:1px solid var(--battle)}
.battle.start .txt,.battle.start .en,.battle.start .mk{color:var(--battle)}
.battle.start .ln{background:linear-gradient(90deg,var(--battle),transparent);opacity:.4}
.battle.end{background:var(--battle-end-bg);border-left:4px solid var(--battle-end);
  border-right:1px solid var(--battle-end)}
.battle.end .txt,.battle.end .en,.battle.end .mk{color:var(--battle-end)}
.battle.end .ln{background:var(--battle-end);opacity:.3}
.battle .mk{font-size:16px;flex:0 0 auto}

.epilogue{margin:52px auto;max-width:74%;text-align:center;padding:18px 26px;background:var(--epi-bg);
  border:1px solid var(--epi-line);border-radius:2px;color:var(--epi)}
.epilogue .orn{font-size:18px;letter-spacing:.5em;text-indent:.5em;display:block;opacity:.85}
.epilogue .txt{font-family:var(--serif);font-style:italic;font-size:clamp(18px,3.2vw,23px);
  letter-spacing:.34em;text-indent:.34em;display:block;margin:8px 0}
.epilogue .en{font-family:var(--mono);font-size:13px;letter-spacing:.42em;text-indent:.42em;opacity:.75;display:block}
.epilogue.start{border-top:3px double var(--epi)}
.epilogue.end{border-bottom:3px double var(--epi)}

/* 章節：戰役進入下一段劇情的章節標題（與前/後日談明顯不同的實心書卷帶） */
.chapter{margin:66px 0 34px}
.chapter .band{position:relative;padding:22px 26px;text-align:center;border-radius:2px}
.chapter.start .band{background:var(--chapter);color:var(--chapter-ink);
  box-shadow:0 2px 0 var(--chapter-accent)}
.chapter.start .tag{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.38em;text-indent:.38em;
  color:var(--chapter-accent);margin-bottom:9px}
.chapter.start .title{display:block;font-family:var(--serif);font-size:clamp(21px,4vw,29px);
  letter-spacing:.28em;text-indent:.28em;font-weight:700}
.chapter.start .band::before,.chapter.start .band::after{content:"";position:absolute;left:14px;right:14px;
  height:1px;background:var(--chapter-accent);opacity:.5}
.chapter.start .band::before{top:8px} .chapter.start .band::after{bottom:8px}
.chapter.end .band{background:transparent;color:var(--chapter);border:1px solid var(--chapter);
  border-top-width:3px}
.chapter.end .title{display:block;font-family:var(--serif);font-size:clamp(17px,3vw,22px);
  letter-spacing:.3em;text-indent:.3em}
.chapter.end .tag{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.38em;text-indent:.38em;
  color:var(--chapter-accent);margin-top:8px}

/* 前日談：與後日談對稱，改用晨青色調 */
.prologue{margin:52px auto;max-width:74%;text-align:center;padding:18px 26px;background:var(--pro-bg);
  border:1px solid var(--pro-line);border-radius:2px;color:var(--pro)}
.prologue .orn{font-size:17px;letter-spacing:.5em;text-indent:.5em;display:block;opacity:.85}
.prologue .txt{font-family:var(--serif);font-size:clamp(18px,3.2vw,23px);
  letter-spacing:.34em;text-indent:.34em;display:block;margin:8px 0}
.prologue .en{font-family:var(--mono);font-size:13px;letter-spacing:.42em;text-indent:.42em;opacity:.75;display:block}
.prologue.start{border-top:3px double var(--pro)}
.prologue.end{border-bottom:3px double var(--pro)}

/* 回合標示 */
.round{display:flex;align-items:center;gap:12px;margin:22px 0 14px}
.round .ln{flex:1;height:1px;background:var(--round);opacity:.28}
.round .pill{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:9px;padding:4px 15px;
  background:var(--round-bg);border:1px solid var(--round);border-radius:999px}
.round .pill .t{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--round);font-weight:700}
.round .pill .n{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--round);opacity:.7}

/* 隱藏資訊：團務當下玩家看不到的幕後情報 */
.hidden-info{display:flex;align-items:flex-start;gap:12px;margin:10px 0;padding:9px 14px;font-size:14px;
  background:var(--hidden);border-left:3px solid var(--hidden-accent);border-radius:var(--radius);
  background-image:repeating-linear-gradient(135deg,rgba(157,143,196,.10) 0 7px,transparent 7px 14px)}
.hidden-info .mk{font-family:var(--mono);font-size:13px;letter-spacing:.22em;color:var(--hidden);
  background:var(--hidden-accent);padding:2px 7px;border-radius:2px;flex:0 0 auto;
  line-height:1.4;margin-top:3px}
.hidden-info .lb{font-family:var(--mono);letter-spacing:.12em;color:var(--hidden-accent);
  flex:0 0 auto;line-height:1.75}
.hidden-info .tx{flex:1;min-width:0;font-family:var(--mono);line-height:1.75;
  color:var(--hidden-ink);white-space:pre-wrap;word-break:break-word}

/* COC 發狂（SAN 損失） */
.madness{margin:20px 0;background:var(--mad-bg);border:1px solid var(--mad-line);
  border-left:3px solid var(--mad);border-radius:var(--radius);
  background-image:repeating-linear-gradient(135deg,rgba(142,59,99,.05) 0 9px,transparent 9px 18px)}
.madness .mhead{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:9px 14px;
  border-bottom:1px dashed var(--mad-line)}
.madness .mk{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:#fff;background:var(--mad);
  padding:2px 8px;border-radius:2px}
.madness .term{font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:var(--mad);
  border:1px solid var(--mad);border-radius:2px;padding:1px 8px}
.madness.short .term{opacity:.95}
.madness .who{font-family:var(--serif);font-size:16px;letter-spacing:.08em;color:var(--mad);font-weight:700}
.madness .dur{margin-left:auto;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--mad);
  background:var(--panel);border:1px solid var(--mad-line);border-radius:999px;padding:2px 11px}
.madness .mbody{padding:12px 16px 14px;font-family:var(--serif);font-size:15px;line-height:1.9;
  color:var(--mad-ink);white-space:pre-wrap;word-break:break-word}

/* 行動順位 */
.turnorder{margin:22px 0;padding:12px 14px 14px;background:var(--order-bg);
  border:1px solid var(--order-line);border-left:3px solid var(--order);border-radius:var(--radius)}
.turnorder .h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.turnorder .h .mk{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:#fff;
  background:var(--order);padding:2px 7px;border-radius:2px}
.turnorder .h .ti{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--order)}
.turnorder .seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.turnorder .ent{display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--order-line);border-radius:999px;padding:3px 12px 3px 4px}
.turnorder .ent .no{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--order);color:#fff;
  font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.turnorder .ent .nm{font-size:14px;letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.turnorder .arw{font-family:var(--mono);font-size:13px;color:var(--order);opacity:.55}

/* 圖片：CG／地圖／道具等 */
.figure{margin:26px auto;text-align:center;max-width:100%}
.figure img{max-width:min(560px,100%);max-height:60vh;width:auto;height:auto;border-radius:var(--radius);
  border:1px solid var(--line);cursor:zoom-in;display:inline-block;background:var(--panel)}
.figure img:hover{filter:brightness(.96)}
.figure figcaption{margin-top:8px;font-size:13.5px;color:var(--muted);letter-spacing:.06em;font-family:var(--serif)}
.figure .ph{display:inline-flex;align-items:center;justify-content:center;min-width:220px;min-height:130px;
  border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:13.5px;
  font-family:var(--mono);padding:20px;background:var(--panel)}

.lightbox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(20,22,30,.88);cursor:zoom-out;padding:24px}
.lightbox.on{display:flex}
.lightbox img{max-width:96vw;max-height:92vh;width:auto;height:auto;border-radius:2px;
  box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox .cap{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:#e8e8ef;
  font-family:var(--serif);font-size:14px;letter-spacing:.08em;pointer-events:none}
.lightbox .x{position:fixed;top:16px;right:22px;color:#e8e8ef;font-family:var(--mono);font-size:23px;
  line-height:1;cursor:pointer;opacity:.8}
.lightbox .x:hover{opacity:1}

.sys{display:flex;align-items:flex-start;gap:12px;font-family:var(--mono);font-size:14px;
  color:var(--muted);margin:6px 0;border-top:1px dotted var(--line);border-bottom:1px dotted var(--line);
  padding:4px 14px}
.sys .lb{flex:0 0 auto;letter-spacing:.12em;font-weight:700}
.sys .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}

.line.info{background:var(--info-bg);border:1px solid #e0cfa8;border-left:3px solid var(--info);
  font-family:var(--serif);padding:16px 20px;margin:20px 0}
.line.info .name{color:var(--info);font-family:var(--mono)}

/* ── avatar editor ────────────────────────── */
dialog{border:1px solid var(--line);background:var(--panel);max-width:560px;width:92%;padding:0;border-radius:var(--radius)}
dialog h2{font-family:var(--serif);font-size:18px;margin:0;padding:16px 20px;border-bottom:1px solid var(--line);letter-spacing:.1em}
.editor{max-height:60vh;overflow:auto;padding:12px 20px}

function parseCSV(t){
  t = t.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
function toCSV(objs, cols){
  const esc=v=>{v=(v??'')+''; return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return '\uFEFF'+[cols.join(',')].concat(objs.map(o=>cols.map(c=>esc(o[c])).join(','))).join('\r\n');
}
function download(name, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

// ((主文字上方小字)) → <ruby>；空 (()) 為切刀；其餘照常轉義（僅用於對話類文字）
function stripRuby(text){ return String(text??'').replace(/\(\(.*?\)\)/g,''); }
function renderRuby(text){
  const s=String(text??'');
  if(s.indexOf('((')<0) return esc(s);
  let out='', base='', i=0;
  while(i<s.length){
    const open=s.indexOf('((', i);
    if(open<0){ base+=s.slice(i); break; }
    base+=s.slice(i, open);
    const close=s.indexOf('))', open+2);
    if(close<0){ base+=s.slice(open); break; }   // 未收尾 → 當普通文字
    const rt=s.slice(open+2, close);
    if(rt===''){ out+=esc(base); base=''; }        // (()) 切刀：輸出前段、不注音
    else { out+=`<ruby>${esc(base)}<rt>${esc(rt)}</rt></ruby>`; base=''; }
    i=close+2;
  }
  return out+esc(base);
}

const CN_NUM='零一二三四五六七八九';
function cnNum(n){
  n=parseInt(n,10);
  if(isNaN(n)) return '';
  if(n<0) return String(n);
  if(n<=10) return n===10?'十':CN_NUM[n];
  if(n<20) return '十'+(n%10?CN_NUM[n%10]:'');
  if(n<100){ const t=Math.floor(n/10), o=n%10; return CN_NUM[t]+'十'+(o?CN_NUM[o]:''); }
  return String(n);
}
function lightenFor(hex,minL){
  let h=(hex||'').trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '';
  let r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const lum=()=>(0.299*r+0.587*g+0.114*b)/255;
  let guard=0;
  while(lum()<minL && guard++<24){ r=Math.round(r+(255-r)*0.18); g=Math.round(g+(255-g)*0.18); b=Math.round(b+(255-b)*0.18); }
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// 從內容開頭抓出 [ 名字 ]，回傳 [名字, 其餘內容]
function splitBracketName(text){
  const m=String(text||'').match(/^\s*[\[［]\s*([^\]］]{1,20}?)\s*[\]］]\s*/);
  return m ? [m[1].trim(), String(text).slice(m[0].length)] : ['', String(text||'')];
}
const MAD_DUR=/\s*(\d+\s*(?:個月|分鐘|小時|回合|週|天|年|秒|月))\s*$/;
const MAD_SHORT=/(分鐘|小時|秒|回合)$/;
function parseMadness(text, fallbackName){
  let s=String(text||'').trim(), duration='', term='long';
  const m=s.match(MAD_DUR);
  if(m){ duration=m[1].replace(/\s+/g,''); s=s.slice(0,s.length-m[0].length).trim();
         term=MAD_SHORT.test(duration)?'short':'long'; }
  let name='', content=s;
  if(/\u3000/.test(s)){ const parts=s.split(/\u3000+/); name=parts.shift().trim(); content=parts.join('\u3000').trim(); }
  if(!name) name=(fallbackName||'').trim();
  return {name, content, duration, term};
}
function roundNo(text){
  const s=String(text||'');
  const arrow=s.match(/(-?\d+)\s*(?:→|->|＞|=>)\s*(-?\d+)/);   // 「回合 : 1 → 2」取箭頭後
  if(arrow) return parseInt(arrow[2],10);
  const m=s.match(/(-?\d+)/);                                  // 否則取第一個數字
  return m?parseInt(m[1],10):null;
}
function resultClass(w){
  if(/決定性|大成功|critical/i.test(w)) return 'crit';
  if(/致命|大失敗|fumble/i.test(w)) return 'fumble';
  if(/成功|success/i.test(w)) return 'good';
  if(/失敗|failure/i.test(w)) return 'bad';
  return '';
}

}

const TOC_KEY={chp:'CHAPTER',scene:'SCENE',pro:'PROLOGUE',epi:'AFTER STORY',rwd:'REWARD'};
let tocOpen=true, tocWidth=0;   // tocWidth 僅存在本次瀏覽，重新開啟即回預設
function renderTOC(items){
  const host=document.getElementById('toc');
  if(!items || !items.length){ host.innerHTML=''; host.className=''; return; }
  const rows=items.map(it=>`<a href="#${it.id}" class="k-${it.kind}">
      <span class="k">${esc(it.keyText || TOC_KEY[it.kind] || '')}</span>
      <span class="t">${esc(stripRuby(it.label))}</span></a>`).join('');
  host.className = tocOpen ? '' : 'collapsed';
  if(tocWidth) host.style.setProperty('--tocw', tocWidth+'px'); else host.style.removeProperty('--tocw');
  host.innerHTML=`<div class="toc-box">
      <div class="toc-grip" title="拖曳調整寬度"></div>
      <div class="toc-head"><button class="toc-toggle" title="收起目錄">›</button>目錄<span class="n">${items.length} 項</span></div>
      <div class="toc-list">${rows}</div>
    </div>
    <button class="toc-tab" title="展開目錄">目錄 ‹</button>`;

  host.querySelector('.toc-toggle').onclick=()=>{ tocOpen=false; host.className='collapsed'; };
  host.querySelector('.toc-tab').onclick=()=>{ tocOpen=true; host.className=''; };

  const grip=host.querySelector('.toc-grip');
  grip.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const startX=ev.clientX, startW=host.getBoundingClientRect().width;
    grip.setPointerCapture(ev.pointerId);
    document.body.classList.add('tocdrag');
    const move=e=>{
      const w=Math.min(460, Math.max(140, startW-(e.clientX-startX)));  // 往左拖變寬
      tocWidth=Math.round(w);
      host.style.setProperty('--tocw', tocWidth+'px');
    };
    const up=()=>{
      grip.removeEventListener('pointermove',move);
      grip.removeEventListener('pointerup',up);
      document.body.classList.remove('tocdrag');
    };
    grip.addEventListener('pointermove',move);
    grip.addEventListener('pointerup',up);
  });
}

              return tag+name+to;     // 秘匿 發送者 → 接收者

        </div></div>`);
      continue;
    }

    const pair = (secTarget||'秘匿').replace(/^(秘匿|秘密)/,'');
    const runStart = kind==='secret' && prevSecret !== pair;
    prevSecret = kind==='secret' ? pair : '';
    const nameless=!r['發言人'];
    const color=(s&&s['代表色'])||'';
    out.push(`<div class="line ${kind} ${nameless?'nameless':''}">

      </div></div>`);
  }
  document.getElementById('log').innerHTML=out.join('');
  renderTOC(toc);
  document.getElementById('count').textContent=`${shown} / ${merged.length} 行`;

const TITLE_ROW = r => (r['類型']||'')==='title';

const PC_COLS = ['序','PC','PL','職業','年齡','性別','立繪','數值','技能','持有物品','備註'];
function statPairs(line){
  line = line.trim(); if(!line) return [];
  if(line.indexOf('：')>-1 || line.indexOf(':')>-1){
    return line.split(/[\s\u3000]+/).filter(Boolean).map(p=>{
      const m=p.split(/[：:]/); return [m[0], m.slice(1).join(':')];
    });
  }
  const tk=line.split(/[\s\u3000]+/).filter(Boolean), out=[];
  for(let i=0;i<tk.length;i+=2) out.push([tk[i], tk[i+1]||'']);
  return out;
}
function chipRow(line, cls){
  const ch = statPairs(line).map(([k,v])=>
    `<span class="pc-chip ${cls||''}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span>`).join('');
  return ch ? `<div class="pc-chips">${ch}</div>` : '';
}
function pcPortrait(p){
  if(p['立繪']) return `<img class="pc-portrait" src="${esc(p['立繪'])}" alt="${esc(p['PC']||'')}"
    data-full="${esc(p['立繪'])}" data-cap="${esc(p['PC']||'')}"
    onerror="this.classList.add('ph');this.removeAttribute('src');this.textContent='立繪\n(圖片無法載入)';">`;
  return `<div class="pc-portrait ph">立繪<br>（在 pcs.csv 的「立繪」欄填圖片網址）</div>`;
}
function pcThumb(p){
  if(p['立繪']) return `<img class="thumb" src="${esc(p['立繪'])}" alt=""
    onerror="this.classList.add('ph');this.removeAttribute('src');this.textContent='${esc((p['PC']||'?').slice(0,1))}';">`;
  return `<span class="thumb ph">${esc((p['PC']||'?').slice(0,1))}</span>`;
}
function hexRGBA(hex,a){
  let h=(hex||'').trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '';
  const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function toHex6(hex){ let h=(hex||'').trim().replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return /^[0-9a-fA-F]{6}$/.test(h)?h:''; }
function mixHex(a,b,t){ // a,b 為 hex；t=b 佔比
  const ha=toHex6(a), hb=toHex6(b); if(!ha||!hb) return ha?('#'+ha):(hb?('#'+hb):'');
  const na=parseInt(ha,16), nb=parseInt(hb,16);
  const mix=(sa,sb)=>Math.round(sa*(1-t)+sb*t);
  const r=mix((na>>16)&255,(nb>>16)&255), g=mix((na>>8)&255,(nb>>8)&255), bl=mix(na&255,nb&255);
  return '#'+[r,g,bl].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// 秘匿氣泡／橫幅用：底＝代表色淡；斜紋、邊框＝代表色混一點紫（方案B）
function secStyle(col){
  const base=toHex6(col)?('#'+toHex6(col)):'#6a4b9c';     // 無代表色→退回紫
  const blend=mixHex(base,'#6a4b9c',0.28);                 // 代表色混 28% 紫
  return `--sbub:${hexRGBA(base,0.14)};--sstripe:${hexRGBA(blend,0.10)};`+
         `--sln:${hexRGBA(blend,0.5)};--sac:${hexRGBA(blend,0.9)}`;
}
// 心靈感應：底＝代表色拉往霧紫、低彩度柔光
function teleStyle(col){
  const base=toHex6(col)?('#'+toHex6(col)):'#6d5b9c';
  const mist=mixHex(base,'#6d5b9c',0.4);
  return `--tbub:${hexRGBA(mist,0.12)};--tln:${hexRGBA(mist,0.34)};--tglow:${hexRGBA(mist,0.16)}`;
}

let _fitRAF=0;
function fitTitle(){
  const el=document.getElementById('title'); if(!el) return;
  const MAX=46, MIN=18;
  el.style.fontSize=MAX+'px';
  const avail=el.clientWidth;                    // 版面可用寬度
  if(!avail){ requestAnimationFrame(fitTitle); return; }  // 版面尚未就緒時重試
  if(el.scrollWidth>avail){
    let size=Math.max(MIN, Math.floor(MAX*avail/el.scrollWidth));
    el.style.fontSize=size+'px';
    let guard=0;
    while(el.scrollWidth>avail && size>MIN && guard++<60){ size-=1; el.style.fontSize=size+'px'; }
  }
}
window.addEventListener('resize',()=>{ cancelAnimationFrame(_fitRAF); _fitRAF=requestAnimationFrame(fitTitle); });

/* ── 原始 ccfolia LOG.html → CSV 資料 ─────── */
function convertLog(htmlText){
  const doc = new DOMParser().parseFromString(htmlText,'text/html');
  const grab = el => {
    const tmp = document.createElement('div');
    tmp.innerHTML = el.innerHTML.replace(/<br\s*\/?>/gi,'\n');
    return (tmp.textContent||'').replace(/\u00a0/g,' ').trim();
  };
  const DICE = /(CCB?<?=|choice\[|\d+[dDbB]\d+|1D100)/;
  const rows = [], colors = {};

  [...doc.querySelectorAll('p')].forEach((p,i)=>{
    const spans = [...p.querySelectorAll('span')];
    if(!spans.length) return;
    const cm = /color\s*:\s*([^;"']+)/i.exec(p.getAttribute('style')||'');
    let color = cm ? cm[1].trim() : ((p.style && p.style.color) || '#888888');
    const rgb = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(color);
    if(rgb) color = '#'+[1,2,3].map(i=>(+rgb[i]).toString(16).padStart(2,'0')).join('');
    if(/^#[0-9a-f]{3}$/i.test(color)) color = '#'+color.slice(1).split('').map(c=>c+c).join('');
    color = color.toLowerCase();
    const tag  = spans[0] ? grab(spans[0]) : '';
    const name = spans[1] ? grab(spans[1]) : '';
    const text = spans[2] ? grab(spans[2]) : (spans[1] ? '' : grab(spans[0]));
    if(!(tag||name||text)) return;

    const inner = tag.replace(/^\[|\]$/g,'');
    let channel='other', target='';
    if(/^(秘匿|秘密)/.test(inner)){ channel='secret'; target=inner; }
    else if(['main','other','info'].includes(inner)){ channel=inner; }
    else if(/ho/i.test(inner)){ channel=inner; }   // 標籤含 HO → 直接當成 HO 頻道名
    else if(inner){ target=inner; }

    const flat = text.replace(/\n/g,'');
    let type='talk', content=text, sysName='';
    if(name==='system'){
      type=/回合/.test(text) ? 'round' : 'system';
      const m=text.match(/^\s*[\[［]\s*([^\]］]{1,20}?)\s*[\]］]\s*/);
      if(m){ sysName=m[1].trim(); content=text.slice(m[0].length); }
    }
    else if(DICE.test(text) && (text.includes('＞')||text.includes('>'))){ type='dice'; }
    else if(name==='KP' && MAD_DUR.test(text)){ type='madness'; }   // KP 且以持續時間結尾
    else if(channel==='info'){ type='info'; }

    const cname = name==='system' ? sysName : name;
    if(cname){ (colors[cname]=colors[cname]||{})[color]=(colors[cname][color]||0)+1; }
    rows.push({'序號':i+1,'類型':type,'頻道':channel,'秘匿對象':target,
               '發言人':name==='system'?sysName:name,'頭像':'','內容':content,'備註':''});
  });

  const prev = Object.fromEntries(SPK.map(s=>[s['發言人'],s]));   // 保留既有頭像設定
  const spk = Object.keys(colors).map(n=>({
    '發言人':n,
    '顯示名稱':(prev[n]&&prev[n]['顯示名稱'])||n,
    '頭像網址':(prev[n]&&prev[n]['頭像網址'])||'',
    '代表色':Object.entries(colors[n]).sort((a,b)=>b[1]-a[1])[0][0]
  }));
  return {rows, spk};
}

document.getElementById('expHtml').onclick=()=>{
  const logEl=document.getElementById('log'), edEl=document.getElementById('editor'),
        whoEl=document.getElementById('who'), qEl=document.getElementById('q'),
        chips=[...document.querySelectorAll('.chip[data-f]')];
  const keepLog=logEl.innerHTML, keepEd=edEl.innerHTML, keepWho=whoEl.value, keepQ=qEl.value,
        keepChips=chips.map(c=>c.getAttribute('aria-pressed'));
  // 匯出乾淨版本：清掉畫面上的暫存狀態，只留資料
  const heads=['eyebrow','title','subtitle'].map(id=>document.getElementById(id));
  logEl.innerHTML=''; edEl.innerHTML=''; whoEl.selectedIndex=0; qEl.setAttribute('value','');
  chips.forEach(c=>c.setAttribute('aria-pressed','true'));
  heads.forEach(e=>{e.removeAttribute('contenteditable');e.removeAttribute('data-ph');});
  applyMeta(true);
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  logEl.innerHTML=keepLog; edEl.innerHTML=keepEd; whoEl.value=keepWho;
  qEl.setAttribute('value',keepQ); chips.forEach((c,i)=>c.setAttribute('aria-pressed',keepChips[i]));
  heads.forEach((e,i)=>{e.setAttribute('contenteditable','plaintext-only');
    e.setAttribute('data-ph',['CALL OF CTHULHU TRPG','（標題）','（副標題，可留空）'][i]);});
  applyMeta();

  const a=html.indexOf('/*DATA_START*/'), b=html.indexOf('/*DATA_END*/');
  if(a<0||b<0){ alert('匯出失敗：找不到資料區塊，請改用原始檔重新載入 CSV。'); return; }
  const j=o=>JSON.stringify(o).replace(/<\//g,'<\\/');
  const data='/*DATA_START*/let LOG = '+j(LOG)+';\nlet SPK = '+j(SPK)+';\nlet META = '+j(META)+';\nlet PCS = '+j(PCS)+';';
  html = html.slice(0,a) + data + html.slice(b);
  // 匯出版為純閱讀：移除所有編輯用介面
  const M1='<!'+'--EDIT_START-->', M2='<!'+'--EDIT_END-->';
  html = html.replace(new RegExp(M1+'[\\s\\S]*?'+M2,'g'),'');

  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const dateStr=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
  // 標題文字 + 今天日期；標題留空時退回 log
  const rawTitle=(META['標題']||'').trim();
  const safeTitle=rawTitle.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
  const name=(safeTitle?safeTitle+'_':'log_')+dateStr+'.html';
  const el=document.createElement('a');
  el.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  el.download=name; el.click(); URL.revokeObjectURL(el.href);
};
