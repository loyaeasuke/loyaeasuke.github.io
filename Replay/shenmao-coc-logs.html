<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>神貓桌 CoC 團錄</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet"><style>
:root{
  --paper:#f2eee4;
  --paper-deep:#eae4d6;
  --paper-lift:#f7f4ec;
  --ink:#211f1a;
  --ink-soft:#4b463c;
  --muted:#8a8474;
  --muted-2:#a9a291;
  --rule:#d9d1bf;
  --rule-strong:#c7bda4;
  --accent:#7c2d2a;
  --accent-deep:#5c201e;
  --accent-soft:#ecdfd8;
  --on-accent:#f6ede3;
  --margin-line:rgba(124,45,42,.30);
  --brass:#9a7b3f;
  --danger:#a23a30;
  --serif:"Noto Serif TC",Georgia,"Songti TC","Times New Roman",serif;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --shadow:0 18px 50px rgba(33,31,26,.16);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}
button{font-family:inherit;cursor:pointer;color:inherit;}
::selection{background:var(--accent-soft);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:10px;border:2px solid var(--paper-deep);}

/* ============ TOOLBAR ============ */
.toolbar{
  height:62px;flex:0 0 62px;
  display:flex;align-items:center;padding:0 22px;
  background:var(--paper-deep);
  border-bottom:1px solid var(--rule-strong);
  position:sticky;top:0;z-index:30;
  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{height:0;display:none;}
.toolbar>*{flex:0 0 auto;}
.tb-brand{
  font-family:var(--serif);font-weight:700;font-size:18px;
  letter-spacing:.05em;color:var(--ink);white-space:nowrap;
  display:flex;align-items:baseline;gap:8px;
}
.tb-brand .dot{color:var(--accent);font-size:15px;}
.tb-div{width:1px;height:28px;background:var(--rule-strong);margin:0 20px;flex:0 0 1px;}
.tb-name{display:flex;align-items:center;gap:12px;min-width:0;}
.tb-name label{
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
#siteName{
  width:220px;min-width:0;
  background:var(--paper-lift);border:1px solid var(--rule-strong);
  border-radius:8px;padding:9px 13px;
  font-family:var(--serif);font-size:16px;color:var(--ink);
  transition:border .12s,box-shadow .12s;
}
#siteName:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.tb-actions{margin-left:auto;display:flex;gap:10px;padding-left:16px;align-items:center;}
.tb-style{display:inline-flex;align-items:center;gap:8px;}
.tb-style .tb-style-lbl{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}
#viewStyle{
  background:var(--paper-lift);border:1px solid var(--rule-strong);border-radius:9px;
  padding:9px 12px;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:.12s;
}
#viewStyle:hover{border-color:var(--accent);}
#viewStyle:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.tb-menu{display:flex;align-items:center;gap:8px;}
.tb-menu-btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--paper-lift);
  border:1px solid var(--rule-strong);
  border-radius:9px;
  padding:8px 14px;
  font-size:15px;font-weight:500;color:var(--ink);letter-spacing:.02em;
  white-space:nowrap;transition:.14s;
  box-shadow:0 1px 0 rgba(33,31,26,.04);
}
.tb-menu-btn svg{width:16px;height:16px;flex:0 0 auto;opacity:.8;}
.tb-menu-btn:hover{background:#fff;border-color:var(--accent);color:var(--accent);}
.tb-menu-btn:hover svg{opacity:1;}
.tb-menu-btn.active{
  background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep);
  box-shadow:0 4px 12px rgba(92,32,30,.22);
}
.tb-menu-btn.active svg{opacity:1;}
.btn-export{
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-deep);
  padding:10px 18px;border-radius:9px;font-size:14px;font-weight:500;letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:8px;transition:.14s;white-space:nowrap;
}
.btn-export:hover{background:var(--accent-deep);}
.btn-export .ic{font-family:var(--mono);font-size:13px;}

/* ============ APP LAYOUT ============ */
.app{display:flex;flex:1;min-height:0;}

/* ============ SIDEBAR (ledger) ============ */
.sidebar{
  width:322px;min-width:322px;
  background:var(--paper-deep);
  border-right:1px solid var(--rule-strong);
  display:flex;flex-direction:column;min-height:0;
}
.ledger-head{
  padding:16px 20px 12px;
  border-bottom:1px solid var(--rule-strong);
  display:flex;align-items:baseline;gap:12px;
}
.ledger-head .lh-main{
  font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:.06em;
}
.ledger-head .lh-sub{
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;margin-left:auto;
}
.side-scroll{flex:1;overflow-y:auto;min-height:0;padding-bottom:12px;}
.viewer-foot{
  flex:0 0 auto;padding:12px 18px;border-top:1px solid var(--rule-strong);
  font-size:13px;line-height:1.5;color:var(--muted);letter-spacing:.03em;text-align:center;
}

.vol{}
.vol-head{
  width:100%;background:none;border:none;
  display:flex;align-items:center;gap:10px;
  padding:13px 18px 7px;
  border-bottom:1px solid var(--rule-strong);
}
.vol-head:hover .vol-name{color:var(--accent);}
.vol-name{
  font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);transition:color .12s;
}
.vol-count{font-family:var(--mono);font-size:13px;color:var(--muted-2);}
.vol-caret{
  margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--muted);
  transition:transform .18s;line-height:1;
}
.vol:not(.open) .vol-caret{transform:rotate(-90deg);}
.vol:not(.open) .vol-body{display:none;}

.entry{
  width:100%;background:none;border:none;text-align:left;
  display:grid;grid-template-columns:38px 1fr;align-items:stretch;
  border-bottom:1px solid var(--rule);
  transition:background .12s;
}
.entry:hover{background:var(--paper-lift);}
.entry .e-num{
  font-family:var(--mono);font-size:13px;color:var(--muted-2);
  text-align:right;padding:7px 9px 7px 0;line-height:1.3;
  border-right:1.5px solid var(--margin-line);
  display:flex;align-items:center;justify-content:flex-end;
}
.entry .e-name{
  font-family:var(--serif);font-size:13px;color:var(--ink-soft);
  padding:7px 14px 7px 12px;line-height:1.4;transition:color .12s;
}
.entry:hover .e-name{color:var(--accent);}
.entry.active{background:var(--accent-soft);}
.entry.active .e-name{color:var(--accent-deep);font-weight:600;}
.entry.active .e-num{color:var(--accent);border-right-color:var(--accent);}
.vol-empty{
  padding:8px 18px 8px 38px;color:var(--muted-2);font-size:13px;
  font-style:italic;border-bottom:1px solid var(--rule);
}

.side-foot{padding:16px;border-top:1px solid var(--rule-strong);}
.side-foot button{
  width:100%;background:var(--paper-lift);color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:9px;
  padding:12px;font-size:15px;font-weight:500;letter-spacing:.06em;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.14s;
}
.side-foot button:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep);}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--paper);position:relative;}

/* empty */
.empty-state{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;color:var(--muted);text-align:center;padding:40px;
}
.empty-state .orn{font-family:var(--serif);font-size:28px;color:var(--rule-strong);letter-spacing:.5em;}
.empty-state p{font-size:17px;margin:0;letter-spacing:.05em;line-height:1.9;}

/* buffer / sealed page */
.buffer{max-width:720px;margin:0 auto;padding:66px 46px 96px;}
.buffer .eyebrow{
  font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);display:inline-flex;align-items:center;gap:12px;margin-bottom:26px;
}
.buffer .eyebrow::before{content:"";width:30px;height:1px;background:var(--accent);opacity:.6;}
.buffer h2{
  font-family:var(--serif);font-weight:700;font-size:42px;line-height:1.32;
  margin:0 0 18px;color:var(--ink);letter-spacing:.01em;
}
.buffer .byline{
  font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.05em;margin-bottom:36px;
}
.buffer .byline span{margin-right:22px;}
.plate{
  position:relative;background:var(--paper-lift);
  border:1px solid var(--rule-strong);border-left:3px solid var(--accent);
  border-radius:4px;padding:16px 34px 34px;margin-bottom:36px;
}
.plate .plate-tab{
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:14px 0 18px;border-bottom:1px dashed var(--rule-strong);margin-bottom:22px;
}
.plate .warn{
  display:flex;align-items:center;gap:9px;color:var(--accent);
  font-weight:700;font-size:14px;letter-spacing:.08em;margin-bottom:16px;font-family:var(--sans);
}
.plate .body{
  font-family:var(--serif);color:var(--ink-soft);font-size:17px;line-height:2.05;
  white-space:pre-wrap;word-break:break-word;
}
.plate .body:empty::after{
  content:"（此團錄尚未設定緩衝頁文字。）";color:var(--muted-2);font-style:italic;
}
.reveal-btn{
  display:inline-flex;align-items:center;gap:14px;
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-deep);
  padding:15px 30px;border-radius:10px;
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em;
  transition:.14s;box-shadow:0 8px 22px rgba(92,32,30,.24);
}
.reveal-btn:hover{background:var(--accent-deep);transform:translateY(-1px);}
.reveal-btn .seal{
  width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;
  display:grid;place-items:center;font-family:var(--serif);font-size:14px;
}

/* content view */
.content-view{display:flex;flex-direction:column;height:100%;}
.content-bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 24px;background:var(--paper-deep);border-bottom:1px solid var(--rule-strong);
}
.content-bar .ttl{
  font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink);
  margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mini-btn{
  background:var(--paper-lift);border:1px solid var(--rule-strong);color:var(--ink-soft);
  padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap;
}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.frame-note{padding:11px 24px;font-size:14px;color:var(--accent-deep);background:var(--accent-soft);border-bottom:1px solid var(--rule-strong);}
.frame-wrap{flex:1;position:relative;background:#fff;min-height:0;}
.content-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;}
.frame-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:14px;background:var(--paper);transition:opacity .3s;}
.frame-loading.hide{opacity:0;pointer-events:none;}
.spinner{width:16px;height:16px;border:2px solid var(--rule-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ MODAL ============ */
.overlay{
  position:fixed;inset:0;background:rgba(33,31,26,.52);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:24px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:14px;
  width:min(940px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);
}
.modal-head{display:flex;align-items:center;padding:20px 26px;border-bottom:1px solid var(--rule-strong);background:var(--paper-deep);}
.modal-head h3{font-family:var(--serif);font-size:22px;margin:0;color:var(--ink);letter-spacing:.05em;}
.modal-head .x{margin-left:auto;background:none;border:none;font-size:28px;color:var(--muted);width:38px;height:38px;border-radius:8px;line-height:1;}
.modal-head .x:hover{background:var(--paper-lift);color:var(--ink);}
.modal-body{padding:24px 26px;overflow-y:auto;flex:1;}
.pane{display:none;}
.pane.active{display:block;}

.field{margin-bottom:16px;}
.form-title{
  font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);
  letter-spacing:.04em;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;
}
.form-title .badge{
  font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.06em;
  padding:3px 10px;border-radius:20px;background:var(--paper-deep);color:var(--muted);
}
#entryForm.editing .form-title{color:var(--accent-deep);}
#entryForm.editing .form-title .badge{background:var(--accent-soft);color:var(--accent-deep);}
.field label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:.02em;}
.field .hint{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--rule-strong);border-radius:9px;
  font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper-lift);transition:.12s;
}
.field textarea{min-height:120px;resize:vertical;line-height:1.7;font-family:var(--serif);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

.btn{border:1px solid transparent;border-radius:9px;padding:11px 20px;font-size:15px;font-weight:600;letter-spacing:.03em;transition:.12s;}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep);}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:var(--paper-lift);color:var(--ink);border-color:var(--rule-strong);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:var(--paper-lift);color:var(--danger);border-color:#d8b3ad;}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.list-block{border:1px solid var(--rule-strong);border-radius:12px;overflow:hidden;margin-bottom:20px;background:var(--paper-lift);}
.list-block .lb-head{background:var(--paper-deep);padding:11px 16px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);}
.row:first-child{border-top:none;}
.row .grow{flex:1;min-width:0;}
.row .r-title{font-weight:500;font-size:16px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .r-sub{font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip{display:inline-block;font-family:var(--mono);font-size:13px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent-deep);font-weight:500;}
.icon-btn{background:var(--paper);border:1px solid var(--rule-strong);border-radius:7px;width:34px;height:34px;color:var(--muted);font-size:16px;display:grid;place-items:center;transition:.12s;flex:0 0 auto;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn.del:hover{border-color:var(--danger);color:var(--danger);}
.icon-btn:disabled{opacity:.35;cursor:default;}
.empty-note{color:var(--muted);font-size:14px;padding:14px 4px;font-style:italic;}

.callout{background:var(--paper-lift);border:1px solid var(--rule-strong);border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.85;color:var(--ink-soft);margin-bottom:18px;}
.callout code{font-family:var(--mono);background:var(--accent-soft);padding:2px 6px;border-radius:5px;font-size:13px;color:var(--accent-deep);}
.callout b{color:var(--ink);}

.drop{border:2px dashed var(--rule-strong);border-radius:12px;padding:26px;text-align:center;color:var(--muted);transition:.12s;cursor:pointer;background:var(--paper-lift);}
.drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:90;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* mobile */
.hamburger{display:none;background:var(--paper-lift);color:var(--ink);border:1px solid var(--rule-strong);border-radius:9px;width:42px;height:42px;font-size:20px;margin-right:14px;flex:0 0 auto;}
.scrim{display:none;position:fixed;inset:0;background:rgba(33,31,26,.4);z-index:40;}
@media(max-width:860px){
  .hamburger{display:grid;place-items:center;}
  .tb-name label{display:none;}
  .tb-div{margin:0 12px;}
  .tb-brand{font-size:16px;}
  .sidebar{position:fixed;left:0;top:62px;bottom:0;z-index:45;transform:translateX(-100%);transition:transform .22s;}
  .sidebar.open{transform:translateX(0);}
  .scrim.show{display:block;top:62px;}
  .buffer{padding:52px 22px 60px;}
  .buffer h2{font-size:32px;}
  .grid2{grid-template-columns:1fr;}
  .btn-export{padding:9px 12px;}
  .btn-export .lbl{display:none;}
  .tb-menu-btn{padding:8px 9px;font-size:13px;}
  .tb-menu-btn .mlbl{display:none;}
  .tb-menu{gap:6px;}
  #siteName{width:130px;}
  .tb-div{margin:0 10px;}
  .tb-style-lbl{display:none;}
  #viewStyle{padding:8px 8px;font-size:13px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}.spinner{animation:none!important;}}

/* ===== THEME TOKENS — each theme re-skins the whole UI (toolbar included) by overriding variables ===== */

/* 紀事 Chronicle — clean white + indigo */
body.sty-chronicle{
  --paper:#ffffff;--paper-deep:#f6f6fa;--paper-lift:#ffffff;
  --ink:#232329;--ink-soft:#494955;--muted:#8f8f9b;--muted-2:#bcbcc6;
  --rule:#ededf1;--rule-strong:#e2e2e8;
  --accent:#6d5bd0;--accent-deep:#5647b4;--accent-soft:#efecfb;
  --on-accent:#ffffff;--margin-line:#e2e2e8;
}
body.sty-chronicle .buffer .eyebrow{letter-spacing:.18em;}

/* 黑暗奇幻 Dark Fantasy — leather + gold, dark */
body.sty-darkfantasy{
  --paper:#17130e;--paper-deep:#100c08;--paper-lift:#211a12;
  --ink:#ece0c8;--ink-soft:#c6b48f;--muted:#93835f;--muted-2:#6b5f43;
  --rule:#2c2417;--rule-strong:#40341f;
  --accent:#c9a24a;--accent-deep:#e2bd66;--accent-soft:#2a2213;
  --on-accent:#1a1408;--margin-line:rgba(201,162,74,.34);
}
body.sty-darkfantasy .buffer h2{font-size:44px;letter-spacing:.02em;}
body.sty-darkfantasy .buffer .eyebrow,body.sty-darkfantasy .vol-name{letter-spacing:.24em;}
body.sty-darkfantasy .plate{border-left-width:4px;}
body.sty-darkfantasy .reveal-btn{box-shadow:0 0 0 1px rgba(201,162,74,.35),0 10px 26px rgba(201,162,74,.16);}

/* 都市恐怖 Urban Horror — cold, stark, blood red */
body.sty-urbanhorror{
