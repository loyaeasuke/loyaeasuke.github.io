<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔道書大戦 魔法使名冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --ink:#0e1120; --ink-2:#161a2c; --ink-3:#20263d; --ink-line:#2c3350;
  --paper:#e8e5dd; --card:rgba(250,248,242,.80); --card-2:rgba(242,239,230,.78);
  --text:#191c28; --text-mid:#585f72; --text-dim:#8b91a2;
  --hair:#ddd8cd; --hair-2:#cec8ba; --star:#c9b8e6;
  --accent:#9280A4; --accent-rgb:146,128,164; --accent-ink:#6b5a82;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"Space Mono","Noto Sans TC",monospace;
  --sidebar-w:268px;
  --topbar-h:52px;
  /* 全站字級基準：最小 13px */
  --fs-min:13px; --fs-sm:13px; --fs-base:15px; --fs-md:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--sans);font-size:var(--fs-base);line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
img{display:block}
a{color:inherit}
::selection{background:rgba(var(--accent-rgb),.25)}

/* ── 工具列（匯出純檢視版會移除） ─────────────────── */
#toolbar{
  position:fixed;top:0;left:0;right:0;z-index:60;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:10px 16px;background:var(--ink);color:#e7e9f2;border-bottom:1px solid #05060c;
}
#toolbar .brand{
  font-family:var(--serif);font-weight:700;letter-spacing:.14em;font-size:var(--fs-md);
  margin-right:6px;display:flex;align-items:center;gap:9px;color:#f2eefb;white-space:nowrap;
}
#toolbar .brand .mk{width:15px;height:15px;flex:none}
.tbtn{
  padding:7px 13px;font-size:var(--fs-sm);background:var(--ink-2);color:#d6dbea;
  border:1px solid var(--ink-line);border-radius:2px;transition:background .14s,border-color .14s,color .14s;
}
.tbtn:hover{background:var(--ink-3);border-color:#3c456a;color:#fff}
.tbtn:disabled{opacity:.42;cursor:default}
.tbtn.primary{background:rgba(var(--accent-rgb),.22);border-color:rgba(var(--accent-rgb),.55);color:#efeaf6}
.tbtn.primary:hover{background:rgba(var(--accent-rgb),.34)}
#toolbar label.chk{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:#aab2c6;cursor:pointer}
#toolbar .status{margin-left:auto;font-size:var(--fs-sm);color:#98a0b6;font-family:var(--mono)}
#toolbar .status b{color:var(--star);font-weight:700}
#toolbar .title-field{display:flex;align-items:center;gap:7px;margin:0 4px 0 6px;padding-left:13px;border-left:1px solid #3a4258}
#toolbar .title-field label{font-size:var(--fs-sm);color:#8b93a9;white-space:nowrap}
#toolbar .title-input{
  width:220px;max-width:38vw;padding:6px 10px;font-family:var(--serif);font-size:var(--fs-sm);letter-spacing:.04em;
  background:var(--ink-2);color:#eef0f8;border:1px solid var(--ink-line);border-radius:2px;transition:border-color .14s,background .14s;
}
#toolbar .title-input::placeholder{color:#6b7288}
#toolbar .title-input:focus{outline:none;border-color:rgba(var(--accent-rgb),.6);background:var(--ink-3)}

/* ── 版面骨架 ─────────────────────────────────── */
#app{display:block}
#sidebar{
  position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);z-index:50;
  background:var(--ink);color:#cfd5e6;border-right:1px solid #05060c;display:flex;flex-direction:column;
}
body.exported{--topbar-h:0px}
.sb-top{padding:16px 15px 12px;border-bottom:1px solid var(--ink-line)}
.sb-title{
  font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.14em;color:#efeaf9;
  margin:0 0 3px;display:flex;align-items:center;gap:8px;
}
.sb-title .mk{width:16px;height:16px;flex:none}
.sb-sub{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.18em;color:#6f7794;margin:0}
#search{
  width:100%;margin-top:12px;padding:9px 11px;font-family:inherit;font-size:var(--fs-sm);
  background:var(--ink-2);color:#e7e9f2;border:1px solid var(--ink-line);border-radius:2px;
}
#search::placeholder{color:#5d6579}
#search:focus{outline:none;border-color:rgba(var(--accent-rgb),.7)}
#homeBtn{
  width:100%;margin-top:9px;padding:8px 10px;font-size:var(--fs-sm);
  display:flex;align-items:center;gap:8px;text-align:left;
  background:var(--ink-2);border:1px solid var(--ink-line);border-radius:2px;color:#aeb6c8;
  transition:background .14s,color .14s,border-color .14s;
}
#homeBtn svg{flex:none;opacity:.85}
#homeBtn:hover,#homeBtn[aria-current="true"]{background:var(--ink-3);color:#fff;border-color:#3c456a}
.sb-list{flex:1;overflow-y:auto;padding:8px 8px 20px}
.sb-group{margin-top:10px}
.sb-group>.gh{
  font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.2em;color:#727a97;
  padding:6px 8px 5px;display:flex;align-items:center;gap:8px;
}
.sb-group>.gh::after{content:"";flex:1;height:1px;background:var(--ink-line)}
.item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 9px;border:none;background:none;border-radius:3px;color:#cbd1e2;
  transition:background .12s;
}
.item:hover{background:var(--ink-2)}
.item[aria-current="true"]{background:var(--ink-3);box-shadow:inset 2px 0 0 var(--ic,var(--accent))}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ic,var(--accent))}
.item .nm{font-size:var(--fs-sm);font-weight:500;line-height:1.35}
.item .rd{display:block;font-family:var(--mono);font-size:var(--fs-min);color:#7b83a0;letter-spacing:.04em}

/* ── 右側主區 ─────────────────────────────────── */
#main{margin-left:var(--sidebar-w);padding-top:var(--topbar-h);min-height:calc(100vh - var(--topbar-h));min-width:0;position:relative}
.wrap{max-width:1120px;margin:0 auto;padding:30px 34px 70px;position:relative;z-index:1}

/* 縮圖展示頁 */
.gp-head{text-align:center;margin:22px 0 46px;position:relative}
.gp-head .const{margin:0 auto 18px;width:132px;height:34px;opacity:.9}
.gp-head .eyebrow{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.36em;color:var(--text-dim);margin:0 0 16px}
.gp-head h2{font-family:var(--serif);font-weight:900;font-size:41px;letter-spacing:.16em;margin:0;line-height:1.2;color:var(--text)}
@media (max-width:640px){.gp-head h2{font-size:30px;letter-spacing:.1em}}
.gp-head .count{margin:14px 0 0;font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.28em;color:var(--text-dim)}
.gp-cat{
  display:flex;align-items:center;gap:12px;margin:0 0 24px;
  font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.14em;color:var(--text-mid);
}
.gp-cat .n{color:var(--accent-ink);letter-spacing:.06em;font-weight:700}
.gp-cat .ct{color:var(--text-dim)}
.gp-cat::after{content:"";flex:1;height:1px;background:var(--hair-2)}
.gp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:24px 20px;margin-bottom:44px}
.gp-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;padding:6px 4px 12px;
  border-radius:4px;
}
.gp-card .pic{
  width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;
  background:var(--card-2);background:color-mix(in srgb,var(--cc,#8a7fa8) 12%,#fff);border:1px solid var(--hair-2);
  box-shadow:0 2px 10px rgba(20,22,40,.1);
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;
  will-change:transform;
}
.gp-card:hover .pic{transform:translateY(-6px);border-color:var(--cc,var(--accent));box-shadow:0 0 0 2px rgba(var(--accent-rgb),.18),0 10px 20px rgba(20,22,40,.18)}
.gp-card .pic img{width:100%;height:100%;object-fit:cover}
.gp-card .pic .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--serif);font-weight:900;font-size:52px;color:var(--cc,#8a7fa8);color:color-mix(in srgb,var(--cc,#8a7fa8) 46%,#fff)}
.gp-card .nm{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.3;color:var(--cc,var(--text));text-align:center;margin-top:2px}
.gp-card .rd{font-family:var(--mono);font-size:var(--fs-min);color:var(--text-dim);min-height:1em;letter-spacing:.03em;text-align:center}
.gp-card .mg{font-size:var(--fs-min);color:var(--text-mid);text-align:center;line-height:1.35}


/* ── 詳情頁 ─────────────────────────────────── */
.sheet{position:relative;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet,.gp-card,.gp-card .pic{animation:none;transition:none}}
/* 角色刷淡浮水印：固定於主區左下角，壓在文字下、不佔版面、不擋點擊 */
#charWM{
  position:fixed;left:var(--sidebar-w);bottom:0;z-index:0;pointer-events:none;
  width:min(48vh,460px);height:min(82vh,660px);
  background-repeat:no-repeat;background-position:left bottom;background-size:contain;
  opacity:0;transition:opacity .3s ease;filter:saturate(.82);
  -webkit-mask-image:radial-gradient(ellipse 74% 72% at 50% 54%,#000 58%,transparent 100%);
  mask-image:radial-gradient(ellipse 74% 72% at 50% 54%,#000 58%,transparent 100%);
}
#charWM.on{opacity:.22}
@media (prefers-reduced-motion:reduce){#charWM{transition:none}}
.sheet>*{position:relative;z-index:1}

/* 詳情標頭：頭像 + 全身圖連結 + 差分（右） */
.dh{display:flex;gap:20px;align-items:flex-start;border-bottom:2px solid var(--accent);padding-bottom:16px;margin-bottom:20px}
.dh-avcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.dh-av{width:112px;height:112px;border-radius:4px;overflow:hidden;border:1px solid var(--hair-2);
  background:var(--card-2);background:color-mix(in srgb,var(--accent) 12%,#fff);box-shadow:0 2px 8px rgba(20,22,40,.1)}
.dh-av img{width:100%;height:100%;object-fit:cover}
.dh-av .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--serif);font-weight:900;font-size:50px;color:var(--accent-ink)}
.viewfull{font-size:var(--fs-min);color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.viewfull:hover{color:var(--accent)}
.dh-variants{flex:1;min-width:0}
.dh-variants .dv-lb{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.14em;color:var(--text-mid);margin-bottom:7px}
.dh-variants .dv-imgs{display:flex;flex-wrap:wrap;gap:8px}
.dh-variants .dv-imgs img{width:88px;height:88px;object-fit:cover;border-radius:3px;border:1px solid var(--hair-2);cursor:pointer;background:color-mix(in srgb,var(--accent) 10%,#fff);transition:border-color .14s}
.dh-variants .dv-imgs img:hover{border-color:var(--accent)}

/* 上排：基本資料 | 魔力 | 特技表 */
.dtop{display:grid;grid-template-columns:minmax(0,232px) auto minmax(0,1fr);gap:26px;align-items:start;margin-bottom:22px}
@media (max-width:1040px){.dtop{grid-template-columns:1fr;gap:22px}}
.dtop-info{min-width:0}
.dtop-info .bi-nrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:9px}
.dtop-info .bi-name{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.05em;line-height:1.12;margin:0;color:var(--accent-ink)}
.dtop-info .bi-cat{font-size:var(--fs-min);font-weight:700;letter-spacing:.06em;color:#fff;background:var(--accent);border-radius:3px;padding:2px 9px}
.dtop-info .bi-read{font-family:var(--mono);font-size:var(--fs-sm);color:var(--text-mid);letter-spacing:.08em;margin-top:6px}
.dtop-info .bi-magic{font-family:var(--serif);font-size:var(--fs-md);color:var(--text-mid);font-style:italic;margin-top:4px;line-height:1.4}
.dtop-info .bi-meta{display:flex;flex-direction:column;gap:3px;margin-top:11px}
.dtop-info .bi-m{font-size:var(--fs-sm);color:var(--text-mid)}
.dtop-info .bi-m b{color:var(--text);font-weight:700}
.dtop-info .bi-stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.bstat{flex:1 1 0;min-width:56px;display:flex;flex-direction:column;align-items:center;background:var(--accent);border-radius:3px;padding:6px 4px}
.bstat .k{font-family:var(--mono);font-size:var(--fs-min);color:rgba(255,255,255,.85)}
.bstat .v{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.1;color:#fff}
.dtop-skill{min-width:0}
.dtop-skill>.sec{margin:0}
.dtop-mana{justify-self:start}

/* 魔力／臨時魔力 直向菱形 widget */
.mana-wid{display:inline-flex;flex-direction:column;border:1px solid var(--hair-2);border-radius:4px;overflow:hidden;background:var(--card)}
.mana-cols{display:flex}
.mana-col{width:64px;display:flex;flex-direction:column;align-items:center}
.mana-col+.mana-col{border-left:1px solid var(--hair-2)}
.mana-h{width:100%;text-align:center;font-size:var(--fs-min);font-weight:700;color:#e9e7f0;background:#3a3d47;padding:5px 2px;line-height:1.25}
.mana-n{font-family:var(--serif);font-weight:900;font-size:20px;padding:5px 0 3px;color:var(--text)}
.mana-dias{display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 0 11px}
.dia{width:13px;height:13px;transform:rotate(45deg);border:1.6px solid #6a7fb0;background:transparent;border-radius:2px}
.mana-col.temp .dia{border-color:#c08a4a}
.dia.fill{background:#1c1e27;border-color:#1c1e27}
.dia.over{background:var(--accent-ink);border-color:var(--accent-ink)}
.mana-max{border-top:1px solid var(--hair-2)}
.mana-max .mm-lb{text-align:center;font-size:var(--fs-min);font-weight:700;color:#e9e7f0;background:#3a3d47;padding:4px 0}
.mana-max .mm-v{text-align:center;font-family:var(--serif);font-weight:900;font-size:24px;color:var(--accent-ink);padding:5px 0 8px}

/* 義務對象下拉 */
.duty-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.duty-row .lb{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.12em;color:var(--text-mid)}
.duty-row select{font-family:inherit;font-size:var(--fs-sm);padding:4px 9px;border:1px solid var(--hair-2);border-radius:2px;background:#fff;color:var(--text)}
.duty-row select:disabled{background:var(--card-2);color:var(--text);opacity:1}
.duty-warn{font-size:var(--fs-min);color:#b05a5a}

/* 詳情下排兩欄：左＝故事/關係，右＝魂/藏書 */
.dbody{display:grid;grid-template-columns:340px minmax(0,1fr);gap:8px 36px;align-items:start}
@media (max-width:1000px){.dbody{grid-template-columns:1fr;gap:0}}
.dcol{min-width:0}
.dcol-left>.sec:first-child,.dcol-right>.sec:first-child{margin-top:0}



/* 區塊 */
.sec{margin:0 0 24px}
.sec-h{
  font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.2em;color:var(--text-mid);
  display:flex;align-items:center;gap:11px;margin:0 0 13px;
}
.sec-h::before{content:"";width:15px;height:1px;background:var(--accent)}
.sec-h::after{content:"";flex:1;height:1px;background:var(--hair)}

/* 特技表 signature */
.skwrap{overflow-x:auto}
.sktable{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:var(--fs-sm)}
.sktable th,.sktable td{border:1px solid var(--hair-2);text-align:center;padding:0}
.sktable thead th{
  background:var(--ink-2);color:#e7e9f2;font-family:var(--serif);font-weight:700;
  letter-spacing:.06em;padding:6px 2px;font-size:var(--fs-sm);
}
.sktable thead th.corner{background:var(--ink);width:34px}
.sktable td.die,.sktable th.die{
  background:var(--ink-3);color:#c7cde0;font-family:var(--mono);font-size:var(--fs-min);width:34px;
}
.sktable td.sk{
  background:var(--card);color:var(--text);height:33px;font-size:var(--fs-sm);
  position:relative;transition:background .1s;white-space:nowrap;padding:0 5px;
}
.sktable td.sk.on{background:var(--accent);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sktable td.sk.judge{outline:2px solid var(--accent-ink);outline-offset:-2px}
.sktable td.sk.judge::after{
  content:"";position:absolute;top:0;right:0;
  border-style:solid;border-width:0 10px 10px 0;
  border-color:transparent var(--accent-ink) transparent transparent;
}
/* 疵：該領域不可用 */
.sktable td.sk.flaw{
  color:var(--text-dim);text-decoration:line-through;
  background:repeating-linear-gradient(45deg,var(--card),var(--card) 4px,var(--card-2) 4px,var(--card-2) 8px);
}
.sktable td.sk.flaw.on{background:var(--text-dim);color:#f3f1ec;box-shadow:none}
.sktable th.flawh{color:#8f96ab;text-decoration:line-through}
/* Gap 直欄（領域間的細長方框；塗黑＝視為不存在） */
.sktable td.gapc,.sktable th.gaph{width:12px;min-width:12px;max-width:12px;padding:0;background:var(--card-2)}
.sktable th.gaph{background:var(--ink-2)}
.sktable td.gapc.blk,.sktable th.gaph.blk{background:var(--accent-ink);border-color:var(--accent-ink)}
/* 特技表底部控制列：領域 + 疵 */
.sk-foot{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:12px;align-items:center}
.sk-foot .ft-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sk-foot .ft-lb{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.2em;color:var(--text-mid)}
.sk-foot select#fld_domain{
  font-family:inherit;font-size:var(--fs-sm);padding:5px 9px;border:1px solid var(--hair-2);
  border-radius:2px;background:#fff;color:var(--text);
}
.sk-foot select#fld_domain:disabled{background:var(--card-2);color:var(--text);opacity:1}
.sk-foot .ft-tag{font-family:var(--serif);font-weight:700;font-size:var(--fs-sm);color:var(--accent-ink)}
.flaw-boxes{display:flex;flex-wrap:wrap;gap:6px}
.flaw-box{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-min);
  padding:3px 8px 3px 6px;border:1px solid var(--hair-2);border-radius:2px;background:#fff;color:var(--text-mid);
}
.flaw-box .bx{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--hair-2);border-radius:2px;background:#fff;font-size:11px;line-height:1;color:#fff}
.flaw-box:hover:not(:disabled){border-color:var(--accent)}
.flaw-box.on{background:#3a2b30;border-color:#3a2b30;color:#f0e6e8}
.flaw-box.on .bx{background:#a23b4a;border-color:#a23b4a}
.flaw-box:disabled{cursor:default}
.sk-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:var(--fs-min);color:var(--text-mid)}
.sk-legend span{display:inline-flex;align-items:center;gap:6px}
.sk-legend .swatch{width:13px;height:13px;border-radius:2px;background:var(--accent);border:1px solid var(--accent-ink)}
.sk-legend .swatch.blk{background:var(--accent-ink);border-color:var(--accent-ink)}
.sk-legend .swatch.j{background:#fff;outline:2px solid var(--accent-ink);outline-offset:-2px}
.sk-legend .swatch.fl{background:repeating-linear-gradient(45deg,var(--card),var(--card) 3px,var(--hair-2) 3px,var(--hair-2) 6px)}

/* 習得特技判定值 + 魂之特技 */

.card-block .creed{font-size:var(--fs-sm);color:var(--accent-ink);font-weight:500}
.card-block .desc{font-size:var(--fs-sm);color:var(--text-mid);line-height:1.55}
.card-block .eff{display:inline-block;font-size:var(--fs-min);font-family:var(--mono);letter-spacing:.04em;background:rgba(var(--accent-rgb),.14);color:var(--accent-ink);border-radius:2px;padding:2px 8px;margin-left:auto}
.card-block .desc.dim{color:var(--text-dim);margin-top:4px}
.trueform .eff{display:inline-block;font-size:var(--fs-min);font-family:var(--mono);letter-spacing:.04em;background:rgba(var(--accent-rgb),.14);color:var(--accent-ink);border-radius:2px;padding:2px 8px;margin-left:auto}
.trueform .tf-warn{font-size:var(--fs-sm);color:#b05a5a;margin:3px 0 4px}
.trueform .tf-note{margin-top:9px;padding-top:9px;border-top:1px dashed var(--hair-2);font-size:var(--fs-sm);color:var(--text-mid);line-height:1.55;display:flex;gap:8px}
.trueform .tf-note-lb{flex:none;font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.1em;color:var(--text-dim);padding-top:1px}

.prose{font-size:var(--fs-base);color:var(--text);line-height:1.72;white-space:pre-wrap}
.prose.mid{color:var(--text-mid);font-size:var(--fs-sm)}

/* 錨點關係 */
.anchor{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:12px 14px;margin-bottom:11px;position:relative}
.anchor .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.anchor .an{font-family:var(--serif);font-weight:700;font-size:var(--fs-base)}
.chip{font-size:var(--fs-min);border-radius:2px;padding:2px 9px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.chip.fate{background:var(--accent-ink);color:#fff;font-family:var(--mono)}
.chip.fate.trauma{background:#7a2e3a}
.chip.attr{background:var(--card-2);border:1px solid var(--hair-2);color:var(--text-mid)}
.anchor .set{font-size:var(--fs-sm);color:var(--text-mid);line-height:1.55}
.anchor .del{position:absolute;top:9px;right:10px;background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;padding:2px 5px;border-radius:3px}

.anchor-edit{display:none;background:var(--card-2);border:1px dashed var(--hair-2);border-radius:4px;padding:13px 14px;margin-bottom:12px}
.anchor-edit.show{display:block}
.anchor-edit .row{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:9px;margin-bottom:9px}

.anchor-edit label{display:block;font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.1em;color:var(--text-mid);margin-bottom:3px}
.anchor-edit input,.anchor-edit select,.anchor-edit textarea{
  width:100%;font-family:inherit;font-size:var(--fs-sm);padding:7px 9px;
  border:1px solid var(--hair-2);border-radius:2px;background:#fff;color:var(--text);
}
.anchor-edit textarea{resize:vertical;min-height:44px}
.anchor-edit .acts{display:flex;gap:8px;margin-top:2px}

.mini.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.accent:hover{filter:brightness(1.06)}
.mini:hover{background:var(--card-2)}
.add-anchor{margin-top:2px}

.mcard{display:grid;grid-template-columns:minmax(0,300px) 1fr;border:1px solid var(--hair-2);border-radius:6px;overflow:hidden;margin-bottom:14px;background:var(--card);box-shadow:0 1px 4px rgba(20,22,40,.06)}

.mcard-left{display:flex;flex-direction:column;border-right:1px solid var(--hair-2)}
@media (max-width:560px){.mcard-left{border-right:none;border-bottom:1px solid var(--hair-2)}}
.mcard-hd{display:flex;align-items:center;gap:9px;background:#24262e;color:#f2f0ea;padding:8px 10px 8px 8px}
.mcard-emblem{flex:none;align-self:stretch;display:flex;flex-direction:row;align-items:flex-end;gap:5px}

.mana-icon{object-fit:contain;border-radius:3px}

.cat-tag.exp{background:rgba(74,131,168,.6)}
.cat-tag.org{background:rgba(86,150,110,.6)}

.lim-mark{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;color:#e59aa9;font-size:15px;font-weight:700;line-height:1}
.mc-attr{width:100%;border-collapse:collapse;font-size:var(--fs-sm);table-layout:fixed}
.mc-attr th{background:#3a3d47;color:#e9e7f0;font-weight:700;padding:4px 2px;font-size:var(--fs-min);letter-spacing:.02em;border:1px solid #2c2f38}

.mc-attr th:nth-child(2),.mc-attr td:nth-child(2){width:30%}

.spell-count b{color:var(--accent-ink);font-weight:700}
.spell-count .over{color:#b05a5a}

/* 差分 */

.variants img:hover{transform:scale(1.05);border-color:var(--accent)}

/* 空狀態 */
.empty{max-width:520px;margin:12vh auto;text-align:center;color:var(--text-mid)}
.empty .const{width:150px;height:40px;margin:0 auto 18px;opacity:.85}
.empty h2{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--text);letter-spacing:.06em;margin:0 0 10px}
.empty p{font-size:var(--fs-sm);line-height:1.7;margin:5px 0}
.empty code{font-family:var(--mono);font-size:var(--fs-min);background:var(--card-2);border:1px solid var(--hair);border-radius:2px;padding:1px 6px}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(8,9,18,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#lb.show{display:flex}
#lb img{max-width:94vw;max-height:92vh;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lb .x{position:absolute;top:18px;right:22px;background:none;border:none;color:#fff;font-size:30px;line-height:1}

body.exported .flaw-box{pointer-events:none}
.hidden{display:none!important}

/* ══════════════════════════════════════════════════
   CSV 解析（RFC4180，支援引號內換行）
   ══════════════════════════════════════════════════ */
function parseCSV(text){
  text = String(text||"").replace(/^\uFEFF/,"");
  var rows=[],row=[],cur="",i=0,q=false,c;
  while(i<text.length){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i+=2;continue;} q=false;i++;continue; }
      cur+=c;i++;continue;
    }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(cur);cur="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";i++;continue;}
    cur+=c;i++;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function csvToObjects(text){
  var rows=parseCSV(text).filter(function(r){return r.some(function(x){return String(x).trim()!=="";});});
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return String(h).trim();});
  return rows.slice(1).map(function(r){
    var o={}; head.forEach(function(h,idx){o[h]=(r[idx]!=null?r[idx]:"");}); return o;
  });
}
function csvEscape(v){
  v=v==null?"":String(v);
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function objectsToCSV(head,objs){
  var out=[head.map(csvEscape).join(",")];
  objs.forEach(function(o){ out.push(head.map(function(h){return csvEscape(o[h]);}).join(",")); });
  return "\uFEFF"+out.join("\r\n");
}

/* 錨點：存於角色.csv 的「錨點」欄，每列一個 "錨點名:命運:屬性:設定" */
function parseAnchors(c){
  return String(c["錨點"]||"").split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean).map(function(line){
    var p=line.split(":");
    return {name:(p[0]||"").trim(), fate:(p[1]||"").trim(), attr:(p[2]||"").trim(), setting:p.slice(3).join(":").trim()};
  });
}
function serializeAnchors(arr){
  return arr.map(function(a){return [a.name,a.fate,a.attr,a.setting].join(":");}).join("\n");
}

/* 解析習得特技欄：每列一個特技名（可選 "特技名:備註"） */
function parseLearned(str){
  return String(str||"").split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var p=l.split(":");
    return {name:(p[0]||"").trim(), note:(p[1]||"").trim()};
  });
}
/* 疵：不可用的領域（以 | 或空白分隔） */
function domainFlaws(c){
  return String(c["疵"]||"").split(/[|,\s]+/).map(function(s){return s.trim();}).filter(function(s){return DOMAINS.indexOf(s)>=0;});
}

/* ══════════════════════════════════════════════════
   圖片解析
   ══════════════════════════════════════════════════ */
function resolveImg(v){
  v=String(v||"").trim();
  if(!v) return "";
  if(/^(https?:|data:|blob:)/i.test(v)) return v;
  if(imgURLs[v]) return imgURLs[v];
  var base=v.split("/").pop();
  if(imgURLs[base]) return imgURLs[base];
  if(imgURLs["./"+v]) return imgURLs["./"+v];
  return "";
}

/* ══════════════════════════════════════════════════
   色彩工具
   ══════════════════════════════════════════════════ */
function hexToRgb(hex){
  hex=String(hex||"").trim().replace('#','');
  if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(hex))return null;
  return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function darken(rgb,amt){
  return {r:Math.round(rgb.r*(1-amt)),g:Math.round(rgb.g*(1-amt)),b:Math.round(rgb.b*(1-amt))};
}
function lum(rgb){return (0.299*rgb.r+0.587*rgb.g+0.114*rgb.b)/255;}
function applyAccent(hex){
  var rgb=hexToRgb(hex)||hexToRgb("#9280A4");
  var ink=rgb; var i=0;
  while(lum(ink)>0.42 && i<8){ ink=darken(ink,0.18); i++; }
  var root=document.documentElement.style;
  root.setProperty('--accent','rgb('+rgb.r+','+rgb.g+','+rgb.b+')');
  root.setProperty('--accent-rgb',rgb.r+','+rgb.g+','+rgb.b);
  root.setProperty('--accent-ink','rgb('+ink.r+','+ink.g+','+ink.b+')');
}
function resetAccent(){
  var root=document.documentElement.style;
  root.setProperty('--accent','#9280A4');
  root.setProperty('--accent-rgb','146,128,164');
  root.setProperty('--accent-ink','#6b5a82');
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function charKey(c){return String(c["偽名"]||"").trim();}

function groupChars(list){
  var groups={},order=[];
  list.forEach(function(c){
    var g=String(c["分類"]||"未分類").trim()||"未分類";
    if(!groups[g]){groups[g]=[];order.push(g);}
    groups[g].push(c);
  });
  return order.map(function(g){return {name:g,items:groups[g]};});
}
function renderList(filter){
  var listEl=document.getElementById('list'); listEl.innerHTML="";
  var f=(filter||"").trim().toLowerCase();
  var shown=state.chars.filter(function(c){return matchChar(c,f);});
  groupChars(shown).forEach(function(grp){
    var box=el('<div class="sb-group"><div class="gh">'+esc(grp.name)+'</div></div>');
    grp.items.forEach(function(c){
      var color=String(c["代表色"]||"#9280A4");
      var b=el('<button class="item" style="--ic:'+esc(color)+'">'+
        '<span class="dot"></span><span><span class="nm">'+esc(c["偽名"])+'</span>'+
        (c["拼音"]?'<span class="rd">'+esc(c["拼音"])+'</span>':'')+'</span></button>');
      b.addEventListener('click',function(){selectChar(charKey(c));});
      if(state.cur===charKey(c))b.setAttribute('aria-current','true');
      box.appendChild(b);
    });
    listEl.appendChild(box);
  });
}
function matchChar(c,f){
  if(!f)return true;
  var learned=parseLearned(c["習得特技"]).map(function(x){return x.name;}).join(" ");
  var hay=[c["偽名"],c["拼音"],c["魔法名"],c["機關"],c["經歷"],c["PL"],c["表面身分"],c["判定特技"],c["領域"],learned,c["藏書"]].join(" ").toLowerCase();
  return hay.indexOf(f)>=0;
}

/* COST 領域配色（消耗魔素的圖示用；細部規則後續補上） */
var COST_DOMAIN={
  "星":"#8f7bc4","獸":"#c58a5b","力":"#cf6f6f","歌":"#5b93b8","夢":"#6bab86","闇":"#5a5a6b","全":"#c9a24a"
};
/* 消耗 COST 的寶石圖示（左上角 ICON） */
function costIcon(cost){
  cost=String(cost||"").trim();
  var none=(cost===""||cost==="無");
  var m=cost.match(/([星獸力歌夢闇全])?\s*(\d+)?/)||[];
  var dom=(!none&&m[1])||"", num=(!none&&m[2])||"";
  var col=COST_DOMAIN[dom]||"#8a8f9e";
  var big=none?"無":(num||"?"), small=dom||"";
  return '<svg class="cost-gem" viewBox="0 0 40 40" aria-hidden="true">'+
    '<polygon points="20,2 38,20 20,38 2,20" fill="'+col+'" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>'+
    '<polygon points="20,2 38,20 20,20 2,20" fill="rgba(255,255,255,.22)"/>'+
    '<polygon points="20,2 38,20 20,38 2,20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>'+
    (small?'<text x="20" y="15" text-anchor="middle" font-size="8" font-family="serif" fill="#fff" opacity=".92">'+small+'</text>':'')+
    '<text x="20" y="'+(small?'31':'26')+'" text-anchor="middle" font-size="'+(none?'13':'16')+'" font-weight="700" font-family="serif" fill="#fff">'+esc(big)+'</text>'+
    '</svg>';
}
/* 由 COST 內容判斷魔素文字（星/獸/力/歌/夢/闇/全/無）；不含前 6 種且非「無」→ 全 */
var MANA_KEYS=["星","獸","力","歌","夢","闇","全"];
function costMana(cost){
  cost=String(cost||"").trim();
  if(cost===""||cost==="無") return "無";
  for(var i=0;i<MANA_KEYS.length;i++){ if(cost.indexOf(MANA_KEYS[i])>=0) return MANA_KEYS[i]; }
  return "全";
}
/* COST 圖示：優先用 魔素.csv 指定的自訂 ICON（1:1），找不到圖檔時回退寶石 SVG */
function costEmblem(cost){
  var mana=costMana(cost);
  var path=(mana && state.mana)?state.mana[mana]:"";
  var src=path?resolveImg(path):"";
  if(src) return '<img class="mana-icon" src="'+esc(src)+'" alt="'+esc(mana)+'">';
  return costIcon(cost);
}
function catInfo(v){
  v=String(v||"").trim();
  if(!v)return {top:"",sub:"",cls:"",full:"",tag:""};
  var top=v, sub="";
  if(v.indexOf("・")>=0){ var p=v.split("・"); top=p[0]; sub=p.slice(1).join("・"); }
  var topName=top.replace("魔法","");
  var cls={"泛用":"gen","經歷":"exp","機關":"org","禁書":"ban"}[topName]||"";
  var tag = (v.indexOf("泛用魔法")>=0) ? "泛用" : (v.indexOf("・")>=0 ? sub : v.slice(0,2));
  return {top:topName,sub:sub,cls:cls,full:v,tag:tag};
}

var CSV_NAMES=["角色.csv","特技.csv","階梯.csv","經歷.csv","機關.csv","真實之姿.csv","藏書_魔法.csv","魔素.csv"];

function bind(id,ev,fn){var e=document.getElementById(id);if(e)e.addEventListener(ev,fn);}

bind('btnFolder','click',function(){var fi=document.getElementById('folderInput');if(fi)fi.click();});
bind('folderInput','change',function(e){
  var files=Array.prototype.slice.call(e.target.files||[]);
  if(!files.length)return;
  var csvText={}, imgCount=0, pending=[];
  imgURLs={};imgFiles={};
  files.forEach(function(f){
    var base=f.name;
    var rel=(f.webkitRelativePath||f.name);
    var relNoRoot=rel.split("/").slice(1).join("/")||f.name;
    if(/\.csv$/i.test(f.name)){
      if(CSV_NAMES.indexOf(base)>=0){
        pending.push(f.text().then(function(t){csvText[base]=t;}));
      }
    }else if(/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(f.name)){
      var url=URL.createObjectURL(f);
      [rel,relNoRoot,base,"./"+relNoRoot].forEach(function(k){if(k){imgURLs[k]=url;imgFiles[k]=f;}});
      imgCount++;
    }
  });
  Promise.all(pending).then(function(){
    buildFromCSV(csvText);
    var got=Object.keys(csvText);
    setStatus('已載入 <b>'+got.length+'</b> 個 CSV・<b>'+imgCount+'</b> 張圖・<b>'+state.chars.length+'</b> 名角色');
    renderList("");
    renderGallery("");
  });
  e.target.value="";
});

function crc32(bytes){
  var c,table=crc32.t;
  if(!table){table=crc32.t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}}
  var crc=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++)crc=(crc>>>8)^table[(crc^bytes[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){return new TextEncoder().encode(s);}
function u16(n){return [n&0xFF,(n>>8)&0xFF];}
function u32(n){return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];}
function makeZip(entries){
  /* entries: [{name, bytes}] store（不壓縮） */
  var chunks=[], central=[], offset=0;
  entries.forEach(function(en){
    var nameB=strBytes(en.name), data=en.bytes, crc=crc32(data);
    var local=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    var localHead=new Uint8Array(local);
    chunks.push(localHead,nameB,data);
    var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cen),nameB);
    offset+=localHead.length+nameB.length+data.length;
  });
  var cenStart=offset, cenSize=0;
  central.forEach(function(c){cenSize+=c.length;});
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(cenSize),u32(cenStart),u16(0)));
  var all=chunks.concat(central,[end]);
  return new Blob(all,{type:'application/zip'});
}
function charHeader(){
  /* 角色 CSV 欄位＝所有角色鍵的聯集，並確保含必要欄位 */
  var seen={},head=[];
  state.chars.forEach(function(o){Object.keys(o).forEach(function(k){if(!seen[k]){seen[k]=1;head.push(k);}});});
  ["領域","疵","真實之姿效果","真實之姿說明","錨點"].forEach(function(k){if(!seen[k]){head.push(k);seen[k]=1;}});
  return head;
}
function currentCSVMap(){
  /* 依當前狀態重建各 CSV：參照資料庫保留載入時的原文，角色（含錨點/義務）用編輯後的狀態重建 */
  var raw=state.rawCSV||{};
  var m={};
  ["特技.csv","階梯.csv","經歷.csv","機關.csv","真實之姿.csv","藏書_魔法.csv","魔素.csv"].forEach(function(n){
    m[n]=(raw[n]!=null?raw[n]:DEMO[n]);
  });
  if(state.chars.length){
    m["角色.csv"]=objectsToCSV(charHeader(),state.chars);
  }else{
    m["角色.csv"]=(raw["角色.csv"]!=null?raw["角色.csv"]:DEMO["角色.csv"]);
  }
  return m;
}
bind('btnTemplate','click',function(){
  var m=currentCSVMap();
  var csvNames=Object.keys(m).filter(function(k){return k!=='__imglib__';});
  var entries=csvNames.map(function(n){
    /* 每個 CSV 前置單一 UTF-8 BOM，Excel 開啟不亂碼 */
    var s=String(m[n]||"").replace(/^\uFEFF/,"");
    return {name:"魔法使名冊資料庫/"+n,bytes:strBytes("\uFEFF"+s)};
  });
  entries.push({name:"魔法使名冊資料庫/images/放圖說明.txt",bytes:strBytes("\uFEFF將頭像／全身圖／差分放在這裡，CSV 以 images/xxx.png 相對路徑指定。\r\n魔素（COST）圖示也放這裡，路徑在「魔素.csv」設定，8 種：星／獸／力／歌／夢／闇／全／無，建議 1:1 方形 PNG。\r\n載入時用工具列的「載入資料夾」選擇整個「魔法使名冊資料庫」資料夾即可一次讀入所有 CSV 與圖片。")});
  var blob=makeZip(entries);
  downloadBlob("魔法使名冊資料庫.zip",blob);
  setStatus('已下載 <b>'+csvNames.length+'</b> 個 CSV 範本（ZIP・UTF-8）');
});

/* ══════════════════════════════════════════════════
   匯出純檢視網頁
   ══════════════════════════════════════════════════ */
function downloadBlob(name,blob){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},200);
}
function fileToDataURL(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){res("");};r.readAsDataURL(file);});}

bind('btnExport','click',async function(){
  var btn=this;btn.disabled=true;setStatus('正在打包純檢視網頁…');
  try{
    var m=currentCSVMap();
    m.__title__=state.title;
    var ec=document.getElementById('embedImgs');var embed=ec?ec.checked:false;
    /* 收集需要內嵌的圖片路徑 */
    if(embed){
      /* 把 imgFiles 轉 data URL，並改寫 CSV 中的相對路徑為 data URL */
      var keys=Object.keys(imgFiles);
      var dataMap={};
      for(var i=0;i<keys.length;i++){ dataMap[keys[i]]=await fileToDataURL(imgFiles[keys[i]]); }
      /* 對角色 CSV 內的圖片欄替換：簡化作法——載入圖片後才有 imgFiles */
      /* 為求穩健，改為在匯出 HTML 內附一份 imgLib，讓 resolveImg 先查 */
      m.__imglib__=JSON.stringify((function(){
        var lib={}; Object.keys(dataMap).forEach(function(k){ if(dataMap[k])lib[k]=dataMap[k]; }); return lib;
      })());
    }
    var doc=document.documentElement.cloneNode(true);
    var tb=doc.querySelector('#toolbar'); if(tb)tb.remove();
    doc.querySelector('body').classList.add('exported');
    var payload="window.__EXPORT__="+JSON.stringify(m)+";";
    var html="<!DOCTYPE html>\n"+doc.outerHTML;
    html=html.replace('<script id="app-script">',
      '<scr'+'ipt>'+payload+'<\/scr'+'ipt>\n<scr'+'ipt id="app-script">');
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    downloadBlob((state.title||"魔法使名冊")+"_純檢視版.html",blob);
    setStatus('已匯出純檢視網頁（<b>'+state.chars.length+'</b> 名角色）');
  }catch(err){ setStatus('匯出失敗：'+(err&&err.message||err)); }
  btn.disabled=false;
});

/* 自訂網頁名稱 */
(function(){
  var ti=document.getElementById('titleInput');
  if(!ti)return;
  ti.value=state.title;
  ti.addEventListener('input',function(){
    state.title=ti.value;
    try{document.title=(state.title||"魔道書大戰 魔法使名冊");}catch(e){}
    var h2=document.querySelector('#content .gp-head h2');
    if(h2)h2.textContent=(state.title||"魔道書大戰 魔法使名冊");
  });
})();

/* ══════════════════════════════════════════════════
   啟動
   ══════════════════════════════════════════════════ */
function boot(){
  var exportData = (typeof window!=='undefined' && window.__EXPORT__) ? window.__EXPORT__ : null;
  if(exportData){
    /* 匯出版：用內嵌 CSV + 圖庫 */
    if(exportData.__imglib__){ try{ var lib=JSON.parse(exportData.__imglib__); Object.keys(lib).forEach(function(k){imgURLs[k]=lib[k];}); }catch(e){} }
    var files={};
    ["角色.csv","特技.csv","階梯.csv","經歷.csv","機關.csv","真實之姿.csv","藏書_魔法.csv","魔素.csv"].forEach(function(n){ if(exportData[n]!=null)files[n]=exportData[n]; });
    buildFromCSV(files);
    if(exportData.__title__){ state.title=exportData.__title__; try{document.title=state.title;}catch(e){} }
  }else{
    buildFromCSV({});
  }
  renderList("");
  renderGallery("");
}
boot();
})();
