<!DOCTYPE html>
<html lang="zh-Hant" style="--accent: #9280A4; --accent-rgb: 146,128,164; --accent-ink: #6b5a82;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔道書大戦 魔法師名冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --ink:#0e1120; --ink-2:#161a2c; --ink-3:#20263d; --ink-line:#2c3350;
  --paper:#e8e5dd; --card:#faf8f2; --card-2:#f2efe6;
  --text:#191c28; --text-mid:#585f72; --text-dim:#8b91a2;
  --hair:#ddd8cd; --hair-2:#cec8ba; --star:#c9b8e6;
  --accent:#9280A4; --accent-rgb:146,128,164; --accent-ink:#6b5a82;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"Space Mono","Noto Sans TC",monospace;
  --sidebar-w:284px;
  /* 全站字級基準：最小 13px */
  --fs-min:13px; --fs-sm:13px; --fs-base:15px; --fs-md:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--sans);font-size:var(--fs-base);line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
img{display:block}
a{color:inherit}
::selection{background:rgba(var(--accent-rgb),.25)}

/* ── 工具列（匯出純檢視版會移除） ─────────────────── */
#toolbar{
  position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:10px 16px;background:var(--ink);color:#e7e9f2;border-bottom:1px solid #05060c;
}
#toolbar .brand{
  font-family:var(--serif);font-weight:700;letter-spacing:.14em;font-size:var(--fs-md);
  margin-right:6px;display:flex;align-items:center;gap:9px;color:#f2eefb;white-space:nowrap;
}
#toolbar .brand .mk{width:15px;height:15px;flex:none}
.tbtn{
  padding:7px 13px;font-size:var(--fs-sm);background:var(--ink-2);color:#d6dbea;
  border:1px solid var(--ink-line);border-radius:2px;transition:background .14s,border-color .14s,color .14s;
}
.tbtn:hover{background:var(--ink-3);border-color:#3c456a;color:#fff}
.tbtn:disabled{opacity:.42;cursor:default}
.tbtn.primary{background:rgba(var(--accent-rgb),.22);border-color:rgba(var(--accent-rgb),.55);color:#efeaf6}
.tbtn.primary:hover{background:rgba(var(--accent-rgb),.34)}
#toolbar label.chk{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:#aab2c6;cursor:pointer}
#toolbar .status{margin-left:auto;font-size:var(--fs-sm);color:#98a0b6;font-family:var(--mono)}
#toolbar .status b{color:var(--star);font-weight:700}

/* ── 版面骨架 ─────────────────────────────────── */
#app{display:flex;min-height:calc(100vh - 48px)}
#sidebar{
  width:var(--sidebar-w);flex:none;background:var(--ink);color:#cfd5e6;
  border-right:1px solid #05060c;display:flex;flex-direction:column;position:sticky;top:48px;
  height:calc(100vh - 48px);
}
body.exported #sidebar{top:0;height:100vh}
.sb-top{padding:16px 15px 12px;border-bottom:1px solid var(--ink-line)}
.sb-title{
  font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.14em;color:#efeaf9;
  margin:0 0 3px;display:flex;align-items:center;gap:8px;
}
.sb-title .mk{width:16px;height:16px;flex:none}
.sb-sub{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.18em;color:#6f7794;margin:0}
#search{
  width:100%;margin-top:12px;padding:9px 11px;font-family:inherit;font-size:var(--fs-sm);
  background:var(--ink-2);color:#e7e9f2;border:1px solid var(--ink-line);border-radius:2px;
}
#search::placeholder{color:#5d6579}
#search:focus{outline:none;border-color:rgba(var(--accent-rgb),.7)}
#homeBtn{
  width:100%;margin-top:9px;padding:8px 10px;font-size:var(--fs-sm);
  display:flex;align-items:center;gap:8px;text-align:left;
  background:var(--ink-2);border:1px solid var(--ink-line);border-radius:2px;color:#aeb6c8;
  transition:background .14s,color .14s,border-color .14s;
}
#homeBtn svg{flex:none;opacity:.85}
#homeBtn:hover,#homeBtn[aria-current="true"]{background:var(--ink-3);color:#fff;border-color:#3c456a}
.sb-list{flex:1;overflow-y:auto;padding:8px 8px 20px}
.sb-group{margin-top:10px}
.sb-group>.gh{
  font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.2em;color:#727a97;
  padding:6px 8px 5px;display:flex;align-items:center;gap:8px;
}
.sb-group>.gh::after{content:"";flex:1;height:1px;background:var(--ink-line)}
.item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 9px;border:none;background:none;border-radius:3px;color:#cbd1e2;
  transition:background .12s;
}
.item:hover{background:var(--ink-2)}
.item[aria-current="true"]{background:var(--ink-3);box-shadow:inset 2px 0 0 var(--ic,var(--accent))}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ic,var(--accent))}
.item .nm{font-size:var(--fs-sm);font-weight:500;line-height:1.35}
.item .rd{display:block;font-family:var(--mono);font-size:var(--fs-min);color:#7b83a0;letter-spacing:.04em}

/* ── 右側主區 ─────────────────────────────────── */
#main{flex:1;min-width:0;position:relative}
.wrap{max-width:1120px;margin:0 auto;padding:30px 34px 70px}

/* 縮圖展示頁 */
.gp-head{text-align:center;margin:14px 0 40px;position:relative}
.gp-head .const{margin:0 auto 14px;width:132px;height:34px;opacity:.9}
.gp-head h2{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.14em;margin:0;line-height:1.2}
.gp-head p{margin:11px 0 0;font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.26em;color:var(--text-dim)}
.gp-cat{
  display:flex;align-items:center;gap:13px;margin:0 0 22px;
  font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.2em;color:var(--text-mid);
}
.gp-cat .n{color:#a48fbb;letter-spacing:.06em}
.gp-cat::after{content:"";flex:1;height:1px;background:var(--hair-2)}
.gp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 16px;margin-bottom:40px}
.gp-card{
  display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:none;padding:6px 4px 10px;
  border-radius:4px;transition:transform .16s;
}
.gp-card:hover{transform:translateY(-3px)}
.gp-card .pic{
  width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden;position:relative;
  background:var(--cc,#cdbfe0);border:1px solid var(--hair-2);
  box-shadow:0 1px 0 #fff inset,0 2px 8px rgba(20,22,40,.09);
  transition:box-shadow .16s,border-color .16s;
}
.gp-card:hover .pic{border-color:var(--cc,var(--accent));box-shadow:0 0 0 2px rgba(var(--accent-rgb),.18),0 6px 16px rgba(20,22,40,.16)}
.gp-card .pic img{width:100%;height:100%;object-fit:cover}
.gp-card .pic .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:34px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.28)}
.gp-card .nm{font-family:var(--serif);font-weight:700;font-size:var(--fs-base);line-height:1.25;color:var(--cc,var(--text));text-align:center}
.gp-card .rd{font-family:var(--mono);font-size:var(--fs-min);color:var(--text-dim);min-height:1em;letter-spacing:.03em;text-align:center}
.gp-card .mg{font-size:var(--fs-min);color:var(--text-mid);text-align:center;line-height:1.3}

/* ── 詳情頁 ─────────────────────────────────── */
.sheet{position:relative;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet,.gp-card{animation:none;transition:none}}
.bgfull{
  position:absolute;top:0;right:-8px;width:min(46%,440px);height:100%;
  background-size:cover;background-position:top center;opacity:.11;pointer-events:none;
  -webkit-mask-image:linear-gradient(to left,#000 40%,transparent);mask-image:linear-gradient(to left,#000 40%,transparent);
  z-index:0;
}
.sheet>*{position:relative;z-index:1}

.dh{border-bottom:2px solid var(--accent);padding-bottom:16px;margin-bottom:20px}
.dh .cat{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.24em;color:var(--accent-ink);text-transform:uppercase;margin-bottom:7px}
.dh h1{font-family:var(--serif);font-weight:900;font-size:33px;letter-spacing:.06em;margin:0;line-height:1.15;color:var(--accent-ink)}
.dh .rd{font-family:var(--mono);font-size:var(--fs-sm);color:var(--text-mid);letter-spacing:.1em;margin-top:5px}
.dh .mg{font-family:var(--serif);font-size:var(--fs-md);color:var(--text-mid);margin-top:3px;font-style:italic}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:13px}
.dh .meta .m{font-size:var(--fs-sm);color:var(--text-mid);background:var(--card-2);border:1px solid var(--hair);border-radius:2px;padding:3px 9px}
.dh .meta .m b{color:var(--text);font-weight:700}
.dh .meta .m.hl{background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.4);color:var(--accent-ink)}
.dh .meta .m.hl b{color:var(--accent-ink)}

/* 能力數值 */
.stats{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:9px 15px;text-align:center;min-width:74px}
.stat .k{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.14em;color:var(--text-dim)}
.stat .v{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.1;color:var(--text);margin-top:1px}
.stat.big{background:var(--accent);border-color:var(--accent)}
.stat.big .k{color:rgba(255,255,255,.82)}
.stat.big .v{color:#fff}
.stat.sm .v{font-size:19px}

/* 區塊 */
.sec{margin:0 0 24px}
.sec-h{
  font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:.2em;color:var(--text-mid);
  display:flex;align-items:center;gap:11px;margin:0 0 13px;
}
.sec-h::before{content:"";width:15px;height:1px;background:var(--accent)}
.sec-h::after{content:"";flex:1;height:1px;background:var(--hair)}

/* 特技表 signature */
.skwrap{overflow-x:auto}
.sktable{border-collapse:separate;border-spacing:0;width:100%;min-width:600px;font-size:var(--fs-sm)}
.sktable th,.sktable td{border:1px solid var(--hair-2);text-align:center;padding:0}
.sktable thead th{
  background:var(--ink-2);color:#e7e9f2;font-family:var(--serif);font-weight:700;
  letter-spacing:.06em;padding:6px 2px;font-size:var(--fs-sm);
}
.sktable thead th.corner{background:var(--ink);width:34px}
.sktable td.die,.sktable th.die{
  background:var(--ink-3);color:#c7cde0;font-family:var(--mono);font-size:var(--fs-min);width:34px;
}
.sktable td.sk{
  background:var(--card);color:var(--text);height:33px;font-size:var(--fs-sm);
  position:relative;transition:background .1s;white-space:nowrap;padding:0 5px;
}
.sktable td.sk.on{background:var(--accent);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sktable td.sk.judge{outline:2px solid var(--accent-ink);outline-offset:-2px}
.sktable td.sk.judge::after{
  content:"";position:absolute;top:0;right:0;
  border-style:solid;border-width:0 10px 10px 0;
  border-color:transparent var(--accent-ink) transparent transparent;
}
.sktable td.sk.gap::before{
  content:"";position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;
  background:var(--star);box-shadow:0 0 0 1px var(--accent-ink);
}
.sk-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:var(--fs-min);color:var(--text-mid)}
.sk-legend span{display:inline-flex;align-items:center;gap:6px}
.sk-legend .swatch{width:13px;height:13px;border-radius:2px;background:var(--accent);border:1px solid var(--accent-ink)}
.sk-legend .swatch.g{background:var(--star)}
.sk-legend .swatch.j{background:#fff;outline:2px solid var(--accent-ink);outline-offset:-2px}

/* 習得特技判定值 + 魂之特技 */
.judge-list{display:flex;flex-wrap:wrap;gap:8px}
.jchip{
  display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--hair);
  border-radius:3px;padding:6px 12px;font-size:var(--fs-sm);
}
.jchip .nm{font-weight:700;color:var(--accent-ink)}
.jchip .vl{font-family:var(--mono);font-size:var(--fs-min);color:var(--text-mid)}
.jchip .gp{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.04em;background:var(--star);color:var(--accent-ink);border-radius:2px;padding:1px 6px}
.jchip.soul{background:rgba(var(--accent-rgb),.1);border-color:rgba(var(--accent-rgb),.45)}
.jchip.soul .tag{font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.08em;background:var(--accent-ink);color:#fff;border-radius:2px;padding:1px 6px}

/* 兩欄 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:840px){.cols{grid-template-columns:1fr}}

/* 定義列表卡 */
.card-block{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:14px 16px;margin-bottom:14px}
.card-block .bt{font-family:var(--serif);font-weight:700;font-size:var(--fs-base);color:var(--text);margin:0 0 4px;display:flex;align-items:baseline;gap:9px}
.card-block .creed{font-size:var(--fs-sm);color:var(--accent-ink);font-weight:500}
.card-block .desc{font-size:var(--fs-sm);color:var(--text-mid);line-height:1.55}
.card-block .eff{display:inline-block;font-size:var(--fs-min);font-family:var(--mono);letter-spacing:.04em;background:rgba(var(--accent-rgb),.14);color:var(--accent-ink);border-radius:2px;padding:2px 8px;margin-left:auto}

.prose{font-size:var(--fs-base);color:var(--text);line-height:1.72;white-space:pre-wrap}
.prose.mid{color:var(--text-mid);font-size:var(--fs-sm)}

/* 錨點關係 */
.anchor{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:12px 14px;margin-bottom:11px;position:relative}
.anchor .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.anchor .an{font-family:var(--serif);font-weight:700;font-size:var(--fs-base)}
.chip{font-size:var(--fs-min);border-radius:2px;padding:2px 9px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.chip.fate{background:var(--accent-ink);color:#fff;font-family:var(--mono)}
.chip.fate.trauma{background:#7a2e3a}
.chip.attr{background:var(--card-2);border:1px solid var(--hair-2);color:var(--text-mid)}
.anchor .set{font-size:var(--fs-sm);color:var(--text-mid);line-height:1.55}
.anchor .del{position:absolute;top:9px;right:10px;background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;padding:2px 5px;border-radius:3px}
.anchor .del:hover{background:#eee2e4;color:#a23b4a}
body.exported .anchor .del{display:none}

/* 錨點編輯器 */
.anchor-edit{display:none;background:var(--card-2);border:1px dashed var(--hair-2);border-radius:4px;padding:13px 14px;margin-bottom:12px}
.anchor-edit.show{display:block}
.anchor-edit .row{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:9px;margin-bottom:9px}
@media (max-width:560px){.anchor-edit .row{grid-template-columns:1fr}}
.anchor-edit label{display:block;font-family:var(--mono);font-size:var(--fs-min);letter-spacing:.1em;color:var(--text-mid);margin-bottom:3px}
.anchor-edit input,.anchor-edit select,.anchor-edit textarea{
  width:100%;font-family:inherit;font-size:var(--fs-sm);padding:7px 9px;
  border:1px solid var(--hair-2);border-radius:2px;background:#fff;color:var(--text);
}
.anchor-edit textarea{resize:vertical;min-height:44px}
.anchor-edit .acts{display:flex;gap:8px;margin-top:2px}
.mini{padding:6px 13px;font-size:var(--fs-sm);border:1px solid var(--hair-2);background:#fff;border-radius:2px}
.mini.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.accent:hover{filter:brightness(1.06)}
.mini:hover{background:var(--card-2)}
.add-anchor{margin-top:2px}
body.exported .add-anchor,body.exported .anchor-edit{display:none!important}

/* 藏書 */
.spell{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:11px 14px;margin-bottom:10px}
.spell .sp-top{grid-column:1/-1;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.spell .sp-nm{font-family:var(--serif);font-weight:700;font-size:var(--fs-base)}
.spell .sp-tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.spell .t{font-size:var(--fs-min);border-radius:2px;padding:1px 8px;white-space:nowrap}
.spell .t.kind{background:rgba(var(--accent-rgb),.16);color:var(--accent-ink)}
.spell .t.skill{background:var(--card-2);border:1px solid var(--hair-2);color:var(--text-mid)}
.spell .t.cost{background:var(--ink-2);color:#dfe3f0;font-family:var(--mono)}
.spell .sp-eff{grid-column:1/-1;font-size:var(--fs-sm);color:var(--text-mid);line-height:1.55;margin-top:5px}
.spell .miss{grid-column:1/-1;font-size:var(--fs-min);color:#b05a5a}

/* 差分 */
.variants{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.variants img{width:70px;height:70px;object-fit:cover;border-radius:3px;border:1px solid var(--hair-2);cursor:zoom-in;transition:transform .14s}
.variants img:hover{transform:scale(1.05);border-color:var(--accent)}

/* 空狀態 */
.empty{max-width:520px;margin:12vh auto;text-align:center;color:var(--text-mid)}
.empty .const{width:150px;height:40px;margin:0 auto 18px;opacity:.85}
.empty h2{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--text);letter-spacing:.06em;margin:0 0 10px}
.empty p{font-size:var(--fs-sm);line-height:1.7;margin:5px 0}
.empty code{font-family:var(--mono);font-size:var(--fs-min);background:var(--card-2);border:1px solid var(--hair);border-radius:2px;padding:1px 6px}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(8,9,18,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#lb.show{display:flex}
#lb img{max-width:94vw;max-height:92vh;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lb .x{position:absolute;top:18px;right:22px;background:none;border:none;color:#fff;font-size:30px;line-height:1}

.hidden{display:none!important}
</style>
</head>
<body class="exported">



<div id="app">
  <aside id="sidebar">
    <div class="sb-top">
      <p class="sb-title">
        <svg class="mk" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 6.9L21.6 9l-5.4 4.3 2 7-6.2-4.2L5.8 20.3l2-7L2.4 9l7.2-.1z" fill="currentColor"></path></svg>
        魔法師名冊
      </p>
      <p class="sb-sub">MAGICA LOGIA ROSTER</p>
      <input id="search" type="search" placeholder="搜尋偽名・魔法名・機關・特技・PL…" autocomplete="off">
      <button id="homeBtn" aria-current="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"></rect><rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"></rect><rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"></rect><rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"></rect></svg>
        回到縮圖展示頁

      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i+=2;continue;} q=false;i++;continue; }
      cur+=c;i++;continue;
    }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(cur);cur="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";i++;continue;}
    cur+=c;i++;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function csvToObjects(text){
  var rows=parseCSV(text).filter(function(r){return r.some(function(x){return String(x).trim()!=="";});});
  if(!rows.length) return [];
  var head=rows[0].map(function(h){return String(h).trim();});
  return rows.slice(1).map(function(r){
    var o={}; head.forEach(function(h,idx){o[h]=(r[idx]!=null?r[idx]:"");}); return o;
  });
}
function csvEscape(v){
  v=v==null?"":String(v);
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function objectsToCSV(head,objs){
  var out=[head.map(csvEscape).join(",")];
  objs.forEach(function(o){ out.push(head.map(function(h){return csvEscape(o[h]);}).join(",")); });
  return "\uFEFF"+out.join("\r\n");
}

/* 解析習得特技欄：每列 "特技:判定值:Gap1:Gap2" */
function parseLearned(str){
  return String(str||"").split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var p=l.split(":");
    return {name:(p[0]||"").trim(), value:(p[1]||"").trim(), gap1:(p[2]||"").trim(), gap2:(p[3]||"").trim()};
  });
}

/* ══════════════════════════════════════════════════
   圖片解析
   ══════════════════════════════════════════════════ */
function resolveImg(v){
  v=String(v||"").trim();
  if(!v) return "";
  if(/^(https?:|data:|blob:)/i.test(v)) return v;
  if(imgURLs[v]) return imgURLs[v];
  var base=v.split("/").pop();
  if(imgURLs[base]) return imgURLs[base];
  if(imgURLs["./"+v]) return imgURLs["./"+v];
  return "";
}

/* ══════════════════════════════════════════════════
   色彩工具
   ══════════════════════════════════════════════════ */
function hexToRgb(hex){
  hex=String(hex||"").trim().replace('#','');
  if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(hex))return null;
  return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function darken(rgb,amt){
  return {r:Math.round(rgb.r*(1-amt)),g:Math.round(rgb.g*(1-amt)),b:Math.round(rgb.b*(1-amt))};
}
function lum(rgb){return (0.299*rgb.r+0.587*rgb.g+0.114*rgb.b)/255;}
function applyAccent(hex){
  var rgb=hexToRgb(hex)||hexToRgb("#9280A4");
  var ink=rgb; var i=0;
  while(lum(ink)>0.42 && i<8){ ink=darken(ink,0.18); i++; }
  var root=document.documentElement.style;
  root.setProperty('--accent','rgb('+rgb.r+','+rgb.g+','+rgb.b+')');
  root.setProperty('--accent-rgb',rgb.r+','+rgb.g+','+rgb.b);
  root.setProperty('--accent-ink','rgb('+ink.r+','+ink.g+','+ink.b+')');
}
function resetAccent(){
  var root=document.documentElement.style;
  root.setProperty('--accent','#9280A4');
  root.setProperty('--accent-rgb','146,128,164');
  root.setProperty('--accent-ink','#6b5a82');
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}

function groupChars(list){

  return order.map(function(g){return {name:g,items:groups[g]};});
}
function renderList(filter){

function matchChar(c,f){
  if(!f)return true;
  var learned=parseLearned(c["習得特技"]).map(function(x){return x.name;}).join(" ");

  return hay.indexOf(f)>=0;
}

function bindAnchorEditor(c){
  var key=charKey(c);
  var content=document.getElementById('content');
  content.querySelectorAll('.anchor .del').forEach(function(btn){
    btn.addEventListener('click',function(){
      var i=parseInt(btn.dataset.del,10);
      if(state.anchors[key]){ state.anchors[key].splice(i,1); renderDetail(c); }
    });
  });
  var addBtn=document.getElementById('btnAddAnchor');
  var editor=document.getElementById('anchorEdit');
  if(addBtn&&editor){
    addBtn.addEventListener('click',function(){ editor.classList.toggle('show'); if(editor.classList.contains('show')){document.getElementById('ae_name').focus();} });
    document.getElementById('ae_cancel').addEventListener('click',function(){editor.classList.remove('show');});
    document.getElementById('ae_save').addEventListener('click',function(){
      var name=document.getElementById('ae_name').value.trim();
      if(!name){document.getElementById('ae_name').focus();return;}
      var a={name:name,fate:document.getElementById('ae_fate').value,attr:document.getElementById('ae_attr').value,setting:document.getElementById('ae_set').value.trim()};
      (state.anchors[key]=state.anchors[key]||[]).push(a);
      renderDetail(c);
      setStatus('已為 <b>'+esc(name)+'</b> 加入錨點（記得匯出以保存）');
    });
  }
}

/* ══════════════════════════════════════════════════
   載入資料夾（多 CSV + 圖片）
   ══════════════════════════════════════════════════ */
var CSV_NAMES=["角色.csv","特技.csv","經歷.csv","機關.csv","真實之姿.csv","藏書_魔法.csv","錨點關係.csv"];
function setStatus(html){var s=document.getElementById('status');if(s)s.innerHTML=html;}
function bind(id,ev,fn){var e=document.getElementById(id);if(e)e.addEventListener(ev,fn);}

bind('btnFolder','click',function(){var fi=document.getElementById('folderInput');if(fi)fi.click();});
bind('folderInput','change',function(e){
  var files=Array.prototype.slice.call(e.target.files||[]);
  if(!files.length)return;
  var csvText={}, imgCount=0, pending=[];
  imgURLs={};imgFiles={};
  files.forEach(function(f){
    var base=f.name;
    var rel=(f.webkitRelativePath||f.name);
    var relNoRoot=rel.split("/").slice(1).join("/")||f.name;
    if(/\.csv$/i.test(f.name)){
      if(CSV_NAMES.indexOf(base)>=0){
        pending.push(f.text().then(function(t){csvText[base]=t;}));
      }
    }else if(/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(f.name)){
      var url=URL.createObjectURL(f);
      [rel,relNoRoot,base,"./"+relNoRoot].forEach(function(k){if(k){imgURLs[k]=url;imgFiles[k]=f;}});
      imgCount++;
    }
  });
  Promise.all(pending).then(function(){
    buildFromCSV(csvText);
    var got=Object.keys(csvText);
    setStatus('已載入 <b>'+got.length+'</b> 個 CSV・<b>'+imgCount+'</b> 張圖・<b>'+state.chars.length+'</b> 名角色');
    renderList("");
    renderGallery("");
  });
  e.target.value="";
});

/* ══════════════════════════════════════════════════
   下載 CSV 範本（store ZIP）
   ══════════════════════════════════════════════════ */
function crc32(bytes){
  var c,table=crc32.t;
  if(!table){table=crc32.t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}}
  var crc=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++)crc=(crc>>>8)^table[(crc^bytes[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){return new TextEncoder().encode(s);}
function u16(n){return [n&0xFF,(n>>8)&0xFF];}
function u32(n){return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];}
function makeZip(entries){
  /* entries: [{name, bytes}] store（不壓縮） */
  var chunks=[], central=[], offset=0;
  entries.forEach(function(en){
    var nameB=strBytes(en.name), data=en.bytes, crc=crc32(data);
    var local=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    var localHead=new Uint8Array(local);
    chunks.push(localHead,nameB,data);
    var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cen),nameB);
    offset+=localHead.length+nameB.length+data.length;
  });
  var cenStart=offset, cenSize=0;
  central.forEach(function(c){cenSize+=c.length;});
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(cenSize),u32(cenStart),u16(0)));
  var all=chunks.concat(central,[end]);
  return new Blob(all,{type:'application/zip'});
}
function currentCSVMap(){
  /* 依當前狀態重建各 CSV（含錨點編輯結果） */
  var m={};
  m["角色.csv"]=DEMO["角色.csv"]; /* 佔位，稍後覆寫 */
  m["特技.csv"]=DEMO["特技.csv"];
  m["經歷.csv"]=DEMO["經歷.csv"];
  m["機關.csv"]=DEMO["機關.csv"];
  m["真實之姿.csv"]=DEMO["真實之姿.csv"];
  m["藏書_魔法.csv"]=DEMO["藏書_魔法.csv"];
  /* 角色 CSV：用當前 state.chars 重建，保留全部欄位 */
  if(state.chars.length){
    var head=Object.keys(state.chars[0]);
    m["角色.csv"]=objectsToCSV(head,state.chars);
  }
  /* 錨點關係 CSV：用當前 state.anchors 重建 */
  var arows=[];
  Object.keys(state.anchors).forEach(function(k){
    state.anchors[k].forEach(function(a){arows.push({角色:k,錨點名:a.name,命運:a.fate,屬性:a.attr,設定:a.setting});});
  });
  m["錨點關係.csv"]=objectsToCSV(["角色","錨點名","命運","屬性","設定"],arows);
  return m;
}
bind('btnTemplate','click',function(){
  var m=currentCSVMap();
  var entries=Object.keys(m).map(function(n){return {name:"魔法師名冊資料庫/"+n,bytes:strBytes(m[n])};});
  entries.push({name:"魔法師名冊資料庫/images/放圖說明.txt",bytes:strBytes("將頭像／全身圖／差分放在這裡，CSV 以 images/xxx.png 相對路徑指定。\r\n載入時用工具列的「載入資料夾」選擇整個「魔法師名冊資料庫」資料夾即可一次讀入所有 CSV 與圖片。")});
  var blob=makeZip(entries);
  downloadBlob("魔法師名冊資料庫.zip",blob);
  setStatus('已下載 <b>7</b> 個 CSV 範本（ZIP）');
});

/* ══════════════════════════════════════════════════
   匯出純檢視網頁
   ══════════════════════════════════════════════════ */
function downloadBlob(name,blob){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},200);
}
function fileToDataURL(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){res("");};r.readAsDataURL(file);});}

bind('btnExport','click',async function(){
  var btn=this;btn.disabled=true;setStatus('正在打包純檢視網頁…');
  try{
    var m=currentCSVMap();
    var ec=document.getElementById('embedImgs');var embed=ec?ec.checked:false;
    /* 收集需要內嵌的圖片路徑 */
    if(embed){
      /* 把 imgFiles 轉 data URL，並改寫 CSV 中的相對路徑為 data URL */
      var keys=Object.keys(imgFiles);
      var dataMap={};
      for(var i=0;i<keys.length;i++){ dataMap[keys[i]]=await fileToDataURL(imgFiles[keys[i]]); }
      /* 對角色 CSV 內的圖片欄替換：簡化作法——載入圖片後才有 imgFiles */
      /* 為求穩健，改為在匯出 HTML 內附一份 imgLib，讓 resolveImg 先查 */
      m.__imglib__=JSON.stringify((function(){
        var lib={}; Object.keys(dataMap).forEach(function(k){ if(dataMap[k])lib[k]=dataMap[k]; }); return lib;
      })());
    }
    var doc=document.documentElement.cloneNode(true);
    var tb=doc.querySelector('#toolbar'); if(tb)tb.remove();
    doc.querySelector('body').classList.add('exported');
    var payload="window.__EXPORT__="+JSON.stringify(m)+";";
    var html="<!DOCTYPE html>\n"+doc.outerHTML;
    html=html.replace('<script id="app-script">',
      '<scr'+'ipt>'+payload+'<\/scr'+'ipt>\n<scr'+'ipt id="app-script">');
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    downloadBlob((state.title||"魔法師名冊")+"_純檢視版.html",blob);
    setStatus('已匯出純檢視網頁（<b>'+state.chars.length+'</b> 名角色）');
  }catch(err){ setStatus('匯出失敗：'+(err&&err.message||err)); }
  btn.disabled=false;
});

/* ══════════════════════════════════════════════════
   啟動
   ══════════════════════════════════════════════════ */
function boot(){
  var exportData = (typeof window!=='undefined' && window.__EXPORT__) ? window.__EXPORT__ : null;
  if(exportData){
    /* 匯出版：用內嵌 CSV + 圖庫 */
    if(exportData.__imglib__){ try{ var lib=JSON.parse(exportData.__imglib__); Object.keys(lib).forEach(function(k){imgURLs[k]=lib[k];}); }catch(e){} }
    var files={};
    ["角色.csv","特技.csv","經歷.csv","機關.csv","真實之姿.csv","藏書_魔法.csv","錨點關係.csv"].forEach(function(n){ if(exportData[n]!=null)files[n]=exportData[n]; });
    buildFromCSV(files);
  }else{
    buildFromCSV({});
  }
  renderList("");
  renderGallery("");
}
boot();
})();
