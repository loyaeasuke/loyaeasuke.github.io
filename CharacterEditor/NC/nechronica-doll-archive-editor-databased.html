/* 部件分區：基本部件固定（不可增減、僅可標損傷）；強化部件／寶物可搜尋加入、排序、刪除；
   強化部件可自訂名稱與說明（留空＝資料庫預設）；已加入的強化部件不可重複選取 */
function partArea(area,judgeKey,tokens,judge,onChange){
  var box=el("div","ptbox");
  var h=el("h4",null,'<span>'+esc(area)+'</span>');
  if(judgeKey){var jSpan=el("span","j",'攻擊判定值 <b style="color:var(--text-mid)">'+esc(judge||"—")+'</b>');h.appendChild(jSpan);}
  box.appendChild(h);
  var cb=combo(partItems(area),{placeholder:"搜尋強化部件名稱後點選加入…"});
  box.appendChild(cb.el);
  var list=el("div","chip-list");box.appendChild(list);
  function fire(){if(onChange)onChange();}

  /* kind: "basic"（固定）| "enh"（強化，可自訂）| "tre"（寶物，可自訂名稱） */
  function makeChip(kind,ref,opt){
    opt=opt||{};
    var chip=el("span","pchip"+(opt.dmg?" dmg":"")+(kind==="tre"?" tre":"")+(kind==="basic"?" basic-fixed":"")+((kind==="enh"||kind==="tre")?" prow":""));
    chip._kind=kind;chip._ref=ref||"";chip._dmg=!!opt.dmg;chip._tre=(kind==="tre");chip._base=(kind==="basic");
    chip._cName=opt.cName||"";chip._cDesc=opt.cDesc||"";
    var head=el("span","pc-head");
    var nameSpan=null;
    if(kind==="tre"){
      var treTag=el("span","tre-tag","寶物");
      var tin=el("input");tin.type="text";tin.className="tre-in";tin.value=chip._cName||"寶物";tin.size=6;tin.placeholder="寶物名稱";
      tin.oninput=function(){chip._cName=tin.value.trim()||"寶物";};
      head.appendChild(treTag);head.appendChild(tin);
      chip._nmEl=treTag;
    }else{
      nameSpan=el("span","pc-nm");
      chip._nmEl=head;
      var lvlText=(kind==="enh")?((DB.part[area+"||"+ref]||{})["部件等級"]||""):"";
      chip._renderName=function(){
        var disp=(kind==="enh"&&chip._cName)?chip._cName:ref;
        var tag=(kind==="basic")?' <span class="base">基本</span>':(lvlText?' <span class="base">'+esc(lvlText)+'</span>':"");
        var cust=(kind==="enh"&&chip._cName)?' <span class="cust" title="已自訂">✎</span>':"";
        nameSpan.innerHTML=esc(disp)+tag+cust;
      };
      chip._renderName();
      head.appendChild(nameSpan);
    }
    /* 損傷開關（含基本部件；損傷不改變數量） */
    var lbl=el("label","dmg-toggle");var dc=el("input");dc.type="checkbox";dc.checked=!!opt.dmg;
    dc.onchange=function(){chip.classList.toggle("dmg",dc.checked);chip._dmg=dc.checked;fire();};
    lbl.appendChild(dc);lbl.appendChild(document.createTextNode("損"));head.appendChild(lbl);
    if(kind!=="basic"){
      if(kind==="enh"){
        var edb=el("button","pc-ed","✎");edb.type="button";edb.title="自訂名稱／說明";
        edb.onclick=function(){chip.classList.toggle("editing");};head.appendChild(edb);
      }else if(kind==="tre"){
        /* 寶物無自訂鈕，但保留同寬空位；用「同為 button」以取得與強化部件 ✎ 完全相同的寬度，
           使「損」核取方塊與後方按鈕與強化部件對齊（span 會少吃到 .pchip button 的樣式而略有位移） */
        var sp=el("button","pc-ed pc-ed-spacer","✎");sp.type="button";sp.disabled=true;sp.tabIndex=-1;sp.style.visibility="hidden";sp.setAttribute("aria-hidden","true");head.appendChild(sp);
      }
      var mv=el("span","mv");
      var up=el("button",null,"▲");up.type="button";up.title="上移";
      up.onclick=function(){var p=chip.previousElementSibling;if(p&&p.classList.contains("pchip")&&!p.classList.contains("basic-fixed"))list.insertBefore(chip,p);};
      var dn=el("button",null,"▼");dn.type="button";dn.title="下移";
      dn.onclick=function(){var n=chip.nextElementSibling;if(n&&n.classList.contains("pchip"))list.insertBefore(n,chip);};
      var rm=el("button",null,"✕");rm.type="button";rm.title="移除";
      rm.onclick=function(){chip.remove();fire();};
      mv.appendChild(up);mv.appendChild(dn);head.appendChild(mv);head.appendChild(rm);
    }
    chip.appendChild(head);
    if(kind==="enh"){
      var rec=DB.part[area+"||"+ref]||{};
      var edp=el("div","pc-edit");
      var lN=el("label","pc-lab","名稱");
      var ni=el("input");ni.type="text";ni.className="pc-cname";ni.value=chip._cName;ni.placeholder=ref;
      var lD=el("label","pc-lab","說明");
      var ta=el("textarea");ta.className="pc-cdesc";ta.value=chip._cDesc;ta.placeholder=(rec["說明"]||"（資料庫預設說明）");
      ni.oninput=function(){chip._cName=ni.value.trim();chip._renderName();};
      ta.oninput=function(){chip._cDesc=ta.value;};
      edp.appendChild(lN);edp.appendChild(ni);edp.appendChild(lD);edp.appendChild(ta);
      chip.appendChild(edp);
    }
    /* 懸浮提示：顯示部件資訊（等級／時機|COST|射程／效果）；掛在名稱元素上，
       因此游標指到自訂名稱／說明的輸入框時不會顯示。強化值超額時，另附警示。 */
    chip._infoTip=partTipText(area,ref,kind==="tre");
    chip._applyTip=function(over){
      if(!chip._nmEl)return;
      var t=(over?("強化值不足，無法加入"+(chip._infoTip?"\n\n"+chip._infoTip:"")):chip._infoTip);
      if(t)chip._nmEl.setAttribute("data-tip",t);else chip._nmEl.removeAttribute("data-tip");
    };
    chip._applyTip(false);
    return chip;
  }

  cb.onPick=function(v){if(v){list.appendChild(makeChip("enh",v,{}));cb.set("",true);cb.input.value="";cb.input.blur();fire();}};
  var bTre=el("button","addbtn tre-add","＋ 寶物（自訂名稱）");bTre.type="button";
  bTre.onclick=function(){list.appendChild(makeChip("tre","寶物",{cName:"寶物"}));fire();};
  box.appendChild(bTre);

  /* 載入：基本部件固定（沿用載入的清單以保留重複與損傷；空清單則帶入資料庫基本部件），其後為強化／寶物 */
  var loaded=tokens||[];
  var loadedBasics=loaded.filter(function(t){return !t.treasure&&(DB.part[area+"||"+t.name]||{})["部件等級"]==="基本部件";});
  var loadedOther=loaded.filter(function(t){return t.treasure||(DB.part[area+"||"+t.name]||{})["部件等級"]!=="基本部件";});
  var basicRender=loadedBasics.length?loadedBasics:basicsOf(area).map(function(n){return {name:n,dmg:false};});
  basicRender.forEach(function(t){list.appendChild(makeChip("basic",t.name,{dmg:t.dmg}));});
  loadedOther.forEach(function(t){
    if(t.treasure)list.appendChild(makeChip("tre","寶物",{dmg:t.dmg,cName:t.cName||t.name||"寶物"}));
    else list.appendChild(makeChip("enh",t.name,{dmg:t.dmg,cName:t.cName,cDesc:t.cDesc}));
  });

  /* 尚可加入的強化部件數量提示（四肢共用同一份額度；0 個以警示色顯示） */
  var hintEl=el("div","enh-hint");box.appendChild(hintEl);
  box._updateHint=function(){
    var rem=(typeof ED!=="undefined"&&ED&&ED._enhRem)||null;
    if(!rem){hintEl.innerHTML="";return;}
    hintEl.innerHTML=ENH_CATS.map(function(cat){
      var r=rem[cat]||{1:0,2:0,3:0};
      function s(v){return '<span class="'+(v>0?"n":"z")+'">'+v+'</span>';}
      return '<div class="row"><span class="cat">尚可加入'+cat+'部件</span>：'+s(r[1])+' 個等級１、'+s(r[2])+' 個等級２、'+s(r[3])+' 個等級３</div>';
    }).join("");
  };

  box._get=function(){return [].slice.call(list.querySelectorAll(".pchip")).map(function(c){
    if(c._kind==="tre")return makeTok({name:c._cName||"寶物",dmg:c._dmg,treasure:true});
    if(c._kind==="basic")return makeTok({name:c._ref,dmg:c._dmg});
    return makeTok({name:c._ref,dmg:c._dmg,cName:c._cName,cDesc:c._cDesc});
  });};
  box._names=function(){return [].slice.call(list.querySelectorAll(".pchip")).map(function(c){
    return {name:(c._kind==="tre"?(c._cName||"寶物"):c._ref),dmg:c._dmg,treasure:c._tre};
  });};
  box._judge=function(){return judge||"";};
  box._area=area;
  /* 強化值驗證：基本／寶物 cls=null（不佔強化欄位）；名稱用於提示訊息 */
  box._chipInfos=function(){return [].slice.call(list.querySelectorAll(".pchip")).map(function(c){
    return {el:c,name:(c._cName||c._ref),treasure:c._tre,cls:c._base?null:partClass(area,c._ref,c._tre)};
  });};
  /* 目前已加入的強化部件（參照名）—供跨部位去重 */
  box._enhRefs=function(){return [].slice.call(list.querySelectorAll(".pchip")).filter(function(c){return c._kind==="enh";}).map(function(c){return c._ref;});};
  /* 重建下拉：套用強化值過濾、排除基本部件、排除四肢已加入的強化部件（不可重複） */
  box._refreshItems=function(){
    var used={};
    if(typeof ED!=="undefined"&&ED&&ED.部件)BODY_AREAS.forEach(function(a){var b=ED.部件[a];if(b&&b._enhRefs)b._enhRefs().forEach(function(n){used[n]=1;});});
    var basics={};basicsOf(area).forEach(function(n){basics[n]=1;});
    cb.setItems(partItems(area).filter(function(it){return !basics[it.v]&&!used[it.v];}));
  };
  box._refreshItems();
  return box;
}

/* 技能編輯器：依位置規則從技能資料庫選取 */
function skillEditor(initialSkills,getIncl,getMain,getSub){
  var box=el("div","skill-ed");
  var slotWrap=el("div","skill-slots");box.appendChild(slotWrap);
  box.appendChild(el("div","skill-free-t","第 5 個以後 · 自由選擇（未選迷幻人偶則不含其技能）"));
  var freeWrap=el("div","rowlist");box.appendChild(freeWrap);
  var addFree=el("button","addbtn","＋ 加入技能（自由）");addFree.type="button";box.appendChild(addFree);
  var slots=[],frees=[];
  function typeItemsFor(typeName){
    var same=(getMain()&&getMain()===getSub());
    return skillItemsFrom(skillsOfType(typeName).filter(function(r){return same||!isSpecial(r);}));
  }
  function slotDef(i){
    if(i===0)return {label:"第 1 技能 · 傾向技能",owner:getIncl(),items:skillItemsFrom(skillsOfIncl(getIncl()))};
    if(i===1)return {label:"第 2 技能 · 主要類型技能",owner:getMain(),items:typeItemsFor(getMain())};
    if(i===2)return {label:"第 3 技能 · 主要類型技能",owner:getMain(),items:typeItemsFor(getMain())};
    return {label:"第 4 技能 · 輔助類型技能",owner:getSub(),items:typeItemsFor(getSub())};
  }
  /* 已選技能參照名（供去重；以資料庫技能名為準，與自訂名稱無關） */
  function usedRefs(exclude){
    var u={};
    slots.forEach(function(s){var v=s.getRef();if(v&&s!==exclude)u[v]=1;});
    frees.forEach(function(f){var v=f.getRef();if(v&&f!==exclude)u[v]=1;});
    return u;
  }
  function dedupAll(){
    slots.forEach(function(s){s.applyDedup(usedRefs(s));});
    frees.forEach(function(f){f.applyDedup(usedRefs(f));});
    /* 技能變動可能影響：強化部件例外額度（歪極／時鐘機器）、以及最大行動值，連動更新 */
    if(ED&&ED.部件&&ED.部件["頭"]){if(typeof revalidateEnh==="function")revalidateEnh();if(ED.recomputeB)ED.recomputeB();}
  }
  /* 單一技能控制項：下拉 ＋「✎ 自訂」名稱／說明面板（留空＝資料庫預設） */
  function makeSkillCtl(baseItems,opt){
    opt=opt||{};
    var wrap=el("div","skl-ctl");
    var cb=combo(baseItems,{placeholder:opt.placeholder||"搜尋技能…",value:opt.value||""});
    var ctl={_base:baseItems,cName:opt.cName||"",cDesc:opt.cDesc||"",cb:cb,el:wrap};
    var edb=el("button","pc-ed",'✎ <span class="pc-ed-txt">自訂</span>');edb.type="button";edb.title="自訂技能名稱／說明";
    var panel=el("div","pc-edit");
    var lN=el("label","pc-lab","名稱");
    var ni=el("input");ni.type="text";ni.className="pc-cname";ni.value=ctl.cName;
    var lD=el("label","pc-lab","說明");
    var ta=el("textarea");ta.className="pc-cdesc";ta.value=ctl.cDesc;
    ni.oninput=function(){ctl.cName=ni.value.trim();};
    ta.oninput=function(){ctl.cDesc=ta.value;};
    panel.appendChild(lN);panel.appendChild(ni);panel.appendChild(lD);panel.appendChild(ta);
    edb.onclick=function(){panel.style.display=(panel.style.display==="flex"?"none":"flex");};
    function sync(){var ref=cb.get();ni.placeholder=ref||"（先選擇技能）";var r=ref?DB.skill[ref]:null;ta.placeholder=(r&&r["說明"])?r["說明"]:"（資料庫預設說明）";edb.style.display=ref?"":"none";if(ref)cb.input.setAttribute("data-tip",skillTipText(ref));else cb.input.removeAttribute("data-tip");}
    cb.onPick=function(){sync();dedupAll();};
    ctl.getRef=function(){return cb.get();};
    ctl.getTok=function(){var ref=cb.get();return ref?makeTok({name:ref,cName:ctl.cName,cDesc:ctl.cDesc}):"";};
    ctl.applyDedup=function(used){cb.setItems(ctl._base.filter(function(it){return !used[it.v]||it.v===cb.get();}));};
    wrap.appendChild(cb.el);wrap.appendChild(edb);wrap.appendChild(panel);
    sync();
    return ctl;
  }
  function buildSlots(values){
    slotWrap.innerHTML="";slots=[];
    for(var i=0;i<4;i++){
      var def=slotDef(i),val=values[i]||{};
      var ctl=makeSkillCtl(def.items,{placeholder:def.owner?("選擇「"+def.owner+"」技能…"):"（尚未選對應傾向/類型）",value:val.name||"",cName:val.cName||"",cDesc:val.cDesc||""});
      slots.push(ctl);
      var f=el("div","fld");f.appendChild(el("label",null,esc(def.label)+(def.owner?"　<span style='color:var(--text-dim)'>"+esc(def.owner)+"</span>":"")));
      f.appendChild(ctl.el);slotWrap.appendChild(f);
    }
    dedupAll();
  }
  function addFreeRow(val){
    val=val||{};
    var item=el("div","rl-item");
    var ctl=makeSkillCtl(freeSkillItems(getMain(),getSub()),{placeholder:"搜尋技能…",value:val.name||"",cName:val.cName||"",cDesc:val.cDesc||""});
    item.appendChild(field("技能",ctl.el));
    var tools=el("div","rl-tools");var del=el("button",null,"✕");del.type="button";
    del.onclick=function(){item.remove();frees=frees.filter(function(x){return x!==rec;});dedupAll();};
    tools.appendChild(del);item.appendChild(tools);
    var rec={item:item,getRef:ctl.getRef,getTok:ctl.getTok,applyDedup:ctl.applyDedup,ctl:ctl};
    freeWrap.appendChild(item);frees.push(rec);dedupAll();
  }
  addFree.onclick=function(){addFreeRow({});};
  function rebuild(){
    var sv=slots.map(function(s){return {name:s.getRef(),cName:s.cName,cDesc:s.cDesc};});
    var fv=frees.map(function(f){return {name:f.ctl.getRef(),cName:f.ctl.cName,cDesc:f.ctl.cDesc};});
    buildSlots(sv);
    freeWrap.innerHTML="";frees=[];fv.forEach(function(v){addFreeRow(v);});
  }
  var init=(initialSkills||[]).map(function(t){return (typeof t==="string")?{name:t}:{name:t.name,cName:t.cName,cDesc:t.cDesc};});
  buildSlots(init.slice(0,4));init.slice(4).forEach(function(v){addFreeRow(v);});
  box._get=function(){var out=[];slots.forEach(function(s){var v=s.getTok();if(v)out.push(v);});frees.forEach(function(f){var v=f.getTok();if(v)out.push(v);});return out;};
  box._names=function(){return box._get().map(function(tok){return {name:parseTok(tok).name,dmg:false,treasure:false};});};
  box._judge=function(){return "";};
  box.rebuild=rebuild;
  return box;
}

/* 編輯器內即時計算部件加成（行動值 B） */
function edComputeB(){
  var sum=0;
  AREAS.forEach(function(area){
    var box=ED.部件&&ED.部件[area];if(!box)return;
    var toks=box._names();
    var eff=toks.length?toks:(area==="技能"?[]:basicsOf(area).map(function(n){return {name:n,dmg:false};}));
    eff.forEach(function(t){if(!t.dmg)sum+=corrOf(area,t.name);});
  });
  return sum;
}

/* 依「取得數量表」檢驗四肢部件；標紅超額 chip、更新下拉可選狀態、回傳違規清單。
   規則：某強化類別依強化值查表得到 [等級1,等級2,等級3] 的「欄位數」S1/S2/S3；
   等級 L 的部件需佔用「等級 ≥ L 的空位」（捨高就低：高等空位可放低等部件）。 */
function revalidateEnh(){
  if(!ED||!ED.部件)return [];
  var viol=[];
  var can={};
  var remByCat={};
  ENH_CATS.forEach(function(cat){
    /* 收集此類別所有 chip（依部位 頭→手→軀幹→腳、再依 chip 次序） */
    var byLvl={1:[],2:[],3:[]};
    BODY_AREAS.forEach(function(area){
      var box=ED.部件[area];if(!box||!box._chipInfos)return;
      box._chipInfos().forEach(function(ci){
        if(ci.cls){if(ci.cls.cat===cat)byLvl[ci.cls.lvl].push({el:ci.el,name:ci.name,area:area});}
        else{ci.el.classList.remove("over");if(ci.el._applyTip)ci.el._applyTip(false);}   /* 基本／寶物：清除超額標記，還原資訊提示 */
      });
    });
    var Q=quotaForCat(cat,enhBudget(cat),edSkillNames()),S1=Q[0],S2=Q[1],S3=Q[2];
    /* 先清除本類別 chip 的超額標記（還原資訊提示） */
    [1,2,3].forEach(function(L){byLvl[L].forEach(function(o){o.el.classList.remove("over");if(o.el._applyTip)o.el._applyTip(false);});});
    /* 由高等到低等貪婪配位：等級 L 依序使用等級 L、L+1…3 的空位 */
    var rem={1:S1,2:S2,3:S3},over={1:0,2:0,3:0};
    [3,2,1].forEach(function(L){
      var need=byLvl[L].length;
      for(var sl=L;sl<=3;sl++){var take=Math.min(need,rem[sl]);rem[sl]-=take;need-=take;}
      over[L]=need;
    });
    /* 標記每個等級中「排在後面、放不下」的 chip */
    [1,2,3].forEach(function(L){
      var arr=byLvl[L],k=over[L];
      for(var i=arr.length-k;i<arr.length;i++){if(i<0)continue;
        arr[i].el.classList.add("over");if(arr[i].el._applyTip)arr[i].el._applyTip(true);
        viol.push("「"+arr[i].area+"」的「"+arr[i].name+"」（"+cat+" 等級"+L+"）");}
    });
    /* 供下拉過濾用：目前各等級是否還能再加入 */
    var n={1:byLvl[1].length,2:byLvl[2].length,3:byLvl[3].length};
    can[cat]={1:canAddLevel(Q,n,1),2:canAddLevel(Q,n,2),3:canAddLevel(Q,n,3)};
    /* 供提示用：貪婪配位後各等級剩餘的「原生空位數」 */
    remByCat[cat]={1:rem[1],2:rem[2],3:rem[3]};
  });
  ED._enhCan=can;
  ED._enhRem=remByCat;
  BODY_AREAS.forEach(function(area){var box=ED.部件[area];if(box){if(box._refreshItems)box._refreshItems();if(box._updateHint)box._updateHint();}});
  ED._enhViol=viol;
  updateApplyState();
  return viol;
}
/* 依違規狀態切換「套用並預覽」按鈕的可用性與提示（強化值 + 寵愛點可同時顯示） */
function updateApplyState(){
  var btn=ED&&ED.applyBtn;if(!btn)return;

  if(msgs.length){
    btn.classList.add("disabled");
    btn.setAttribute("data-tip","尚無法套用並預覽：\n\n"+msgs.join("\n\n"));
  }else{
    btn.classList.remove("disabled");
    btn.removeAttribute("data-tip");
  }
}

/* 套用到記憶體中的名冊（不寫檔） */
function commitEditor(){
  var o=readEditor();
  if(!nameOf(o)||nameOf(o)==="？"){alert("請填寫「人偶名稱」");return -1;}
  if(typeof revalidateEnh==="function"&&(revalidateEnh()||[]).length)return -1;   /* 強化值不足時不套用 */
  if(editIndex>=0){chars[editIndex]=o;}
  else{chars.push(o);editIndex=chars.length-1;}
  window.__DATA__.csv["角色"]=serializeChars();
  markDirty(editIndex);
  statusApplied();
  return editIndex;
}

/* 序列化整份名冊為 CSV 文字 */
function csvCell(v){v=(v==null?"":String(v));if(/[",\n]/.test(v)){return '"'+v.replace(/"/g,'""')+'"';}return v;}
function serializeChars(){
  var lines=[CHAR_COLS.join(",")];
  chars.forEach(function(c){lines.push(CHAR_COLS.map(function(k){return csvCell(c[k]);}).join(","));});
  return lines.join("\n");
}

/* 匯出（另存）角色 CSV — 只下載，不動原始檔案 */
function exportCharCSV(){
  var csv="\uFEFF"+serializeChars();
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="角色.csv";a.click();
  dirtyIdx=[];
  setStatus("已匯出角色 CSV（<b>"+chars.length+"</b> 名）· 請另存到 資料庫/ 取代舊檔");
}
