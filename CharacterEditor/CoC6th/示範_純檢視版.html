<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>您的CoC 6th PC一覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#12141a;
  --ink-soft:#1b1f28;
  --ink-line:#2b3140;
  --paper:#e6e8ec;
  --card:#ffffff;
  --text:#171a21;
  --text-mid:#5c6371;
  --text-dim:#8b919d;
  --hair:#dcdfe6;
  --accent:#c0392b;
  --accent-rgb:192,57,43;
  --accent-text:#a8321f;
  --sans:"Noto Sans TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --serif-name:"Noto Serif JP","Noto Serif TC","Hiragino Mincho ProN","Yu Mincho",
               "YuMincho","MS Mincho","Songti TC","PMingLiU",serif;
  --util:"Oswald","Noto Sans TC",sans-serif;
  --sidebar-w:268px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit}
img{display:block}

/* ── 工具列（匯出後不存在） ───────────────────────── */
#toolbar{
  position:sticky;top:0;z-index:60;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:10px 16px;background:var(--ink);color:#e7e9ee;
  border-bottom:1px solid #000;
}
#toolbar .brand{
  font-family:var(--serif);font-weight:700;font-size:13.5px;letter-spacing:.04em;
  color:#dfe3ea;margin-right:6px;padding-right:12px;
  border-right:1px solid #39404f;white-space:nowrap;
}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border:1px solid #39404f;border-radius:2px;
  background:#1e2330;color:#e7e9ee;font-size:13px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.tbtn:hover{background:#2a3140;border-color:#525c70}
.tbtn.primary{background:#e7e9ee;color:#12141a;border-color:#e7e9ee;font-weight:500}
.tbtn.primary:hover{background:#fff}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
#titleInput{
  padding:7px 10px;border:1px solid #39404f;border-radius:2px;
  background:#1e2330;color:#e7e9ee;font-size:13px;width:230px;font-family:inherit;
}
#titleInput:focus{outline:none;border-color:#7c88a3}
.tswitch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#a9b0be;cursor:pointer}
#status{font-size:12.5px;color:#8b93a3;margin-left:auto}
#status b{color:#e7e9ee;font-weight:500}
.hint{
  padding:10px 16px;background:#191d27;color:#8b93a3;font-size:12.5px;
  border-bottom:1px solid #000;line-height:1.7;
}
.hint code{font-family:var(--util);color:#c7cddb;background:#242a37;padding:1px 5px;border-radius:2px}

/* ── 版面 ─────────────────────────────────────── */
#toolbar,.hint{flex:none}
#root{display:flex;flex:1 1 auto;min-height:0}

/* 側欄 */
#side{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--ink);color:#cfd4de;
  display:flex;flex-direction:column;min-height:0;
  box-shadow:1px 0 0 rgba(0,0,0,.35);
}
#sideHead{padding:20px 20px 16px;border-bottom:1px solid var(--ink-line)}
#sideTitle{
  font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.4;
  color:#fff;letter-spacing:.02em;margin:0 0 12px;
}
#search{
  width:100%;padding:8px 10px;font-size:13px;font-family:inherit;
  background:var(--ink-soft);border:1px solid var(--ink-line);
  border-radius:2px;color:#e7e9ee;
}
#search::placeholder{color:#5d6579}
#homeBtn{
  width:100%;margin-top:9px;padding:8px 10px;font-size:12.5px;font-family:inherit;
  display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;
  background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:2px;
  color:#aeb6c4;transition:background .14s,color .14s,border-color .14s;
}
#homeBtn svg{flex:none;opacity:.8}
#homeBtn:hover,#homeBtn[aria-current="true"]{background:#252b39;color:#fff;border-color:#4a5364}
#homeBtn:focus-visible{outline:2px solid #7c88a3;outline-offset:1px}
#search:focus{outline:none;border-color:#7c88a3}
#list{flex:1;overflow-y:auto;padding-bottom:24px;scrollbar-width:thin}
#list::-webkit-scrollbar{width:8px}
#list::-webkit-scrollbar-thumb{background:#333a49;border-radius:4px}
#sideFoot{
  flex:none;padding:13px 20px;border-top:1px solid var(--ink-line);
  font-size:10.5px;line-height:1.65;letter-spacing:.03em;color:#5f6879;
}
.grp{
  display:flex;align-items:center;gap:8px;
  padding:20px 20px 8px;font-family:var(--util);font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:#6d768a;
}
.grp::after{content:"";flex:1;height:1px;background:var(--ink-line)}
.grp .n{letter-spacing:.05em;color:#4f5768}
.item{
  display:block;width:100%;text-align:left;border:0;background:none;
  padding:9px 20px 9px 20px;font-size:14px;color:#b9c0cd;cursor:pointer;
  position:relative;line-height:1.5;transition:color .12s,background .12s;
}
.item:hover{background:var(--ink-soft);color:#fff}
.item::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--c,#7a8397);opacity:0;transition:opacity .12s;
}
.item:hover::before{opacity:.55}
.item[aria-current="true"]{background:var(--ink-soft);color:#fff;font-weight:500}
.item[aria-current="true"]::before{opacity:1}
.item .meta{
  display:flex;align-items:baseline;margin-bottom:2px;line-height:1.45;
}
.item .log{
  font-size:10.5px;color:#6c7488;flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item .ho{                       /* flex:0 0 auto：永遠不被壓縮或截斷 */
  font-family:var(--util);font-size:10.5px;letter-spacing:.12em;
  color:var(--c,#7a8397);filter:brightness(1.5);flex:0 0 auto;white-space:nowrap;
}
.item .log + .ho::before{content:"·";margin:0 6px;color:#464e60}
.item:hover .log{color:#8d95a6}
.item[aria-current="true"] .log{color:#99a1b2}
.item:focus-visible{outline:2px solid #7c88a3;outline-offset:-2px}
.empty-list{padding:24px 20px;color:#5d6579;font-size:13px;line-height:1.8}

/* 主區 */
#main{flex:1;min-width:0;overflow-y:auto;padding:34px 40px 80px}
#backBtn{display:none}

/* 空狀態 */
.blank{
  height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;color:var(--text-dim);gap:14px;
  min-height:60vh;
}
.blank .mark{
  width:46px;height:46px;border:1px solid var(--hair);border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);font-size:20px;color:#b6bcc7;
}
.blank p{margin:0;font-size:15px;letter-spacing:.04em}
.blank small{font-size:12.5px;color:#a3a9b5}

/* ── 縮圖展示頁 ─────────────────────────────── */
.gp{max-width:1040px;margin:0 auto;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.gp-head{text-align:center;margin:6px 0 42px}
.gp-head h2{
  font-family:var(--serif-name);font-weight:900;font-size:40px;
  letter-spacing:.1em;margin:0;line-height:1.2;
}
.gp-head p{
  margin:12px 0 0;font-family:var(--util);font-size:11.5px;
  letter-spacing:.26em;color:var(--text-dim);
}
.gp-cat{
  display:flex;align-items:center;gap:14px;margin:0 0 26px;
  font-family:var(--util);font-size:11.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--text-mid);
}
.gp-cat::after{content:"";flex:1;height:1px;background:var(--hair)}
.gp-cat .n{letter-spacing:.06em;color:#b0b6c1}
.gp-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:32px 24px;margin:0 0 50px;
}
.gp-card{
  display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:0;cursor:pointer;text-align:center;
}
.gp-card .pic{
  position:relative;                 /* 讓標籤能絕對定位在圖上 */
  width:100%;aspect-ratio:1/1;border:1px solid var(--hair);border-radius:2px;
  background:rgba(var(--c-rgb),.06);overflow:hidden;
  transition:transform .16s,border-color .16s,box-shadow .16s;
}
.gp-card .tag{
  position:absolute;bottom:6px;right:6px;z-index:2;
  padding:2px 7px;border-radius:2px;
  font-family:var(--util);font-size:10px;font-weight:500;letter-spacing:.08em;
  line-height:1.4;color:#fff;background:var(--c);
  box-shadow:0 1px 3px rgba(20,24,35,.35);
  pointer-events:none;white-space:nowrap;
}
.gp-card:hover .pic{
  transform:translateY(-3px);border-color:var(--c);
  box-shadow:0 12px 24px -14px rgba(20,24,35,.55);
}
.gp-card:focus-visible{outline:none}
.gp-card:focus-visible .pic{outline:2px solid var(--c);outline-offset:2px}
.gp-card img{width:100%;height:100%;object-fit:cover}
.gp-card .fb{
  width:100%;height:100%;display:grid;place-items:center;
  font-family:var(--serif);font-size:42px;color:rgba(var(--c-rgb),.45);
}
.gp-card .nm{
  margin-top:13px;font-family:var(--serif-name);font-weight:700;
  font-size:15px;line-height:1.4;color:var(--c-text);letter-spacing:.03em;
}
.gp-card .rd{
  margin-top:4px;font-size:11px;letter-spacing:.1em;color:var(--text-dim);
  min-height:15px;line-height:15px;
}
.gp-card .jb{                       /* 沒填也保留一行，卡片高度一致 */
  margin-top:3px;font-size:12px;color:var(--text-mid);
  min-height:17px;line-height:17px;
}
.gp-card .ho-blk{                   /* 只有填了 HO 的角色才出現 */
  width:100%;margin-top:9px;padding-top:8px;border-top:1px solid var(--hair);
}
.gp-card .lg{
  display:block;max-width:100%;font-size:10.5px;line-height:1.5;
  color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gp-card .ho{
  display:block;margin-top:2px;font-family:var(--util);font-size:11px;
  letter-spacing:.12em;color:var(--c-text);
}

/* ── 角色卡 ──────────────────────────────────── */
.sheet{
  position:relative;max-width:1040px;margin:0 auto;background:var(--card);
  border:1px solid var(--hair);border-radius:3px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,24,35,.05),0 12px 34px -18px rgba(20,24,35,.35);
  animation:rise .32s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--accent);z-index:3;
}
.art{
  position:absolute;top:0;right:0;height:100%;width:52%;
  pointer-events:none;z-index:0;overflow:hidden;
}
.art img{
  height:100%;width:100%;object-fit:contain;object-position:right top;
  opacity:.15;filter:grayscale(.15);
  -webkit-mask-image:linear-gradient(to left,#000 30%,transparent 92%);
  mask-image:linear-gradient(to left,#000 30%,transparent 92%);
}
.sheet-in{position:relative;z-index:2;padding:34px 38px 40px}
.edit-btn{
  position:absolute;top:16px;right:16px;z-index:5;
  padding:6px 14px;border-radius:2px;cursor:pointer;
  font-family:var(--util);font-size:12px;letter-spacing:.1em;
  color:#fff;background:var(--accent);border:0;
  box-shadow:0 1px 3px rgba(20,24,35,.28);
  transition:filter .14s,transform .14s;
}
.edit-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.edit-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 圖片列 */
.gallery{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.gcol{display:flex;flex-direction:column;gap:8px}
.glabel{
  font-family:var(--util);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--text-dim);text-align:center;
}
.icon-frame{
  width:132px;height:132px;border:1px solid var(--hair);border-radius:2px;
  background:rgba(var(--accent-rgb),.05);overflow:hidden;cursor:zoom-in;
  padding:0;display:block;
}
.icon-frame img{width:100%;height:100%;object-fit:cover;image-rendering:auto}
.icon-fallback{
  width:100%;height:100%;display:grid;place-items:center;
  font-family:var(--serif);font-size:44px;color:rgba(var(--accent-rgb),.45);
}
.thumbs{
  display:flex;gap:8px;flex-wrap:nowrap;              /* 不換行 */
  max-width:412px;                                     /* 約 5 格；第 6 格起水平捲動 */
  overflow-x:auto;overflow-y:hidden;
  padding-bottom:6px;                                  /* 留給捲軸，避免蓋到縮圖 */
  scrollbar-width:thin;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
.thumbs::-webkit-scrollbar{height:7px}
.thumbs::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.35);border-radius:4px}
.thumbs::-webkit-scrollbar-track{background:transparent}
.thumbs.scrollable{cursor:grab}
.thumbs.dragging{cursor:grabbing;scroll-behavior:auto}
.thumbs.dragging .thumb{pointer-events:none}        /* 拖曳時不觸發縮圖 hover/點擊 */
.thumb{
  flex:0 0 auto;                                        /* 不被壓縮，維持原尺寸 */
  width:76px;height:100px;border:1px solid var(--hair);border-radius:2px;
  overflow:hidden;background:#f6f7f9;cursor:zoom-in;padding:0;
  transition:border-color .15s,transform .15s;
}
.thumb:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;image-rendering:auto}
.full-link{
  align-self:flex-start;margin-top:2px;background:none;border:0;padding:4px 0;
  font-size:12.5px;line-height:18px;min-height:18px;color:var(--accent-text);
  cursor:pointer;border-bottom:1px solid rgba(var(--accent-rgb),.35);
}
.full-link:hover{border-bottom-color:var(--accent)}
.full-link.is-empty{        /* 沒有全身圖時仍佔住同樣高度 */
  border-bottom-color:transparent;pointer-events:none;cursor:default;
}

/* 標題 */
.headline .ho{
  font-family:var(--util);font-size:15px;letter-spacing:.16em;
  color:var(--accent-text);margin:0 0 6px;display:flex;align-items:center;gap:9px;
  min-height:22px;line-height:22px;
}
.headline .ho .sw{width:9px;height:9px;background:var(--accent);flex:none}
.name-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px}
.name{
  font-family:var(--serif-name);font-weight:900;font-size:44px;line-height:1.15;
  margin:0;letter-spacing:.02em;
}
.name-tag{
  flex:none;padding:3px 9px;border-radius:2px;
  font-family:var(--util);font-size:11px;font-weight:500;letter-spacing:.1em;
  line-height:1.5;color:#fff;background:var(--accent);
  box-shadow:0 1px 3px rgba(20,24,35,.28);white-space:nowrap;
}
.headline .reading{        /* 沒填也保留一行，職業不會往上跑 */
  margin:6px 0 0;font-size:12.5px;letter-spacing:.14em;color:var(--text-dim);
  min-height:18px;line-height:18px;
}
.job{
  margin:4px 0 0;font-size:14px;color:var(--text-mid);letter-spacing:.08em;
}
.headline{margin-bottom:20px}

/* 主欄＋雷達 */
.body-grid{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.col-main{flex:1 1 460px;min-width:300px}
table.stat{width:100%;border-collapse:collapse;table-layout:fixed}
table.stat th{
  font-family:var(--util);font-weight:400;font-size:12.5px;letter-spacing:.12em;
  color:var(--accent-text);background:rgba(var(--accent-rgb),.10);
  padding:9px 4px;border-bottom:1px solid rgba(var(--accent-rgb),.28);
}
table.stat td{
  font-family:var(--util);font-weight:300;font-size:25px;text-align:center;
  padding:13px 4px;border-bottom:1px solid var(--hair);
  font-variant-numeric:tabular-nums;
}
.derived{
  display:flex;gap:20px;flex-wrap:wrap;margin-top:13px;
  font-size:12.5px;color:var(--text-mid);
}
.derived b{font-family:var(--util);font-weight:400;font-size:15px;color:var(--text);margin-left:5px}
.radar{flex:0 0 306px;margin:28px auto 0}
.radar svg{width:306px;height:auto;overflow:visible}
.radar .axis{stroke:#c9cdd6;stroke-width:1}
.radar .web{fill:none;stroke:#dfe2e8;stroke-width:1}
.radar .web.outer{stroke:#aeb4c0}
.radar .lab{
  font-family:var(--util);font-size:12px;letter-spacing:.09em;fill:var(--text);
}
.radar .tick{font-family:var(--util);font-size:8.5px;fill:#a8aeba}
.radar .poly{fill:rgba(var(--accent-rgb),.22);stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.radar .dot{fill:var(--accent)}

/* 台詞 */
.quote{
  margin:20px 0 0;padding:3px 0 3px 20px;border-left:3px solid var(--accent);
  font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.85;
  color:#2c3140;max-width:620px;white-space:pre-line;
}

/* 段落 */
.block{padding-top:20px;border-top:1px solid var(--hair);margin-top:20px}
.block h3{
  font-family:var(--util);font-weight:400;font-size:11.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--text-dim);margin:0 0 12px;
}
.block p{margin:0;font-size:14.5px;line-height:2.05;color:#333844;white-space:pre-line;max-width:720px}
.logs{list-style:none;margin:0;padding:0;max-width:720px}
.logs li{
  position:relative;padding:8px 0 8px 20px;font-size:14.5px;line-height:1.75;
  border-bottom:1px dashed var(--hair);color:#333844;
}
.logs li:last-child{border-bottom:0}
.logs li::before{
  content:"";position:absolute;left:2px;top:16px;width:6px;height:6px;
  background:var(--accent);transform:rotate(45deg);
}

/* 燈箱 */
#lightbox{
  position:fixed;inset:0;z-index:200;background:rgba(12,14,20,.93);
  display:none;align-items:center;justify-content:center;padding:36px;
}
#lightbox.on{display:flex}
#lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lightbox .lb-btn{
  position:absolute;background:none;border:1px solid rgba(255,255,255,.3);
  color:#fff;width:44px;height:44px;font-size:20px;cursor:pointer;border-radius:50%;
  display:grid;place-items:center;transition:background .15s;
}
#lightbox .lb-btn:hover{background:rgba(255,255,255,.14)}
#lbPrev{left:22px;top:50%;transform:translateY(-50%)}
#lbNext{right:22px;top:50%;transform:translateY(-50%)}
#lbClose{right:22px;top:22px}
#lbCount{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  color:#9aa2b2;font-family:var(--util);font-size:12px;letter-spacing:.18em;
}

@media (max-width:900px){
  :root{--sidebar-w:100%}
  html,body{height:auto;min-height:100%}
  #root{flex-direction:column}
  #side{height:auto;max-height:46vh}
  #main{padding:20px 16px 60px}
  .sheet-in{padding:24px 20px 30px}
  .name{font-size:34px}
  .art{width:70%;opacity:.8}
  .gp-head{margin-bottom:30px}
  .gp-head h2{font-size:30px}
  .gp-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:24px 16px}
  .gp-card .nm{font-size:13.5px;margin-top:10px}
  .radar{flex:1 1 100%;margin:16px auto 0}
  .radar svg{width:100%;max-width:340px;height:auto}
  #root.show-detail #side{display:none}
  #root.show-detail #backBtn{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;
    background:none;border:1px solid var(--hair);border-radius:2px;
    padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text-mid);
  }
  table.stat td{font-size:20px}
  #status{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ── 新增角色 Modal ─────────────────────────── */
#modal{
  position:fixed;inset:0;z-index:150;display:none;
  align-items:center;justify-content:center;padding:40px 20px;
  background:rgba(12,14,20,.55);overflow:hidden;
}
#modal.on{display:flex}
.mbox{
  width:100%;max-width:760px;max-height:calc(100vh - 80px);
  display:flex;flex-direction:column;overflow:hidden;
  background:#fff;border-radius:6px;
  box-shadow:0 24px 70px -20px rgba(12,14,20,.6);
  animation:rise .26s cubic-bezier(.2,.7,.3,1) both;
}
.mhead{
  flex:none;display:flex;align-items:center;gap:12px;padding:18px 24px;
  border-bottom:1px solid var(--hair);background:#fff;
}
.mhead h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;flex:1}
.mhead .x{
  border:0;background:none;font-size:22px;line-height:1;color:var(--text-dim);
  cursor:pointer;width:32px;height:32px;border-radius:4px;
}
.mhead .x:hover{background:#f0f1f4;color:var(--text)}
.mbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px 24px}
.frow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.fld{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:5px}
.fld.narrow{flex:0 0 150px}
.fld label{font-size:12px;font-weight:500;color:var(--text-mid);letter-spacing:.02em}
.fld label .req{color:var(--accent-text)}
.fld label .hn{font-weight:400;color:var(--text-dim);font-size:11px}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{
  font-family:inherit;font-size:14px;color:var(--text);
  padding:8px 10px;border:1px solid #cfd3db;border-radius:3px;background:#fff;width:100%;
}
.fld textarea{resize:vertical;min-height:64px;line-height:1.6}
.fld input:focus,.fld textarea:focus,.fld select:focus{
  outline:none;border-color:#7c88a3;box-shadow:0 0 0 3px rgba(124,136,163,.16);
}
.msec{margin:22px 0 14px;padding-top:16px;border-top:1px solid var(--hair)}
.msec:first-child{margin-top:0;padding-top:0;border-top:0}
.msec h3{
  font-family:var(--util);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 14px;
}
.color-row{display:flex;align-items:center;gap:10px}
.color-row input[type=color]{
  width:40px;height:38px;padding:0;border:1px solid #cfd3db;border-radius:3px;
  background:none;cursor:pointer;flex:none;
}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-grid .fld label{font-family:var(--util);letter-spacing:.08em;text-align:center}
.stat-grid input{text-align:center;font-family:var(--util);font-size:16px}
.img-fld{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.img-prev{
  width:70px;height:70px;flex:none;border:1px solid var(--hair);border-radius:3px;
  background:#f6f7f9 center/cover no-repeat;display:grid;place-items:center;
  font-size:10px;color:var(--text-dim);overflow:hidden;
}
.img-prev.full{width:56px;height:88px}
.img-ctrl{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:6px}
.img-ctrl .btnrow{display:flex;gap:8px;align-items:center}
.mini{
  font-size:12px;padding:6px 11px;border:1px solid #cfd3db;border-radius:3px;
  background:#f7f8fa;cursor:pointer;color:var(--text);white-space:nowrap;
}
.mini:hover{background:#eef0f3}
.mini.ghost{border-style:dashed;color:var(--text-mid)}
.var-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.var-chip{position:relative;width:52px;height:68px;border:1px solid var(--hair);border-radius:3px;overflow:hidden;background:#f6f7f9}
.var-chip img{width:100%;height:100%;object-fit:cover;display:block}
.var-chip button{
  position:absolute;top:2px;right:2px;width:16px;height:16px;border:0;border-radius:50%;
  background:rgba(20,24,35,.7);color:#fff;font-size:11px;line-height:16px;cursor:pointer;padding:0;
}
.mfoot{
  flex:none;display:flex;align-items:center;gap:12px;padding:16px 24px;
  border-top:1px solid var(--hair);background:#fff;
}
.mfoot .err{color:var(--accent-text);font-size:13px;flex:1}
.mfoot .spacer{flex:1}
.mbtn{
  padding:9px 18px;border-radius:3px;font-size:14px;font-family:inherit;cursor:pointer;
  border:1px solid #cfd3db;background:#fff;color:var(--text);
}
.mbtn:hover{background:#f4f5f7}
.mbtn.primary{background:#1e2330;border-color:#1e2330;color:#fff;font-weight:500}
.mbtn.primary:hover{background:#2a3140}
@media (max-width:640px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  #modal{padding:0}
  .mbox{border-radius:0;height:100%;max-height:100%}
}

@media print{
  #side,#toolbar,.hint{display:none}
  #main{overflow:visible;padding:0}
  .sheet{box-shadow:none;border:0}
}

</style>

  "差分":"variants","差分圖":"variants","variants":"variants",
  "SAN":"san","san":"san","理智":"san","理智值":"san","初始SAN":"san","SAN值":"san",
  "關係":"relation","关系":"relation","羈絆":"relation","relation":"relation","うちよそ":"relation",
  "台詞":"quote","台詞台本":"quote","quote":"quote","line":"quote",
  "概要":"summary","簡介":"summary","設定":"summary","summary":"summary",
  "經歷":"logs","團務":"logs","通過團務":"logs","logs":"logs","history":"logs"
};

function normKey(k){
  var t = String(k||"").replace(/^\uFEFF/,"").trim();
  if(ALIAS[t]) return ALIAS[t];
  var up = t.toUpperCase();
  if(STAT_KEYS.indexOf(up)>=0) return up;
  if(ALIAS[t.toLowerCase()]) return ALIAS[t.toLowerCase()];
  return t;
}

/* RFC4180 CSV 解析（支援引號內的逗號與換行） */
function parseCSV(text){
  text = String(text).replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  var rows=[], row=[], val="", q=false, i=0;
  while(i<text.length){
    var c=text[i];
    if(q){
      if(c==='"'){
        if(text[i+1]==='"'){ val+='"'; i+=2; continue; }
        q=false; i++; continue;
      }
      val+=c; i++; continue;
    }
    if(c==='"'){ q=true; i++; continue; }
    if(c===','){ row.push(val); val=""; i++; continue; }
    if(c==='\n'){ row.push(val); rows.push(row); row=[]; val=""; i++; continue; }
    val+=c; i++;
  }
  row.push(val); rows.push(row);
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==""; }); });
}

function splitList(v){
  return String(v||"").split(/[|\n]/).map(function(s){return s.trim();}).filter(Boolean);
}

function recordsFromCSV(text){
  var rows = parseCSV(text);
  if(!rows.length) return [];
  var head = rows[0].map(normKey);
  var out = [];
  for(var r=1;r<rows.length;r++){
    var o={};
    for(var c=0;c<head.length;c++) o[head[c]] = (rows[r][c]!==undefined?String(rows[r][c]).trim():"");
    if(!o.name) continue;
    var stats={};
    STAT_KEYS.forEach(function(k){
      var n = parseFloat(o[k]);
      stats[k] = isFinite(n) ? n : 0;
    });
    var sanRaw = parseFloat(o.san);
    out.push({
      category: o.category || "未分類",
      name: o.name,
      ho: o.ho || "",
      reading: o.reading || "",
      job: o.job || "",
      color: cleanColor(o.color),
      icon: o.icon || "",
      full: o.full || "",
      relation: (o.relation||"").trim(),
      variants: splitList(o.variants),
      stats: stats,
      san: isFinite(sanRaw) ? sanRaw : null,
      quote: (o.quote||"").replace(/\\n/g,"\n").replace(/\|/g,"\n"),
      summary: (o.summary||"").replace(/\\n/g,"\n"),
      logs: splitList(o.logs)
    });
  }
  return out;
}

function cleanColor(v){
  v = String(v||"").trim();
  if(!v) return "#5a6273";
  if(/^[0-9a-f]{6}$/i.test(v) || /^[0-9a-f]{3}$/i.test(v)) v = "#"+v;
  return v;
}

/* 把新角色插進同分類群組的尾端，維持側欄群組連續；回傳插入位置 */
function insertByCategory(list, rec){
  var last = -1;
  for(var i=0;i<list.length;i++){ if(list[i].category===rec.category) last=i; }
  var at = (last>=0) ? last+1 : list.length;
  list.splice(at,0,rec);
  return at;
}

/* 依 CSV 規格把資料序列化回 CSV（欄位順序與範本一致） */
var CSV_COLS = [
  ["category","分類"],["name","名字"],["reading","拼音"],["ho","HO"],["job","職業"],
  ["color","代表色"],["relation","關係"],["icon","頭像"],["full","全身圖"],["variants","差分"],
  ["STR","STR"],["CON","CON"],["POW","POW"],["DEX","DEX"],["APP","APP"],["SIZ","SIZ"],
  ["INT","INT"],["EDU","EDU"],["san","SAN"],["quote","台詞"],["summary","概要"],["logs","經歷"]
];
function csvCell(v){
  v = (v==null) ? "" : String(v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function recordsToCSV(list){
  var lines = [ CSV_COLS.map(function(c){ return c[1]; }).join(",") ];
  list.forEach(function(c){
    var row = CSV_COLS.map(function(col){
      var k = col[0];
      if(k==="variants") return csvCell(c.variants.join("|"));
      if(k==="logs")     return csvCell(c.logs.join("|"));
      if(k==="quote")    return csvCell((c.quote||"").replace(/\n/g,"|"));
      if(k==="san")      return csvCell(c.san==null ? "" : c.san);
      if(STAT_KEYS.indexOf(k)>=0) return csvCell(c.stats[k]||0);
      return csvCell(c[k]);
    });
    lines.push(row.join(","));
  });
  return "\uFEFF"+lines.join("\n");
}

/* ══════════════════════════════════════════════════════════
   CSV 匯出：把內嵌圖(data URL)抽成 images/ 檔案，欄位改回路徑，
   打包成 ZIP，讓匯出的 CSV 跟手寫的一樣好編輯。
   ══════════════════════════════════════════════════════════ */
function dataURLtoBytes(durl){
  var m = /^data:([^;,]*)?(;base64)?,([\s\S]*)$/i.exec(durl||"");
  var mime = (m && m[1]) ? m[1].toLowerCase() : "image/png";
  var body = m ? m[3] : "";
  var bytes;
  if(m && m[2]){                       /* base64 */
    var bin = atob(body);
    bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  } else {                             /* 純文字（少見，如 svg 未編碼） */
    bytes = new TextEncoder().encode(decodeURIComponent(body));
  }
  var ext = ({"image/png":"png","image/jpeg":"jpg","image/jpg":"jpg","image/gif":"gif",
              "image/webp":"webp","image/svg+xml":"svg","image/avif":"avif"})[mime] || "png";
  return { bytes: bytes, ext: ext };
}

/* 匯出資料包：內嵌圖(data URL)抽進 JSON 圖庫、CSV 只放代號(@pcNN_xxx)，
   路徑型圖片維持原路徑。匯入的代號會先還原成 data URL 再重新編碼。 */
function buildDataPack(list){
  var library = {};
  var copy = list.map(function(c){
    var o = {}; for(var k in c) o[k]=c[k];
    o.variants = (c.variants||[]).slice();
    o.stats = c.stats;
    return o;
  });
  copy.forEach(function(c, i){
    var base = "pc" + (i+1<10 ? "0"+(i+1) : (i+1));
    function code(field, suffix){
      var actual = imgLib[c[field]] || c[field];
      if(actual && /^data:/i.test(actual)){
        var key = "@"+base+"_"+suffix;
        library[key] = actual; c[field] = key;
      } else { c[field] = actual || ""; }
    }
    code("icon","icon");
    code("full","full");
    c.variants = c.variants.map(function(v,j){
      var actual = imgLib[v] || v;
      if(actual && /^data:/i.test(actual)){
        var key = "@"+base+"_v"+(j+1);
        library[key] = actual; return key;
      }
      return actual;
    });
  });
  return { csvText: recordsToCSV(copy), library: library };
}

/* bytes ↔ base64 / mime */
function bytesToBase64(bytes){
  var bin="", CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(bin);
}
function extToMime(name){
  var ext=(name.split(".").pop()||"").toLowerCase();
  return ({png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",
           webp:"image/webp",svg:"image/svg+xml",avif:"image/avif"})[ext]||"image/png";
}

/* ══════════════════════════════════════════════════════════
   讀取 ZIP（store 直接切；deflate 用瀏覽器內建 DecompressionStream）
   ══════════════════════════════════════════════════════════ */
function _u16(a,p){ return a[p]|(a[p+1]<<8); }
function _u32(a,p){ return (a[p]|(a[p+1]<<8)|(a[p+2]<<16)|(a[p+3]*0x1000000))>>>0; }

function inflateRaw(bytes){
  if(typeof DecompressionStream==="undefined")
    return Promise.reject(new Error("此瀏覽器無法解壓縮，請改用工具匯出的原始資料包"));
  var ds = new DecompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
}

function readZip(u8){
  var i = u8.length - 22;
  for(; i>=0; i--){ if(u8[i]===0x50&&u8[i+1]===0x4b&&u8[i+2]===0x05&&u8[i+3]===0x06) break; }
  if(i<0) return Promise.reject(new Error("不是有效的 ZIP 檔"));
  var count=_u16(u8,i+10), cdOff=_u32(u8,i+16), p=cdOff, entries=[];
  for(var n=0;n<count;n++){
    if(_u32(u8,p)!==0x02014b50) break;
    var method=_u16(u8,p+10), csize=_u32(u8,p+20);
    var nlen=_u16(u8,p+28), elen=_u16(u8,p+30), clen=_u16(u8,p+32), lho=_u32(u8,p+42);
    var name=new TextDecoder().decode(u8.slice(p+46,p+46+nlen));
    var lnlen=_u16(u8,lho+26), lelen=_u16(u8,lho+28);
    var dstart=lho+30+lnlen+lelen;
    entries.push({name:name, method:method, comp:u8.slice(dstart,dstart+csize)});
    p += 46+nlen+elen+clen;
  }
  var files={};
  return entries.reduce(function(chain, e){
    return chain.then(function(){
      if(e.method===0){ files[e.name]=e.comp; return; }
      if(e.method===8) return inflateRaw(e.comp).then(function(b){ files[e.name]=b; });
      throw new Error("不支援的壓縮方式："+e.method);
    });
  }, Promise.resolve()).then(function(){ return files; });
}

/* 最小 ZIP（store，無壓縮；PNG/JPEG 本身已壓縮） */
var CRC_TABLE = (function(){
  var t = new Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = (c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(bytes){
  var c = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  var enc = new TextEncoder();
  var now = new Date();
  var dtime = (now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  var ddate = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  var u16=function(n){return [n&255,(n>>8)&255];};
  var u32=function(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];};
  var chunks=[], central=[], offset=0;
  files.forEach(function(f){
    var nameB = enc.encode(f.name);
    var data = f.bytes;
    var crc = crc32(data);
    var local = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0),
      u16(dtime), u16(ddate), u32(crc), u32(data.length), u32(data.length),
      u16(nameB.length), u16(0));
    var localA = Uint8Array.from(local);
    chunks.push(localA, nameB, data);
    central.push({crc:crc, size:data.length, nameB:nameB, offset:offset});
    offset += localA.length + nameB.length + data.length;
  });
  var cdStart = offset;
  central.forEach(function(c){
    var hdr = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0),
      u16(dtime), u16(ddate), u32(c.crc), u32(c.size), u32(c.size),
      u16(c.nameB.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset));
    var hdrA = Uint8Array.from(hdr);
    chunks.push(hdrA, c.nameB);
    offset += hdrA.length + c.nameB.length;
  });
  var cdSize = offset - cdStart;
  chunks.push(Uint8Array.from([].concat(u32(0x06054b50), u16(0), u16(0),
    u16(central.length), u16(central.length), u32(cdSize), u32(cdStart), u16(0))));
  var total = chunks.reduce(function(a,c){ return a+c.length; },0);
  var out = new Uint8Array(total), p=0;
  chunks.forEach(function(c){ out.set(c,p); p+=c.length; });
  return out;
}

/* ══════════════════════════════════════════════════════════
   顏色工具
   ══════════════════════════════════════════════════════════ */
function toRGB(hex){
  var h = String(hex||"").trim().replace("#","");
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-f]{6}$/i.test(h)) h = "5a6273";
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function lum(rgb){
  var a = rgb.map(function(v){ v/=255; return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4); });
  return .2126*a[0]+.7152*a[1]+.0722*a[2];
}
/* 淺色代表色在白底上會看不清，文字用調暗後的版本 */
function readable(rgb){
  var r=rgb.slice(), guard=0;
  while(lum(r) > 0.34 && guard++ < 40){ r = r.map(function(v){ return Math.round(v*0.9); }); }
  return "rgb("+r.join(",")+")";
}

/* ══════════════════════════════════════════════════════════
   繪製：雷達圖
   ══════════════════════════════════════════════════════════ */
function radarSVG(stats){
  var vals = STAT_KEYS.map(function(k){ return stats[k]||0; });
  var top = Math.max(21, Math.ceil(Math.max.apply(null,vals)/3)*3);
  var cx=170, cy=168, R=104, N=8;
  function pt(i,rad){
    var a = -Math.PI/2 + i*(2*Math.PI/N);
    return [cx + Math.cos(a)*rad, cy + Math.sin(a)*rad];
  }
  function ring(rad){
    return STAT_KEYS.map(function(_,i){ var p=pt(i,rad); return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  }
  var s = '<svg viewBox="8 26 324 284" role="img" aria-label="能力值雷達圖">';
  for(var t=3;t<=top;t+=3){
    var rr = R*t/top;
    s += '<polygon class="web'+(t===top?" outer":"")+'" points="'+ring(rr)+'"/>';
  }
  for(var i=0;i<N;i++){
    var e=pt(i,R);
    s += '<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'"/>';
  }
  for(var t2=3;t2<=top;t2+=3){
    s += '<text class="tick" x="'+(cx+4)+'" y="'+(cy - R*t2/top + 3).toFixed(1)+'">'+t2+'</text>';
  }
  var pts = vals.map(function(v,i){
    var p = pt(i, R*Math.min(v,top)/top); return p[0].toFixed(1)+","+p[1].toFixed(1);
  });
  s += '<polygon class="poly" points="'+pts.join(" ")+'"/>';
  pts.forEach(function(p){
    var xy=p.split(",");
    s += '<circle class="dot" cx="'+xy[0]+'" cy="'+xy[1]+'" r="2.6"/>';
  });
  STAT_KEYS.forEach(function(k,i){
    var p = pt(i, R+24), anchor="middle";
    if(p[0] > cx+6) anchor="start";
    else if(p[0] < cx-6) anchor="end";
    s += '<text class="lab" x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="'+anchor+'">'+k+'</text>';
  });
  return s+'</svg>';
}

/* CoC 6th 傷害加值。STR 與 SIZ 都沒填時不套表，直接顯示 0 */
function dmgBonus(str, siz){
  if(!str && !siz) return "0";
  var sum = str + siz;
  if(sum<=12) return "-1D6";
  if(sum<=16) return "-1D4";
  if(sum<=24) return "±0";
  if(sum<=32) return "+1D4";
  if(sum<=40) return "+1D6";
  return "+"+(2+Math.floor(Math.max(0,sum-41)/16))+"D6";
}

/* ══════════════════════════════════════════════════════════
   縮圖：逐步減半縮放，避免瀏覽器一次縮太多產生鋸齒顆粒
   ══════════════════════════════════════════════════════════ */
var thumbCache = {};

function canvasOf(w,h){
  var cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  var g = cv.getContext("2d");
  g.imageSmoothingEnabled = true;
  if("imageSmoothingQuality" in g) g.imageSmoothingQuality = "high";
  return [cv,g];
}

function makeThumb(src, boxW, boxH, cb){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var tw = Math.round(boxW*dpr), th = Math.round(boxH*dpr);
  var key = src+"@"+tw+"x"+th;
  if(thumbCache[key]!==undefined){ if(thumbCache[key]) cb(thumbCache[key]); return; }

  var img = new Image();
  if(!/^(data:|blob:)/i.test(src)) img.crossOrigin = "anonymous";
  img.onerror = function(){ thumbCache[key] = null; };
  img.onload = function(){
    var sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
    /* 原圖沒有大很多就不必重製 */
    var scale = Math.max(tw/sw, th/sh);
    if(!sw || !sh || scale > 0.85){ thumbCache[key] = null; return; }
    try{
      var cw = sw, ch = sh, pair = canvasOf(cw, ch);
      pair[1].drawImage(img, 0, 0);
      var cur = pair[0];
      var fw = Math.max(1, Math.round(sw*scale)), fh = Math.max(1, Math.round(sh*scale));
      /* 每次最多縮一半，逐級逼近目標尺寸 */
      while(cw > fw*2 && ch > fh*2){
        cw = Math.max(fw, Math.round(cw/2));
        ch = Math.max(fh, Math.round(ch/2));
        var step = canvasOf(cw, ch);
        step[1].drawImage(cur, 0, 0, cw, ch);
        cur = step[0];
      }
      var out = canvasOf(fw, fh);
      out[1].drawImage(cur, 0, 0, fw, fh);
      var url = out[0].toDataURL("image/webp", 0.92);
      if(url.indexOf("data:image/webp")!==0) url = out[0].toDataURL("image/png");
      thumbCache[key] = url;
      cb(url);
    }catch(err){
      /* 跨網域或 file:// 會污染 canvas，維持原圖即可 */
      thumbCache[key] = null;
    }
  };
  img.src = src;
}

function smoothThumbs(scope){
  var list = scope.querySelectorAll("img[data-tw]");
  Array.prototype.forEach.call(list, function(im){
    var src = im.getAttribute("src");
    if(!src) return;
    makeThumb(src, parseInt(im.dataset.tw,10), parseInt(im.dataset.th,10), function(url){
      if(im.isConnected && im.getAttribute("src")===src) im.src = url;
    });
  });
}

/* 差分一覽：滑鼠可左右拖曳捲動（觸控／觸控板本來就能滑） */
function markThumbScrollable(){
  var el = $("detail") && $("detail").querySelector(".thumbs");
  if(el) el.classList.toggle("scrollable", el.scrollWidth > el.clientWidth + 1);
}
window.addEventListener("resize", markThumbScrollable);

function enableThumbDrag(el){
  if(!el) return;
  requestAnimationFrame(markThumbScrollable);   /* 等版面算好再判斷是否可捲 */

  var down=false, moved=false, startX=0, startLeft=0, pid=null;
  el.addEventListener("pointerdown", function(e){
    if(el.scrollWidth <= el.clientWidth + 1) return;   /* 不可捲時不攔截點擊 */
    down=true; moved=false; startX=e.clientX; startLeft=el.scrollLeft; pid=e.pointerId;
    el.classList.add("dragging");
    try{ el.setPointerCapture(pid); }catch(_){}
  });
  el.addEventListener("pointermove", function(e){
    if(!down) return;
    var dx = e.clientX - startX;
    if(Math.abs(dx) > 4) moved=true;
    el.scrollLeft = startLeft - dx;
  });
  var end = function(){
    if(!down) return;
    down=false; el.classList.remove("dragging");
    try{ el.releasePointerCapture(pid); }catch(_){}
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  /* 拖曳後別觸發縮圖放大（捕獲階段攔下這次 click） */
  el.addEventListener("click", function(e){
    if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; }
  }, true);
}

      if(isZip){
        readZip(u8).then(function(files){ importPack(files, f.name); })
                   .catch(function(err){ setStatus("資料包讀取失敗："+(err&&err.message?err.message:err)); });
      } else {

        catch(err){
          try{ text = new TextDecoder("big5").decode(u8); }
          catch(e2){ text = new TextDecoder("utf-8").decode(u8); }
        }

      var rel = (f.webkitRelativePath || f.name);
      var relNoRoot = rel.split("/").slice(1).join("/") || f.name;
      var url = URL.createObjectURL(f);
      [rel, relNoRoot, f.name, "./"+relNoRoot].forEach(function(k){

      });
    });
    var n = files.filter(function(f){ return /\.(png|jpe?g|gif|webp|avif|svg)$/i.test(f.name); }).length;

function setStatus(html){ var s=$("status"); if(s) s.innerHTML = html; }

/* 載入 CSV 文字（不動圖庫；圖庫由呼叫端決定是否清空／設定） */
function loadCSVText(text, fname){
  try{
    state.chars = recordsFromCSV(text);
    state.sel = -1;
    render();
    setExportEnabled();
    setStatus(state.chars.length ? "已載入 <b>"+state.chars.length+"</b> 位 PC　·　"+esc(fname)
                                 : "CSV 讀到了，但沒有任何一列有「名字」");
  }catch(err){
    setStatus("CSV 解析失敗：檢查欄位標題與引號是否成對");
  }
}

/* 匯入資料包（ZIP）：拆出 CSV、JSON 圖庫、以及舊格式的 images/ 圖檔 */
function importPack(files, zipName){
  imgLib = {};
  var names = Object.keys(files);
  var csvName = names.filter(function(n){ return /\.csv$/i.test(n); })[0];
  if(!csvName){ setStatus("資料包裡找不到 CSV 檔"); return; }

  var jsonName = names.filter(function(n){ return /\.json$/i.test(n); })[0];
  if(jsonName){
    try{
      var lib = JSON.parse(new TextDecoder().decode(files[jsonName]));
      if(lib && typeof lib==="object") imgLib = lib;
    }catch(e){ /* 圖庫壞了就當作沒有 */ }
  }

  /* 舊格式資料包：images/ 內的實體圖檔 → 轉 data URL 放進 imgURLs（路徑照樣解析得到） */
  names.forEach(function(n){
    if(/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(n)){
      var durl = "data:"+extToMime(n)+";base64,"+bytesToBase64(files[n]);
      var baseName = n.split(/[\\/]/).pop();
      imgURLs[n] = durl; imgURLs[baseName] = durl; imgURLs["./"+n] = durl;
    }
  });

  var text = new TextDecoder().decode(files[csvName]).replace(/^\uFEFF/,"");
  loadCSVText(text, zipName);
}

function setExportEnabled(){
  var on = state.chars.length>0;
  var be=$("btnExport"), bc=$("btnCsvOut");
  if(be) be.disabled = !on;
  if(bc) bc.disabled = !on;

  document.body.insertAdjacentHTML("beforeend", html);
  var picker = document.createElement("input");
  picker.type="file"; picker.accept="image/*"; picker.hidden=true;
  document.body.appendChild(picker);

  var modal = $("modal");

  function renderVars(){
    var box = $("pv_vars");
    box.innerHTML = addState.variants.map(function(src,i){
      return '<span class="var-chip">'+
             '<img src="'+esc(src)+'" alt="差分 '+(i+1)+'">'+
             '<button type="button" data-rmvar="'+i+'" aria-label="移除">✕</button></span>';
    }).join("");
  }
  function setPrev(which){
    var el = $("pv_"+which); if(!el) return;
    var v = addState[which] || (modal.querySelector('[data-path="'+which+'"]')||{}).value || "";
    if(v){ el.style.backgroundImage = "url("+JSON.stringify(v)+")"; el.textContent=""; }
    else { el.style.backgroundImage=""; el.textContent = which==="icon"?"頭像":"全身圖"; }
  }

  /* 顏色雙向同步 */
  var cp=$("f_colorPick"), ct=$("f_color");
  cp.addEventListener("input", function(){ ct.value=cp.value; });
  ct.addEventListener("input", function(){
    var v=cleanColor(ct.value); if(/^#[0-9a-f]{6}$/i.test(v)) cp.value=v;
  });

  /* 圖片：選檔（讀成 data URL） */
  var pickTarget=null;
  modal.addEventListener("click", function(e){
    var pk=e.target.closest("[data-pick]");
    if(pk){ pickTarget=pk.dataset.pick; picker.value=""; picker.multiple=(pickTarget==="variants"); picker.click(); return; }
    var cl=e.target.closest("[data-clr]");
    if(cl){
      var w=cl.dataset.clr;
      if(w==="variants"){ addState.variants=[]; renderVars(); }
      else { addState[w]=""; var pi=modal.querySelector('[data-path="'+w+'"]'); if(pi) pi.value=""; setPrev(w); }
      return;
    }
    var rm=e.target.closest("[data-rmvar]");
    if(rm){ addState.variants.splice(parseInt(rm.dataset.rmvar,10),1); renderVars(); return; }
    if(e.target.closest("[data-mx]")){ closeAddModal(); return; }
    if(e.target===modal){ closeAddModal(); return; }
  });
  picker.addEventListener("change", function(){
    var files=Array.prototype.slice.call(picker.files||[]); if(!files.length) return;
    var w=pickTarget;
    files.forEach(function(f){
      var fr=new FileReader();
      fr.onload=function(){
        if(w==="variants"){ addState.variants.push(fr.result); renderVars(); }
        else {
          addState[w]=fr.result;
          var pi=modal.querySelector('[data-path="'+w+'"]'); if(pi) pi.value="";
          setPrev(w);
        }
      };
      fr.readAsDataURL(f);
    });
  });
  /* 路徑欄輸入時更新預覽（若沒有選檔） */
  ["icon","full"].forEach(function(w){
    var pi=modal.querySelector('[data-path="'+w+'"]');
    pi.addEventListener("input", function(){ if(!addState[w]) setPrev(w); });
  });

  $("f_save").addEventListener("click", commitAdd);
  document.addEventListener("keydown", function(e){
    if(!modal.classList.contains("on")) return;
    if(e.key==="Escape") closeAddModal();
  });

  var editIndex = -1;   /* -1＝新增；>=0＝編輯該索引的角色 */

  /* 把一筆角色資料填回表單（編輯用） */
  function fillForm(c){
    $("f_name").value = c.name || "";
    $("f_reading").value = c.reading || "";
    $("f_category").value = c.category==="未分類" ? "" : (c.category||"");
    $("f_job").value = c.job || "";
    $("f_ho").value = c.ho || "";
    var col = cleanColor(c.color);
    $("f_color").value = col;
    if(/^#[0-9a-f]{6}$/i.test(col)) $("f_colorPick").value = col;
    $("f_relation").checked = !!c.relation;
    STAT_KEYS.forEach(function(k){
      modal.querySelector('[data-stat="'+k+'"]').value = (c.stats && c.stats[k]) ? c.stats[k] : "";
    });
    $("f_san").value = (c.san==null ? "" : c.san);
    $("f_quote").value = c.quote || "";
    $("f_summary").value = c.summary || "";
    $("f_logs").value = (c.logs||[]).join("\n");

    /* 圖片：內嵌(data:)放暫存並預覽，路徑放文字欄；代號先還原成 data URL */
    function loadImg(w, val){
      var real = imgLib[val] || val;
      if(!real){ addState[w]=""; var p0=modal.querySelector('[data-path="'+w+'"]'); if(p0)p0.value=""; setPrev(w); return; }
      if(/^data:/i.test(real)){ addState[w]=real; var p1=modal.querySelector('[data-path="'+w+'"]'); if(p1)p1.value=""; }
      else { addState[w]=""; var p2=modal.querySelector('[data-path="'+w+'"]'); if(p2)p2.value=val; }
      setPrev(w);
    }
    loadImg("icon", c.icon);
    loadImg("full", c.full);
    addState.variants = (c.variants||[]).map(function(v){ return imgLib[v]||v; }).filter(function(v){ return /^data:/i.test(v); });
    var paths = (c.variants||[]).filter(function(v){ return !/^data:/i.test(imgLib[v]||v); });
    modal.querySelector('[data-path="variants"]').value = paths.join("|");
    renderVars();
  }

  /* 對外開關；傳入索引＝編輯，不傳＝新增 */
  openAddModal = function(idx){
    var cats={}; state.chars.forEach(function(c){ cats[c.category]=1; });
    $("catList").innerHTML = Object.keys(cats).map(function(c){ return '<option value="'+esc(c)+'">'; }).join("");

    if(typeof idx==="number" && idx>=0 && state.chars[idx]){
      editIndex = idx;
      resetAddForm();
      fillForm(state.chars[idx]);
      $("m_title").textContent = "編輯PC";
      $("f_save").textContent = "儲存變更";
    } else {
      editIndex = -1;
      resetAddForm();
      $("m_title").textContent = "新增PC";
      $("f_save").textContent = "新增";
    }
    modal.classList.add("on");
    $("f_name").focus();
  };
  function closeAddModal(){ modal.classList.remove("on"); }

  function commitAdd(){
    var name=$("f_name").value.trim();
    if(!name){ $("f_err").textContent="請至少填寫名字"; $("f_name").focus(); return; }
    $("f_err").textContent="";

    var pathVal=function(w){ var pi=modal.querySelector('[data-path="'+w+'"]'); return pi?pi.value.trim():""; };
    var stats={};
    STAT_KEYS.forEach(function(k){
      var n=parseFloat(modal.querySelector('[data-stat="'+k+'"]').value);
      stats[k]=isFinite(n)?n:0;
    });
    var sanV=parseFloat($("f_san").value);
    var varPaths=splitList(pathVal("variants"));

    var rec={
      category: $("f_category").value.trim() || "未分類",
      name: name,
      reading: $("f_reading").value.trim(),
      ho: $("f_ho").value.trim(),
      job: $("f_job").value.trim(),
      color: cleanColor($("f_color").value),
      icon: addState.icon || pathVal("icon"),
      full: addState.full || pathVal("full"),
      relation: $("f_relation").checked ? "有" : "",
      variants: addState.variants.concat(varPaths),
      stats: stats,
      san: isFinite(sanV)?sanV:null,
      quote: $("f_quote").value.replace(/\|/g,"\n"),
      summary: $("f_summary").value,
      logs: splitList($("f_logs").value)
    };

    var at;
    if(editIndex>=0 && state.chars[editIndex]){
      var old = state.chars[editIndex];
      if(old.category === rec.category){
        state.chars[editIndex] = rec;
        at = editIndex;
      } else {
        state.chars.splice(editIndex,1);
        at = insertByCategory(state.chars, rec);
      }
    } else {
      at = insertByCategory(state.chars, rec);
    }
    var wasEdit = editIndex>=0;
    editIndex = -1;
    resetAddForm();
    closeAddModal();
    setExportEnabled();
    select(at);
    setStatus((wasEdit?"已更新 <b>":"已新增 <b>")+esc(name)+"</b>　·　目前 "+state.chars.length+" 位 PC，記得用「匯出 CSV」保存");
  }

  function resetAddForm(){
    ["f_name","f_reading","f_category","f_job","f_ho","f_san","f_quote","f_summary","f_logs"].forEach(function(id){ $(id).value=""; });
    $("f_color").value="#5a6273"; $("f_colorPick").value="#5a6273";
    $("f_relation").checked=false;
    STAT_KEYS.forEach(function(k){ modal.querySelector('[data-stat="'+k+'"]').value=""; });
    ["icon","full"].forEach(function(w){ var pi=modal.querySelector('[data-path="'+w+'"]'); if(pi) pi.value=""; });
    modal.querySelector('[data-path="variants"]').value="";
    addState={icon:"",full:"",variants:[]};
    setPrev("icon"); setPrev("full"); renderVars();
    $("f_err").textContent="";
  }
}


function download(filename, content, mime){
  var blob = new Blob([content], {type:mime});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 匯出 ─────────────────────────────────────── */
function fileToDataURL(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(new Error("讀取圖片失敗："+file.name)); };
    fr.readAsDataURL(file);
  });
}

function buildExport(){
  var embed = $("embedImgs") && $("embedImgs").checked;
  var chars = JSON.parse(JSON.stringify(state.chars));
  /* 資料包代號 → 內嵌 data URL，讓匯出的檢視頁自成一體 */
  chars.forEach(function(c){
    if(imgLib[c.icon]) c.icon = imgLib[c.icon];
    if(imgLib[c.full]) c.full = imgLib[c.full];
    c.variants = (c.variants||[]).map(function(v){ return imgLib[v]||v; });
  });
  var jobs = [];

  if(embed){
    var cache = {};
    var swap = function(obj, key){
      var v = obj[key]; if(!v) return;
      var base = String(v).split(/[\\/]/).pop();
      var file = imgFiles[v] || imgFiles[base];
      if(!file) return;
      if(!cache[v]) cache[v] = fileToDataURL(file);
      jobs.push(cache[v].then(function(d){ obj[key] = d; }));
    };
    chars.forEach(function(c){
      swap(c,"icon"); swap(c,"full");
      c.variants.forEach(function(v,i){
        var o = {v:v};
        var base = String(v).split(/[\\/]/).pop();
        var file = imgFiles[v] || imgFiles[base];
        if(!file) return;
        if(!cache[v]) cache[v] = fileToDataURL(file);
        jobs.push(cache[v].then(function(d){ c.variants[i] = d; }));
      });
    });
  }

  return Promise.all(jobs).then(function(){
    var css = document.getElementById("app-style").textContent;
    var js  = document.getElementById("app-script").textContent;
    var data = JSON.stringify({title: state.title, chars: chars})
                 .replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
    var S = "<"+"script>", E = "<\/script>";
    return '<!DOCTYPE html>\n'+
      '<html lang="zh-Hant">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>'+esc(state.title)+'</title>\n'+
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      '<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">\n'+
      '<style>\n'+css+'\n</style>\n</head>\n<body>\n<div id="root"></div>\n'+
      S+'window.__PCDATA__ = '+data+';'+E+'\n'+
      S+'\n'+js+'\n'+E+'\n</body>\n</html>';
  });
}
