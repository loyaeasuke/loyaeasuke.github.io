<!DOCTYPE html>
<html lang="zh-Hant" style="--accent: rgb(105,102,98); --accent-rgb: 105,102,98; --accent-ink: rgb(105,102,98);"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エモクロア Emo-klore 角色名冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --ink:#171a26;
  --ink-2:#1f2333;
  --ink-3:#2a2f43;
  --ink-line:#343a52;
  --paper:#e9e7e1;
  --card:#fbfaf6;
  --card-2:#f2f0e9;
  --text:#1b1e29;
  --text-mid:#565c6e;
  --text-dim:#8a8f9e;
  --hair:#dedbd2;
  --hair-2:#cfccc1;
  --warn:#b1503f;
  --ok:#4f7a5b;
  /* character accent (rep color) injected at runtime */
  --accent:#696662;
  --accent-ink:#54514e;
  --accent-rgb:105,102,98;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"DM Mono","Noto Sans TC",monospace;
  --sidebar-w:286px;
  --fs-min:13px; --fs-sm:13px; --fs-md:14px; --fs-base:15px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--sans);font-size:var(--fs-base);line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
img{display:block}
::selection{background:rgba(var(--accent-rgb),.22)}
.app{display:flex;flex-direction:column;height:100vh}
.body{display:flex;flex:1;min-height:0}

/* ---------- Sidebar ---------- */
.side{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--ink);color:#e7e6ef;height:100%;
  display:flex;flex-direction:column;border-right:1px solid #0c0e16;
}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--ink-line)}
.brand .jp{
  font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.16em;
  color:#c9c6dd;margin:0 0 6px;
}
.brand h1{
  font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.2;margin:0;
  letter-spacing:.02em;color:#fff;
}
.brand .sub{margin:7px 0 0;font-size:var(--fs-sm);color:#8e93ab;letter-spacing:.04em}
.searchwrap{padding:14px 16px 10px}
.search{
  width:100%;background:var(--ink-2);border:1px solid var(--ink-line);color:#eceafc;
  border-radius:9px;padding:9px 11px;font-size:var(--fs-md);outline:none;
}
.search::placeholder{color:#767b93}
.search:focus{border-color:#5a6188;box-shadow:0 0 0 3px rgba(90,97,136,.28)}
.homebtn{
  margin:2px 16px 8px;display:flex;align-items:center;gap:9px;width:calc(100% - 32px);
  background:var(--ink-2);border:1px solid var(--ink-line);color:#cdd0e4;
  border-radius:9px;padding:8px 11px;font-size:var(--fs-md);text-align:left;
}
.homebtn:hover{background:var(--ink-3)}
.homebtn[aria-current="true"]{
  background:rgba(var(--accent-rgb),.24);border-color:rgba(var(--accent-rgb),.6);color:#fff;
}
.homebtn svg{width:15px;height:15px;flex:0 0 15px;opacity:.85}
.roster{flex:1;overflow-y:auto;padding:4px 10px 12px}
.grp-h{
  font-size:var(--fs-sm);letter-spacing:.14em;color:#828aa6;
  padding:12px 8px 6px;font-weight:700;
}
.pc{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:9px;padding:8px 9px;margin:1px 0;color:#dcdbe9;
}
.pc:hover{background:var(--ink-2)}
.pc[aria-current="true"]{background:var(--ink-3);box-shadow:inset 3px 0 0 var(--accent)}
.pc .av{
  width:34px;height:34px;flex:0 0 34px;border-radius:8px;object-fit:cover;
  background:#3a3f57;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:var(--fs-md);color:#fff;overflow:hidden;
}
.pc .tx{min-width:0;flex:1}
.pc .nm{font-weight:700;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.pc .rd{font-size:var(--fs-sm);color:#8a8fa8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.side-foot{padding:10px 16px;border-top:1px solid var(--ink-line);font-size:var(--fs-sm);color:#767b93}
.side-foot b{color:#aeb2c8;font-weight:700}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;overflow-y:auto;height:100%}
.topbar{
  flex:0 0 auto;z-index:20;background:var(--ink);
  border-bottom:1px solid #0c0e16;display:flex;gap:9px;align-items:center;
  padding:10px 20px;flex-wrap:wrap;
}
.tb-title{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.05em;color:#e7e6ef;white-space:nowrap;margin-right:2px}
.tb-name{background:var(--ink-2);border:1px solid var(--ink-line);color:#eceafc;border-radius:9px;
  padding:8px 12px;font-size:var(--fs-md);font-family:inherit;min-width:160px;max-width:220px;flex:0 1 auto}
.tb-name:focus{outline:none;border-color:var(--accent)}
.tb-name::placeholder{color:#767b93}
.tb-btn{
  background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;color:#d7d6e4;cursor:pointer;
  padding:8px 13px;font-size:var(--fs-md);font-weight:500;display:inline-flex;align-items:center;gap:7px;
}
.tb-btn:hover{border-color:var(--accent);color:#fff}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb-btn.primary:hover{filter:brightness(1.12)}
.tb-btn svg{width:15px;height:15px}
.tb-chk{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:#b9bccf;cursor:pointer}
.tb-status{margin-left:auto;font-size:var(--fs-sm);color:#9a9fb8}
.tb-status b{color:#e7e6ef}

/* ---------- Gallery ---------- */
.gallery{padding:30px 30px 60px;max-width:1240px;margin:0 auto}
.g-head{text-align:center;margin:14px 0 30px}
.g-head .eye{font-size:var(--fs-sm);letter-spacing:.34em;color:var(--text-dim);font-weight:700}
.g-head h2{font-family:var(--serif);font-weight:900;font-size:32px;margin:8px 0 6px;letter-spacing:.04em}
.g-head p{margin:0;color:var(--text-mid);font-size:var(--fs-md)}
.g-cat{margin:0 0 30px}
.g-cat-h{display:flex;align-items:baseline;gap:11px;margin:0 2px 14px;padding-bottom:8px;border-bottom:1px solid var(--hair-2)}
.g-cat-h span{font-family:var(--serif);font-weight:700;font-size:19px}
.g-cat-h em{font-style:normal;font-size:var(--fs-sm);color:var(--text-dim)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.g-card{
  background:var(--card);border:1px solid var(--hair-2);border-radius:14px;overflow:hidden;
  text-align:left;padding:0;transition:transform .16s,box-shadow .16s,border-color .16s;
}
.g-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,20,30,.12);border-color:var(--gc-acc,var(--accent))}
.g-card .ph{aspect-ratio:1/1;background:var(--card-2);overflow:hidden;position:relative}
.g-card .ph img{width:100%;height:100%;object-fit:cover}
.g-card .ph .init{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:40px;color:#fff;
}
.g-card .cap{padding:11px 12px 13px}
.g-card .cap .nm{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.28;color:var(--gc-acc,var(--text))}
.g-card .cap .rd{font-size:var(--fs-sm);color:var(--text-dim);margin-top:2px;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-card .cap .jb{font-size:var(--fs-sm);color:var(--text-mid);margin-top:5px}

/* ---------- Detail ---------- */
.sheet{padding:26px 30px 70px;max-width:1240px;margin:0 auto;position:relative}

/* 全身圖：刷淡浮水印（頁面右側，固定於視窗；半透明底板讓它透出） */
.watermark{position:fixed;top:0;right:0;height:100vh;width:min(46%,560px);
  pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:flex-end;overflow:hidden}
.watermark img{max-width:100%;max-height:96vh;object-fit:contain;object-position:right center;opacity:.16;
  -webkit-mask-image:linear-gradient(to left,#000 52%,transparent);mask-image:linear-gradient(to left,#000 52%,transparent)}
.dh,.top3,.skwide{position:relative;z-index:1}

/* 標題列：頭像輪播 ｜ 身分＋台詞 */
.dh{display:flex;gap:24px;align-items:flex-start;margin-bottom:22px}
.por-col{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;width:132px}
.por{
  width:132px;height:132px;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
  background:var(--card-2);border:1px solid var(--hair-2);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.por .por-img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.por .init{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:56px;color:#fff}
.por-nav{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  border:0;background:rgba(20,20,28,.55);color:#fff;font-size:17px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:2;transition:background .12s}
.por-nav:hover{background:rgba(20,20,28,.82)}
.por-nav.prev{left:6px}.por-nav.next{right:6px}
/* 檢視全身圖：固定保留一個位置（有無立繪都不影響下方排版高度） */
.fullbtn-slot{height:34px;display:flex}
.fullbtn{flex:1;font-size:var(--fs-sm);color:var(--accent-ink);font-weight:700;cursor:pointer;
  border:1px solid var(--hair-2);background:rgba(255,255,255,.6);border-radius:8px;
  display:flex;align-items:center;justify-content:center;gap:6px}
.fullbtn:hover{border-color:var(--accent)}

.hx{flex:1;min-width:0;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.hx .idb{min-width:0;flex:0 1 auto}
.hx .cat{display:inline-block;font-size:var(--fs-sm);letter-spacing:.12em;color:#fff;
  background:var(--accent);padding:3px 10px;border-radius:999px;font-weight:700}
.hx h2{font-family:var(--serif);font-weight:900;font-size:32px;margin:11px 0 3px;line-height:1.16;color:var(--accent-ink)}
.hx .rd{font-size:var(--fs-md);color:var(--text-mid);letter-spacing:.08em}
.hx .meta{margin-top:13px;display:flex;flex-wrap:wrap;gap:7px}
.hx .meta .m{background:var(--card);border:1px solid var(--hair-2);border-radius:8px;
  padding:6px 11px;font-size:var(--fs-md)}
.hx .meta .m b{color:var(--text-mid);font-weight:500;margin-right:6px}
.hx-quote{flex:1 1 240px;min-width:0;align-self:center;font-family:var(--serif);font-size:18px;
  color:var(--accent-ink);border-left:3px solid var(--accent);padding:8px 0 8px 16px;line-height:1.65;white-space:pre-wrap}

/* 三欄上區：角色設定 ｜ 能力值+點數 ｜ 共鳴+殘響 */
.top3{display:grid;grid-template-columns:minmax(300px,1.25fr) minmax(190px,.62fr) minmax(250px,1fr);
  gap:20px;align-items:start;margin-bottom:18px}
/* 個資與喜歡／討厭：緊密「標籤：內容」單行內嵌 */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin-bottom:11px}
.ib{display:flex;align-items:baseline;gap:2px;font-size:var(--fs-md);min-width:0;line-height:1.45}
.ib .k{color:var(--text-dim);font-size:var(--fs-sm);flex:0 0 auto;white-space:nowrap}
.ib .k::after{content:"："}
.ib .v{color:var(--text);min-width:0;overflow-wrap:anywhere}
.ib.wide{grid-column:1/-1}

/* 角色設定：固定高度可捲動內容（緊密） */
.scrollbox{max-height:106px;overflow-y:auto;
  border:1px solid var(--hair);border-radius:8px;background:rgba(255,255,255,.42);padding:7px 10px;margin:0 0 10px}
.scrollbox::-webkit-scrollbar{width:7px}
.scrollbox::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.35);border-radius:8px}
.scrollbox p{margin:0;white-space:pre-wrap;font-size:var(--fs-md);line-height:1.55}

/* 燈箱 */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(15,15,20,.86);
  display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:min(92vw,820px);max-height:90vh;object-fit:contain;
  border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.skwide{margin-top:2px}
/* 半透明底板：不完全遮擋背景浮水印 */
.card{background:rgba(249,248,245,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid var(--hair-2);border-radius:14px;padding:16px 17px;margin-bottom:18px}
.top3 .card:last-child,.colB .card:last-child,.colC .card:last-child{margin-bottom:0}
.card > h3{
  font-family:var(--serif);font-size:var(--fs-md);font-weight:700;letter-spacing:.16em;
  margin:0 0 13px;color:var(--text-mid);display:flex;align-items:center;gap:8px;
}
.card > h3::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px;display:inline-block}

/* abilities：直向、緊密單欄；HP／MP 併入同一列表 */
.abil{display:flex;flex-direction:column;border:1px solid var(--hair-2);border-radius:10px;overflow:hidden}
.ab{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);
  padding:5px 12px;border-top:1px solid var(--hair)}
.ab:first-child{border-top:0}
.ab .k{font-size:var(--fs-md);color:var(--text-mid);letter-spacing:.04em}
.ab .v{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--text)}
.ab.luck{background:rgba(var(--accent-rgb),.10)}
.ab.luck .v{color:var(--accent-ink)}
.ab.hp{border-top:2px solid var(--hair-2);background:rgba(138,75,82,.11)}
.ab.hp .v{color:#8a4b52}
.ab.mp{background:rgba(64,90,134,.11)}
.ab.mp .v{color:#405a86}

/* 點數預算：能力點併入「能力值」、技能點併入「技能列表」 */
.budget{border:1px solid var(--hair);border-radius:9px;background:var(--card-2);padding:9px 12px}
.budget .lab{font-weight:700;color:var(--text-mid);font-size:var(--fs-md)}
.budget .num{font-family:var(--mono);font-size:var(--fs-md);white-space:nowrap}
.budget .num b{font-size:17px;color:var(--text)}
.budget .num .over{color:var(--warn)}
.budget .bar{height:6px;border-radius:4px;background:#dcd9cf;overflow:hidden}
.budget .bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.budget .bar > i.over{background:var(--warn)}
.budget .foot{font-size:var(--fs-sm);color:var(--text-dim)}
.budget .foot .x{color:var(--text-mid)}
.budget .foot .x b{font-family:var(--mono);color:var(--text);font-weight:600}
.budget .foot .warn{color:var(--warn)}
/* 直式（能力值卡內） */
.budget.v{margin-bottom:12px;border-left:3px solid var(--accent)}
.budget.v .top{display:flex;justify-content:space-between;align-items:baseline}
.budget.v .bar{margin:7px 0}
.budget.v .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* 橫式（技能列表卡內） */
.budget.h{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:14px;border-left:3px solid var(--accent)}
.budget.h .bar{flex:1 1 120px;min-width:120px}
.budget.h .foot{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;flex:0 0 auto}
.budget.h .note{color:var(--text-dim)}

/* resonance emotions — signature */
.reson{position:relative;padding-left:20px}
.reson::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(var(--accent),rgba(var(--accent-rgb),.15))}
.emo{position:relative;background:var(--card-2);border:1px solid var(--hair);border-radius:10px;
  padding:9px 12px;margin-bottom:10px}
.emo::before{content:"";position:absolute;left:-17px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--card)}
.emo:last-child{margin-bottom:0}
.emo .slot{font-size:var(--fs-sm);letter-spacing:.22em;color:var(--text-dim);font-weight:700}
.emo .wr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
.emo .word{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--accent-ink)}
.emo .cat{font-size:var(--fs-sm);color:#fff;background:var(--accent);
  border-radius:999px;padding:2px 9px;font-weight:700;align-self:center}
.emo .desc{font-size:var(--fs-sm);color:var(--text-mid);margin-top:6px;line-height:1.5}

/* skill list — 寬表格（欄位標題＋分區） */
.sk-legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 14px;font-size:var(--fs-sm);color:var(--text-mid)}
.sk-legend span{display:inline-flex;align-items:center;gap:5px}
.sk-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sk-wrap{overflow-x:auto}
.sk-cols{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:16px;align-items:start}
.sk-col{display:grid;grid-template-columns:1fr 54px 63px 46px;align-content:start;
  border:1px solid var(--hair-2);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.42);font-size:var(--fs-md)}
/* 欄位標題列 */
.sk-h{background:var(--ink-3);color:#fff;font-family:var(--serif);font-weight:700;font-size:var(--fs-sm);
  padding:7px 9px;display:flex;align-items:center;letter-spacing:.04em}
.sk-h.c{justify-content:center;padding-left:0;padding-right:0}
.sk-h.r{justify-content:flex-end}
.sk-h-lv{background:var(--ink-3);color:#fff;font-family:var(--serif);font-weight:700;font-size:var(--fs-sm);
  display:flex;align-items:center;justify-content:center;padding:7px 0;letter-spacing:.04em}
/* 分區列（技能分類）：以代表色系深底，與欄位標題（深藍）以顏色區分 */
.sk-catbar{grid-column:1/-1;background:var(--accent-ink);border-top:1px solid var(--accent-ink);
  font-family:var(--serif);font-weight:700;font-size:var(--fs-md);color:#fff;padding:6px 10px;letter-spacing:.06em}
/* 技能格 */
.sk-c{border-top:1px solid var(--hair-2);padding:5px 9px;display:flex;align-items:center;min-width:0;background:rgba(255,255,255,.30)}
.sk-c.on{background:rgba(var(--accent-rgb),.07)}
.sk-c.name{min-width:0}
.sk-c.name .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sk-c.name.on2 .nm{font-weight:700;color:var(--accent-ink)}
.sk-c.name .mk{font-family:var(--mono);font-weight:700;letter-spacing:-.03em;white-space:pre}
.sk-c.name .mk.main{color:var(--accent-ink)}
.sk-c.name .mk.up{color:#a06a2c}
.sk-c.name .fill{color:var(--text-mid);font-weight:400}
.sk-c.ab{justify-content:flex-end;font-size:var(--fs-sm);color:var(--text-dim)}
.sk-c.lv{justify-content:center;padding-left:0;padding-right:0}
.sk-lv{display:flex;gap:3px}
.sk-lv i{width:19px;height:19px;border-radius:4px;border:1px solid var(--hair-2);background:rgba(255,255,255,.6);
  font-family:var(--mono);font-size:13px;line-height:17px;text-align:center;color:var(--text-dim)}
.sk-lv i.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.sk-c.jd{justify-content:flex-end;font-family:var(--mono);font-weight:500;color:var(--text-dim)}
.sk-c.jd.on{color:var(--accent-ink)}

/* echo record */
.echo table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
.echo th{text-align:left;font-size:var(--fs-sm);letter-spacing:.1em;color:var(--text-dim);
  font-weight:700;padding:6px 9px;border-bottom:1px solid var(--hair-2)}
.echo td{padding:7px 9px;border-bottom:1px solid var(--hair)}
.echo td:last-child,.echo th:last-child{text-align:center;width:66px}
.echo .used{color:var(--accent-ink);font-weight:700}
.echo .box{display:inline-block;width:15px;height:15px;border:1px solid var(--hair-2);border-radius:4px;vertical-align:-2px}
.echo .box.on{background:var(--accent);border-color:var(--accent)}

/* prose */
.prose h4{font-size:var(--fs-sm);letter-spacing:.12em;color:var(--text-dim);font-weight:700;margin:0 0 3px}
.prose p{margin:0 0 10px;white-space:pre-wrap;font-size:var(--fs-md);line-height:1.55}
.prose .quote{font-family:var(--serif);font-size:17px;color:var(--accent-ink);border-left:3px solid var(--accent);
  padding:4px 0 4px 14px;margin:2px 0 4px;line-height:1.6}
.likes{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.likes .lk{flex:1;min-width:130px}

/* empty */
.empty{max-width:560px;margin:12vh auto;text-align:center;color:var(--text-mid)}
.empty svg{width:52px;height:52px;color:var(--hair-2);margin-bottom:14px}
.empty h2{font-family:var(--serif);font-size:22px;color:var(--text);margin:0 0 8px}
.empty p{font-size:var(--fs-md);margin:0 0 6px}

@media(max-width:1180px){
  .top3{grid-template-columns:1fr 1fr}
  .sk-cols{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .side{transform:none}
  .app.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
  .menu-btn{display:inline-flex!important}
  .top3{grid-template-columns:1fr}
  .sk-cols{grid-template-columns:1fr}
  .dh{flex-direction:column}
  .watermark{display:none}
}
.menu-btn{display:none}
.hidden{display:none!important}

/* ===== 檢視模式（角色頁）改版 ===== */
.sheet.view{padding:26px 30px 80px}
.v-top{display:grid;grid-template-columns:minmax(250px,330px) minmax(200px,250px) minmax(30px,1fr);gap:8px 20px;align-items:start;margin-bottom:22px;position:relative;z-index:1}
.v-head{grid-column:1/-1;min-width:0}
.v-idhead{display:flex;gap:20px;align-items:flex-start;margin-bottom:8px}
.v-name{min-width:0;padding-top:4px}
.v-name .cat{display:inline-block;font-size:var(--fs-sm);letter-spacing:.12em;color:#fff;background:var(--accent);padding:3px 10px;border-radius:999px;font-weight:700}
.v-name h2{font-family:var(--serif);font-weight:900;font-size:30px;margin:9px 0 3px;line-height:1.15;color:var(--accent-ink)}
.v-name .rd{font-size:var(--fs-md);color:var(--text-mid);letter-spacing:.08em}
.v-name .v-pl{margin-top:9px;font-size:var(--fs-md);color:var(--text)}
.v-name .v-pl b{color:var(--text-mid);font-weight:500;margin-right:6px}
.v-quote{font-family:var(--serif);font-size:17px;color:var(--accent-ink);border-left:3px solid var(--accent);padding:6px 0 6px 15px;margin:2px 0 12px;line-height:1.6;white-space:pre-wrap}
.v-radar{grid-column:1;max-width:300px;margin:0}
.v-spacer{grid-column:3}
.radar{width:100%;height:auto;display:block}
.radar .rv{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--text)}
.radar .rk{font-size:13px;fill:var(--text-mid)}

/* 共鳴感情（菱形，交錯下降；置於雷達圖右側／畫面中間，右方留空） */
.v-reson{grid-column:2;display:flex;flex-direction:column;min-width:0}
.v-emo{position:relative;width:150px;height:150px;margin:1px 0}
.v-emo.p0{align-self:flex-start}
.v-emo.p1{align-self:flex-end;margin-top:-52px}
.v-emo.p2{align-self:flex-start;margin-top:-52px}
.v-emo .lb{position:absolute;top:-1px;left:50%;transform:translateX(-50%);z-index:3;font-size:var(--fs-sm);color:#fff;background:var(--ink-3);border-radius:7px;padding:2px 10px;letter-spacing:.1em;white-space:nowrap}
.v-emo .dia{position:absolute;inset:23px;transform:rotate(45deg);border:2px solid var(--ink-3);border-radius:16px;background:rgba(252,251,248,.9)}
.v-emo .inner{position:absolute;inset:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.v-emo .wd{font-family:var(--serif);font-weight:900;font-size:24px;color:var(--accent-ink);line-height:1.05}
.v-emo .ct{font-size:var(--fs-sm);color:var(--text-mid)}

/* 下方：技能一覽 / 角色設定 ｜ 殘響 */
.v-bottom{display:grid;grid-template-columns:1fr minmax(240px,330px);gap:20px;align-items:start;position:relative;z-index:1}
.v-mainL{min-width:0}
.v-noskill{color:var(--text-dim);font-size:var(--fs-md)}
.v-skills{display:flex;flex-direction:column;gap:9px}
.lvrow{display:flex;align-items:flex-start;gap:10px}
.lvtag{flex:0 0 auto;background:var(--ink-3);color:#fff;font-family:var(--mono);font-weight:700;font-size:var(--fs-md);border-radius:999px;padding:4px 13px;margin-top:1px}
.lvskills{display:flex;flex-wrap:wrap;gap:7px 15px;align-items:baseline;min-width:0}
.lvskills .sk{display:inline-flex;align-items:baseline;gap:3px;font-size:15px}
.lvskills .sk .st{color:#a06a2c;font-weight:700}
.lvskills .sk b{font-weight:700;color:var(--text)}
.lvskills .sk .tag{font-size:var(--fs-sm);background:var(--accent);color:#fff;border-radius:5px;padding:1px 6px;align-self:center}
.lvskills .sk i{font-family:var(--mono);color:var(--text-mid);font-style:normal;font-size:13px}
@media(max-width:980px){
  .v-top{grid-template-columns:1fr}
  .v-head,.v-radar,.v-reson,.v-spacer{grid-column:auto}
  .v-spacer{display:none}
  .v-bottom{grid-template-columns:1fr}
  .v-reson{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
  .v-emo.p1,.v-emo.p2{margin-top:2px;align-self:auto}
}

/* ===== 編輯器 ===== */
/* 詳情頁編輯列：按鈕位置對齊編輯模式的「儲存角色」 */
.sheet-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:14px;position:relative;z-index:2}
.editor{max-width:1240px;margin:0 auto;padding:24px 30px 90px}
.ed-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid var(--hair-2)}
.ed-bar h2{font-family:var(--serif);font-size:24px;color:var(--accent-ink);margin:0;flex:1;min-width:150px}
.ed-btn{border:1px solid var(--hair-2);background:var(--card);border-radius:9px;padding:8px 15px;font-size:var(--fs-md);font-weight:700;color:var(--text-mid);cursor:pointer}
.ed-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.ed-btn.primary{background:var(--accent-ink);color:#fff;border-color:var(--accent-ink)}
.ed-btn.primary:hover{filter:brightness(1.14);color:#fff}
.ed-sec{background:rgba(249,248,245,.74);border:1px solid var(--hair-2);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.ed-sec > h3{font-family:var(--serif);font-size:var(--fs-md);font-weight:700;letter-spacing:.16em;margin:0 0 14px;color:var(--text-mid);display:flex;align-items:center;gap:8px}
.ed-sec > h3::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.ed-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.ed-f.wide{grid-column:1/-1}
.ed-f label{font-size:var(--fs-sm);color:var(--text-dim);font-weight:700;letter-spacing:.04em}
.ed-f input,.ed-f textarea,.ed-f select{font-family:inherit;font-size:var(--fs-md);color:var(--text);border:1px solid var(--hair-2);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
.ed-f textarea{resize:vertical;min-height:54px;line-height:1.6}
.ed-f input:focus,.ed-f textarea:focus,.ed-f select:focus{outline:none;border-color:var(--accent)}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:46px;height:36px;padding:2px;flex:0 0 auto;cursor:pointer}

.ed-ptline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px;background:var(--card-2);border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:9px;padding:9px 12px}
.ed-ptline .lab{font-weight:700;color:var(--text-mid)}
.ed-ptline .num{font-family:var(--mono)} .ed-ptline .num b{font-size:17px;color:var(--text)} .ed-ptline .num b.over{color:var(--warn)}
.ed-ptline .bar{flex:1 1 110px;min-width:90px;height:6px;border-radius:4px;background:#dcd9cf;overflow:hidden}
.ed-ptline .bar>i{display:block;height:100%;background:var(--accent)} .ed-ptline .bar>i.over{background:var(--warn)}
.ed-ptline .rem{font-size:var(--fs-sm);color:var(--text-dim)} .ed-ptline .rem.warn{color:var(--warn)}

.ed-abil{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.eda{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card-2);border:1px solid var(--hair);border-radius:8px;padding:5px 10px}
.eda .k{font-size:var(--fs-md);color:var(--text-mid)}
.eda .stp{display:flex;align-items:center;gap:7px}
.eda .stp button{width:26px;height:26px;border-radius:6px;border:1px solid var(--hair-2);background:#fff;font-size:16px;line-height:1;cursor:pointer;color:var(--accent-ink);font-weight:700}
.eda .stp button:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.eda .stp b{font-family:var(--mono);font-size:16px;min-width:22px;text-align:center}
.eda.luck{background:rgba(var(--accent-rgb),.10)}
.ed-derived{display:flex;gap:10px;margin-top:9px}

.ed-derived .d.hp{background:#8a4b52}.ed-derived .d.mp{background:#405a86}
.ed-derived .d .v{font-family:var(--mono);font-weight:600;font-size:18px}

.ed-skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.ed-cat{border:1px solid var(--hair-2);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.42)}
.ed-cat-h{background:var(--accent-ink);color:#fff;font-family:var(--serif);font-weight:700;padding:6px 11px;letter-spacing:.05em}
.edsk{padding:6px 10px;border-top:1px solid var(--hair);background:rgba(255,255,255,.5)}
.edsk.basic{background:rgba(var(--accent-rgb),.05)}
.edsk .r1{display:flex;align-items:center;gap:6px;min-width:0}
.edsk .r2{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.edsk .mk{font-family:var(--mono);font-weight:700;font-size:var(--fs-sm)}
.edsk .mk.main{color:var(--accent-ink)}.edsk .mk.up{color:#a06a2c}
.edsk .snm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edsk .cnm{flex:1 1 100px;min-width:80px;font-size:var(--fs-md);border:1px solid var(--hair-2);border-radius:6px;padding:4px 7px;background:#fff}
.edsk select.ab{font-size:var(--fs-sm);border:1px solid var(--hair-2);border-radius:6px;padding:3px 5px;background:#fff}
.edsk .abfix{font-size:var(--fs-sm);color:var(--text-dim);min-width:42px}
.edsk .lvbtns{display:flex;gap:3px}
.edsk .lvbtns button{width:24px;height:24px;border-radius:5px;border:1px solid var(--hair-2);background:#fff;font-family:var(--mono);font-size:var(--fs-sm);cursor:pointer;color:var(--text-dim)}
.edsk .lvbtns button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.edsk .lvfix{font-size:var(--fs-sm);color:var(--accent-ink);font-weight:700}
.edsk .up-chk{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-sm);color:var(--text-mid);cursor:pointer}
.edsk .jd{font-family:var(--mono);font-weight:600;color:var(--accent-ink);margin-left:auto;min-width:22px;text-align:right}
.edsk .rm{border:0;background:none;color:var(--warn);cursor:pointer;font-size:15px;padding:0 2px;margin-left:auto}
.ed-addcustom{width:100%;border:0;border-top:1px dashed var(--hair-2);background:rgba(var(--accent-rgb),.06);color:var(--accent-ink);font-weight:700;font-size:var(--fs-sm);padding:7px;cursor:pointer}
.ed-addcustom:hover{background:rgba(var(--accent-rgb),.12)}
@media(max-width:820px){.ed-skills{grid-template-columns:1fr}}
</style>

/* ============ CSV parser（支援引號內換行） ============ */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  if(!rows.length) return [];
  const head=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(x=>x.trim()!=='')).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]??'').trim()); return o;
  });
}

/* ============ 色彩工具 ============ */
function hexToRgb(hex){
  hex=(hex||'').trim().replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex||'696662',16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function lum(rgb){ return (0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2])/255; }
function darken(rgb,f){ return rgb.map(v=>Math.round(v*(1-f))); }
function inkFor(rgb){ let c=rgb.slice(); while(lum(c)>0.42) c=darken(c,0.16); return c; }
function setAccent(hex){
  const rgb=hexToRgb(hex||'#696662'); const ink=inkFor(rgb);
  const r=document.documentElement.style;
  r.setProperty('--accent',`rgb(${rgb.join(',')})`);
  r.setProperty('--accent-rgb',rgb.join(','));
  r.setProperty('--accent-ink',`rgb(${ink.join(',')})`);
}

/* ============ 技能等級與點數計算 ============ */
// 解析角色「習得技能」多列 → [{名,等級,能力,自填}]
function parseLearned(str){
  return (str||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const p=line.split('|');
    return {名:(p[0]||'').trim(), 等級:parseInt(p[1]||'0',10)||0, 能力:(p[2]||'').trim(), 自填:(p[3]||'').trim(),
      分類:(p[4]||'').trim(), 上位custom:/^(是|★|上位|1|true)$/i.test((p[5]||'').trim())};
  }).filter(x=>x.名);
}
// 把技能表 join 角色習得 → 產生 slots（每列一項，含等級/能力/判定值）
function buildSkillSlots(ch){
  const learned = parseLearned(ch.習得技能);
  // 基礎（*）與一般技能；排除「可自填」占位列（改由自訂技能處理）
  const base = SKILLS.filter(s=>s.可自填!=='是').map((s,idx)=>({
    idx, 分類:s.分類, 技能名:s.技能名,
    主技:s.主技==='是', 上位:s.上位==='是',
    能力可變:s.能力可變==='是', 可自填:false,
    預設能力:s.預設能力||'', 能力:s.預設能力||'', 自填:'', 等級:0
  }));
  base.forEach(s=>{ if(s.主技) s.等級=1; });   // 基礎技能自動 LV1
  const byName={}; base.forEach(s=>{ if(!byName[s.技能名]) byName[s.技能名]=s; });
  const custom=[];
  learned.forEach((L,i)=>{
    if(L.分類){ // 明確標記的自訂技能
      custom.push({idx:'c'+i, 分類:L.分類, 技能名:L.名, 主技:false, 上位:!!L.上位custom,
        能力可變:true, 可自填:false, 預設能力:L.能力||'靈巧', 能力:L.能力||'靈巧', 自填:'', 等級:L.等級||1, custom:true});
      return;
    }
    const slot=byName[L.名];
    if(slot){
      if(slot.主技) slot.等級=1; else slot.等級=Math.max(slot.等級, L.等級||1);
      if(L.能力) slot.能力=L.能力;
    }else{
      // 可自填或未知技能 → 查完整技能表，歸入其分類的自訂技能
      const cat=SKILLS.find(s=>s.技能名===L.名);
      custom.push({idx:'x'+i, 分類:cat?cat.分類:'特殊技能', 技能名:L.名+(L.自填?'：'+L.自填:''),
        主技:false, 上位:cat?cat.上位==='是':false, 能力可變:true, 可自填:false,
        預設能力:L.能力||(cat?cat.預設能力:'靈巧'), 能力:L.能力||(cat?cat.預設能力:'靈巧'), 自填:'', 等級:L.等級||1, custom:true});
    }
  });
  return base.concat(custom);
}
function abilVal(ch, key){ // 能力值（含運勢）
  const v=parseInt(ch[key]||'0',10); return isNaN(v)?0:v;
}
function judge(ch, slot){
  let base;
  if(slot.技能名==='緊急處置') base=Math.ceil(abilVal(ch,'智力')/2);
  else base=abilVal(ch, slot.能力||slot.預設能力);
  return base + (slot.等級||0);
}
function slotCost(slot){
  const lv=slot.等級||0; if(!lv) return 0;
  if(slot.主技 && lv===1) return 0;           // 基本技能 LV1 免費
  return (slot.上位?COST_UPPER:COST_NORMAL)[lv]||0;
}
function abilUsed(ch){ return ABILS.reduce((a,k)=>a+abilVal(ch,k),0); }
function skillUsed(ch, slots){ return (slots||buildSkillSlots(ch)).reduce((a,s)=>a+slotCost(s),0); }
function hp(ch){ return abilVal(ch,'身體')+10; }
function mp(ch){ return abilVal(ch,'精神')+abilVal(ch,'智力'); }

  wrap.querySelectorAll('.stp button').forEach(b=>b.onclick=()=>{ const k=b.dataset.ab; let v=edAbil(k)+(+b.dataset.d); if(v<0)v=0; if(v>99)v=99; ED.f[k]=String(v); edCalcRender(); });
  wrap.querySelectorAll('[data-reg-lv]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const nm=g.dataset.regLv, l=+b.dataset.l, cur=ED.reg[nm], rs=regByName(nm);
    if(cur&&cur.等級===l) delete ED.reg[nm]; else ED.reg[nm]={等級:l,能力:(cur&&cur.能力)||(rs?rs.預設能力:'靈巧')};
    edCalcRender();
  }));
  wrap.querySelectorAll('select[data-reg-ab]').forEach(s=>s.onchange=()=>{ const nm=s.dataset.regAb, rs=regByName(nm); ED.reg[nm]=ED.reg[nm]||{等級:0,能力:rs?rs.預設能力:'靈巧'}; ED.reg[nm].能力=s.value; edCalcRender(); });
  wrap.querySelectorAll('.cnm[data-cid]').forEach(inp=>inp.addEventListener('input',()=>{ const c=ED.custom.find(x=>x.id===inp.dataset.cid); if(c)c.技能名=inp.value; }));
  wrap.querySelectorAll('select.ab[data-cid]').forEach(s=>s.onchange=()=>{ const c=ED.custom.find(x=>x.id===s.dataset.cid); if(c){c.能力=s.value; edCalcRender();} });
  wrap.querySelectorAll('input[type=checkbox][data-cid]').forEach(cb=>cb.onchange=()=>{ const c=ED.custom.find(x=>x.id===cb.dataset.cid); if(c){c.上位=cb.checked; edCalcRender();} });
  wrap.querySelectorAll('[data-clv]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const c=ED.custom.find(x=>x.id===g.dataset.clv); if(c){ c.等級=(c.等級===+b.dataset.l?0:+b.dataset.l); edCalcRender(); } }));

function edCommit(){
  view.querySelectorAll('[data-f]').forEach(el=>{ ED.f[el.dataset.f]=el.value; });
  if(!(ED.f.PC姓名||'').trim()){ alert('請先填寫「PC 姓名」'); return null; }
  const lines=[];
  Object.keys(ED.reg).forEach(nm=>{ const r=ED.reg[nm]; if(r.等級>0){ const rs=regByName(nm); const ab=(rs&&rs.能力可變==='是')?(r.能力||rs.預設能力):''; lines.push(`${nm}|${r.等級}|${ab}`); } });
  ED.custom.forEach(c=>{ const nm=(c.技能名||'').trim(); if(nm && c.等級>0) lines.push(`${nm}|${c.等級}|${c.能力||''}||${c.分類}|${c.上位?'上位':''}`); });
  ED.f.習得技能=lines.join('\n');
  const ch={}; EDIT_ALLKEYS.concat('習得技能').forEach(k=>ch[k]=ED.f[k]!=null?ED.f[k]:'');
  let idx=ED.idx;
  if(idx>=0) CHARS[idx]=ch; else { CHARS.push(ch); idx=CHARS.length-1; ED.idx=idx; }
  return idx;
}

/* 能力值八角雷達圖（左上起順時針：身體→精神→智力→社會→靈巧→五感→魅力→運勢） */
function radarSVG(ch){
  const order=['身體','精神','智力','社會','靈巧','五感','魅力','運勢'];
  const vals=order.map(k=>abilVal(ch,k));
  const scaleMax=Math.max(6, ...vals);
  const cx=190, cy=182, R=116, rings=3, labR=R+32;
  const ang=i=>(-22.5+i*45)*Math.PI/180;                 // 左上起、順時針
  const pt=(i,r)=>[cx+r*Math.sin(ang(i)), cy-r*Math.cos(ang(i))];
  const poly=(r)=>order.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
  let grid='';
  for(let g=1;g<=rings;g++){ grid+=`<polygon points="${poly(R*g/rings)}" fill="none" stroke="var(--hair-2)" stroke-width="1" opacity="${g===rings?1:0.55}"/>`; }
  let spokes=''; order.forEach((_,i)=>{ const [x,y]=pt(i,R); spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--hair-2)" stroke-width="1" opacity=".5"/>`; });
  const dpoly=vals.map((v,i)=>pt(i,R*v/scaleMax).map(t=>t.toFixed(1)).join(',')).join(' ');
  const dots=vals.map((v,i)=>{const [x,y]=pt(i,R*v/scaleMax);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--accent)"/>`;}).join('');
  const labels=order.map((k,i)=>{ const [x,y]=pt(i,labR); return `<text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" class="rv">${vals[i]}</text>`+
    `<text x="${x.toFixed(1)}" y="${(y+13).toFixed(1)}" text-anchor="middle" class="rk">${k}</text>`; }).join('');
  return `<svg viewBox="0 0 380 372" class="radar" role="img" aria-label="能力雷達圖">`+
    grid+spokes+`<polygon points="${dpoly}" fill="rgba(var(--accent-rgb),.30)" stroke="var(--accent)" stroke-width="2"/>`+dots+labels+`</svg>`;
}

/* 共鳴感情：表／裏／根源 菱形 */
function resonanceDiamonds(ch){
  const items=[['表感情',ch.表_感情],['裏感情',ch.裏_感情],['根源',ch.根源_感情]];
  const html=items.map(([label,raw],idx)=>{
    if(!raw) return '';
    let word=raw, cat='';
    if(/[／/]/.test(raw)){ const p=raw.split(/[／/]/); word=p[0].trim(); cat=(p[1]||'').trim(); }
    if(!cat) cat=emoCat(word);
    return `<div class="v-emo p${idx}"><span class="lb">${label}</span><div class="dia"></div>`+
      `<div class="inner"><span class="wd">${esc(word)}</span>${cat?`<span class="ct">（${esc(cat)}）</span>`:''}</div></div>`;
  }).filter(Boolean).join('');
  return html?`<div class="v-reson">${html}</div>`:`<div class="v-reson"></div>`;
}

/* 技能一覽：依 LV1/2/3 分類；LV1 不列基本技能；自填→標籤；★上位 */
function skillsByLv(ch, slots){
  const groups={1:[],2:[],3:[]};
  slots.filter(s=>s.等級>0).forEach(s=>{
    if(s.等級===1 && s.主技) return;          // LV1 不顯示基本技能
    if(groups[s.等級]) groups[s.等級].push(s);
  });
  const fmt=s=>{
    const star=s.上位?`<span class="st">★</span>`:'';
    let nm=s.技能名, tag='';
    const parts=s.技能名.split(/[:：]/);
    if(parts.length>1){ tag=`<span class="tag">${esc(parts[0])}</span>`; nm=parts.slice(1).join('：'); }
    return `<span class="sk">${star}${tag}<b>${esc(nm)}</b><i>(${judge(ch,s)})</i></span>`;
  };
  let out='';
  [1,2,3].forEach(lv=>{ if(groups[lv].length) out+=`<div class="lvrow"><span class="lvtag">Lv.${lv}</span><div class="lvskills">${groups[lv].map(fmt).join('')}</div></div>`; });
  return out?`<div class="v-skills">${out}</div>`:'';
}

      const mk = s.上位?`<span class="mk up">★</span>`:(s.主技?`<span class="mk main">＊</span>`:`<span class="mk">　</span>`);
      let name=esc(s.技能名);
      if(s.可自填){ name+=`：<span class="fill">${s.自填?esc(s.自填):'———'}</span>`; }
      const ab = s.技能名==='緊急處置' ? '智力/2' : (s.能力可變 ? (s.能力||s.預設能力) : s.預設能力);
      const pips=[1,2,3].map(l=>`<i class="${s.等級===l?'on':''}">${l}</i>`).join('');
      h+=`<div class="sk-c name${on?' on on2':''}"><span class="nm">${mk}${name}</span></div>`+
         `<div class="sk-c ab${on?' on':''}">${esc(ab||'')}</div>`+
         `<div class="sk-c lv${on?' on':''}"><div class="sk-lv">${pips}</div></div>`+
         `<div class="sk-c jd${on?' on':''}">${judge(ch,s)}</div>`;
    });
    return h;
  };
  let cols=`<div class="sk-wrap"><div class="sk-cols">`;
  SK_COLUMNS.forEach(col=>{
    cols+=`<div class="sk-col">`+header+col.map(rowsFor).join('')+`</div>`;
  });
  cols+=`</div></div>`;
  return cols;
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

bind('fileCsv','change',async e=>{

  status(`已載入角色 CSV：${CHARS.length} 名`); renderGallery();
  e.target.value='';
});
bind('fileFolder','change',async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  let cChar=null,cSkill=null,cEmo=null; IMG={};
  for(const f of files){
    const name=f.name, low=name.toLowerCase(), rel=(f.webkitRelativePath||name);
    if(low.endsWith('.csv')){
      const t=await f.text();
      if(name.includes('角色')||low.includes('char')) cChar=t;
      else if(name.includes('技能')||low.includes('skill')) cSkill=t;
      else if(name.includes('共鳴')||name.includes('感情')||low.includes('emo')) cEmo=t;
    }else if(/\.(png|jpe?g|gif|webp|svg|avif)$/i.test(low)){
      const url=await fileToDataURL(f);
      IMG[name]=url;
      const parts=rel.split('/'); const short=parts.slice(-2).join('/'); IMG[short]=url; IMG['images/'+name]=url;
    }
  }
  loadData(cChar,cSkill,cEmo);
  status(`已載入資料夾：${CHARS.length} 名角色・${Object.keys(IMG).length?'含圖片':'無圖片'}`);
  renderGallery(); e.target.value='';
});
function fileToDataURL(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});}
function status(t){document.getElementById('status').textContent=t;}
function scrollTop(){ const m=document.querySelector('.main'); if(m) m.scrollTop=0; try{window.scrollTo(0,0);}catch(e){} }

function currentCharCSV(){
  const head=["分類","PC姓名","拼音","PL","代表色","頭像","立繪","性別","年齡","職業","出身地","喜歡的東西","討厭的東西","身體","靈巧","精神","五感","智力","魅力","社會","運勢","額外能力點","額外技能點","表_感情","裏_感情","根源_感情","習得技能","殘響紀錄","背景故事","外貌","性格","台詞","差分"];
  const esc=v=>{v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return head.join(',')+'\n'+CHARS.map(c=>head.map(h=>esc(c[h])).join(',')).join('\n');
}
function dl(name,text){
  const b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

  const foot=doc.querySelector('#status'); if(foot) foot.textContent='純檢視版';

  const html='<!DOCTYPE html>\n'+doc.outerHTML;

function SKILLS_asCSV(){

  return head.join(',')+'\n'+SKILLS.map(s=>head.map(h=>s[h]??'').join(',')).join('\n');
}
function EMOS_asCSV(){

  return head.join(',')+'\n'+EMOS.map(e=>head.map(h=>esc(e[h])).join(',')).join('\n');
}
