<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>神貓卓團錄編輯器1.0版</title>
<style>
:root{
  --paper:#e7e9ef; --panel:#fbfcfe; --ink:#191d29; --ink-2:#3c4considered;
  --muted:#6d7689; --line:#c9cedb;
  --secret:#6a4b9c; --secret-bg:#efeaf7; --secret-line:#b9a5d8;
  --dice:#0e6a66; --dice-bg:#e6f1f0;
  --info:#8a5a12; --info-bg:#f6efe2;
  --other:#7a8194;
  --reward:#2f6b45; --reward-bg:#eaf2ec; --reward-line:#a9c6b4;
  --note:#a24a6d; --note-bg:#f7eef2; --note-line:#dcbccb; --note-ink:#4a2233;
  --pc:#355a7a; --pc-bg:#eef2f6; --pc-line:#c3d0dd; --pc-accent:#b98a2e;
  --battle:#a83232; --battle-bg:#f6e9e7; --battle-end:#5a6472; --battle-end-bg:#eceef1;
  --epi:#8a6d3b; --epi-bg:#f5f0e5; --epi-line:#d9cca9;
  --pro:#46707f; --pro-bg:#e9f0f2; --pro-line:#b5cdd5;
  --round:#8c3d3d; --round-bg:#f7ecea;
  --hidden:#2b2b38; --hidden-ink:#d8d4e2; --hidden-accent:#9d8fc4;
  --radius:3px;
  --mono:"Roboto Mono","DejaVu Sans Mono",ui-monospace,"Noto Sans TC",monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.85;
  background-image:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(0deg,rgba(0,0,0,.02) 0 1px,transparent 1px 4px);}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 120px}

/* ── header ───────────────────────────────── */
header.mast{padding:52px 0 26px;border-bottom:1px solid var(--line)}
.mast .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase}
.mast h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5.5vw,46px);letter-spacing:.14em;margin:.28em 0 .1em}
.mast .sub{color:var(--muted);font-size:13px;letter-spacing:.1em;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.mast .stat{font-family:var(--mono);font-size:11px;opacity:.75}
[contenteditable]{outline:none;border-bottom:1px dashed transparent;cursor:text}
[contenteditable]:hover{border-bottom-color:var(--line)}
[contenteditable]:focus{border-bottom-color:var(--ink);background:rgba(255,255,255,.5)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55}

/* ── toolbar ──────────────────────────────── */
.bar{position:sticky;top:0;z-index:20;background:rgba(231,233,239,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:26px}
.bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:5px 11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:var(--radius);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--panel);background:var(--ink);border-color:var(--ink)}
.chip.k-secret[aria-pressed="true"]{background:var(--secret);border-color:var(--secret)}
.chip.k-dice[aria-pressed="true"]{background:var(--dice);border-color:var(--dice)}
.chip.k-info[aria-pressed="true"]{background:var(--info);border-color:var(--info)}
input[type=search],select{font-family:var(--sans);font-size:13px;padding:5px 9px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:var(--radius);min-width:150px}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

/* ── log rows ─────────────────────────────── */
.line{display:flex;gap:12px;padding:9px 0 9px 14px;border-left:3px solid transparent;position:relative}
.line + .line{margin-top:2px}
.line.main{border-left-color:var(--ink)}
.line.other{border-left-color:transparent;color:var(--other);font-size:13.5px;line-height:1.6}
.line.other .name{color:var(--other)}
.avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--line);
  background:var(--panel);margin-top:2px}
.avatar.ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;color:var(--panel)}
.line.other .avatar{flex-basis:28px;width:28px;height:28px}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:13px;letter-spacing:.06em;margin-bottom:1px}
.text{white-space:pre-wrap;word-break:break-word}
.line.nameless .text{padding-left:0}

/* ── secret ───────────────────────────────── */
.line.secret{background:
    repeating-linear-gradient(135deg,rgba(106,75,156,.055) 0 6px,transparent 6px 12px),var(--secret-bg);
  border-left:3px solid var(--secret);border-right:1px solid var(--secret-line);
  border-top:1px solid var(--secret-line);border-bottom:1px solid var(--secret-line);
  padding:11px 14px 11px 16px;margin-top:4px}
.seal{position:absolute;top:-1px;right:-1px;background:var(--secret);color:#fff;font-family:var(--mono);
  font-size:10px;letter-spacing:.22em;padding:2px 7px}
.line.secret .name{color:var(--secret)}
.target{font-family:var(--mono);font-size:10.5px;color:var(--secret);opacity:.8;letter-spacing:.05em}

/* ── scene / dice / system / info ─────────── */
.scene{margin:46px 0 32px;text-align:center}
.scene .idx{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted);display:block;margin-bottom:12px}
.scene .bar{display:flex;align-items:center;gap:18px}
.scene .bar::before,.scene .bar::after{content:"";flex:1;height:1px;background:var(--line)}
.scene .label{font-family:var(--serif);font-size:15px;letter-spacing:.5em;text-indent:.5em;color:var(--ink);
  flex:0 1 auto;max-width:70%}

.dice{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:13px;
  background:var(--dice-bg);border-left:3px solid var(--dice);padding:7px 12px;margin:6px 0}
.dice .who{color:var(--dice);font-weight:700;flex:0 0 auto}
.dice .expr{flex:1;word-break:break-all;color:#33414a}
.dice .res{font-weight:700;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.dice.sec{background:
    repeating-linear-gradient(135deg,rgba(106,75,156,.06) 0 6px,transparent 6px 12px),var(--secret-bg);
  border-left-color:var(--secret);border-top:1px dashed var(--secret-line);
  border-bottom:1px dashed var(--secret-line);border-right:1px dashed var(--secret-line)}
.dice.sec .who{color:var(--secret)}
.dice.sec .expr{color:#4a4159}
.dice .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#fff;background:var(--secret);
  padding:1px 6px;flex:0 0 auto;align-self:center}
.dice.sec .whisper{font-family:var(--mono);font-size:10px;color:var(--secret);opacity:.85;flex:0 0 auto}
.res.good{color:#0d6b3a}.res.bad{color:#a02020}.res.crit{color:#0b5fa5}.res.fumble{color:#6a0d0d}

.endmark{margin:64px 0 56px;text-align:center}
.endmark .rules{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:5px;margin-bottom:22px}
.endmark .word{font-family:var(--mono);font-size:11px;letter-spacing:.55em;text-indent:.55em;color:var(--muted);display:block}
.endmark .label{font-family:var(--serif);font-size:clamp(20px,3.4vw,26px);letter-spacing:.42em;text-indent:.42em;
  color:var(--ink);display:block;margin-top:10px}
.endmark .rules.b{margin:22px 0 0;border-top:1px solid var(--ink);border-bottom:2px solid var(--ink)}

.reward{margin:26px 0;padding:18px 22px;background:var(--reward-bg);
  border:1px solid var(--reward-line);box-shadow:inset 0 0 0 3px var(--reward-bg),inset 0 0 0 4px var(--reward-line)}
.reward .head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;
  border-bottom:1px dotted var(--reward-line);padding-bottom:7px}
.reward .badge{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--reward);
  border:1px solid var(--reward);padding:1px 7px}
.reward .ttl{font-family:var(--serif);font-size:16px;letter-spacing:.18em;color:var(--reward)}
.reward .text{white-space:pre-wrap;word-break:break-word;color:var(--ink)}

.note{margin:24px 0;background:var(--note-bg);border:1px solid var(--note-line);border-radius:var(--radius);
  position:relative;overflow:hidden}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--note);
  background-image:repeating-linear-gradient(0deg,var(--note) 0 8px,transparent 8px 12px)}
.note .cap{display:flex;align-items:center;gap:10px;padding:11px 20px 9px;border-bottom:1px dashed var(--note-line)}
.note .cap .mk{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:#fff;background:var(--note);padding:2px 8px}
.note .cap .who{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--note)}
.note .text{white-space:pre-wrap;word-break:break-word;padding:14px 22px 18px;color:var(--note-ink);
  font-family:var(--serif);line-height:2}

/* ── 目錄（右側固定面板）──────────────────── */
html{scroll-behavior:smooth}
#toc{margin:18px 0 8px}
.toc-box{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  transition:transform .22s ease,opacity .18s ease}
.toc-head{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
  font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:var(--ink);user-select:none}
.toc-head .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.toc-toggle{border:0;background:none;cursor:pointer;padding:0 2px;color:var(--muted);
  font-family:var(--mono);font-size:12px;line-height:1}
.toc-toggle:hover{color:var(--ink)}
/* 收合把手（收起後出現在右緣） */
.toc-tab{display:none;position:fixed;right:0;top:96px;z-index:16;cursor:pointer;
  border:1px solid var(--line);border-right:0;border-radius:var(--radius) 0 0 var(--radius);
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.2em;
  padding:11px 6px;writing-mode:vertical-rl;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.toc-tab:hover{background:var(--paper)}
/* 拖曳寬度的握把 */
.toc-grip{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;touch-action:none}
.toc-grip::before{content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:2px;height:26px;border-radius:2px;background:var(--line)}
.toc-grip:hover::before{background:var(--muted)}
body.tocdrag{user-select:none;cursor:col-resize}
.toc-list{padding:5px;display:flex;flex-direction:column;gap:1px}
.toc-list a{display:block;padding:3px 7px;border-radius:2px;text-decoration:none;color:var(--ink);
  border-left:2px solid transparent;line-height:1.35}
.toc-list a:hover{background:var(--paper);border-left-color:var(--ink)}
.toc-list a .k{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.18em;opacity:.8}
.toc-list a .t{display:block;font-size:12px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-list a.k-scene .k{color:var(--muted)}
.toc-list a.k-pro .k{color:var(--pro)}
.toc-list a.k-epi .k{color:var(--epi)}
.toc-list a.k-rwd .k{color:var(--reward)}
.toc-list a.k-pro:hover{border-left-color:var(--pro)}
.toc-list a.k-epi:hover{border-left-color:var(--epi)}
.toc-list a.k-rwd:hover{border-left-color:var(--reward)}
[data-anchor]{scroll-margin-top:96px}

/* 捲軸：項目過多時明顯提示可上下拖拉 */
.toc-list{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.toc-list::-webkit-scrollbar{width:9px}
.toc-list::-webkit-scrollbar-track{background:var(--paper);border-radius:9px}
.toc-list::-webkit-scrollbar-thumb{background:var(--muted);border-radius:9px;
  border:2px solid var(--panel)}
.toc-list::-webkit-scrollbar-thumb:hover{background:var(--ink)}

/* 寬螢幕：釘在右側，不隨捲動移動 */
@media (min-width:1220px){
  #toc{position:fixed;top:96px;right:22px;width:var(--tocw,208px);margin:0;z-index:15}
  .toc-box{box-shadow:0 1px 8px rgba(0,0,0,.06)}
  .toc-list{max-height:calc(100vh - 176px)}
  #toc.collapsed .toc-box{transform:translateX(calc(100% + 26px));opacity:0;pointer-events:none}
  #toc.collapsed .toc-tab{display:block}
}
/* 窄螢幕：回到內文流，避免蓋住團錄；不提供拖曳寬度 */
@media (max-width:1219px){
  .toc-list{max-height:46vh}
  .toc-grip{display:none}
  #toc.collapsed .toc-box{display:none}
  #toc.collapsed .toc-tab{display:inline-block;position:static;writing-mode:horizontal-tb;
    border-right:1px solid var(--line);border-radius:var(--radius);padding:6px 12px}
}

/* ── PC 隊伍資訊 ─────────────────────────── */
#pcs{margin:26px 0 8px}
.pc-section{border:1px solid var(--pc-line);border-radius:var(--radius);background:var(--panel)}
.pc-section>summary{list-style:none;cursor:pointer;padding:12px 18px;display:flex;align-items:center;gap:12px;
  font-family:var(--serif);font-size:15px;letter-spacing:.18em;color:var(--pc);
  border-bottom:1px solid transparent;user-select:none}
.pc-section[open]>summary{border-bottom-color:var(--pc-line)}
.pc-section>summary::-webkit-details-marker{display:none}
.pc-section>summary .tri{font-family:var(--mono);font-size:11px;transition:transform .15s;color:var(--pc)}
.pc-section[open]>summary .tri{transform:rotate(90deg)}
.pc-section>summary .n{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);margin-left:auto}

.pc-grid{padding:14px;display:grid;gap:14px}


.pc-card{border:1px solid var(--cline,var(--pc-line));border-radius:var(--radius);
  background:var(--cbg,var(--pc-bg));overflow:hidden}
.pc-card>summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:12px;
  padding:11px 15px;border-left:3px solid var(--c,var(--pc))}
.pc-card>summary::-webkit-details-marker{display:none}
.pc-card>summary .thumb{flex:0 0 40px;width:40px;height:40px;border-radius:4px;object-fit:cover;
  border:1px solid var(--pc-line);background:var(--panel)}
.pc-card>summary .thumb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:16px;color:#fff;background:var(--pc)}
.pc-card>summary .id{min-width:0}
.pc-card>summary .id .nm{font-family:var(--serif);font-size:16px;letter-spacing:.1em;color:var(--c,var(--pc));font-weight:700}
.pc-card>summary .id .sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-card>summary .tri{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--c,var(--pc));transition:transform .15s}
.pc-card[open]>summary .tri{transform:rotate(90deg)}

.pc-body{display:flex;gap:16px;padding:14px;border-top:1px dashed var(--cline,var(--pc-line));align-items:flex-start}
.pc-portrait{flex:0 0 150px;width:150px;border-radius:4px;border:1px solid var(--cline,var(--pc-line));
  background:var(--panel) center/cover;display:block}
.pc-portrait.ph{aspect-ratio:3/5;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:13px;color:var(--muted);text-align:center;padding:8px}
.pc-detail{flex:1;min-width:0}
.pc-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:10px;font-size:13px}
.pc-meta b{color:var(--c,var(--pc));font-weight:700;letter-spacing:.05em}
.pc-block{margin-top:12px}
.pc-block .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--c,var(--pc-accent));
  border-bottom:1px solid var(--cline,var(--pc-line));padding-bottom:3px;margin-bottom:8px}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px}
.pc-chip{font-size:12px;font-family:var(--mono);background:var(--panel);border:1px solid var(--cline,var(--pc-line));
  border-radius:3px;padding:2px 8px;white-space:nowrap}
.pc-chip .k{color:var(--muted);margin-right:5px}
.pc-chip .v{color:var(--ink);font-weight:700}
.pc-chip.skill .v{color:var(--c,var(--pc))}
.pc-items{font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap}
@media (max-width:560px){.pc-body{flex-direction:column}.pc-portrait{width:60%;max-width:180px;margin:0 auto}}

.battle{display:flex;align-items:center;gap:14px;margin:30px 0;padding:9px 16px;border-radius:var(--radius)}
.battle .en{font-family:var(--mono);font-size:10px;letter-spacing:.3em;flex:0 0 auto}
.battle .txt{font-family:var(--serif);font-size:15px;letter-spacing:.4em;text-indent:.4em;flex:0 0 auto}
.battle .ln{flex:1;height:1px}
.battle.start{background:
    repeating-linear-gradient(135deg,rgba(168,50,50,.10) 0 8px,transparent 8px 16px),var(--battle-bg);
  border-left:4px solid var(--battle);border-right:1px solid var(--battle)}
.battle.start .txt,.battle.start .en,.battle.start .mk{color:var(--battle)}
.battle.start .ln{background:linear-gradient(90deg,var(--battle),transparent);opacity:.4}
.battle.end{background:var(--battle-end-bg);border-left:4px solid var(--battle-end);
  border-right:1px solid var(--battle-end)}
.battle.end .txt,.battle.end .en,.battle.end .mk{color:var(--battle-end)}
.battle.end .ln{background:var(--battle-end);opacity:.3}
.battle .mk{font-size:15px;flex:0 0 auto}

.epilogue{margin:52px auto;max-width:74%;text-align:center;padding:18px 26px;background:var(--epi-bg);
  border:1px solid var(--epi-line);border-radius:2px;color:var(--epi)}
.epilogue .orn{font-size:17px;letter-spacing:.5em;text-indent:.5em;display:block;opacity:.85}
.epilogue .txt{font-family:var(--serif);font-style:italic;font-size:clamp(18px,3.2vw,23px);
  letter-spacing:.34em;text-indent:.34em;display:block;margin:8px 0}
.epilogue .en{font-family:var(--mono);font-size:10px;letter-spacing:.42em;text-indent:.42em;opacity:.75;display:block}
.epilogue.start{border-top:3px double var(--epi)}
.epilogue.end{border-bottom:3px double var(--epi)}

/* 前日談：與後日談對稱，改用晨青色調 */
.prologue{margin:52px auto;max-width:74%;text-align:center;padding:18px 26px;background:var(--pro-bg);
  border:1px solid var(--pro-line);border-radius:2px;color:var(--pro)}
.prologue .orn{font-size:16px;letter-spacing:.5em;text-indent:.5em;display:block;opacity:.85}
.prologue .txt{font-family:var(--serif);font-size:clamp(18px,3.2vw,23px);
  letter-spacing:.34em;text-indent:.34em;display:block;margin:8px 0}
.prologue .en{font-family:var(--mono);font-size:10px;letter-spacing:.42em;text-indent:.42em;opacity:.75;display:block}
.prologue.start{border-top:3px double var(--pro)}
.prologue.end{border-bottom:3px double var(--pro)}

/* 回合標示 */
.round{display:flex;align-items:center;gap:12px;margin:22px 0 14px}
.round .ln{flex:1;height:1px;background:var(--round);opacity:.28}
.round .pill{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:9px;padding:4px 15px;
  background:var(--round-bg);border:1px solid var(--round);border-radius:999px}
.round .pill .t{font-family:var(--serif);font-size:14px;letter-spacing:.2em;color:var(--round);font-weight:700}
.round .pill .n{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--round);opacity:.7}

/* 隱藏資訊：團務當下玩家看不到的幕後情報 */
.hidden-info{display:flex;align-items:flex-start;gap:12px;margin:10px 0;padding:9px 14px;font-size:13px;
  background:var(--hidden);border-left:3px solid var(--hidden-accent);border-radius:var(--radius);
  background-image:repeating-linear-gradient(135deg,rgba(157,143,196,.10) 0 7px,transparent 7px 14px)}
.hidden-info .mk{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--hidden);
  background:var(--hidden-accent);padding:2px 7px;border-radius:2px;flex:0 0 auto;
  line-height:1.4;margin-top:3px}
.hidden-info .lb{font-family:var(--mono);letter-spacing:.12em;color:var(--hidden-accent);

<script>
/*DATA_START*/let LOG = [];
let SPK = [];
let META = {"眉標": "CALL OF CTHULHU TRPG ／ SESSION LOG", "標題": "", "副標題": ""};
let PCS = [];/*DATA_END*/

/* ── CSV ─────────────────────────────────── */
function parseCSV(t){
  t = t.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
function toCSV(objs, cols){
  const esc=v=>{v=(v??'')+''; return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return '\uFEFF'+[cols.join(',')].concat(objs.map(o=>cols.map(c=>esc(o[c])).join(','))).join('\r\n');
}
function download(name, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

/* ── render ──────────────────────────────── */
const state={f:{main:1,other:1,info:1,secret:1,dice:1},who:'',q:''};
const spkMap=()=>Object.fromEntries(SPK.map(s=>[s['發言人'],s]));
const esc=s=>(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const CN_NUM='零一二三四五六七八九';
function cnNum(n){
  n=parseInt(n,10);
  if(isNaN(n)) return '';
  if(n<0) return String(n);
  if(n<=10) return n===10?'十':CN_NUM[n];
  if(n<20) return '十'+(n%10?CN_NUM[n%10]:'');
  if(n<100){ const t=Math.floor(n/10), o=n%10; return CN_NUM[t]+'十'+(o?CN_NUM[o]:''); }
  return String(n);
}
function lightenFor(hex,minL){
  let h=(hex||'').trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '';
  let r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const lum=()=>(0.299*r+0.587*g+0.114*b)/255;
  let guard=0;
  while(lum()<minL && guard++<24){ r=Math.round(r+(255-r)*0.18); g=Math.round(g+(255-g)*0.18); b=Math.round(b+(255-b)*0.18); }
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// 從內容開頭抓出 [ 名字 ]，回傳 [名字, 其餘內容]
function splitBracketName(text){
  const m=String(text||'').match(/^\s*[\[［]\s*([^\]］]{1,20}?)\s*[\]］]\s*/);
  return m ? [m[1].trim(), String(text).slice(m[0].length)] : ['', String(text||'')];
}
function roundNo(text){
  const s=String(text||'');
  const arrow=s.match(/(-?\d+)\s*(?:→|->|＞|=>)\s*(-?\d+)/);   // 「回合 : 1 → 2」取箭頭後
  if(arrow) return parseInt(arrow[2],10);
  const m=s.match(/(-?\d+)/);                                  // 否則取第一個數字
  return m?parseInt(m[1],10):null;
}
function resultClass(w){
  if(/決定性|大成功|critical/i.test(w)) return 'crit';
  if(/致命|大失敗|fumble/i.test(w)) return 'fumble';
  if(/成功|success/i.test(w)) return 'good';
  if(/失敗|failure/i.test(w)) return 'bad';
  return '';
}
function avatarHTML(s, cls, override){
  const url = (override && override.trim()) || (s && s['頭像網址']) || '';
  const nm  = (s && (s['顯示名稱']||s['發言人'])) || '';
  const col = (s && s['代表色']) || '#888888';
  if(url) return `<img class="avatar ${cls}" src="${esc(url)}" alt="${esc(nm)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'avatar ph ${cls}',style:'background:${col}'}))">`;
  if(!s) return '';
  return `<span class="avatar ph ${cls}" style="background:${esc(col)}"></span>`;
}

const TOC_KEY={scene:'SCENE',pro:'PROLOGUE',epi:'AFTER STORY',rwd:'REWARD'};
let tocOpen=true, tocWidth=0;   // tocWidth 僅存在本次瀏覽，重新開啟即回預設
function renderTOC(items){
  const host=document.getElementById('toc');
  if(!items || !items.length){ host.innerHTML=''; host.className=''; return; }
  const rows=items.map(it=>`<a href="#${it.id}" class="k-${it.kind}">
      <span class="k">${TOC_KEY[it.kind]||''}</span>
      <span class="t">${esc(it.label)}</span></a>`).join('');
  host.className = tocOpen ? '' : 'collapsed';
  if(tocWidth) host.style.setProperty('--tocw', tocWidth+'px'); else host.style.removeProperty('--tocw');
  host.innerHTML=`<div class="toc-box">
      <div class="toc-grip" title="拖曳調整寬度"></div>
      <div class="toc-head"><button class="toc-toggle" title="收起目錄">›</button>目錄<span class="n">${items.length} 項</span></div>
      <div class="toc-list">${rows}</div>
    </div>
    <button class="toc-tab" title="展開目錄">目錄 ‹</button>`;

  host.querySelector('.toc-toggle').onclick=()=>{ tocOpen=false; host.className='collapsed'; };
  host.querySelector('.toc-tab').onclick=()=>{ tocOpen=true; host.className=''; };

  const grip=host.querySelector('.toc-grip');
  grip.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    const startX=ev.clientX, startW=host.getBoundingClientRect().width;
    grip.setPointerCapture(ev.pointerId);
    document.body.classList.add('tocdrag');
    const move=e=>{
      const w=Math.min(460, Math.max(140, startW-(e.clientX-startX)));  // 往左拖變寬
      tocWidth=Math.round(w);
      host.style.setProperty('--tocw', tocWidth+'px');
    };
    const up=()=>{
      grip.removeEventListener('pointermove',move);
      grip.removeEventListener('pointerup',up);
      document.body.classList.remove('tocdrag');
    };
    grip.addEventListener('pointermove',move);
    grip.addEventListener('pointerup',up);
  });
}

function render(){
  const M=spkMap(), out=[], toc=[]; let shown=0, sceneNo=0, prevSecret='', anchorNo=0;
  const anchor=(kind,label)=>{ const id='sec-'+(++anchorNo); toc.push({id,kind,label}); return id; };
  for(const r of LOG){
    const type=r['類型']||'talk', ch=(r['頻道']||'main').trim();
    const isHO = ch!=='secret' && /ho/i.test(ch);   // 非 secret 但名稱含 HO（不分大小寫）
    const secTarget = isHO ? ch : (r['秘匿對象']||'');  // HO 的秘匿對象＝頻道名
    const kind = (type==='dice')?'dice':(type==='info'||ch==='info')?'info':(ch==='secret'||isHO)?'secret':ch;
    if(['scene','system','end','reward','note','battle_start','battle_end','epilogue_start','epilogue_end',
        'prologue_start','prologue_end','round','hidden','image'].includes(type)){ /* 永遠顯示，作為結構標記 */ }
    else if(!state.f[kind]) continue;
    else if(kind==='dice' && (ch==='secret'||isHO) && !state.f.secret) continue;
    if(state.who && r['發言人']!==state.who && type!=='scene') continue;
    if(state.q && !(r['內容']||'').includes(state.q) && !(r['發言人']||'').includes(state.q)) continue;
    shown++;

    if(type==='scene'){
      sceneNo++;
      const sid=anchor('scene',`SCENE ${String(sceneNo).padStart(2,'0')}　${r['內容']||''}`.trim());
      out.push(`<section class="scene" id="${sid}" data-anchor><span class="idx">SCENE ${String(sceneNo).padStart(2,'0')}</span>
        <div class="bar"><span class="label">${esc(r['內容']||'◆')}</span></div></section>`);
      continue;
    }
    if(type==='battle_start'){
      out.push(`<section class="battle start"><span class="mk">⚔</span>
        <span class="txt">${esc(r['內容']||'戰鬥開始')}</span>
        <span class="en">BATTLE START</span><span class="ln"></span></section>`);
      continue;
    }
    if(type==='battle_end'){
      out.push(`<section class="battle end"><span class="mk">▣</span>
        <span class="txt">${esc(r['內容']||'戰鬥結束')}</span>
        <span class="en">BATTLE END</span><span class="ln"></span></section>`);
      continue;
    }
    if(type==='epilogue_start'){
      const eid=anchor('epi', r['內容']||'後日談');
      out.push(`<section class="epilogue start" id="${eid}" data-anchor><span class="orn">❧</span>
        <span class="txt">${esc(r['內容']||'後日談')}</span>
        <span class="en">AFTER STORY</span></section>`);
      continue;
    }
    if(type==='epilogue_end'){
      out.push(`<section class="epilogue end"><span class="txt">${esc(r['內容']||'後日談　完')}</span>
        <span class="en">AFTER STORY ／ END</span><span class="orn">❦</span></section>`);
      continue;
    }
    if(type==='prologue_start'){
      const pid=anchor('pro', r['內容']||'前日談開始');
      out.push(`<section class="prologue start" id="${pid}" data-anchor><span class="orn">❖</span>
        <span class="txt">${esc(r['內容']||'前日談開始')}</span>
        <span class="en">PROLOGUE</span></section>`);
      continue;
    }
    if(type==='prologue_end'){
      out.push(`<section class="prologue end"><span class="txt">${esc(r['內容']||'前日談結束')}</span>
        <span class="en">PROLOGUE ／ END</span><span class="orn">❖</span></section>`);
      continue;
    }
    if(type==='round'){
      const no=roundNo(r['內容']);
      const label=(no!==null&&!isNaN(no))?`第${cnNum(no)}回合`:(String(r['內容']||'').trim()||'回合');
      out.push(`<section class="round"><span class="ln"></span>
        <span class="pill"><span class="t">${esc(label)}</span>
        ${(no!==null&&!isNaN(no))?`<span class="n">ROUND ${String(no).padStart(2,'0')}</span>`:''}</span>
        <span class="ln"></span></section>`);
      continue;
    }
    if(type==='image'){
      const src=(r['頭像']||r['內容']||'').trim();   // 圖片網址：優先取「頭像」欄，其次「內容」
      const cap=(r['頭像']&&r['內容'])?r['內容'].trim():(r['發言人']||'').trim();
      out.push(`<figure class="figure">
        ${src?`<img src="${esc(src)}" alt="${esc(cap)}" data-full="${esc(src)}" data-cap="${esc(cap)}"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'圖片無法載入：'+this.getAttribute('src')}))">`
          :`<div class="ph">在「頭像」或「內容」欄填圖片網址</div>`}
        ${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`);
      continue;
    }
    if(type==='hidden'){
      let hn=r['發言人']||'', hb=r['內容']||'';
      if(!hn){ const sp=splitBracketName(hb); hn=sp[0]; hb=sp[1]; }
      const hc=lightenFor((M[hn]&&M[hn]['代表色'])||'',0.62);
      out.push(`<div class="hidden-info"><span class="mk">HIDDEN</span>
        ${hn?`<span class="lb" style="${hc?`color:${esc(hc)}`:''}">${esc((M[hn]&&M[hn]['顯示名稱'])||hn)}</span>`:''}
        <span class="tx">${esc(hb)}</span></div>`);
      continue;
    }
    if(type==='system'){
      let nm=r['發言人']||'', body=r['內容']||'';
      if(!nm){ const sp=splitBracketName(body); nm=sp[0]; body=sp[1]; }
      const sc=(M[nm]&&M[nm]['代表色'])||'';
      out.push(`<div class="sys">
        ${nm?`<span class="lb" style="${sc?`color:${esc(sc)}`:''}">${esc((M[nm]&&M[nm]['顯示名稱'])||nm)}</span>`:''}
        <span class="tx">${esc(body)}</span></div>`);
      continue;
    }
    if(type==='end'){
      out.push(`<section class="endmark"><div class="rules"></div>
        <span class="word">SESSION END</span>
        ${r['內容']?`<span class="label">${esc(r['內容'])}</span>`:''}
        <div class="rules b"></div></section>`);
      continue;
    }
    if(type==='reward'){
      const rid=anchor('rwd', r['發言人']||'通關報酬');
      out.push(`<section class="reward" id="${rid}" data-anchor><div class="head">
        <span class="badge">REWARD</span>
        <span class="ttl">${esc(r['發言人']||'通關報酬')}</span></div>
        <div class="text">${esc(r['內容'])}</div></section>`);
      continue;
    }
    if(type==='note'){
      out.push(`<section class="note"><div class="cap">
        <span class="mk">COMMENT</span>
        <span class="who">${esc(r['發言人']||'心得')}</span></div>
        <div class="text">${esc(r['內容'])}</div></section>`);
      continue;
    }

    const s=M[r['發言人']];
    if(type==='dice'){
      const sec = ch==='secret'||isHO;
      const parts=(r['內容']||'').split(/＞|=>/).map(x=>x.trim());
      const last=parts.length>1?parts.pop():'';
      out.push(`<div class="dice ${sec?'sec':''}">
        ${sec?`<span class="tag">秘匿</span>`:''}
        ${r['發言人']?`<span class="who">${esc((s&&s['顯示名稱'])||r['發言人'])}</span>`:''}
        <span class="expr">${esc(parts.join(' ＞ '))}</span>
        ${sec&&secTarget?`<span class="whisper">${esc(secTarget)}</span>`:''}
        ${last?`<span class="res ${resultClass(last)}">${esc(last)}</span>`:''}</div>`);
      continue;
    }

    const pair = (secTarget||'秘匿').replace(/^(秘匿|秘密)/,'');
    const runStart = kind==='secret' && prevSecret !== pair;
    prevSecret = kind==='secret' ? pair : '';
    const nameless=!r['發言人'];
    const color=(s&&s['代表色'])||'';
    out.push(`<div class="line ${kind} ${nameless?'nameless':''}">
      ${runStart?`<span class="seal">秘匿</span>`:''}
      ${avatarHTML(s,'',r['頭像'])}
      <div class="body">
        ${r['發言人']?`<div class="name" style="${color?`color:${esc(color)}`:''}">${esc((s&&s['顯示名稱'])||r['發言人'])}
          ${kind==='secret'&&secTarget?`<span class="target">→ ${esc(secTarget)}</span>`:''}</div>`:''}
        <div class="text">${esc(r['內容'])}</div>
      </div></div>`);
  }
  document.getElementById('log').innerHTML=out.join('');
  renderTOC(toc);
  document.getElementById('count').textContent=`${shown} / ${LOG.length} 行`;
}

const TITLE_ROW = r => (r['類型']||'')==='title';

const PC_COLS = ['序','PC','PL','職業','年齡','性別','立繪','數值','技能','持有物品','備註'];
function statPairs(line){
  line = line.trim(); if(!line) return [];
  if(line.indexOf('：')>-1 || line.indexOf(':')>-1){
    return line.split(/[\s\u3000]+/).filter(Boolean).map(p=>{
      const m=p.split(/[：:]/); return [m[0], m.slice(1).join(':')];
    });
  }
  const tk=line.split(/[\s\u3000]+/).filter(Boolean), out=[];
  for(let i=0;i<tk.length;i+=2) out.push([tk[i], tk[i+1]||'']);
  return out;
}
function chipRow(line, cls){
  const ch = statPairs(line).map(([k,v])=>
    `<span class="pc-chip ${cls||''}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span>`).join('');
  return ch ? `<div class="pc-chips">${ch}</div>` : '';
}
function pcPortrait(p){
  if(p['立繪']) return `<img class="pc-portrait" src="${esc(p['立繪'])}" alt="${esc(p['PC']||'')}"
    onerror="this.classList.add('ph');this.removeAttribute('src');this.textContent='立繪\n(圖片無法載入)';">`;
  return `<div class="pc-portrait ph">立繪<br>（在 pcs.csv 的「立繪」欄填圖片網址）</div>`;
}
function pcThumb(p){
  if(p['立繪']) return `<img class="thumb" src="${esc(p['立繪'])}" alt=""
    onerror="this.classList.add('ph');this.removeAttribute('src');this.textContent='${esc((p['PC']||'?').slice(0,1))}';">`;
  return `<span class="thumb ph">${esc((p['PC']||'?').slice(0,1))}</span>`;
}
function hexRGBA(hex,a){
  let h=(hex||'').trim().replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return '';
  const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function renderPCs(){
  const host=document.getElementById('pcs');
  const SM=spkMap();
  const list=(PCS||[]).filter(p=>p && (p['PC']||p['PL']||p['數值']||p['技能']||p['立繪']));
  if(!list.length){ host.innerHTML=''; return; }
  const cards=list.map(p=>{
    const sub=p['PL']?'PL '+p['PL']:'';
    const stat=(p['數值']||'').split('\n').map(l=>chipRow(l,'')).filter(Boolean).join('');
    const skill=(p['技能']||'').split('\n').map(l=>chipRow(l,'skill')).filter(Boolean).join('');
    const items=(p['持有物品']||'').trim();
    const note=(p['備註']||'').trim();
    const col=(SM[p['PC']]&&SM[p['PC']]['代表色'])||'';
    const bg=hexRGBA(col,0.09), ln=hexRGBA(col,0.38);
    const cstyle=col?`style="--c:${esc(col)};${bg?`--cbg:${bg};`:''}${ln?`--cline:${ln};`:''}"`:'';
    return `<details class="pc-card" open ${cstyle}>
      <summary>
        <span class="id"><span class="nm">${esc(p['PC']||'（未命名）')}</span>
          ${sub?`<span class="sub">${esc(sub)}</span>`:''}</span>
        <span class="tri">▶</span></summary>
      <div class="pc-body">
        ${pcPortrait(p)}
        <div class="pc-detail">
          <div class="pc-meta">
            ${p['職業']?`<span><b>職業</b> ${esc(p['職業'])}</span>`:''}
            ${p['年齡']?`<span><b>年齡</b> ${esc(p['年齡'])}</span>`:''}
            ${p['性別']?`<span><b>性別</b> ${esc(p['性別'])}</span>`:''}
          </div>
          ${stat?`<div class="pc-block"><div class="h">STATUS</div>${stat}</div>`:''}
          ${skill?`<div class="pc-block"><div class="h">SKILLS</div>${skill}</div>`:''}
          ${items?`<div class="pc-block"><div class="h">ITEMS</div><div class="pc-items">${esc(items)}</div></div>`:''}
          ${note?`<div class="pc-block"><div class="h">NOTE</div><div class="pc-items">${esc(note)}</div></div>`:''}
        </div>
      </div></details>`;
  }).join('');
  host.innerHTML = `<details class="pc-section" open>
    <summary><span class="tri">▶</span>PC資訊<span class="n">${list.length} 名探索者</span></summary>
    <div class="pc-grid">${cards}</div>
  </details>`;
}

function applyMeta(forExport){
  document.getElementById('eyebrow').textContent = META['眉標']||'';
  document.getElementById('title').textContent   = META['標題']||'';
  document.getElementById('subtitle').textContent= META['副標題']||'';
  document.title = META['標題'] || '神貓卓團錄編輯器1.0版';
  document.getElementById('meta').textContent =
    (EDITABLE && !forExport) ? `共 ${LOG.filter(r=>!TITLE_ROW(r)).length} 行 ／ ${SPK.length} 位發言人` : '';
}
function pullTitleRows(){                       // CSV 裡的 title 列 → 標題設定
  const t = LOG.find(TITLE_ROW);
  if(t){
    META['標題']   = t['內容'] || META['標題'];
    META['副標題'] = t['備註'] || '';
    META['眉標']   = t['秘匿對象'] || META['眉標'];
  }
  LOG = LOG.filter(r=>!TITLE_ROW(r));
}
function logForCSV(){                           // 匯出時把標題寫回第一列
  return [{'序號':0,'類型':'title','頻道':'','秘匿對象':META['眉標']||'','發言人':'',
           '頭像':'','內容':META['標題']||'','備註':META['副標題']||''}].concat(LOG);
}
function fillSpeakers(){
  const sel=document.getElementById('who'), cur=sel.value;

    SPK.map(s=>`<option value="${esc(s['發言人'])}">${esc(s['顯示名稱']||s['發言人'])}</option>`).join('');
  sel.value=cur;
  applyMeta();
}

/* ── 原始 ccfolia LOG.html → CSV 資料 ─────── */
function convertLog(htmlText){
  const doc = new DOMParser().parseFromString(htmlText,'text/html');
  const grab = el => {
    const tmp = document.createElement('div');
    tmp.innerHTML = el.innerHTML.replace(/<br\s*\/?>/gi,'\n');
    return (tmp.textContent||'').replace(/\u00a0/g,' ').trim();
  };
  const DICE = /(CCB?<?=|choice\[|\d+[dDbB]\d+|1D100)/;
  const SEP  = /^[\s\u3000─—–\-=＝_]*$/;
  const rows = [], colors = {};

  [...doc.querySelectorAll('p')].forEach((p,i)=>{
    const spans = [...p.querySelectorAll('span')];
    if(!spans.length) return;
    const cm = /color\s*:\s*([^;"']+)/i.exec(p.getAttribute('style')||'');
    let color = cm ? cm[1].trim() : ((p.style && p.style.color) || '#888888');
    const rgb = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(color);
    if(rgb) color = '#'+[1,2,3].map(i=>(+rgb[i]).toString(16).padStart(2,'0')).join('');
    if(/^#[0-9a-f]{3}$/i.test(color)) color = '#'+color.slice(1).split('').map(c=>c+c).join('');
    color = color.toLowerCase();
    const tag  = spans[0] ? grab(spans[0]) : '';
    const name = spans[1] ? grab(spans[1]) : '';
    const text = spans[2] ? grab(spans[2]) : (spans[1] ? '' : grab(spans[0]));
    if(!(tag||name||text)) return;

    const inner = tag.replace(/^\[|\]$/g,'');
    let channel='other', target='';
    if(/^(秘匿|秘密)/.test(inner)){ channel='secret'; target=inner; }
    else if(['main','other','info'].includes(inner)){ channel=inner; }
    else if(/ho/i.test(inner)){ channel=inner; }   // 標籤含 HO → 直接當成 HO 頻道名
    else if(inner){ target=inner; }

    const flat = text.replace(/\n/g,'');
    let type='talk', content=text, sysName='';
    if(name==='system'){
      type=/回合/.test(text) ? 'round' : 'system';
      const m=text.match(/^\s*[\[［]\s*([^\]］]{1,20}?)\s*[\]］]\s*/);
      if(m){ sysName=m[1].trim(); content=text.slice(m[0].length); }
    }
    else if(SEP.test(flat) || (flat.split('─').length-1)>=4){
      type='scene';
      content = flat.replace(/[\s\u3000─—–\-]+/g,' ').trim();
    }
    else if(DICE.test(text) && (text.includes('＞')||text.includes('>'))){ type='dice'; }
    else if(channel==='info'){ type='info'; }

    const cname = name==='system' ? sysName : name;
    if(cname){ (colors[cname]=colors[cname]||{})[color]=(colors[cname][color]||0)+1; }
    rows.push({'序號':i+1,'類型':type,'頻道':channel,'秘匿對象':target,
               '發言人':name==='system'?sysName:name,'頭像':'','內容':content,'備註':''});
  });

  const prev = Object.fromEntries(SPK.map(s=>[s['發言人'],s]));   // 保留既有頭像設定
  const spk = Object.keys(colors).map(n=>({
    '發言人':n,
    '顯示名稱':(prev[n]&&prev[n]['顯示名稱'])||n,
    '頭像網址':(prev[n]&&prev[n]['頭像網址'])||'',
    '代表色':Object.entries(colors[n]).sort((a,b)=>b[1]-a[1])[0][0]
  }));
  return {rows, spk};
}

document.getElementById('fHtml').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const {rows,spk}=convertLog(rd.result);
    if(!rows.length){ alert('這個檔案裡沒有找到對話行。請確認是 ccfolia 匯出的 LOG.html。'); return; }
    LOG=rows; SPK=spk; applyMeta(); fillSpeakers(); render(); renderPCs();
    download('log.csv', toCSV(logForCSV(),['序號','類型','頻道','秘匿對象','發言人','頭像','內容','備註']));
    download('speakers.csv', toCSV(SPK,['發言人','顯示名稱','頭像網址','代表色']));
  };
  rd.readAsText(f,'utf-8');
  e.target.value='';
};

document.getElementById('expHtml').onclick=()=>{
  const logEl=document.getElementById('log'), edEl=document.getElementById('editor'),
        whoEl=document.getElementById('who'), qEl=document.getElementById('q'),
        chips=[...document.querySelectorAll('.chip[data-f]')];
  const keepLog=logEl.innerHTML, keepEd=edEl.innerHTML, keepWho=whoEl.value, keepQ=qEl.value,
        keepChips=chips.map(c=>c.getAttribute('aria-pressed'));
  // 匯出乾淨版本：清掉畫面上的暫存狀態，只留資料
  const heads=['eyebrow','title','subtitle'].map(id=>document.getElementById(id));
  logEl.innerHTML=''; edEl.innerHTML=''; whoEl.selectedIndex=0; qEl.setAttribute('value','');
  chips.forEach(c=>c.setAttribute('aria-pressed','true'));
  heads.forEach(e=>{e.removeAttribute('contenteditable');e.removeAttribute('data-ph');});
  applyMeta(true);
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  logEl.innerHTML=keepLog; edEl.innerHTML=keepEd; whoEl.value=keepWho;
  qEl.setAttribute('value',keepQ); chips.forEach((c,i)=>c.setAttribute('aria-pressed',keepChips[i]));
  heads.forEach((e,i)=>{e.setAttribute('contenteditable','plaintext-only');
    e.setAttribute('data-ph',['CALL OF CTHULHU TRPG','（標題）','（副標題，可留空）'][i]);});
  applyMeta();

  const a=html.indexOf('/*DATA_START*/'), b=html.indexOf('/*DATA_END*/');
  if(a<0||b<0){ alert('匯出失敗：找不到資料區塊，請改用原始檔重新載入 CSV。'); return; }
  const j=o=>JSON.stringify(o).replace(/<\//g,'<\\/');
  const data='/*DATA_START*/let LOG = '+j(LOG)+';\nlet SPK = '+j(SPK)+';\nlet META = '+j(META)+';\nlet PCS = '+j(PCS)+';';
  html = html.slice(0,a) + data + html.slice(b);
  // 匯出版為純閱讀：移除所有編輯用介面
  const M1='<!'+'--EDIT_START-->', M2='<!'+'--EDIT_END-->';
  html = html.replace(new RegExp(M1+'[\\s\\S]*?'+M2,'g'),'');

  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const dateStr=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
  // 標題文字 + 今天日期；標題留空時退回 log
  const rawTitle=(META['標題']||'').trim();
  const safeTitle=rawTitle.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
  const name=(safeTitle?safeTitle+'_':'log_')+dateStr+'.html';
  const el=document.createElement('a');
  el.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  el.download=name; el.click(); URL.revokeObjectURL(el.href);
};

[['eyebrow','眉標','CALL OF CTHULHU TRPG'],['title','標題','（標題）'],['subtitle','副標題','（副標題，可留空）']]
