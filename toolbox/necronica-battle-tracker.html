<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NC 用戰鬥流程輔助工具</title><style>
/* ===== NC 戰鬥流程輔助工具 — Necronica gothic dark ===== */
:root{
  --bg:#131019; --panel:#1b1824; --panel2:#221f2e; --panel3:#2a2637;
  --row:#201d2b; --row2:#25222f; --rowhead:#2f2942;
  --line:#3a3549; --line-soft:#2c2839;
  --ink:#ece7f4; --ink-dim:#a79fbb; --ink-faint:#726a87;
  --accent:#c0424f; --accent-soft:#8a4450; --amethyst:#9a7fc0;
  --danger:#7b1f2c; --danger-bg:#2c1319; --danger-ink:#e0808b;
  --ok:#5aa886; --warn:#c9a15a;
  /* battlefield bands: 奈落(深/危)→樂園(淺/安) */
  --b-naraku:#171320; --b-jigoku:#211a2a; --b-rengoku:#2b2436;
  --b-hanazono:#372f44; --b-rakuen:#463c56;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.serif{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PingFang TC",serif;}
button{font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;border:1px solid var(--line);
  background:var(--panel3);border-radius:6px;padding:5px 10px;transition:.12s}
button:hover{border-color:var(--amethyst);background:#332e44}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#7a3b6e,#5e2f57);border-color:#8a4d80}
button.primary:hover{background:linear-gradient(180deg,#8a4880,#6c3665)}
button.danger{border-color:var(--danger)}
button.ghost{background:transparent}
input,select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amethyst);outline-offset:1px}
::selection{background:#5e2f57;color:#fff}

/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#3a3549;border-radius:5px}
*::-webkit-scrollbar-thumb:hover{background:#4a4560}
*::-webkit-scrollbar-track{background:transparent}

/* ============ APP GRID ============ */
.app{
  height:100vh; display:grid;
  grid-template-columns:266px 1fr;
  grid-template-rows:auto 1fr;
  grid-template-areas:"top top" "left right";
}
/* --- top bar --- */
.topbar{grid-area:top;display:flex;align-items:center;gap:12px;
  padding:8px 14px;background:linear-gradient(180deg,#221a2b,#171320);
  border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand .t1{font-size:15px;font-weight:700;letter-spacing:.5px}
.brand .t2{font-size:13px;color:var(--ink-dim)}
.brand .t1 b{color:var(--accent);font-weight:800}
.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}

/* --- left flow panel --- */
.left{grid-area:left;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px}
.section-title{font-size:13px;font-weight:700;color:var(--amethyst);letter-spacing:1px;
  margin:2px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line)}
.summary{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;margin-bottom:14px}
.summary .line{display:flex;justify-content:space-between;font-size:13px;margin:2px 0}
.summary .num{font-weight:700;color:var(--ink)}
.summary .num.ally{color:var(--ok)} .summary .num.foe{color:var(--accent)}

.phase{margin-bottom:10px}
.phase-h{font-size:13px;font-weight:700;color:var(--ink);background:var(--rowhead);
  border:1px solid var(--line);border-left:3px solid var(--amethyst);
  border-radius:5px;padding:4px 9px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.phase-h .tag{font-size:13px;color:var(--ink-faint);font-weight:400;margin-left:auto}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px 6px;border-radius:5px;cursor:pointer}
.chk:hover{background:var(--panel2)}
.chk input{margin-top:2px;flex:0 0 auto}
.chk.done span{color:var(--ink-faint);text-decoration:line-through}
.chk .mk{font-size:13px;color:var(--warn);font-weight:700}
.note{font-size:13px;color:var(--ink-faint);margin:3px 0 8px;padding-left:2px;font-style:italic}

.cost-box{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;margin-top:4px}
.cost-row{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line-soft)}
.cost-row:last-child{border-bottom:0}
.cost-row .nm{font-weight:600}
.cost-row .calc{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.cost-row .calc b{color:var(--ink)}
.cost-row .calc .c{color:var(--accent)}
.cost-row .calc .r{color:var(--ok);font-weight:700}
.cost-hint{font-size:13px;color:var(--ink-faint);margin-top:6px}

/* --- right column --- */
.right{grid-area:right;display:flex;flex-direction:column;min-width:0;min-height:0}

/* battlefield toolbar */
.bf-toolbar{display:flex;align-items:center;gap:10px;padding:7px 12px;
  background:linear-gradient(180deg,#1e1b27,#171320);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:20px;padding:3px 12px;font-size:13px}
.pill b{font-size:15px;color:var(--warn);font-weight:800;font-variant-numeric:tabular-nums}
.pill.round b{color:var(--amethyst)}
.pill .lbl{color:var(--ink-dim)}
.bf-toolbar .spacer{margin-left:auto}

/* battlefield body: enemy | grid | ally */
.bf{display:grid;grid-template-columns:262px 1fr 270px;gap:0;
  height:332px;flex:0 0 auto;min-height:0;
  background:radial-gradient(120% 100% at 50% 0,#1a1622,#120f18)}
/* draggable splitter between battlefield & unit-detail */
.splitter{flex:0 0 9px;height:9px;cursor:row-resize;background:linear-gradient(180deg,#242030,#17131f);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
.splitter::before{content:"";width:52px;height:3px;border-radius:2px;background:var(--line-soft)}
.splitter:hover::before,.splitter.drag::before{background:var(--amethyst)}
.side-col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.side-col.ally{border-right:0;border-left:1px solid var(--line)}
.side-head{font-size:13px;font-weight:700;letter-spacing:1px;text-align:center;padding:5px 4px;
  background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto}
.side-head.foe{color:var(--accent)} .side-head.ally{color:var(--ok)}
.side-list{overflow-y:auto;padding:6px 6px 10px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}

/* unit mini-card */
.ucard{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:6px;position:relative}
.ucard.sel{border-color:var(--amethyst);box-shadow:0 0 0 1px var(--amethyst) inset}
.ucard.mad{border-color:var(--accent)}
.ucard .top{display:flex;align-items:center;gap:6px}
.avatar{width:30px;height:30px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;overflow:hidden;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.15)}
.ucard .nm{font-size:13px;font-weight:700;line-height:1.15;cursor:pointer;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .nm:hover{color:var(--amethyst)}
.ucard .kind{font-size:13px;color:var(--ink-faint)}
.ucard .kind.chishi{color:var(--amethyst)} .ucard .kind.kaibutsu{color:var(--accent-soft)}
.pcounts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.pc{font-size:13px;background:var(--panel3);border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;
  color:var(--ink-dim);font-variant-numeric:tabular-nums}
.pc b{color:var(--ink)}
.pc.zero b{color:var(--danger-ink)}
.uctrl{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.uctrl .av{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 3px}
.uctrl .av label{font-size:13px;color:var(--ink-faint)}
.uctrl .av input{width:38px;padding:1px 3px;text-align:center;font-variant-numeric:tabular-nums}
.uctrl select{padding:2px 4px;font-size:13px}
/* 單列排版：頭 手 軀幹 腳 行動值 位置 發狂 同一行（必要時換行） */
.uline{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.uline .av{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.uline .av label{font-size:13px;color:var(--ink-faint)}
.uline .av input{width:42px;padding:1px 3px;text-align:center;font-variant-numeric:tabular-nums}
.uline select{padding:2px 5px;font-size:13px}
.ucard.dismantled{border-color:#5a5566;background:#1d1a24}
.ucard.dismantled .avatar{filter:grayscale(.85) brightness(.75)}
.status-dismantled{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1px;color:#fff;
  background:linear-gradient(180deg,#4b4552,#332f3c);border:1px solid #6a6478;border-radius:5px;
  padding:1px 8px;margin-top:5px}
.mini{padding:1px 6px;font-size:13px;line-height:1.5;border-radius:5px}
.mini.mad{border-color:var(--accent);color:var(--danger-ink)}
.mini.mad.on{background:#3a1620;color:#fff}
.rowbtns{display:flex;gap:3px;margin-left:auto}
.mad-note{font-size:13px;color:var(--danger-ink);margin-top:4px;line-height:1.3}
.side-empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:14px 6px;font-style:italic}

/* grid */
.grid-wrap{overflow:auto;position:relative;background:var(--panel)}
.grid{display:grid;position:relative;width:max-content;margin:0 auto}
.rcell{font-size:13px;text-align:center;color:var(--ink-dim);font-variant-numeric:tabular-nums;
  padding:3px 0;background:var(--panel2);position:sticky;top:0;z-index:6;border-bottom:1px solid var(--line);
  border-left:1px solid var(--line-soft)}
.rcell.cur{color:var(--warn);font-weight:800;background:#332a1a}
.rcell.dead{color:var(--danger-ink);background:var(--danger-bg)}
.rcell.corner{position:sticky;left:0;z-index:8;background:var(--panel3)}
.blabel{position:sticky;left:0;z-index:5;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:upright;font-size:17px;font-weight:700;letter-spacing:3px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft);min-width:34px}
.blabel small{writing-mode:horizontal-tb;font-size:13px;color:var(--ink-faint);margin-top:6px;letter-spacing:0;font-weight:400}
.cell{border-left:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  min-height:52px;padding:3px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;justify-content:center;position:relative}
.cell.dead{background:var(--danger-bg)}
.cell.dead:hover{background:#3a1820}
.cell.curcol{box-shadow:inset 0 0 0 1px rgba(201,161,90,.35)}
.b-naraku{background:var(--b-naraku)} .b-jigoku{background:var(--b-jigoku)}
.b-rengoku{background:var(--b-rengoku)} .b-hanazono{background:var(--b-hanazono)}
.b-rakuen{background:var(--b-rakuen)}
/* unit token on grid */
.token{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;background-size:cover;background-position:center;
  border:1.5px solid #fff8;cursor:pointer;position:relative}
.token.foe{border-color:#c0424fcc}
.token.ally{border-color:#5aa886cc}
.token.sel{outline:2px solid var(--warn);outline-offset:1px}
.token.dismantled{filter:grayscale(1) brightness(.6);border-color:#7a7488}
.token.dismantled::before{content:"解";position:absolute;bottom:-7px;left:-7px;background:#4b4552;color:#fff;
  font-size:13px;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;border:1px solid #fff6}
.token.mad::after{content:"狂";position:absolute;top:-7px;right:-7px;background:var(--accent);color:#fff;
  font-size:13px;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;border:1px solid #fff6}

/* ============ bottom detail ============ */
.bottom{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.tabs{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto;align-items:stretch}
.tab{padding:7px 18px;font-size:13px;font-weight:700;color:var(--ink-dim);background:transparent;border:0;
  border-right:1px solid var(--line-soft);border-radius:0;position:relative}
.tab.active{color:var(--ink);background:var(--panel)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--amethyst)}
.tab.foe.active::after{background:var(--accent)}
.unit-chips{display:flex;gap:6px;padding:7px 10px;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--line-soft);background:var(--panel2)}
.chip{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border:1px solid var(--line);border-radius:20px;
  background:var(--panel3);white-space:nowrap;font-size:13px}
.chip.active{border-color:var(--amethyst);background:#332e44}
.chip .ca{width:20px;height:20px;border-radius:5px;font-size:13px}
.chip-x{padding:0;width:18px;height:18px;line-height:1;font-size:14px;border-radius:50%;
  background:transparent;border:1px solid var(--line);color:var(--ink-faint);margin-left:2px;flex:0 0 auto}
.chip-x:hover{border-color:var(--accent);color:#fff;background:var(--danger)}
.detail{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 20px}
.usheet-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.usheet-head .avatar{width:46px;height:46px;border-radius:9px;font-size:20px}
.usheet-head .info .n{font-size:15px;font-weight:800}
.usheet-head .info .sub{font-size:13px;color:var(--ink-dim);margin-top:1px}
.usheet-head .stat{margin-left:auto;text-align:right}
.usheet-head .stat .k{font-size:13px;color:var(--ink-faint)}
.usheet-head .stat .v{font-size:19px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}

.blk{margin-bottom:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.blk-h{display:flex;align-items:center;background:var(--rowhead);padding:5px 10px;font-size:13px;font-weight:700}
.blk-h .bignum{margin-left:auto;font-size:13px;color:var(--ink-dim)}
.blk-h .bignum b{color:var(--warn);font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:13px;font-weight:600;color:var(--ink-faint);text-align:left;padding:4px 8px;
  background:var(--panel2);border-bottom:1px solid var(--line-soft)}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.dmg td{background:var(--danger-bg);color:var(--ink-faint)}
.tbl tr.dmg .nm{text-decoration:line-through}
.tbl tr.used-on td{background:#241f33}
.tbl .c-chk{width:34px;text-align:center}
.tbl .c-nm{width:120px}
.tbl .c-tm{width:64px}.tbl .c-co{width:52px}.tbl .c-rg{width:56px}.tbl .c-lv{width:96px}
.tbl .nm{font-weight:700}
.tbl .tag{font-size:13px;color:var(--warn)}
.tbl .ef{color:var(--ink-dim);line-height:1.4}
.tbl .lv{color:var(--ink-faint);font-size:13px}
.tbl .co b{color:var(--accent)}
.tbl input[type=checkbox]{cursor:pointer}
.empty-blk{padding:8px 10px;color:var(--ink-faint);font-size:13px;font-style:italic}
.detail-empty{color:var(--ink-faint);text-align:center;padding:30px;font-style:italic}

/* modal */
.modal-bg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:380px;max-width:92vw}
.modal h3{margin:0 0 12px;font-size:15px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.frow label{width:88px;font-size:13px;color:var(--ink-dim);flex:0 0 auto}
.frow input,.frow select{flex:1 1 auto}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.hint{font-size:13px;color:var(--ink-faint);margin-top:-4px;margin-bottom:8px}

</style></head><body>
<div class="app">
  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="t1 serif">神貓卓 <b>NECRONICA</b> ｜ NC 用戰鬥流程輔助工具</div>
      <div class="t2">永い後日談のネクロニカ — 戰場・流程・單位管理</div>
    </div>
    <div class="tools">
      <button class="primary" id="btnAdd">＋ 新增單位</button>
      <button id="btnImport">匯入角色 CSV</button>
      <button id="btnLoadDB">載入資料庫資料夾</button>
      <button id="btnExport">匯出戰場資訊</button>
      <input type="file" id="fileInput" accept=".csv" hidden>
      <input type="file" id="dbFolder" webkitdirectory directory multiple hidden>
    </div>
  </header>

  <!-- ===== LEFT: FLOW ===== -->
  <aside class="left">
    <div class="section-title">戰鬥摘要</div>
    <div class="summary">
      <div class="line"><span>我方單位</span><span class="num ally"><span id="sumAlly">0</span> 名</span></div>
      <div class="line"><span>敵方單位</span><span class="num foe"><span id="sumFoe">0</span> 名</span></div>
    </div>
    <div class="section-title">戰鬥流程檢驗</div>
    <div id="flow"></div>
  </aside>

  <!-- ===== RIGHT ===== -->
  <section class="right">
    <!-- battlefield toolbar -->
    <div class="bf-toolbar">
      <div class="pill round"><span class="lbl">ROUND</span><b id="roundNum">1</b></div>
      <div class="pill"><span class="lbl">刻度</span><b id="tickNum">10</b></div>
      <button id="btnNextRound">下一輪 ▸</button>
      <button id="btnNextTick">下一刻度 ▾</button>
      <div class="spacer"></div>
      <button class="primary" id="btnRefresh">⟳ 刷新戰場</button>
    </div>

    <!-- battlefield -->
    <div class="bf">
      <div class="side-col foe">
        <div class="side-head foe">敵方單位</div>
        <div class="side-list" id="foeList"></div>
      </div>
      <div class="grid-wrap" id="gridWrap"></div>
      <div class="side-col ally">
        <div class="side-head ally">我方單位</div>
        <div class="side-list" id="allyList"></div>
      </div>
    </div>

    <!-- draggable splitter -->
    <div class="splitter" id="splitter" title="拖曳調整戰場／單位資訊高度"></div>

    <!-- bottom detail -->
    <div class="bottom">
      <div class="tabs">
        <button class="tab ally active" id="tabAlly">我方單位</button>
        <button class="tab foe" id="tabFoe">敵方單位</button>
      </div>
      <div class="unit-chips" id="chips"></div>
      <div class="detail" id="detail"></div>
    </div>
  </section>
</div>

<script>
// Embedded NC database (raw CSV text, JSON-encoded to preserve literal \n in fields)

/* ================= NC 戰鬥流程輔助工具 ================= */
'use strict';

const POS_CLASS = {奈落:'b-naraku',地獄:'b-jigoku',煉獄:'b-rengoku',花園:'b-hanazono',樂園:'b-rakuen'};

const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const esc = s => (s==null?'':String(s));

/* ---------- CSV ---------- */
function parseCSV(text){
  const lines = text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim().length>0);
  if(!lines.length) return [];
  const header = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',');
    const o={}; header.forEach((h,i)=>o[h]=(cells[i]??'').trim()); return o;
  });
}

/* ---------- databases（可經「載入資料庫資料夾」熱抽換） ---------- */
const RAW = window.NC_RAW;
let PARTS=[], SKILLS=[], ATTACH=[], TEND=[];
let partByName={}, skillByName={}, attachByName={};
function buildDB(pText, sText, aText, tText){
  if(pText!=null) PARTS=parseCSV(pText);
  if(sText!=null) SKILLS=parseCSV(sText);
  if(aText!=null) ATTACH=parseCSV(aText);
  if(tText!=null) TEND=parseCSV(tText);
  partByName={}; PARTS.forEach(p=>{ if(!(p['名稱'] in partByName)) partByName[p['名稱']]=p; });
  skillByName={}; SKILLS.forEach(s=>{ if(!(s['名稱'] in skillByName)) skillByName[s['名稱']]=s; });
  attachByName={}; ATTACH.forEach(a=>{ attachByName[a['名稱']]=a; });
}
buildDB(RAW.parts, RAW.skills, RAW.attach, RAW.tend);

/* ---------- helpers ---------- */
let _uid = 1; const nid = ()=>'u'+(_uid++);
function costNum(c){ if(c==null) return 0; c=String(c).trim(); if(c===''||c==='無') return 0;
  const m=c.match(/^\d+/); return m?parseInt(m[0],10):0; }
function costHas(c){ // 是否可自動計算（純數字）
  c=String(c||'').trim(); return /^\d+$/.test(c); }

function lookupPart(token){
  // token 形如 "黑曜石項鍊^寶物" 或 "斬骨刀"
  const [name, tag] = token.split('^');
  let db = partByName[name] || (tag ? partByName[tag] : null);
  return {
    name, tag: tag||'',
    timing: db?db['時機']:'—', cost: db?db['COST']:'—', range: db?db['射程']:'—',
    effect: db?db['效果']:'（資料庫無此部件）', level: db?db['部件等級']:(tag||'—'),
    mod: db?parseInt(db['最大行動值補正']||'0',10):0,
    used:false, damaged:false
  };
}
function lookupSkill(name){
  const db = skillByName[name];
  return { name, timing: db?db['時機']:'—', cost: db?db['COST']:'—', range: db?db['射程']:'—',
    effect: db?db['效果']:'（資料庫無此技能）', from: db?db['所屬']:'', used:false };
}

  }
  const defColor = side==='ally' ? '#9a7fc0' : (enemyType==='intelligent'?'#8a5bb0':'#b25a63');
  const u = {
    id:nid(), side, enemyType,
    name:r['人偶名稱']||'（無名）', color:r['代表色']||defColor, icon:r['頭像']||'',
    tendency:r['傾向']||'', mainType:r['主要類型']||'', subType:r['輔助類型']||'',
    position: POSITIONS.includes(r['初期配置'])?r['初期配置']:'煉獄',
    initPos: POSITIONS.includes(r['初期配置'])?r['初期配置']:'煉獄',
    skills:[], parts:{頭:[],手:[],軀幹:[],腳:[]}, monsterParts:[],
    attachments:[], madness:false, action:0,
    flatMax: parseInt(r['最大行動值']||'0',10)||0
  };
  if(side==='enemy' && enemyType==='monster'){
    // 怪物：技能不分部位，部件為單一清單
    (r['怪物部件']||r['部件']||'').split('|').filter(Boolean).forEach(tok=>u.monsterParts.push(lookupPart(tok)));
  } else {
    // 人偶 / 智慧體：技能 + 四部位部件
    (r['技能']||'').split('|').filter(Boolean).forEach(n=>u.skills.push(lookupSkill(n)));
    [['頭部件','頭'],['手部件','手'],['軀幹部件','軀幹'],['腳部件','腳']].forEach(([col,loc])=>{
      (r[col]||'').split('|').filter(Boolean).forEach(tok=>u.parts[loc].push(lookupPart(tok)));
    });
    (r['依戀']||'').split('|').filter(Boolean).forEach(a=>{
      const [target,type,pts]=a.split('^'); const info=attachByName[type]||{};
      u.attachments.push({target,type,points:parseInt(pts||'0',10),
        madEffect:info['發狂內容']||'', madName:info['發狂']||''});
    });
  }
  u.action = baseMax(u);
  return u;
}
function blankUnit(side, enemyType){
  return { id:nid(), side, enemyType: side==='enemy'?(enemyType||'monster'):null,
    name:'新單位', color: side==='ally'?'#6f9bd1':'#b25a63', icon:'',
    tendency:'', mainType:'', subType:'', position:'煉獄', initPos:'煉獄',
    skills:[], parts:{頭:[],手:[],軀幹:[],腳:[]}, monsterParts:[],
    attachments:[], madness:false, action:0, flatMax:10 };
}

/* ---------- action-value maths ---------- */
function baseMax(u){
  const isMon = u.side==='enemy'&&u.enemyType==='monster';
  if(isMon) return u.flatMax||0;                       // 怪物：直接使用其行動值（不由部件補正累加）
  const hasParts = LOCS.some(l=>u.parts[l].length>0);
  if(!hasParts) return u.flatMax||0;                   // 無部件之人偶／智慧體：使用手動設定值
  let s=0;
  LOCS.forEach(l=>u.parts[l].forEach(p=>{ if(!p.damaged) s+=p.mod||0; }));
  return s;
}
// 其他同陣營單位發狂 → 本單位最大行動值 -1（依使用者設定的假設）
function externalPenalty(u){
  let p=0;
  state.units.forEach(o=>{ if(o!==u && o.side===u.side && o.madness) p-=1; });
  return p;
}
// 自身發狂 + 依戀「依存」→ 最大行動值 -2
function selfPenalty(u){
  if(!u.madness) return 0; let p=0;
  u.attachments.forEach(a=>{ if(a.type==='依存') p-=2; });
  return p;
}
function effMax(u){ return baseMax(u) + selfPenalty(u) + externalPenalty(u); }

function partCount(u,loc){ // 未損傷數
  return u.parts[loc].filter(p=>!p.damaged).length;
}
function monsterCount(u){ return u.monsterParts.filter(p=>!p.damaged).length; }
// 單位所有部件皆損傷 → 完全解體
function allParts(u){ return (u.side==='enemy'&&u.enemyType==='monster') ? u.monsterParts : LOCS.flatMap(l=>u.parts[l]); }
function isDismantled(u){ const ps=allParts(u); return ps.length>0 && ps.every(p=>p.damaged); }

// 本回合消耗 COST（已勾「使用」之技能/部件的可計算 COST 總和）
function roundCost(u){
  let c=0;
  u.skills.forEach(s=>{ if(s.used) c+=costNum(s.cost); });
  const allParts = (u.side==='enemy'&&u.enemyType==='monster') ? u.monsterParts
                   : LOCS.flatMap(l=>u.parts[l]);
  allParts.forEach(p=>{ if(p.used) c+=costNum(p.cost); });
  return c;
}

/* ================= STATE ================= */
const FLOW_DEF = [
  {type:'note', text:'戰鬥最初：進行戰鬥相關動作【自動】宣告'},
  {type:'phase', title:'行動階段'},
  {type:'chk', key:'a1', text:'敵方宣告動作'},
  {type:'chk', key:'a2', text:'我方宣告動作'},
  {type:'chk', key:'a3', text:'可進行動作【行動】宣告', mk:'行動'},
  {type:'phase', title:'擲骰階段'},
  {type:'chk', key:'b1', text:'進行動作判定'},
  {type:'phase', title:'裁判階段'},
  {type:'chk', key:'c1', text:'可進行動作【裁判】影響擲骰結果', mk:'裁判'},
  {type:'phase', title:'傷害階段'},
  {type:'chk', key:'d1', text:'NC 進行傷害計算（此階段扣除敵我單位 HP／部件）'},
  {type:'chk', key:'d2', text:'可進行時機為【傷害】的動作，影響指定動作的傷害結果', mk:'傷害'},
  {type:'phase', title:'本回合 COST 計算'},
];
const state = {
  round:1, tick:10,
  units:[],
  flow:{}, // key->bool
  tab:'ally',
  selAlly:null, selEnemy:null,
  selectedId:null
};

/* ================= BATTLE ACTIONS ================= */
function maxTickOnField(){
  const vals = state.units.map(u=>Math.round(u.action));
  return vals.length ? Math.max(...vals) : 10;
}
function refreshField(){
  state.units.forEach(u=>{ u.position=u.initPos;
    LOCS.forEach(l=>u.parts[l].forEach(p=>{p.damaged=false;p.used=false;}));
    u.monsterParts.forEach(p=>{p.damaged=false;p.used=false;});
    u.skills.forEach(s=>s.used=false);
  });
  state.units.forEach(u=>{ u.action=effMax(u); });
  state.round=1; state.flow={}; state.tick=maxTickOnField();
  render();
}
function nextRound(){
  state.units.forEach(u=>{ u.action = (u.action - roundCost(u)) + effMax(u); });
  state.units.forEach(u=>{ // 進新一輪，清空「使用」勾選
    u.skills.forEach(s=>s.used=false);
    LOCS.forEach(l=>u.parts[l].forEach(p=>p.used=false));
    u.monsterParts.forEach(p=>p.used=false);
  });
  state.round++; state.flow={}; state.tick=maxTickOnField();
  render();
}
function nextTick(){
  const below = state.units.map(u=>Math.round(u.action))
    .filter(v=>v<state.tick && v>=TICK_LO);
  if(below.length) state.tick=Math.max(...below);
  else if(state.tick>TICK_LO) state.tick--;
  render();
}

/* ================= RENDER ================= */
function render(){ renderTop(); renderFlow(); renderBattlefield(); renderBottom(); }

function renderTop(){
  const allies=state.units.filter(u=>u.side==='ally').length;
  const foes=state.units.filter(u=>u.side==='enemy').length;
  $('#sumAlly').textContent=allies; $('#sumFoe').textContent=foes;
}

/* ----- left: flow ----- */
function renderFlow(){
  renderTop();
  const box=$('#flow'); box.innerHTML='';
  FLOW_DEF.forEach(item=>{
    if(item.type==='note'){ box.appendChild(el('div','note','● '+item.text)); return; }
    if(item.type==='phase'){
      const h=el('div','phase-h'); h.appendChild(el('span',null,item.title));
      box.appendChild(h); return;
    }
    const done=!!state.flow[item.key];
    const row=el('label','chk'+(done?' done':''));
    const cb=el('input'); cb.type='checkbox'; cb.checked=done;
    cb.onchange=()=>{ state.flow[item.key]=cb.checked; renderFlow(); };
    row.appendChild(cb);
    const sp=el('span'); if(item.mk){const m=el('b','mk');m.textContent='【'+item.mk+'】';sp.appendChild(m);}
    sp.appendChild(document.createTextNode(item.text));
    row.appendChild(sp); box.appendChild(row);
  });
  // cost calc block
  const cb=el('div','cost-box');
  const allies=state.units.filter(u=>u.side==='ally');
  const foes=state.units.filter(u=>u.side==='enemy');
  const rowsFor=(arr,label)=>{
    if(!arr.length) return;
    const hd=el('div','cost-hint',label); hd.style.margin='2px 0 4px'; hd.style.fontWeight='700'; cb.appendChild(hd);
    arr.forEach(u=>{
      const c=roundCost(u); const cur=Math.round(u.action); const rem=cur-c;
      const r=el('div','cost-row');
      r.appendChild(el('div','nm',u.name));
      const calc=el('div','calc');
      calc.innerHTML=`<b>${cur}</b> − <span class="c">${c}</span> = <span class="r">${rem}</span>`;
      r.appendChild(calc); cb.appendChild(r);
    });
  };
  rowsFor(allies,'我方'); rowsFor(foes,'敵方');
  if(!state.units.length) cb.appendChild(el('div','cost-hint','（尚無單位）'));
  box.appendChild(cb);
  box.appendChild(el('div','cost-hint','＊勾選各單位「使用」核取方塊後自動加總 COST。按「下一輪」時：（行動值−COST）＋最大行動值＝新一輪行動值。'));
}

/* ----- battlefield ----- */
function avatarStyle(u){
  if(u.icon){ return `background-image:url('${u.icon.replace(/'/g,"%27")}')`; }
  return `background:${u.color}`;
}
function avatarText(u){ return u.icon?'':(u.name||'?').slice(0,1); }

function renderBattlefield(){
  $('#roundNum').textContent=state.round;
  $('#tickNum').textContent=state.tick;
  // side lists
  renderSideList('enemy'); renderSideList('ally');
  renderGrid();
}

function renderSideList(side){
  const wrap = side==='enemy'?$('#foeList'):$('#allyList');
  wrap.innerHTML='';
  const arr=state.units.filter(u=>u.side===side);
  if(!arr.length){ wrap.appendChild(el('div','side-empty', side==='enemy'?'尚無敵方單位':'尚無我方單位')); return; }
  arr.forEach((u)=>{
    const idxAll=state.units.indexOf(u);
    const dism=isDismantled(u);
    const card=el('div','ucard'+(state.selectedId===u.id?' sel':'')+(u.madness?' mad':'')+(dism?' dismantled':''));
    // top row：ICON + 名稱 + 手動排序
    const top=el('div','top');
    const showIcon = side==='ally' || u.enemyType==='intelligent';
    if(showIcon){ const av=el('div','avatar'); av.setAttribute('style',avatarStyle(u)); av.textContent=avatarText(u); top.appendChild(av); }
    const nm=el('div','nm',u.name); nm.title='點擊於下方檢視詳細'; nm.onclick=()=>selectUnit(u); top.appendChild(nm);
    const btns=el('div','rowbtns');
    const up=el('button','mini','↑'); up.title='上移'; up.onclick=()=>moveUnit(u,-1);
    const dn=el('button','mini','↓'); dn.title='下移'; dn.onclick=()=>moveUnit(u,1);
    btns.appendChild(up); btns.appendChild(dn); top.appendChild(btns);
    card.appendChild(top);
    if(side==='enemy'){
      const k=el('div','kind '+(u.enemyType==='intelligent'?'chishi':'kaibutsu'),
        u.enemyType==='intelligent'?'智慧體':'怪物');
      card.appendChild(k);
    }
    // 單列：頭 手 軀幹 腳 行動值 位置選單 發狂
    const line=el('div','uline');
    if(showIcon){
      LOCS.forEach(l=>{ const n=partCount(u,l); const c=el('div','pc'+(n===0?' zero':''));
        c.innerHTML=`${l}<b>${n}</b>`; line.appendChild(c); });
    } else {
      const n=monsterCount(u); const c=el('div','pc'+(n===0?' zero':''));
      c.innerHTML=`部件<b>${n}</b>`; line.appendChild(c);
    }
    const avbox=el('div','av'); avbox.innerHTML='<label>行動值</label>';
    const inp=el('input'); inp.type='number'; inp.value=Math.round(u.action);
    inp.onchange=()=>{ u.action=parseInt(inp.value||'0',10)||0;
      const isMon=u.side==='enemy'&&u.enemyType==='monster';
      const hasParts=isMon?false:LOCS.some(l=>u.parts[l].length>0);
      if(isMon||!hasParts) u.flatMax=u.action;
      renderBattlefield(); renderFlow(); };
    avbox.appendChild(inp); line.appendChild(avbox);
    const sel=el('select');
    POSITIONS.forEach(p=>{const o=el('option',null,p);o.value=p;if(p===u.position)o.selected=true;sel.appendChild(o);});
    sel.onchange=()=>{ u.position=sel.value; renderGrid(); };
    line.appendChild(sel);
    const madBtn=el('button','mini mad'+(u.madness?' on':''), u.madness?'發狂中':'發狂');
    madBtn.title='切換發狂狀態'; madBtn.onclick=()=>{ u.madness=!u.madness; render(); };
    line.appendChild(madBtn);
    card.appendChild(line);
    // 完全解體 狀態
    if(dism) card.appendChild(el('div','status-dismantled','完全解體'));
    // 發狂 效果說明
    if(u.madness){
      const eff=el('div','mad-note');
      const notes=[];
      u.attachments.forEach(a=>{ if(a.type==='依存') notes.push('依存：自身最大行動值−2'); });
      notes.push('其他同陣營單位最大行動值−1');
      eff.textContent='☠ '+notes.join('；');
      card.appendChild(eff);
    }
    wrap.appendChild(card);
  });
}

function renderGrid(){
  const wrap=$('#gridWrap'); wrap.innerHTML='';
  const ticks=[]; for(let t=TICK_HI;t>=TICK_LO;t--) ticks.push(t);
  const grid=el('div','grid');
  grid.style.gridTemplateColumns=`34px repeat(${ticks.length},30px)`;
  grid.style.gridTemplateRows=`26px repeat(${POSITIONS.length}, minmax(52px,auto))`;
  // corner
  const corner=el('div','rcell corner'); corner.style.gridColumn='1'; corner.style.gridRow='1';
  corner.textContent='刻度'; grid.appendChild(corner);
  // ruler
  ticks.forEach((t,i)=>{
    const c=el('div','rcell'+(t<=0?' dead':'')+(t===state.tick?' cur':''));
    c.style.gridColumn=(i+2); c.style.gridRow='1'; c.textContent=t;
    if(t<=0) c.title='不可行動的領域';
    grid.appendChild(c);
  });
  // band rows
  POSITIONS.forEach((pos,pi)=>{
    const lab=el('div','blabel '+POS_CLASS[pos]); lab.style.gridColumn='1'; lab.style.gridRow=(pi+2);
    lab.appendChild(document.createTextNode(pos));
    grid.appendChild(lab);
    ticks.forEach((t,i)=>{
      const cell=el('div','cell '+POS_CLASS[pos]+(t<=0?' dead':'')+(t===state.tick?' curcol':''));
      cell.style.gridColumn=(i+2); cell.style.gridRow=(pi+2);
      cell.dataset.pos=pos; cell.dataset.tick=t;
      if(t<=0) cell.title='不可行動的領域';
      grid.appendChild(cell);
    });
  });
  wrap.appendChild(grid);
  // place tokens
  state.units.forEach(u=>{
    let t=Math.round(u.action); if(t>TICK_HI)t=TICK_HI; if(t<TICK_LO)t=TICK_LO;
    const cell=grid.querySelector(`.cell[data-pos="${u.position}"][data-tick="${t}"]`);
    if(!cell) return;
    const tok=el('div','token '+(u.side==='enemy'?'foe':'ally')+(u.madness?' mad':'')+(isDismantled(u)?' dismantled':'')+(state.selectedId===u.id?' sel':''));
    tok.setAttribute('style',avatarStyle(u)); tok.textContent=avatarText(u);
    tok.title=`${u.name}（${u.position}・行動值 ${Math.round(u.action)}${isDismantled(u)?'・完全解體':''}）`;
    tok.onclick=()=>selectUnit(u);
    cell.appendChild(tok);
  });
}

/* ----- bottom detail ----- */
function renderBottom(){
  // tabs
  $('#tabAlly').className='tab ally'+(state.tab==='ally'?' active':'');
  $('#tabFoe').className='tab foe'+(state.tab==='enemy'?' active':'');
  const arr=state.units.filter(u=>u.side===state.tab);
  // chips
  const chips=$('#chips'); chips.innerHTML='';
  let selId = state.tab==='ally'?state.selAlly:state.selEnemy;
  if(!arr.find(u=>u.id===selId)) selId = arr.length?arr[0].id:null;
  if(state.tab==='ally') state.selAlly=selId; else state.selEnemy=selId;
  arr.forEach(u=>{
    const chip=el('div','chip'+(u.id===selId?' active':''));
    const showIcon = u.side==='ally'||u.enemyType==='intelligent';
    if(showIcon){const a=el('div','avatar ca');a.setAttribute('style',avatarStyle(u));a.textContent=avatarText(u);chip.appendChild(a);}
    chip.appendChild(el('span',null,u.name));
    chip.onclick=()=>{ if(state.tab==='ally')state.selAlly=u.id;else state.selEnemy=u.id; state.selectedId=u.id; renderBottom(); renderBattlefield(); renderSideList(u.side); };
    const x=el('button','chip-x','×'); x.title='移除此單位';

    chip.appendChild(x);

  renderSheet(det,u);

function renderSheet(det,u){
  const isMonster = u.side==='enemy' && u.enemyType==='monster';
  const head=el('div','usheet-head');
  const showIcon = !isMonster;
  if(showIcon){const a=el('div','avatar');a.setAttribute('style',avatarStyle(u));a.textContent=avatarText(u);head.appendChild(a);}
  const info=el('div','info');
  info.appendChild(el('div','n',u.name));
  const subbits=[];
  if(u.side==='enemy') subbits.push(u.enemyType==='intelligent'?'智慧體':'怪物');
  if(u.tendency) subbits.push('傾向：'+u.tendency);
  if(u.mainType) subbits.push(u.mainType+(u.subType?' / '+u.subType:''));
  if(u.position) subbits.push('位置：'+u.position);
  info.appendChild(el('div','sub',subbits.join('　')||'—'));
  if(isDismantled(u)) info.appendChild(el('span','status-dismantled','完全解體'));
  head.appendChild(info);
  const stat=el('div','stat');
  stat.innerHTML=`<div class="k">最大行動值</div><div class="v">${effMax(u)}</div>`;
  head.appendChild(stat);
  det.appendChild(head);

  // skills (dolls & intelligent only)
  if(!isMonster){
    det.appendChild(buildTable('技能', u.skills, 'skill', u, null));
  }
  // parts
  if(isMonster){
    det.appendChild(buildTable('部件', u.monsterParts, 'part', u, 'monster'));
  } else {
    LOCS.forEach(l=>{
      det.appendChild(buildTable('部件・'+l, u.parts[l], 'part', u, l));
    });
  }
}

function buildTable(title, items, kind, u, loc){
  const blk=el('div','blk');
  const h=el('div','blk-h'); h.appendChild(el('span',null,title));
  if(kind==='part'){
    const n=(loc==='monster')?monsterCount(u):partCount(u,loc);
    const total=items.length;
    const num=el('div','bignum'); num.innerHTML=`未損傷 <b>${n}</b> / ${total}`;
    h.appendChild(num);
  }
  blk.appendChild(h);
  if(!items.length){ blk.appendChild(el('div','empty-blk','（無）')); return blk; }
  const tbl=el('table','tbl');
  const thead=el('tr');
  // 損傷欄：部件顯示「損傷」，技能留空以維持與部件表格的欄位對齊
  thead.appendChild(Object.assign(el('th','c-chk'),{textContent:kind==='part'?'損傷':''}));
  thead.appendChild(Object.assign(el('th','c-chk'),{textContent:'使用'}));
  thead.appendChild(Object.assign(el('th','c-nm'),{textContent:'名稱'}));
  thead.appendChild(Object.assign(el('th','c-tm'),{textContent:'時機'}));
  thead.appendChild(Object.assign(el('th','c-co'),{textContent:'COST'}));
  thead.appendChild(Object.assign(el('th','c-rg'),{textContent:'射程'}));
  thead.appendChild(Object.assign(el('th'),{textContent:'效果'}));
  if(kind==='part') thead.appendChild(Object.assign(el('th','c-lv'),{textContent:'等級'}));
  tbl.appendChild(thead);
  items.forEach(it=>{
    const tr=el('tr', (it.damaged?'dmg ':'')+(it.used?'used-on':''));
    if(kind==='part'){
      const td=el('td','c-chk'); const c=el('input');c.type='checkbox';c.checked=it.damaged;
      c.title='損傷（勾選後戰場對應部件數量−1）';
      c.onchange=()=>{ it.damaged=c.checked; if(it.damaged)it.used=false;
        u.action=Math.min(u.action, effMax(u)); render(); };
      td.appendChild(c); tr.appendChild(td);
    } else {
      tr.appendChild(el('td','c-chk')); // 技能：損傷欄留空（對齊用）
    }
    const tdu=el('td','c-chk'); const cu=el('input');cu.type='checkbox';cu.checked=it.used;cu.disabled=!!it.damaged;
    cu.title='使用（計入本回合 COST）';
    cu.onchange=()=>{ it.used=cu.checked; renderFlow(); const tr2=cu.closest('tr'); if(tr2) tr2.className=(it.damaged?'dmg ':'')+(it.used?'used-on':''); };
    tdu.appendChild(cu); tr.appendChild(tdu);
    const tdn=el('td','c-nm'); const nm=el('div','nm',it.name); tdn.appendChild(nm);
    if(it.tag){ const g=el('div','tag','◈ '+it.tag); tdn.appendChild(g); }
    tr.appendChild(tdn);
    tr.appendChild(Object.assign(el('td','c-tm'),{textContent:it.timing}));
    const tdc=el('td','co c-co'); tdc.innerHTML = costHas(it.cost)?`<b>${it.cost}</b>`:esc(it.cost); tr.appendChild(tdc);
    tr.appendChild(Object.assign(el('td','c-rg'),{textContent:it.range}));
    tr.appendChild(Object.assign(el('td','ef'),{textContent:it.effect}));
    if(kind==='part') tr.appendChild(Object.assign(el('td','lv c-lv'),{textContent:it.level}));
    tbl.appendChild(tr);
  });
  blk.appendChild(tbl);
  return blk;
}

/* ================= UI ACTIONS ================= */
function selectUnit(u){
  state.selectedId=u.id; state.tab=u.side;
  if(u.side==='ally') state.selAlly=u.id; else state.selEnemy=u.id;
  render();
  $('#detail').scrollTop=0;
}
function moveUnit(u,dir){
  const arr=state.units; const i=arr.indexOf(u);
  // 只在同陣營相鄰單位間交換
  let j=i+dir;
  while(j>=0&&j<arr.length&&arr[j].side!==u.side) j+=dir;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  renderBattlefield();
}
function removeUnit(u){
  state.units=state.units.filter(x=>x!==u);
  if(state.selectedId===u.id) state.selectedId=null;
  render();
}

/* ---- import 角色.csv ---- */
function importCSV(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCSV(rd.result);
      let a=0,e=0;
      rows.forEach(r=>{ if(r['人偶名稱']){ const u=unitFromCharRow(r); state.units.push(u); (u.side==='ally'?a++:e++); } });
      refreshField();
      alert(`已匯入我方 ${a} 名、敵方 ${e} 名，並刷新戰場。`);
    }catch(err){ alert('匯入失敗：'+err.message); }
  };
  rd.readAsText(file,'utf-8');
}

/* ---- load database folder（熱抽換 部件／技能／依戀／傾向） ---- */
function reresolveUnit(u){
  u.skills = u.skills.map(s=>{ const n=lookupSkill(s.name); n.used=s.used; return n; });
  const remap = p=>{ const tok=p.tag?(p.name+'^'+p.tag):p.name; const n=lookupPart(tok);
    n.used=p.used; n.damaged=p.damaged; return n; };
  LOCS.forEach(l=>{ u.parts[l]=u.parts[l].map(remap); });
  u.monsterParts=u.monsterParts.map(remap);
  u.action=effMax(u);
}
function loadDBFolder(fileList){
  const files=[...fileList].filter(f=>/\.csv$/i.test(f.name));
  if(!files.length){ alert('資料夾中找不到 CSV 檔。'); return; }
  const pick=(kw)=>files.find(f=>f.name.replace(/\.csv$/i,'').includes(kw));
  const map={ parts:pick('部件'), skills:pick('技能'), attach:pick('依戀'), tend:pick('傾向') };
  const found=Object.entries(map).filter(([,f])=>f);
  if(!found.length){ alert('未辨識到 部件／技能／依戀／傾向 任何一個資料庫檔（請確認檔名含這些字）。'); return; }
  const texts={};
  let pending=found.length;
  found.forEach(([key,f])=>{
    const rd=new FileReader();
    rd.onload=()=>{ texts[key]=rd.result; if(--pending===0) applyDB(); };
    rd.onerror=()=>{ if(--pending===0) applyDB(); };
    rd.readAsText(f,'utf-8');
  });
  function applyDB(){
    buildDB(texts.parts, texts.skills, texts.attach, texts.tend);
    state.units.forEach(reresolveUnit);
    render();
    const label=n=>({parts:'部件',skills:'技能',attach:'依戀',tend:'傾向'}[n]);
    alert('已載入資料庫：'+Object.keys(texts).map(label).join('、')+'。\n現有單位的技能／部件資料已依新資料庫重新對應。');
  }
}

/* ---- resizable splitter（戰場 / 單位資訊 高度） ---- */
function initSplitter(){
  const sp=$('#splitter'), bf=$('.bf'), right=$('.right');
  if(!sp||!bf||!right) return;
  let dragging=false;
  const clamp=(h)=>{ const min=150, max=right.getBoundingClientRect().height-150;
    return Math.max(min, Math.min(max, h)); };
  sp.addEventListener('pointerdown',e=>{
    dragging=true; sp.classList.add('drag'); sp.setPointerCapture(e.pointerId);
    document.body.style.userSelect='none'; e.preventDefault();
  });
  sp.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const top=bf.getBoundingClientRect().top;
    bf.style.height=clamp(e.clientY-top)+'px';
  });
  const end=e=>{ if(!dragging) return; dragging=false; sp.classList.remove('drag');
    document.body.style.userSelect=''; try{sp.releasePointerCapture(e.pointerId);}catch(_){} };
  sp.addEventListener('pointerup',end);
  sp.addEventListener('pointercancel',end);
}

/* ---- export battlefield ---- */
function exportField(){
  const L=[];
  L.push('# NC 戰場資訊');
  L.push(`ROUND ${state.round}　刻度 ${state.tick}`);
  L.push('');
  const dump=(side,label)=>{
    const arr=state.units.filter(u=>u.side===side);
    if(!arr.length) return;
    L.push(`== ${label}（${arr.length}）==`);
    arr.forEach(u=>{
      const isM=side==='enemy'&&u.enemyType==='monster';
      const counts=isM?`部件${monsterCount(u)}`:LOCS.map(l=>`${l}${partCount(u,l)}`).join(' ');
      const kind=side==='enemy'?`[${u.enemyType==='intelligent'?'智慧體':'怪物'}] `:'';
      L.push(`- ${kind}${u.name}｜位置:${u.position}｜行動值:${Math.round(u.action)}｜最大:${effMax(u)}｜${counts}｜COST本回合:${roundCost(u)}${u.madness?'｜★發狂':''}`);
    });
    L.push('');
  };
  dump('enemy','敵方單位'); dump('ally','我方單位');
  const blob=new Blob(['\uFEFF'+L.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`NC戰場_R${state.round}_刻度${state.tick}.txt`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ================= WIRE UP ================= */
function boot(){
  // build summary node refs already in HTML
  $('#btnAdd').onclick=openAddModal;
  $('#btnImport').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{ if(e.target.files[0]) importCSV(e.target.files[0]); e.target.value=''; };
  $('#btnExport').onclick=exportField;
  $('#btnLoadDB').onclick=()=>$('#dbFolder').click();
  $('#dbFolder').onchange=e=>{ if(e.target.files.length) loadDBFolder(e.target.files); e.target.value=''; };
  $('#btnRefresh').onclick=refreshField;
  $('#btnNextRound').onclick=nextRound;
  $('#btnNextTick').onclick=nextTick;
  $('#tabAlly').onclick=()=>{state.tab='ally';renderBottom();};
  $('#tabFoe').onclick=()=>{state.tab='enemy';renderBottom();};
  initSplitter();
  // load sample characters embedded in 角色.csv
  parseCSV(RAW.chars).forEach(r=>{ if(r['人偶名稱']) state.units.push(unitFromCharRow(r)); });
  refreshField();
  if(state.units[0]) selectUnit(state.units[0]);
}
document.addEventListener('DOMContentLoaded',boot);
