<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NC 用戰鬥流程輔助工具（內含資料庫）</title><style>

/* ===== NC 戰鬥流程輔助工具 — Necronica gothic dark ===== */
:root{
  --bg:#131019; --panel:#1b1824; --panel2:#221f2e; --panel3:#2a2637;
  --row:#201d2b; --row2:#25222f; --rowhead:#2f2942;
  --line:#3a3549; --line-soft:#2c2839;
  --ink:#ece7f4; --ink-dim:#a79fbb; --ink-faint:#726a87;
  --accent:#c0424f; --accent-soft:#8a4450; --amethyst:#9a7fc0;
  --danger:#7b1f2c; --danger-bg:#2c1319; --danger-ink:#e0808b;
  --ok:#5aa886; --warn:#c9a15a;
  /* battlefield bands: 奈落(深/危)→樂園(淺/安) */
  --b-naraku:#171320; --b-jigoku:#211a2a; --b-rengoku:#2b2436;
  --b-hanazono:#372f44; --b-rakuen:#463c56;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.serif{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PingFang TC",serif;}
button{font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;border:1px solid var(--line);
  background:var(--panel3);border-radius:6px;padding:5px 10px;transition:.12s}
button:hover{border-color:var(--amethyst);background:#332e44}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#7a3b6e,#5e2f57);border-color:#8a4d80}
button.primary:hover{background:linear-gradient(180deg,#8a4880,#6c3665)}
button.danger{border-color:var(--danger)}
button.ghost{background:transparent}
input,select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amethyst);outline-offset:1px}
::selection{background:#5e2f57;color:#fff}

/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#3a3549;border-radius:5px}
*::-webkit-scrollbar-thumb:hover{background:#4a4560}
*::-webkit-scrollbar-track{background:transparent}

/* ============ APP GRID ============ */
.app{
  height:100vh; display:grid;
  grid-template-columns:266px 1fr;
  grid-template-rows:auto 1fr;
  grid-template-areas:"top top" "left right";
}
/* --- top bar --- */
.topbar{grid-area:top;display:flex;align-items:center;gap:12px;
  padding:8px 14px;background:linear-gradient(180deg,#221a2b,#171320);
  border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand .t1{font-size:15px;font-weight:700;letter-spacing:.5px}
.brand .t2{font-size:13px;color:var(--ink-dim)}
.brand .t1 b{color:var(--accent);font-weight:800}
.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}

/* --- left flow panel --- */
.left{grid-area:left;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px}
.section-title{font-size:13px;font-weight:700;color:var(--amethyst);letter-spacing:1px;
  margin:2px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line)}
.summary{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px;margin-bottom:14px}
.summary .line{display:flex;justify-content:space-between;font-size:13px;margin:2px 0}
.summary .num{font-weight:700;color:var(--ink)}
.summary .num.ally{color:var(--ok)} .summary .num.foe{color:var(--accent)}

.phase{margin-bottom:10px}
.phase-h{font-size:13px;font-weight:700;color:var(--ink);background:var(--rowhead);
  border:1px solid var(--line);border-left:3px solid var(--amethyst);
  border-radius:5px;padding:4px 9px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.phase-h .tag{font-size:13px;color:var(--ink-faint);font-weight:400;margin-left:auto}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px 6px;border-radius:5px;cursor:pointer}
.chk:hover{background:var(--panel2)}
.chk input{margin-top:2px;flex:0 0 auto}
.chk.done span{color:var(--ink-faint);text-decoration:line-through}
.chk .mk{font-size:13px;color:var(--warn);font-weight:700}
.note{font-size:13px;color:var(--ink-faint);margin:3px 0 8px;padding-left:2px;font-style:italic}
/* flow：階段說明子文字、行動宣告、擲骰、傷害 */
.flow-sub{font-size:13px;color:var(--ink-faint);margin:1px 0 4px;padding-left:16px;opacity:.85}
.flow-unit{font-size:13px;color:var(--ink);padding:2px 6px 2px 22px;line-height:1.5}
.flow-unit .fu-name{color:var(--ink)} .flow-unit .fu-idle{color:var(--ink-faint)}
.flow-unit .fu-item{color:var(--warn);text-decoration:underline dotted;cursor:help}
.flow-empty{font-size:13px;color:var(--ink-faint);padding:2px 6px 2px 22px;font-style:italic}
.flow-decl{margin-bottom:3px}
.tgt-row{display:flex;align-items:flex-start;gap:4px;padding:1px 8px 5px 30px}
.tgt-row .tgt-label{font-size:13px;color:var(--ink-faint);white-space:nowrap;padding-top:5px}
.tgt-row .search-select.tgt{flex:1 1 auto;min-width:0;max-width:220px}
.roll-row{padding:3px 6px 3px 22px}
.roll-name{font-size:13px;color:var(--ink)}
.roll-opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.roll-opt{font-size:13px;padding:1px 7px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);
  color:var(--ink-faint);cursor:pointer;white-space:nowrap}
.roll-opt:hover{border-color:var(--accent-soft)}
.roll-opt.on{color:#fff;font-weight:700;border-color:transparent}
.roll-opt.on.r-crit{background:#c9962f} .roll-opt.on.r-ok{background:#4c8a55}
.roll-opt.on.r-bad{background:#7a6a86} .roll-opt.on.r-fumble{background:#b0454f}
.dmg-row{font-size:13px;padding:2px 6px 2px 22px}
.dmg-row .dmg-name{color:var(--ink)} .dmg-row .dmg-val{color:var(--warn)}
.dmg-total{font-size:13px;margin:4px 0 2px;padding:3px 8px;background:var(--panel2);border-radius:5px;
  border:1px solid var(--line-soft);color:var(--ink)} .dmg-total b{color:var(--accent-soft);font-size:14px}
.dmg-assign{margin:1px 6px 8px 30px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line-soft);border-radius:6px}
.dmg-assign-h{font-size:13px;color:var(--ink-dim);margin-bottom:4px}
.dmg-parts{display:flex;flex-wrap:wrap;gap:4px 10px}
.dmg-part{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.dmg-part input{margin:0}
.dmg-part.on span{color:var(--warn);text-decoration:line-through}
.dmg-part.old{opacity:.6;cursor:not-allowed}
.dmg-warn{margin-top:5px;font-size:13px;color:#ff7a85;font-weight:700;background:#3a1f24;border:1px solid #7a343d;border-radius:5px;padding:4px 8px}

.cost-box{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;margin-top:4px}
.cost-row{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line-soft)}
.cost-row:last-child{border-bottom:0}
.cost-row .nm{font-weight:600}
.cost-row .calc{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.cost-row .calc b{color:var(--ink)}
.cost-row .calc .c{color:var(--accent)}
.cost-row .calc .r{color:var(--ok);font-weight:700}
.cost-hint{font-size:13px;color:var(--ink-faint);margin-top:6px}

/* --- right column --- */
.right{grid-area:right;display:flex;flex-direction:column;min-width:0;min-height:0}

/* battlefield toolbar */
.bf-toolbar{display:flex;align-items:center;gap:10px;padding:7px 12px;
  background:linear-gradient(180deg,#1e1b27,#171320);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:20px;padding:3px 12px;font-size:13px}
.pill b{font-size:15px;color:var(--warn);font-weight:800;font-variant-numeric:tabular-nums}
.pill.round b{color:var(--amethyst)}
.pill .lbl{color:var(--ink-dim)}
.bf-toolbar .spacer{margin-left:auto}

/* battlefield body: enemy | grid | ally */
.bf{display:grid;grid-template-columns:262px 1fr 270px;gap:0;
  height:332px;flex:0 0 auto;min-height:0;
  background:radial-gradient(120% 100% at 50% 0,#1a1622,#120f18)}
/* draggable splitter between battlefield & unit-detail */
.splitter{flex:0 0 9px;height:9px;cursor:row-resize;background:linear-gradient(180deg,#242030,#17131f);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
.splitter::before{content:"";width:52px;height:3px;border-radius:2px;background:var(--line-soft)}
.splitter:hover::before,.splitter.drag::before{background:var(--amethyst)}
.side-col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.side-col.ally{border-right:0;border-left:1px solid var(--line)}
.side-head{font-size:13px;font-weight:700;letter-spacing:1px;text-align:center;padding:5px 4px;
  background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto}
.side-head.foe{color:var(--accent)} .side-head.ally{color:var(--ok)}
.side-list{overflow-y:auto;padding:6px 6px 10px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}

/* unit mini-card */
.ucard{background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:6px;position:relative}
.ucard.sel{border-color:var(--amethyst);box-shadow:0 0 0 1px var(--amethyst) inset}
.ucard.mad{border-color:var(--accent)}
.ucard .top{display:flex;align-items:center;gap:6px}
.avatar{width:30px;height:30px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;overflow:hidden;background-size:contain;background-repeat:no-repeat;background-position:center;border:1px solid rgba(255,255,255,.15)}
.ucard .nm{font-size:13px;font-weight:700;line-height:1.15;cursor:pointer;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .nm:hover{color:var(--amethyst)}
.ucard .kind{font-size:13px;color:var(--ink-faint)}
.ucard .kind.chishi{color:var(--amethyst)} .ucard .kind.kaibutsu{color:var(--accent-soft)}
.ucard .kind.shudan{color:#c9a86a} .ucard .kind.tendency{color:#8fb7d8}
.pcounts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.pc{font-size:13px;background:var(--panel3);border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;
  color:var(--ink-dim);font-variant-numeric:tabular-nums}
.pc b{color:var(--ink)}
.pc.zero b{color:var(--danger-ink)}
.uctrl{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.uctrl .av{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 3px}
.uctrl .av label{font-size:13px;color:var(--ink-faint)}
.uctrl .av input{width:38px;padding:1px 3px;text-align:center;font-variant-numeric:tabular-nums}
.uctrl select{padding:2px 4px;font-size:13px}
/* 單列排版：頭 手 軀幹 腳 行動值 位置 發狂 同一行（必要時換行） */
.uline{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.uline .av{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.uline .av label{font-size:13px;color:var(--ink-faint)}
.uline .av input{width:42px;padding:1px 3px;text-align:center;font-variant-numeric:tabular-nums}
.uline select{padding:2px 5px;font-size:13px}
.ucard.dismantled{border-color:#5a5566;background:#1d1a24}
.ucard.dismantled .avatar{filter:grayscale(.85) brightness(.75)}
.status-dismantled{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1px;color:#fff;
  background:linear-gradient(180deg,#4b4552,#332f3c);border:1px solid #6a6478;border-radius:5px;
  padding:1px 8px;margin-top:5px}
.mini{padding:1px 6px;font-size:13px;line-height:1.5;border-radius:5px;white-space:nowrap}
.mini.mad{border-color:var(--accent);color:var(--danger-ink)}
.mini.mad.on{background:#3a1620;color:#fff}
.mini.del{border-color:var(--danger);color:var(--danger-ink);padding:1px 8px}
.mini.del:hover{background:var(--danger);color:#fff}
.madrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
/* cursor-following tooltip */
.cursor-tip{position:fixed;z-index:9999;display:none;background:#000;color:#fff;font-size:13px;line-height:1.3;
  padding:3px 8px;border-radius:4px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 10px #000a;border:1px solid #fff2}
/* bottom detail edit mode */
.edit-toggle{margin-left:10px;flex:0 0 auto;align-self:flex-start}
.edit-hint{font-size:13px;color:var(--warn);background:#2a2418;border:1px solid #4a3f22;border-radius:6px;
  padding:5px 9px;margin-bottom:10px}
.addrow{display:flex;gap:6px;align-items:flex-start;padding:7px 10px;background:var(--panel2);border-top:1px solid var(--line-soft)}
.addrow input{flex:1 1 auto;min-width:0}
/* 可搜尋下拉式選單 */
.search-select{position:relative;flex:1 1 auto;min-width:0;width:100%}
.ss-input{width:100%}
.ss-list{display:none;margin-top:5px;max-height:200px;overflow-y:auto;
  background:var(--panel3);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0007}
.ss-list.open{display:block}
.ss-opt{padding:5px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ss-opt .ss-nm{color:var(--ink)} .ss-opt .ss-meta{color:var(--ink-faint);font-size:13px;white-space:nowrap;flex:0 0 auto}
.ss-opt:last-child{border-bottom:0}
.ss-opt:hover{background:#332e44;color:var(--ink)}
.ss-empty{padding:6px 10px;font-size:13px;color:var(--ink-faint);font-style:italic}
.rowbtns{display:flex;gap:3px;margin-left:auto}
.mad-note{font-size:13px;color:var(--danger-ink);margin-top:4px;line-height:1.3}
.side-empty{font-size:13px;color:var(--ink-faint);text-align:center;padding:14px 6px;font-style:italic}

/* grid */
.grid-wrap{overflow:auto;position:relative;background:var(--panel)}
.grid{display:grid;position:relative;width:max-content;margin:0 auto}
.rcell{font-size:13px;text-align:center;color:var(--ink-dim);font-variant-numeric:tabular-nums;
  padding:3px 0;background:var(--panel2);position:sticky;top:0;z-index:6;border-bottom:1px solid var(--line);
  border-left:1px solid var(--line-soft)}
.rcell.cur{color:var(--warn);font-weight:800;background:#332a1a}
.rcell.dead{color:var(--danger-ink);background:var(--danger-bg)}
.rcell.corner{position:sticky;left:0;z-index:8;background:var(--panel3)}
.blabel{position:sticky;left:0;z-index:5;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:upright;font-size:17px;font-weight:700;letter-spacing:3px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft);min-width:34px}
.blabel small{writing-mode:horizontal-tb;font-size:13px;color:var(--ink-faint);margin-top:6px;letter-spacing:0;font-weight:400}
.cell{border-left:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  min-height:46px;padding:3px 1px;display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;position:relative}
.cell.dead{background:var(--danger-bg)}
.cell.dead:hover{background:#3a1820}
.cell.curcol{box-shadow:inset 0 0 0 1px rgba(201,161,90,.35)}
.b-naraku{background:var(--b-naraku)} .b-jigoku{background:var(--b-jigoku)}
.b-rengoku{background:var(--b-rengoku)} .b-hanazono{background:var(--b-hanazono)}
.b-rakuen{background:var(--b-rakuen)}
/* unit token on grid（1:1 正方形棋子，尺寸由 JS 依欄寬設定 30/25px） */
.token{border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;
  border:1.5px solid #fff8;cursor:pointer;position:relative;flex:0 0 auto}
.token.foe{border-color:#c0424fcc}
.token.ally{border-color:#5aa886cc}
.token.sel{outline:2px solid var(--warn);outline-offset:1px}
.token.dismantled{filter:grayscale(1) brightness(.6);border-color:#7a7488}
.token.dismantled::before{content:"解";position:absolute;bottom:-7px;left:-7px;background:#4b4552;color:#fff;
  font-size:13px;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;border:1px solid #fff6}
.token.mad::after{content:"狂";position:absolute;top:-7px;right:-7px;background:var(--accent);color:#fff;
  font-size:13px;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;border:1px solid #fff6}

/* ============ bottom detail ============ */
.bottom{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.tabs{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto;align-items:stretch}
.tab{padding:7px 18px;font-size:13px;font-weight:700;color:var(--ink-dim);background:transparent;border:0;
  border-right:1px solid var(--line-soft);border-radius:0;position:relative}
.tab.active{color:var(--ink);background:var(--panel)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--amethyst)}
.tab.foe.active::after{background:var(--accent)}
.unit-chips{display:flex;gap:6px;padding:7px 10px;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--line-soft);background:var(--panel2)}
.chip{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border:1px solid var(--line);border-radius:20px;
  background:var(--panel3);white-space:nowrap;font-size:13px}
.chip.active{border-color:var(--amethyst);background:#332e44}
.chip .ca{width:20px;height:20px;border-radius:5px;font-size:13px}
.chip-x{padding:0;width:18px;height:18px;line-height:1;font-size:14px;border-radius:50%;
  background:transparent;border:1px solid var(--line);color:var(--ink-faint);margin-left:2px;flex:0 0 auto}
.chip-x:hover{border-color:var(--accent);color:#fff;background:var(--danger)}
.detail{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 20px}
.usheet-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.usheet-head .avatar{width:46px;height:46px;border-radius:9px;font-size:20px}
.usheet-head .info .n{font-size:15px;font-weight:800}
.usheet-head .info .sub{font-size:13px;color:var(--ink-dim);margin-top:1px}
.usheet-head .stat{margin-left:auto;text-align:right}
.usheet-head .stat .k{font-size:13px;color:var(--ink-faint)}
.usheet-head .stat .v{font-size:19px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}

.blk{margin-bottom:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.blk-h{display:flex;align-items:center;background:var(--rowhead);padding:5px 10px;font-size:13px;font-weight:700}
.blk-h .bignum{margin-left:auto;font-size:13px;color:var(--ink-dim)}
.blk-h .bignum b{color:var(--warn);font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:13px;font-weight:600;color:var(--ink-faint);text-align:left;padding:4px 8px;
  background:var(--panel2);border-bottom:1px solid var(--line-soft)}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.dmg td{background:var(--danger-bg);color:var(--ink-faint)}
.tbl tr.dmg .nm{text-decoration:line-through}
.tbl tr.used-on td{background:#241f33}
.tbl .c-chk{width:42px;text-align:center}
.tbl .c-nm{width:120px}

function parseCSV(text){

  // token 形如 "黑曜石項鍊^寶物" 或 "斬骨刀"
  const [name, tag] = token.split('^');
  let db = partByName[name] || (tag ? partByName[tag] : null);
  return {
    name, tag: tag||'',
    timing: db?db['時機']:'—', cost: db?db['COST']:'—', range: db?db['射程']:'—',
    effect: db?db['效果']:'（資料庫無此部件）', level: db?db['部件等級']:(tag||'—'),
    mod: db?parseInt(db['最大行動值補正']||'0',10):0,
    atkType: db?(db['攻擊類型']||''):'', dmg: db?(parseInt(db['傷害']||'0',10)||0):0,
    used:false, costApplied:false, damaged:false, dmgKey:null, dmgBy:null
  };
}
function lookupSkill(name){
  const db = skillByName[name];
  let maxMod = 0;
  if(db){
    const col = (db['最大行動值']||'').trim();
    if(/^-?\d+$/.test(col)) maxMod = parseInt(col,10);
    else { const m=String(db['效果']||'').match(/最大行動值[＋+](\d+)/); if(m) maxMod=parseInt(m[1],10); }
  }
  return { name, timing: db?db['時機']:'—', cost: db?db['COST']:'—', range: db?db['射程']:'—',
    effect: db?db['效果']:'（資料庫無此技能）', from: db?db['所屬']:'', maxMod, used:false, costApplied:false };
}

/* ---------- build units ---------- */
function unitFromCharRow(r){
  // 陣營／敵方類型（缺省＝我方人偶，向下相容舊版角色.csv）
  const camp = (r['陣營']||'').trim();
  const side = (camp==='敵方'||camp==='敵'||camp==='enemy') ? 'enemy' : 'ally';
  let enemyType = null;
  if(side==='enemy'){
    const t=(r['敵方類型']||'').trim();
    enemyType = (t==='智慧體'||t==='intelligent') ? 'intelligent'
              : (t==='集團'||t==='group') ? 'group' : 'monster';
  }
  const defColor = side==='ally' ? '#9a7fc0'
    : (enemyType==='intelligent'?'#8a5bb0':(enemyType==='group'?'#7d6b4a':'#b25a63'));
  const u = {
    id:nid(), side, enemyType,
    name:r['人偶名稱']||'（無名）', color:r['代表色']||defColor, icon:r['頭像']||'',
    tendency:r['傾向']||'', mainType:r['主要類型']||'', subType:r['輔助類型']||'',
    position: POSITIONS.includes(r['初期配置'])?r['初期配置']:'煉獄',
    initPos: POSITIONS.includes(r['初期配置'])?r['初期配置']:'煉獄',
    skills:[], parts:{頭:[],手:[],軀幹:[],腳:[]}, monsterParts:[],
    attachments:[], madness:false, target:null, action:0, appliedMax:0,
    flatMax: parseInt(r['最大行動值']||'0',10)||0
  };
  if(side==='enemy' && (enemyType==='monster'||enemyType==='group')){
    // 怪物／集團：技能不分部位，部件為單一清單
    (r['怪物部件']||r['部件']||'').split('|').filter(Boolean).forEach(tok=>u.monsterParts.push(lookupPart(tok)));
  } else {
    // 人偶 / 智慧體：技能 + 四部位部件
    (r['技能']||'').split('|').filter(Boolean).forEach(n=>u.skills.push(lookupSkill(n)));
    [['頭部件','頭'],['手部件','手'],['軀幹部件','軀幹'],['腳部件','腳']].forEach(([col,loc])=>{
      (r[col]||'').split('|').filter(Boolean).forEach(tok=>u.parts[loc].push(lookupPart(tok)));
    });
    (r['依戀']||'').split('|').filter(Boolean).forEach(a=>{
      const [target,type,pts]=a.split('^'); const info=attachByName[type]||{};
      u.attachments.push({target:target||'', type:type||'', points:parseInt(pts||'0',10),
        madEffect:info['發狂內容']||'', madName:info['發狂']||'', mad:false});
    });
  }
  u.action = baseMax(u); u.appliedMax = baseMax(u);
  return u;
}
function blankUnit(side, enemyType){
  return { id:nid(), side, enemyType: side==='enemy'?(enemyType||'monster'):null,
    name:'新單位', color: side==='ally'?'#6f9bd1':'#b25a63', icon:'',
    tendency:'', mainType:'', subType:'', position:'煉獄', initPos:'煉獄',
    skills:[], parts:{頭:[],手:[],軀幹:[],腳:[]}, monsterParts:[],
    attachments:[], madness:false, target:null, action:0, appliedMax:0, flatMax:10 };
}

/* ---------- action-value maths ---------- */
const BASE_ACTION = 6;   // 人偶／智慧體／怪物基礎行動值
// 敵方「怪物 / 集團」使用單一部件清單（無技能、無四部位）
function isFlatEnemy(u){ return u.side==='enemy' && (u.enemyType==='monster'||u.enemyType==='group'); }
function isGroup(u){ return u.side==='enemy' && u.enemyType==='group'; }
function isMonster(u){ return u.side==='enemy' && u.enemyType==='monster'; }
// 傾向／類型選項：依 CSV 清單順序，不做字母排序
function tendencyOptions(){
  const out=[], seen=new Set();
  TEND.forEach(t=>{ const n=t['名稱']; if(n&&!seen.has(n)){ seen.add(n); out.push(n); } });          // 傾向.csv 順序
  SKILLS.forEach(s=>{ if((s['類別']||'')==='傾向'){ const n=s['所屬']; if(n&&!seen.has(n)){ seen.add(n); out.push(n); } } });
  return out;
}
function typeOptions(){
  const out=[], seen=new Set();
  SKILLS.forEach(s=>{ if((s['類別']||'')==='類型'){ const n=s['所屬']; if(n&&!seen.has(n)){ seen.add(n); out.push(n); } } });  // 技能.csv 出現順序
  return out;
}
function baseMax(u){
  if(isGroup(u)) return u.flatMax||0;                  // 集團：自訂最大行動值
  if(isMonster(u)){                                    // 怪物：基礎 6 ＋ 各未損傷部件補正累加
    let s=BASE_ACTION;
    u.monsterParts.forEach(p=>{ if(!p.damaged) s+=p.mod||0; });
    return s;
  }
  // 人偶 / 智慧體：基礎 6 ＋ 部件補正 ＋ 技能加成
  let s = BASE_ACTION;
  LOCS.forEach(l=>u.parts[l].forEach(p=>{ if(!p.damaged) s+=p.mod||0; }));
  u.skills.forEach(sk=>{ s += sk.maxMod||0; });
  return s;
}
// 發狂：以「依戀對象」為單位切換（每個依戀對象可分別發狂）
function isMad(u){ return u.attachments.some(a=>a.mad); }
// 自身發狂造成的自身最大行動值減少（如「依存：妳的最大行動值減少2」）
function madSelfReduce(u){
  let r=0;
  u.attachments.forEach(a=>{ if(a.mad){
    const e=a.madEffect||'';
    if(!/除了妳以外/.test(e)){ const m=e.match(/最大行動值減少(\d+)/); if(m) r+=parseInt(m[1],10); }
  }});
  return r;
}
// 本單位對「其他同陣營單位」造成的最大行動值減少（限「信賴：除了妳以外…減少1」）
function madOthersReduce(u){
  let r=0;
  u.attachments.forEach(a=>{ if(a.mad){
    const m=(a.madEffect||'').match(/除了妳以外.*?最大行動值減少(\d+)/); if(m) r+=parseInt(m[1],10);
  }});
  return r;
}
function externalPenalty(u){
  let p=0;
  state.units.forEach(o=>{ if(o!==u && o.side===u.side) p-=madOthersReduce(o); });
  return p;
}
function selfPenalty(u){ return -madSelfReduce(u); }
function effMax(u){ return baseMax(u) + selfPenalty(u) + externalPenalty(u); }

function partCount(u,loc){ // 未損傷數
  return u.parts[loc].filter(p=>!p.damaged).length;
}
function monsterCount(u){ return u.monsterParts.filter(p=>!p.damaged).length; }
// 單位所有部件皆損傷 → 完全解體
function allParts(u){ return isFlatEnemy(u) ? u.monsterParts : LOCS.flatMap(l=>u.parts[l]); }
function isDismantled(u){ const ps=allParts(u); return ps.length>0 && ps.every(p=>p.damaged); }

// 本刻度消耗 COST（已勾「使用」之技能/部件的可計算 COST 總和）
function roundCost(u){
  let c=0;
  u.skills.forEach(s=>{ if(s.used) c+=costNum(s.cost); });
  allParts(u).forEach(p=>{ if(p.used) c+=costNum(p.cost); });
  return c;
}

/* ================= STATE ================= */
const rnd = x=>Math.round(x);
// 目前刻度上「行動值＝刻度」的單位（即本刻度行動的單位）
function actingUnits(side){ return state.units.filter(u=>rnd(u.action)===state.tick && (!side||u.side===side)); }
// 某單位已勾「使用」且指定時機的技能＋部件
function usedItemsByTiming(u, timing){
  const out=[];
  u.skills.forEach(s=>{ if(s.used && s.timing===timing) out.push(s); });
  allParts(u).forEach(p=>{ if(p.used && p.timing===timing) out.push(p); });
  return out;
}
// 某單位所有時機為【行動】的技能＋部件（供「行動只能擇一」用）
function allActionItems(u){
  const out=[];
  u.skills.forEach(s=>{ if(s.timing==='行動') out.push(s); });
  allParts(u).forEach(p=>{ if(p.timing==='行動') out.push(p); });
  return out;
}
// 本刻度「有宣告行動」的單位（行動值＝刻度，且有勾選時機為【行動】的項目）
function declaredUnits(){ return actingUnits().filter(u=>usedItemsByTiming(u,'行動').length>0); }
function clearUsed(){
  state.units.forEach(u=>{ u.skills.forEach(s=>{s.used=false;s.costApplied=false;});
    LOCS.forEach(l=>u.parts[l].forEach(p=>{p.used=false;p.costApplied=false;}));
    u.monsterParts.forEach(p=>{p.used=false;p.costApplied=false;}); u.target=null; });
}
// 本刻度尚未扣過的「使用」COST（使用勾選可跨刻度保留，故以 costApplied 避免重複扣除）
function pendingCost(u){
  let c=0;
  u.skills.forEach(s=>{ if(s.used&&!s.costApplied) c+=costNum(s.cost); });
  allParts(u).forEach(p=>{ if(p.used&&!p.costApplied) c+=costNum(p.cost); });
  return c;
}
function markCostApplied(u){
  u.skills.forEach(s=>{ if(s.used) s.costApplied=true; });
  allParts(u).forEach(p=>{ if(p.used) p.costApplied=true; });
}
const state = {
  round:1, tick:10,
  units:[],
  flow:{}, // key->bool
  rolls:{}, // unitId -> 大成功/成功/失敗/大失敗
  log:[], // 每刻度的戰鬥流程紀錄（不覆蓋）
  tab:'ally',
  edit:false,
  selAlly:null, selEnemy:null,
  selectedId:null
};

/* ================= BATTLE ACTIONS ================= */
function maxTickOnField(){
  const vals = state.units.map(u=>Math.round(u.action));
  return vals.length ? Math.max(...vals) : 10;
}
function refreshField(){
  state.units.forEach(u=>{ u.position=u.initPos;
    LOCS.forEach(l=>u.parts[l].forEach(p=>{p.damaged=false;p.used=false;p.dmgKey=null;p.dmgBy=null;}));
    u.monsterParts.forEach(p=>{p.damaged=false;p.used=false;p.dmgKey=null;p.dmgBy=null;});
    u.skills.forEach(s=>s.used=false);
  });
  state.units.forEach(u=>{ u.action=effMax(u); u.appliedMax=effMax(u); });
  state.round=1; state.flow={}; state.rolls={}; state.log=[]; state.tick=maxTickOnField();
  render();
}
// 記錄目前 ROUND／刻度的戰鬥流程最終狀態（行動→擲骰→裁判→傷害→本刻度COST）
function captureLog(){ state.log.push(buildFlowRecord()); }
// 進入下一輪的實際邏輯（不含紀錄）：現在行動值 ＋ 最大行動值（COST 已於各刻度扣除）
function _advanceRound(){
  state.units.forEach(u=>{ u.action = u.action + effMax(u); u.appliedMax = effMax(u); });
  clearUsed();
  state.round++; state.flow={}; state.rolls={}; state.tick=maxTickOnField();
  render();
}
function nextRound(){                       // 按鈕：先記錄目前刻度，再進入下一輪
  captureLog();
  _advanceRound();
}
// 進入下一刻度：套用待套用的最大行動值減少量，扣除本刻度尚未扣過的 COST；
// 依 req1：僅重置流程勾選與擲骰結果，「使用」勾選保留（若因此級聯進入下一輪，才一併清空）。
function nextTick(){
  captureLog();                             // 先記錄目前 ROUND／刻度的流程
  state.units.forEach(u=>{
    const m=effMax(u); const pend=(u.appliedMax||0)-m;
    if(pend>0) u.action -= pend;          // 損失部件等造成的最大值下降 → 現在行動值同步下降
    u.appliedMax = m;
    u.action -= pendingCost(u);           // 扣除本刻度尚未扣過的使用 COST
    markCostApplied(u);
  });
  state.flow={}; state.rolls={};          // 重置流程與擲骰（使用勾選保留）
  const vals = state.units.map(u=>rnd(u.action));
  const below = vals.filter(v=> v<state.tick && v>0 );
  const allBelowZero = vals.length>0 && vals.every(v=> v<=0 );
  if(below.length===0 || allBelowZero){
    // 無下一個可行動刻度、或全部單位行動值皆在 0 以下 → 自動進入下一輪（不重複記錄）
    _advanceRound();
    return;
  }
  state.tick = Math.max(...below);
  render();
}

/* ================= RENDER ================= */
function render(){ renderTop(); renderFlow(); renderBattlefield(); renderBottom(); }

function renderTop(){
  const allies=state.units.filter(u=>u.side==='ally').length;
  const foes=state.units.filter(u=>u.side==='enemy').length;
  $('#sumAlly').textContent=allies; $('#sumFoe').textContent=foes;
}

/* ----- left: flow ----- */
function renderFlow(){
  renderTop();
  const box=$('#flow'); box.innerHTML='';
  const noteLine=(t)=>box.appendChild(el('div','note','● '+t));
  const phaseH=(t)=>{ const h=el('div','phase-h'); h.appendChild(el('span',null,t)); box.appendChild(h); };
  const subNote=(t)=>box.appendChild(el('div','flow-sub','— '+t));
  const chkRow=(key,text,mk)=>{
    const done=!!state.flow[key];
    const row=el('label','chk'+(done?' done':''));
    const cb=el('input'); cb.type='checkbox'; cb.checked=done;
    cb.onchange=()=>{ state.flow[key]=cb.checked; renderFlow(); renderBottom(); };
    row.appendChild(cb);
    const sp=el('span'); if(mk){const m=el('b','mk');m.textContent='【'+mk+'】';sp.appendChild(m);}
    sp.appendChild(document.createTextNode(text));
    row.appendChild(sp); box.appendChild(row);
  };
  // 單位＋已勾選項目（帶效果提示）；無項目時顯示 idleText（可為空＝不顯示 idle）
  const unitItemsLine=(u, timing, idleText)=>{
    const items=usedItemsByTiming(u, timing);
    const row=el('div','flow-unit');
    row.appendChild(el('b','fu-name',u.name));
    if(!items.length){ if(idleText){ row.appendChild(el('span','fu-idle','　'+idleText)); } }
    else{
      row.appendChild(document.createTextNode('　使用 '));
      items.forEach((it,i)=>{
        const s=el('span','fu-item',it.name); s.setAttribute('data-tip', it.effect||'（無效果說明）');
        row.appendChild(s);
        if(i<items.length-1) row.appendChild(document.createTextNode('、'));
      });
    }
    return row;
  };
  // 行動階段：選擇行動後可挑選目標（敵方挑我方、我方挑敵方），可搜尋下拉
  const buildTargetPicker=(u)=>{
    const foes=state.units.filter(x=>x.side!==u.side);
    const wrap=el('div','search-select tgt');
    const inp=el('input','ss-input'); inp.type='text';
    inp.placeholder=(u.side==='ally'?'選擇敵方目標…':'選擇我方目標…');
    const cur=u.target? state.units.find(x=>x.id===u.target):null;
    if(cur) inp.value=cur.name;
    const list=el('div','ss-list');
    const draw=(f)=>{ list.innerHTML=''; const q=(f||'').trim().toLowerCase();
      const ms=foes.filter(x=>!q||x.name.toLowerCase().includes(q));
      if(!ms.length){ list.appendChild(el('div','ss-empty','（無可選目標）')); return; }
      ms.forEach(x=>{ const o=el('div','ss-opt'); o.appendChild(el('span','ss-nm',x.name));
        if(x.position) o.appendChild(el('span','ss-meta',x.position));
        o.onmousedown=(ev)=>{ ev.preventDefault(); u.target=x.id; renderFlow(); };
        list.appendChild(o); });
    };
    inp.onfocus=()=>{ draw(inp.value); list.classList.add('open'); };
    inp.oninput=()=>{ draw(inp.value); list.classList.add('open'); };
    inp.onblur=()=>{ setTimeout(()=>list.classList.remove('open'),160); };
    wrap.appendChild(inp); wrap.appendChild(list);
    return wrap;
  };
  const actionDeclBlock=(u)=>{
    const wrap=el('div','flow-decl');
    wrap.appendChild(unitItemsLine(u,'行動','待機'));
    if(usedItemsByTiming(u,'行動').length){          // 已選擇行動 → 顯示目標選擇
      const row=el('div','tgt-row');
      row.appendChild(el('span','tgt-label','目標：'));
      row.appendChild(buildTargetPicker(u));
      wrap.appendChild(row);
    }
    return wrap;
  };
  noteLine('戰鬥最初：進行戰鬥相關動作【自動】宣告');

  // ── 行動階段 ──
  phaseH('行動階段');
  subNote('可進行動作【行動】宣告');                         // req8 說明文字
  chkRow('a1','敵方宣告動作');
  actingUnits('enemy').forEach(u=> box.appendChild(actionDeclBlock(u)) );
  chkRow('a2','我方宣告動作');
  actingUnits('ally').forEach(u=> box.appendChild(actionDeclBlock(u)) );
  chkRow('a3','宣告結束','行動');                            // req8：顯示為「【行動】宣告結束」，勾選後鎖定【行動】使用

  // ── 擲骰階段 ──
  phaseH('擲骰階段');
  subNote('進行動作判定');                                    // req7 說明文字
  if(state.flow.a3){                                          // 完成行動宣告後，列出擲骰單選
    const decl=declaredUnits();
    if(decl.length){
      decl.forEach(u=>{
        const rr=el('div','roll-row');
        rr.appendChild(el('b','roll-name',u.name));
        const opts=el('div','roll-opts');
        ['大成功','成功','失敗','大失敗'].forEach(o=>{
          const b=el('button','roll-opt'+(state.rolls[u.id]===o?' on '+({'大成功':'r-crit','成功':'r-ok','失敗':'r-bad','大失敗':'r-fumble'}[o]):''),'「'+o+'」');
          b.onclick=()=>{ state.rolls[u.id]=o; renderFlow(); };
          opts.appendChild(b);
        });
        rr.appendChild(opts); box.appendChild(rr);
      });
    } else box.appendChild(el('div','flow-empty','（本刻度無宣告行動的單位）'));
  }
  chkRow('b1','動作判定處理完成');                            // req7 改名

  // ── 裁判階段 ──
  phaseH('裁判階段');
  subNote('可進行動作【裁判】影響擲骰結果');                     // req4 說明文字
  if(state.flow.b1){                                          // 完成擲骰後，列出【裁判】使用項目
    let any=false;
    actingUnits().forEach(u=>{
      if(usedItemsByTiming(u,'裁判').length){ any=true; box.appendChild(unitItemsLine(u,'裁判','')); }
    });
    if(!any) box.appendChild(el('div','flow-empty','（無勾選【裁判】時機的項目）'));
  }
  chkRow('c1','宣告結束','裁判');                              // req4：顯示為「【裁判】宣告結束」，勾選後鎖定【裁判】使用

  // ── 傷害階段 ──
  phaseH('傷害階段');
  subNote('NC 進行傷害計算（此階段扣除敵我單位 HP／部件）');   // req11 說明文字
  subNote('可進行時機為【傷害】的動作，影響指定動作的傷害結果'); // req5 說明文字
  if(state.flow.c1){                                          // 完成裁判後，列出大成功/成功單位傷害加總
    const winners=declaredUnits().filter(u=>state.rolls[u.id]==='大成功'||state.rolls[u.id]==='成功');
    if(winners.length){
      const key=state.round+':'+state.tick;
      const nameOf=id=>{ const t=state.units.find(x=>x.id===id); return t?t.name:''; };
      let grand=0;
      winners.forEach(u=>{
        const atk=usedItemsByTiming(u,'行動').filter(it=>it.dmg>0);
        const byType={}; atk.forEach(p=>{ byType[p.atkType||'—']=(byType[p.atkType||'—']||0)+p.dmg; });
        const sum=atk.reduce((s,p)=>s+p.dmg,0); grand+=sum;
        const tgt=u.target? state.units.find(x=>x.id===u.target):null;
        const r=el('div','dmg-row');
        r.appendChild(el('b','dmg-name',u.name+'（'+state.rolls[u.id]+'）'));
        const detail=Object.entries(byType).map(([t,v])=>`${t} ${v}`).join('、');
        r.appendChild(el('span','dmg-val',(tgt?`　→${tgt.name}`:'')+'　傷害 '+sum+(detail?`（${detail}）`:'')));
        box.appendChild(r);
        // 攻擊目標的損傷部件勾選（本刻度・僅計入本攻擊方 u 指定的部件）
        if(!tgt){ box.appendChild(el('div','flow-empty','　（未指定攻擊目標，無法指定損傷部件）')); return; }
        const mineCount=allParts(tgt).filter(p=>p.damaged && p.dmgKey===key && p.dmgBy===u.id).length;
        const assign=el('div','dmg-assign');
        assign.appendChild(el('div','dmg-assign-h', `${tgt.name} 損傷部件（${u.name} 本刻度已指定 ${mineCount} / 傷害值 ${sum}）`));
        const grid=el('div','dmg-parts');
        allParts(tgt).forEach(p=>{
          const mine       = p.damaged && p.dmgKey===key && p.dmgBy===u.id;         // 本攻擊方本刻度指定 → 可改、計入
          const otherTick  = p.damaged && p.dmgKey!==key;                            // 他刻度既有損傷
          const otherOwner = p.damaged && p.dmgKey===key && p.dmgBy!==u.id;          // 本刻度由其他攻擊方／詳情指定
          const locked = otherTick || otherOwner;                                    // 同步顯示、但不可由本攻擊方更動、不計入本攻擊方
          let suffix=''; if(otherTick) suffix='（既有）'; else if(otherOwner) suffix = p.dmgBy? `（${nameOf(p.dmgBy)}）` : '（詳情指定）';
          const lab=el('label','dmg-part'+(p.damaged?' on':'')+(locked?' old':''));
          const cb=el('input'); cb.type='checkbox'; cb.checked=!!p.damaged; cb.disabled=locked;
          cb.setAttribute('data-tip', locked ? (otherTick?'其他刻度既有損傷':'本刻度由其他來源指定，僅同步顯示、不計入本攻擊方') : '勾選＝本攻擊方於本刻度指定此部件損傷');
          cb.onchange=()=>{ if(cb.checked){ p.damaged=true; p.dmgKey=key; p.dmgBy=u.id; } else { p.damaged=false; p.dmgKey=null; p.dmgBy=null; }
            renderFlow(); renderBottom(); };
          lab.appendChild(cb); lab.appendChild(el('span',null,p.name+suffix));
          grid.appendChild(lab);
        });
        assign.appendChild(grid);
        if(mineCount>sum) assign.appendChild(el('div','dmg-warn',
          `⚠ ${u.name} 本刻度已勾選 ${mineCount} 個損傷部件，超過傷害值 ${sum}，請修正為 ${sum} 個。`));
        box.appendChild(assign);
      });
      const tot=el('div','dmg-total'); tot.innerHTML=`合計傷害：<b>${grand}</b>`; box.appendChild(tot);
    } else box.appendChild(el('div','flow-empty','（本刻度無「大成功／成功」的單位）'));
  }
  chkRow('d2','宣告結束','傷害');                              // req5：顯示為「【傷害】宣告結束」

  // ── 本回合 COST 計算 ──
  phaseH('本刻度 COST 計算');
  const cb=el('div','cost-box');
  const rowsFor=(arr,label)=>{
    if(!arr.length) return;
    const hd=el('div','cost-hint',label); hd.style.margin='2px 0 4px'; hd.style.fontWeight='700'; cb.appendChild(hd);
    arr.forEach(u=>{
      const c=pendingCost(u); const cur=rnd(u.action); const rem=cur-c;
      const r=el('div','cost-row');
      r.appendChild(el('div','nm',u.name));
      const calc=el('div','calc');
      calc.innerHTML=`<b>${cur}</b> − <span class="c">${c}</span> = <span class="r">${rem}</span>`;
      r.appendChild(calc); cb.appendChild(r);
    });
  };
  rowsFor(state.units.filter(u=>u.side==='ally'),'我方');
  rowsFor(state.units.filter(u=>u.side==='enemy'),'敵方');
  if(!state.units.length) cb.appendChild(el('div','cost-hint','（尚無單位）'));
  box.appendChild(cb);
  box.appendChild(el('div','cost-hint','＊進入「下一刻度」時，行動值＝現在行動值−本刻度尚未扣除的使用COST（使用勾選會保留）；到最低刻度後進入「下一輪」時，再加最大行動值並清空使用勾選。'));
}

/* ----- battlefield ----- */
const iconOK={};  // url -> true/false（false＝載入失敗，改用底色+名稱）
function ensureIcon(u){
  if(!u.icon || (u.icon in iconOK)) return;
  iconOK[u.icon]=undefined;
  const img=new Image();
  img.onload=()=>{ iconOK[u.icon]=true; };
  img.onerror=()=>{ iconOK[u.icon]=false; renderBattlefield(); renderBottom(); };
  img.src=u.icon;
}
function iconUsable(u){ return !!u.icon && iconOK[u.icon]!==false; }
function avatarStyle(u){
  ensureIcon(u);
  if(iconUsable(u)){ return `background-image:url('${u.icon.replace(/'/g,"%27")}');background-size:contain;background-repeat:no-repeat;background-position:center`; }
  return `background:${u.color}`;
}
function avatarText(u){ return iconUsable(u)?'':(u.name||'?').slice(0,1); }

function renderBattlefield(){
  $('#roundNum').textContent=state.round;
  $('#tickNum').textContent=state.tick;
  // side lists
  renderSideList('enemy'); renderSideList('ally');
  renderGrid();
}

function renderSideList(side){

    const dism=isDismantled(u);

    const card=el('div','ucard'+(state.selectedId===u.id?' sel':'')+(mad?' mad':'')+(dism?' dismantled':''));
    // top row：ICON + 名稱 + 手動排序（怪物亦顯示預設頭像）
    const top=el('div','top');
    const hasLoc = side==='ally' || u.enemyType==='intelligent';
    const av=el('div','avatar'); av.setAttribute('style',avatarStyle(u)); av.textContent=avatarText(u); top.appendChild(av);
    const nm=el('div','nm',u.name); nm.setAttribute('data-tip','點擊於下方檢視詳細'); nm.onclick=()=>selectUnit(u); top.appendChild(nm);
    const btns=el('div','rowbtns');

    const dn=el('button','mini','↓'); dn.setAttribute('data-tip','下移'); dn.onclick=()=>moveUnit(u,1);
    btns.appendChild(up); btns.appendChild(dn); top.appendChild(btns);
    card.appendChild(top);
    if(side==='enemy'){
      const lbl=u.enemyType==='intelligent'?'智慧體':(u.enemyType==='group'?'集團':'怪物');
      const cls=u.enemyType==='intelligent'?'chishi':(u.enemyType==='group'?'shudan':'kaibutsu');
      card.appendChild(el('div','kind '+cls, lbl));
    } else {
      const bits=[];
      if(u.tendency) bits.push(u.tendency);
      if(u.mainType) bits.push(u.mainType+(u.subType?'／'+u.subType:''));
      if(bits.length) card.appendChild(el('div','kind tendency', bits.join(' | ')));

    // 單列：頭 手 軀幹 腳 行動值 位置選單

      LOCS.forEach(l=>{ const n=partCount(u,l); const c=el('div','pc'+(n===0?' zero':''));
        c.innerHTML=`${l}<b>${n}</b>`; line.appendChild(c); });
    } else {

      c.innerHTML=`${u.enemyType==='group'?'集團':'部件'}<b>${n}</b>`; line.appendChild(c);
    }

    inp.onchange=()=>{ u.action=parseInt(inp.value||'0',10)||0;
      if(isGroup(u)) u.flatMax=u.action;   // 僅集團以行動值同步其自訂最大行動值
      u.appliedMax=effMax(u);
      renderBattlefield(); renderFlow(); };
    avbox.appendChild(inp); line.appendChild(avbox);
    const sel=el('select');
    POSITIONS.forEach(p=>{const o=el('option',null,p);o.value=p;if(p===u.position)o.selected=true;sel.appendChild(o);});
    sel.onchange=()=>{ u.position=sel.value; renderGrid(); };

    if(dism) card.appendChild(el('div','status-dismantled','完全解體'));
    // 發狂：僅我方，一個依戀對象一個小標籤（敵方單位無發狂標籤）
    if(side==='ally' && u.attachments.length){

        eff.setAttribute('data-tip','依戀對象：'+(a.target||'—'));
        card.appendChild(eff);
      });

    wrap.appendChild(card);
  });
}

function renderGrid(){
  const wrap=$('#gridWrap'); wrap.innerHTML='';
  const ticks=[]; for(let t=TICK_HI;t>=TICK_LO;t--) ticks.push(t);
  // 棋子改為 1:1 正方形，預設 30px；若整盤在此欄寬內會太寬，退回 25px，
  // 並由 grid-wrap 的 overflow 夾住，永遠不與左右兩側清單重疊。
  const LABEL_W=34, GAP=6, n=ticks.length;   // GAP 加寬，讓選取外框不會被相鄰格切掉
  const avail = wrap.clientWidth || 640;
  const fits = t => (LABEL_W + n*(t+GAP)) <= avail;
  const TOK = fits(30) ? 30 : 25;
  const CELL = TOK + GAP;
  const ROW = Math.max(46, TOK + 14);
  const grid=el('div','grid');
  grid.style.gridTemplateColumns=`${LABEL_W}px repeat(${n},${CELL}px)`;
  grid.style.gridTemplateRows=`26px repeat(${POSITIONS.length}, minmax(${ROW}px,auto))`;
  // corner
  const corner=el('div','rcell corner'); corner.style.gridColumn='1'; corner.style.gridRow='1';
  corner.textContent='刻度'; grid.appendChild(corner);
  // ruler
  ticks.forEach((t,i)=>{
    const c=el('div','rcell'+(t<=0?' dead':'')+(t===state.tick?' cur':''));
    c.style.gridColumn=(i+2); c.style.gridRow='1'; c.textContent=t;
    if(t<=0) c.setAttribute('data-tip','不可行動的領域');
    grid.appendChild(c);
  });
  // band rows
  POSITIONS.forEach((pos,pi)=>{
    const lab=el('div','blabel '+POS_CLASS[pos]); lab.style.gridColumn='1'; lab.style.gridRow=(pi+2);
    lab.appendChild(document.createTextNode(pos));
    grid.appendChild(lab);
    ticks.forEach((t,i)=>{
      const cell=el('div','cell '+POS_CLASS[pos]+(t<=0?' dead':'')+(t===state.tick?' curcol':''));
      cell.style.gridColumn=(i+2); cell.style.gridRow=(pi+2);
      cell.dataset.pos=pos; cell.dataset.tick=t;
      if(t<=0) cell.setAttribute('data-tip','不可行動的領域');
      grid.appendChild(cell);
    });
  });
  wrap.appendChild(grid);
  // place tokens（1:1 正方形棋子）
  const tokStyle = u => `${avatarStyle(u)};width:${TOK}px;height:${TOK}px;font-size:${Math.round(TOK*0.42)}px`;
  state.units.forEach(u=>{
    let t=Math.round(u.action); if(t>TICK_HI)t=TICK_HI; if(t<TICK_LO)t=TICK_LO;
    const cell=grid.querySelector(`.cell[data-pos="${u.position}"][data-tick="${t}"]`);
    if(!cell) return;
    const tok=el('div','token '+(u.side==='enemy'?'foe':'ally')+(isMad(u)?' mad':'')+(isDismantled(u)?' dismantled':'')+(state.selectedId===u.id?' sel':''));
    tok.setAttribute('style',tokStyle(u)); tok.textContent=avatarText(u);
    tok.setAttribute('data-tip',`${u.name}（${u.position}・行動值 ${Math.round(u.action)}${isDismantled(u)?'・完全解體':''}）`);
    tok.onclick=()=>selectUnit(u);
    cell.style.position='relative';
    if(state.selectedId===u.id) cell.style.zIndex='4';          // 選取外框
    else if(isMad(u)||isDismantled(u)) cell.style.zIndex='3';   // 發狂／解體角標不被相鄰格遮住
    cell.appendChild(tok);
  });
}

/* 可搜尋的下拉式選單（編輯時新增技能／部件用） */
function buildSearchAdd(kind, onPick, unit, loc){
  let names=(kind==='skill')?Object.keys(skillByName):Object.keys(partByName);
  if(kind==='part'){
    if(unit && unit.side==='ally'){
      // 我方單位不能加入部件等級含「惡意」的部件
      names=names.filter(n=>!(partByName[n] && String(partByName[n]['部件等級']||'').includes('惡意')));
    }
    // 部位過濾：頭／手／軀幹／腳 各表只接受該部位或「任意」的部件；flat（怪物／集團，loc='monster'）不過濾
    if(LOCS.includes(loc)){
      names=names.filter(n=>{ const bw=String((partByName[n]||{})['部位']||''); return bw===loc || bw==='任意'; });
    }
    // req5：不能選擇已加入過的部件（同單位所有部位／怪物清單）
    if(unit){
      const owned=new Set((isFlatEnemy(unit)? unit.monsterParts : LOCS.flatMap(l=>unit.parts[l])).map(p=>p.name));
      names=names.filter(n=>!owned.has(n));
    }
  }
  if(kind==='skill' && unit){
    // req3：敵方智慧體可選擇任何傾向／類型的技能（略過過濾）；其餘依傾向／類型／特化過濾
    const anySkill = unit.side==='enemy' && unit.enemyType==='intelligent';
    if(!anySkill){
      names=names.filter(n=>{
        const db=skillByName[n]||{};
        const cat=String(db['類別']||''), owner=String(db['所屬']||''), spec=String(db['特化']||'');
        if(spec.includes('特化'))            // 特化：主要類型與輔助類型皆需等於該技能所屬
          return unit.mainType===owner && unit.subType===owner;
        if(cat==='傾向') return unit.tendency===owner;              // 傾向技能：單位傾向須相符
        if(cat==='類型') return unit.mainType===owner || unit.subType===owner;  // 類型技能：主要或輔助類型相符
        return true;                                               // 其他類別不限制
      });
    }
    // req4：不能選擇已加入過的技能
    const owned=new Set(unit.skills.map(s=>s.name));
    names=names.filter(n=>!owned.has(n));
  }
  // 每個項目的補充資訊（可一併被搜尋，並在選項右側以淡色顯示）
  const meta=n=> kind==='part'
    ? String((partByName[n]||{})['部件等級']||'')
    : (String((skillByName[n]||{})['所屬']||'') + (String((skillByName[n]||{})['特化']||'').includes('特化')?' ★特化':''));
  const wrap=el('div','search-select');
  const inp=el('input','ss-input'); inp.type='text';
  inp.placeholder=(kind==='skill'?'搜尋技能名稱／所屬…':'搜尋部件名稱／等級（例：惡意）…');
  const list=el('div','ss-list');
  const draw=(f)=>{
    list.innerHTML=''; const q=(f||'').trim().toLowerCase();
    const ms=names.filter(n=>!q || n.toLowerCase().includes(q) || meta(n).toLowerCase().includes(q));
    if(!ms.length){ list.appendChild(el('div','ss-empty','（無相符項目）')); return; }
    ms.slice(0,60).forEach(n=>{ const o=el('div','ss-opt');
      o.appendChild(el('span','ss-nm',n));
      const m=meta(n); if(m) o.appendChild(el('span','ss-meta',m));
      o.onmousedown=(ev)=>{ ev.preventDefault(); onPick(n); };
      list.appendChild(o); });
    if(ms.length>60) list.appendChild(el('div','ss-empty',`（尚有 ${ms.length-60} 項，請再輸入以縮小範圍）`));
  };
  inp.onfocus=()=>{ draw(inp.value); list.classList.add('open'); };
  inp.oninput=()=>{ draw(inp.value); list.classList.add('open'); };
  inp.onblur=()=>{ setTimeout(()=>list.classList.remove('open'),160); };
  inp.onkeydown=(e)=>{ if(e.key==='Enter'){ const q=inp.value.trim().toLowerCase(); if(!q) return;
    const pick=names.find(n=>n.toLowerCase()===q)
             ||names.find(n=>n.toLowerCase().includes(q)||meta(n).toLowerCase().includes(q));
    if(pick) onPick(pick); } };
  wrap.appendChild(inp); wrap.appendChild(list);
  return wrap;
}

function buildTable(title, items, kind, u, loc){
  const blk=el('div','blk');
  const h=el('div','blk-h'); h.appendChild(el('span',null,title));
  if(kind==='part'){
    const n=(loc==='monster')?monsterCount(u):partCount(u,loc);
    const total=items.length;
    const num=el('div','bignum'); num.innerHTML=`未損傷 <b>${n}</b> / ${total}`;
    h.appendChild(num);
  }
  blk.appendChild(h);
  const addRowEl=()=>{ const addrow=el('div','addrow');
    addrow.appendChild(buildSearchAdd(kind, name=>{
      if(kind==='skill') items.push(lookupSkill(name)); else items.push(lookupPart(name));
      render();
    }, u, loc));
    return addrow; };
  if(!items.length){
    blk.appendChild(el('div','empty-blk','（無）'));
    if(state.edit) blk.appendChild(addRowEl());   // req2：無技能／部件的單位也能新增
    return blk;
  }
  const tbl=el('table','tbl');
  const thead=el('tr');
  // 損傷欄：部件顯示「損傷」，技能留空以維持與部件表格的欄位對齊
  thead.appendChild(Object.assign(el('th','c-chk'),{textContent:kind==='part'?'損傷':''}));
  thead.appendChild(Object.assign(el('th','c-chk'),{textContent:'使用'}));

  thead.appendChild(Object.assign(el('th','c-co'),{textContent:'COST'}));
  thead.appendChild(Object.assign(el('th','c-rg'),{textContent:'射程'}));
  thead.appendChild(Object.assign(el('th'),{textContent:'效果'}));
  if(kind==='part') thead.appendChild(Object.assign(el('th','c-lv'),{textContent:'等級'}));
  if(state.edit) thead.appendChild(Object.assign(el('th','c-del'),{textContent:'刪除'}));
  tbl.appendChild(thead);
  items.forEach(it=>{
    const tr=el('tr', (it.damaged?'dmg ':'')+(it.used?'used-on':''));
    if(kind==='part'){
      const td=el('td','c-chk'); const c=el('input');c.type='checkbox';c.checked=it.damaged;
      c.setAttribute('data-tip','損傷（勾選後戰場對應部件數量−1）');
      c.onchange=()=>{ it.damaged=c.checked;
        // 詳情表格的損傷屬「手動指定」：標記本刻度但無歸屬（dmgBy=null），不計入任何攻擊方的指定數
        it.dmgKey = c.checked ? (state.round+':'+state.tick) : null;
        it.dmgBy = null;
        if(it.damaged)it.used=false;
        render(); }; // 最大行動值即時更新，但現在行動值改於「下一刻度」時才刷新
      td.appendChild(c); tr.appendChild(td);
    } else {
      tr.appendChild(el('td','c-chk')); // 技能：損傷欄留空（對齊用）
    }
    const tdu=el('td','c-chk'); const cu=el('input');cu.type='checkbox';cu.checked=it.used;
    const lockAction = it.timing==='行動' && !!state.flow.a3;   // 【行動】宣告結束後鎖定
    const lockJudge  = it.timing==='裁判' && !!state.flow.c1;   // 【裁判】宣告後鎖定
    cu.disabled = !!it.damaged || lockAction || lockJudge;
    cu.setAttribute('data-tip', (lockAction||lockJudge) ? ('本階段已宣告結束，無法變更【'+it.timing+'】時機的使用') : '使用（計入本刻度 COST）');
    cu.onchange=()=>{
      if(it.timing==='行動'){                        // 行動只能擇一：選新的即取消其他
        if(cu.checked){
          allActionItems(u).forEach(x=>{ if(x!==it){ x.used=false; x.costApplied=false; } });
          it.used=true;
        } else { it.used=false; }
        renderBottom(); renderFlow();                 // 整體重繪以更新其他【行動】核取與目標選擇
        return;
      }
      it.used=cu.checked; renderFlow();
      const tr2=cu.closest('tr'); if(tr2) tr2.className=(it.damaged?'dmg ':'')+(it.used?'used-on':'');
    };
    tdu.appendChild(cu); tr.appendChild(tdu);
    const tdn=el('td','c-nm'); const nm=el('div','nm',it.name); tdn.appendChild(nm);
    if(it.tag){ const g=el('div','tag','◈ '+it.tag); tdn.appendChild(g); }
    tr.appendChild(tdn);
    tr.appendChild(Object.assign(el('td','c-tm'),{textContent:it.timing}));
    const tdc=el('td','co c-co'); tdc.innerHTML = costHas(it.cost)?`<b>${it.cost}</b>`:esc(it.cost); tr.appendChild(tdc);
    tr.appendChild(Object.assign(el('td','c-rg'),{textContent:it.range}));
    tr.appendChild(Object.assign(el('td','ef'),{textContent:it.effect}));
    if(kind==='part') tr.appendChild(Object.assign(el('td','lv c-lv'),{textContent:it.level}));
    if(state.edit){
      const tdd=el('td','c-del'); const del=el('button','mini del','刪除');
      del.onclick=()=>{ const i=items.indexOf(it); if(i>=0) items.splice(i,1); render(); };
      tdd.appendChild(del); tr.appendChild(tdd);
    }
    tbl.appendChild(tr);
  });
  blk.appendChild(tbl);
  if(state.edit) blk.appendChild(addRowEl());
  return blk;
}

function moveUnit(u,dir){
  const arr=state.units; const i=arr.indexOf(u);
  // 只在同陣營相鄰單位間交換
  let j=i+dir;
  while(j>=0&&j<arr.length&&arr[j].side!==u.side) j+=dir;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  renderBattlefield();
}
function removeUnit(u){
  state.units=state.units.filter(x=>x!==u);
  if(state.selectedId===u.id) state.selectedId=null;
  render();
}

/* ---- load database folder（熱抽換 部件／技能／依戀／傾向） ---- */
function reresolveUnit(u){
  u.skills = u.skills.map(s=>{ const n=lookupSkill(s.name); n.used=s.used; return n; });
  const remap = p=>{ const tok=p.tag?(p.name+'^'+p.tag):p.name; const n=lookupPart(tok);
    n.used=p.used; n.damaged=p.damaged; return n; };
  LOCS.forEach(l=>{ u.parts[l]=u.parts[l].map(remap); });
  u.monsterParts=u.monsterParts.map(remap);
  u.action=effMax(u);
}
function loadDBFolder(fileList){
  const files=[...fileList].filter(f=>/\.csv$/i.test(f.name));
  if(!files.length){ alert('資料夾中找不到 CSV 檔。'); return; }
  const pick=(kw)=>files.find(f=>f.name.replace(/\.csv$/i,'').includes(kw));
  const map={ parts:pick('部件'), skills:pick('技能'), attach:pick('依戀'), tend:pick('傾向') };
  const found=Object.entries(map).filter(([,f])=>f);
  if(!found.length){ alert('未辨識到 部件／技能／依戀／傾向 任何一個資料庫檔（請確認檔名含這些字）。'); return; }
  const texts={};
  let pending=found.length;
  found.forEach(([key,f])=>{
    const rd=new FileReader();
    rd.onload=()=>{ texts[key]=rd.result; if(--pending===0) applyDB(); };
    rd.onerror=()=>{ if(--pending===0) applyDB(); };
    rd.readAsText(f,'utf-8');
  });
  function applyDB(){
    buildDB(texts.parts, texts.skills, texts.attach, texts.tend);
    state.units.forEach(reresolveUnit);
    render();
    const label=n=>({parts:'部件',skills:'技能',attach:'依戀',tend:'傾向'}[n]);
    alert('已載入資料庫：'+Object.keys(texts).map(label).join('、')+'。\n現有單位的技能／部件資料已依新資料庫重新對應。');
  }
}

/* ---- resizable splitter（戰場 / 單位資訊 高度） ---- */
function initSplitter(){
  const sp=$('#splitter'), bf=$('.bf'), right=$('.right');
  if(!sp||!bf||!right) return;
  let dragging=false;
  const clamp=(h)=>{ const min=150, max=right.getBoundingClientRect().height-150;
    return Math.max(min, Math.min(max, h)); };
  sp.addEventListener('pointerdown',e=>{
    dragging=true; sp.classList.add('drag'); sp.setPointerCapture(e.pointerId);
    document.body.style.userSelect='none'; e.preventDefault();
  });
  sp.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const top=bf.getBoundingClientRect().top;
    bf.style.height=clamp(e.clientY-top)+'px';
  });
  const end=e=>{ if(!dragging) return; dragging=false; sp.classList.remove('drag');
    document.body.style.userSelect=''; try{sp.releasePointerCapture(e.pointerId);}catch(_){} };
  sp.addEventListener('pointerup',end);
  sp.addEventListener('pointercancel',end);
}

/* ---- cursor-following tooltip（黑底白字 13px，隨游標移動） ---- */
function initTooltip(){
  const tip=el('div','cursor-tip'); document.body.appendChild(tip);
  document.addEventListener('mousemove',e=>{
    const t=e.target.closest('[data-tip]');
    if(t){ tip.textContent=t.getAttribute('data-tip'); tip.style.display='block';
      let x=e.clientX+14, y=e.clientY+16;
      const w=tip.offsetWidth, h=tip.offsetHeight;
      if(x+w>window.innerWidth-6) x=e.clientX-w-12;
      if(y+h>window.innerHeight-6) y=e.clientY-h-12;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    } else tip.style.display='none';
  });
  document.addEventListener('mouseleave',()=>{ tip.style.display='none'; });
}

function normalizeUnit(u){
  u.parts = u.parts || {頭:[],手:[],軀幹:[],腳:[]};
  LOCS.forEach(l=>{ if(!Array.isArray(u.parts[l])) u.parts[l]=[]; });
  if(!Array.isArray(u.monsterParts)) u.monsterParts=[];
  if(!Array.isArray(u.skills)) u.skills=[];
  if(!Array.isArray(u.attachments)) u.attachments=[];
  const fixItem=it=>{ it.used=!!it.used; it.costApplied=!!it.costApplied; };
  u.skills.forEach(fixItem);
  [...u.monsterParts, ...LOCS.flatMap(l=>u.parts[l])].forEach(p=>{ fixItem(p); p.damaged=!!p.damaged; if(p.dmgKey===undefined)p.dmgKey=null; if(p.dmgBy===undefined)p.dmgBy=null; });
  if(u.appliedMax==null) u.appliedMax=baseMax(u);
  if(u.target===undefined) u.target=null;
  return u;
}
function importBattle(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const s=JSON.parse(rd.result);
      if(!s || !Array.isArray(s.units)) throw new Error('檔案格式不符（缺少單位資料）');
      state.units = s.units.map(normalizeUnit);
      state.round = s.round||1; state.tick = (s.tick!=null)? s.tick : maxTickOnField();
      state.flow = s.flow||{}; state.rolls = s.rolls||{}; state.log = Array.isArray(s.log)?s.log:[];
      state.tab = s.tab||'ally';
      state.selAlly = s.selAlly||null; state.selEnemy = s.selEnemy||null; state.selectedId = s.selectedId||null;
      state.edit = false;
      state.units.forEach(u=>{ const n=parseInt(String(u.id||'').replace(/\D/g,''),10); if(n>=_uid) _uid=n+1; });
      render();
      alert(`已載入戰鬥存檔（ROUND ${state.round}、刻度 ${state.tick}，單位 ${state.units.length}）。`);
    }catch(err){ alert('匯入戰鬥存檔失敗：'+err.message); }
  };
  rd.readAsText(file,'utf-8');
}

/* ---- 戰場資訊文字（供檢視與匯出） ---- */
function buildFieldText(){
  const L=[];
  L.push('# NC 戰場資訊');
  L.push(`ROUND ${state.round}　刻度 ${state.tick}`);
  L.push('');
  const dump=(side,label)=>{
    const arr=state.units.filter(u=>u.side===side);
    if(!arr.length) return;
    L.push(`== ${label}（${arr.length}）==`);
    arr.forEach(u=>{
      const isM=isFlatEnemy(u);
      const flatLbl=u.enemyType==='group'?'集團':'部件';
      const counts=isM?`${flatLbl}${monsterCount(u)}`:LOCS.map(l=>`${l}${partCount(u,l)}`).join(' ');
      const kind=side==='enemy'?`[${u.enemyType==='intelligent'?'智慧體':(u.enemyType==='group'?'集團':'怪物')}] `:'';
      const typ=side==='ally'?`｜傾向:${u.tendency||'—'}｜類型:${u.mainType||'—'}${u.subType?'／'+u.subType:''}`:'';
      L.push(`- ${kind}${u.name}｜位置:${u.position}｜行動值:${Math.round(u.action)}｜最大:${effMax(u)}｜${counts}${typ}${isMad(u)?'｜★發狂':''}`);
    });
    L.push('');
  };
  dump('enemy','敵方單位'); dump('ally','我方單位');
  return L.join('\n');
}
// 擷取目前 ROUND／刻度的完整流程紀錄
function buildFlowRecord(){
  const nameOf=id=>{ const t=state.units.find(x=>x.id===id); return t?t.name:null; };
  const acts=[];
  ['enemy','ally'].forEach(side=>{
    actingUnits(side).forEach(u=>{
      const items=usedItemsByTiming(u,'行動').map(it=>it.name);
      acts.push({side, name:u.name, items, idle:items.length===0, target:u.target?nameOf(u.target):null});
    });
  });
  const rolls=[];
  declaredUnits().forEach(u=>{ if(state.rolls[u.id]) rolls.push({name:u.name, result:state.rolls[u.id]}); });
  const judges=[];
  actingUnits().forEach(u=>{ const js=usedItemsByTiming(u,'裁判').map(it=>it.name); if(js.length) judges.push({name:u.name, items:js}); });
  const damages=[]; let grand=0;
  declaredUnits().filter(u=>state.rolls[u.id]==='大成功'||state.rolls[u.id]==='成功').forEach(u=>{
    const atk=usedItemsByTiming(u,'行動').filter(it=>it.dmg>0);
    const byType={}; atk.forEach(p=>{ byType[p.atkType||'—']=(byType[p.atkType||'—']||0)+p.dmg; });
    const sum=atk.reduce((s,p)=>s+p.dmg,0); grand+=sum;
    damages.push({name:u.name, roll:state.rolls[u.id], total:sum, byType, target:u.target?nameOf(u.target):null});
  });
  const costs=[];
  ['ally','enemy'].forEach(side=>{ state.units.filter(u=>u.side===side).forEach(u=>{
    const c=pendingCost(u), cur=rnd(u.action); costs.push({side, name:u.name, cur, cost:c, rem:cur-c});
  });});
  return {round:state.round, tick:state.tick, acts, rolls, judges, damages, grand, costs, flags:{...state.flow}, ts:Date.now()};
}
function recordToText(r){
  const L=[];
  L.push(`【ROUND ${r.round}｜刻度 ${r.tick}】`);
  const en=r.acts.filter(a=>a.side==='enemy'), al=r.acts.filter(a=>a.side==='ally');
  const fmt=a=>`   ${a.name}：${a.idle?'待機':'使用 '+a.items.join('、')}${a.target?`　→目標：${a.target}`:''}`;
  L.push(' 〔行動階段〕');
  L.push('  敵方宣告動作：'+(en.length?'':'（無）')); en.forEach(a=>L.push(fmt(a)));
  L.push('  我方宣告動作：'+(al.length?'':'（無）')); al.forEach(a=>L.push(fmt(a)));
  L.push(' 〔擲骰階段〕'+(r.rolls.length?'':'　（無宣告單位）'));
  r.rolls.forEach(x=>L.push(`   ${x.name}：${x.result}`));
  L.push(' 〔裁判階段〕'+(r.judges.length?'':'　（無裁判項目）'));
  r.judges.forEach(x=>L.push(`   ${x.name}：使用 ${x.items.join('、')}`));
  L.push(' 〔傷害階段〕'+(r.damages.length?'':'　（無大成功／成功）'));
  r.damages.forEach(x=>{ const dt=Object.entries(x.byType).map(([t,v])=>`${t} ${v}`).join('、');
    L.push(`   ${x.name}（${x.roll}）${x.target?`→${x.target}`:''}：傷害 ${x.total}${dt?`（${dt}）`:''}`); });
  if(r.damages.length) L.push(`   合計傷害：${r.grand}`);
  L.push(' 〔本刻度 COST 計算〕');
  r.costs.forEach(c=>L.push(`   ${c.name}：${c.cur} − ${c.cost} = ${c.rem}`));
  return L.join('\n');
}
function buildFullExportText(){
  const parts=[buildFieldText()];
  parts.push('# 戰鬥流程紀錄'+(state.log.length?`（${state.log.length} 筆）`:'（尚無）'));
  parts.push('');
  state.log.forEach(r=>{ parts.push(recordToText(r)); parts.push(''); });
  return parts.join('\n');
}
function exportFieldAndLog(){
  dlText(`NC戰場_R${state.round}_刻度${state.tick}.txt`, buildFullExportText(), 'text/plain', true);
}
/* ---- 檢視戰場資訊（燈箱） ---- */
function openFieldView(){
  const bg=el('div','modal-bg');
  const m=el('div','modal fieldview');
  const title=el('div','fv-title');
  title.innerHTML=`戰場資訊　<span class="sub">ROUND ${state.round}｜刻度 ${state.tick}</span>`;
  m.appendChild(title);
  const body=el('div','fv-body');
  // 目前戰場
  const s1=el('div','fv-sec'); s1.appendChild(el('div','fv-h','目前戰場單位'));
  const p1=el('pre','fv-pre'); p1.textContent=buildFieldText(); s1.appendChild(p1); body.appendChild(s1);
  // 流程紀錄
  const s2=el('div','fv-sec'); s2.appendChild(el('div','fv-h',`戰鬥流程紀錄（${state.log.length} 筆）`));
  if(!state.log.length){ s2.appendChild(el('div','fv-empty','（尚無紀錄；按「下一刻度／下一輪」後會記錄該刻度的完整流程，且不覆蓋先前紀錄）')); }
  else { state.log.slice().reverse().forEach(r=>{ const pre=el('pre','fv-pre rec'); pre.textContent=recordToText(r); s2.appendChild(pre); }); }
  body.appendChild(s2);
  m.appendChild(body);
  const foot=el('div','fv-foot');
  const bExp=el('button','primary','匯出為 .txt'); bExp.onclick=exportFieldAndLog;
  const bClose=el('button',null,'關閉'); bClose.onclick=()=>bg.remove();
  foot.appendChild(bExp); foot.appendChild(bClose); m.appendChild(foot);
  bg.appendChild(m);
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  document.body.appendChild(bg);
}
