function Svg({ size = 16, children, style, ...p }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style} {...p}>{children}</svg>
  );
}

const Download = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></Svg>;
const Upload = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Svg>;
const X = (p) => <Svg {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Svg>;
const ExternalLink = (p) => <Svg {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></Svg>;
const Cake = (p) => <Svg {...p}><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8" /><path d="M4 16s.5-1 2-1 2.5 1 4 1 2.5-1 4-1 2.5 1 4 1 2-1 2-1" /><path d="M2 21h20M7 8v3M12 8v3M17 8v3M7 4h.01M12 4h.01M17 4h.01" /></Svg>;
const SlidersHorizontal = (p) => <Svg {...p}><line x1="21" y1="4" x2="14" y2="4" /><line x1="10" y1="4" x2="3" y2="4" /><line x1="21" y1="12" x2="12" y2="12" /><line x1="8" y1="12" x2="3" y2="12" /><line x1="21" y1="20" x2="16" y2="20" /><line x1="12" y1="20" x2="3" y2="20" /><line x1="14" y1="2" x2="14" y2="6" /><line x1="8" y1="10" x2="8" y2="14" /><line x1="16" y1="18" x2="16" y2="22" /></Svg>;

const ChevronUp = (p) => <Svg {...p}><polyline points="18 15 12 9 6 15" /></Svg>;

const Table2 = (p) => <Svg {...p}><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18" /></Svg>;

const Eye = (p) => <Svg {...p}><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></Svg>;

/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const PALETTE = ["#b5533a", "#2f6fb0", "#4b8b6e", "#8a5cc4", "#c08a2e", "#c2456b", "#3f7d7a", "#9a5b2f"];

function normMode(v) {
  const s = String(v ?? "").trim().toLowerCase();
  if (["rel", "r", "相對", "相对", "第", "relative"].includes(s)) return "rel";
  return "abs";
}
function toInt(v) {
  const s = String(v ?? "").trim();
  if (s === "") return null;
  const n = parseInt(s, 10);
  return Number.isFinite(n) ? n : null;
}
function internalYear(mode, year, epoch) {
  const y = year ?? 1;
  return mode === "rel" ? epoch + (y - 1) : y;
}
function ordinalOf(d, epoch) {
  const iy = internalYear(d.mode, d.year, epoch);
  const m = d.month ?? 1;
  const day = d.day ?? 1;
  return iy + (m - 1) / 12 + (day - 1) / 372;
}
function ageAt(birth, at, epoch) {
  if (!birth || birth.year == null) return null;
  const by = internalYear(birth.mode, birth.year, epoch);
  const ty = internalYear(at.mode, at.year, epoch);
  let age = ty - by;
  const bm = birth.month ?? 1, bd = birth.day ?? 1;
  const tm = at.month ?? 1, td = at.day ?? 1;
  if (tm < bm || (tm === bm && td < bd)) age -= 1;
  return age;
}
function ageLabel(c, e, epoch) {
  if (c.year == null) return "未設生日";
  const a = ageAt(c, e, epoch);
  return a < 0 ? "尚未出生" : `${a} 歲`;
}
function fmtDate(d) {
  const head = d.mode === "rel" ? `第 ${d.year ?? 1} 年` : `西元 ${d.year ?? 1} 年`;
  const m = d.month != null ? ` ${d.month} 月` : "";
  const day = d.day != null ? ` ${d.day} 日` : "";
  return head + m + day;
}
function parseRelated(v) {
  if (Array.isArray(v)) return v.map((s) => String(s).trim()).filter(Boolean);
  return String(v ?? "").split(/[、,;；\/]+/).map((s) => s.trim()).filter(Boolean);
}
function relatedToStr(arr) { return (arr || []).join("、"); }
function parseLinks(v) {
  if (Array.isArray(v)) return v.filter((l) => l && l.url).map((l) => ({ name: String(l.name || "").trim(), url: String(l.url).trim() }));
  const s = String(v ?? "").trim();
  if (!s) return [];
  return s.split(/[;；\n]+/).map((part) => {
    const t = part.trim();
    if (!t) return null;
    const i = t.indexOf("|");
    if (i >= 0) return { name: t.slice(0, i).trim(), url: t.slice(i + 1).trim() };
    return { name: "", url: t };
  }).filter((l) => l && l.url);
}
function linksToStr(arr) {
  return (arr || []).filter((l) => l && l.url).map((l) => (l.name ? `${l.name}|${l.url}` : l.url)).join(";");
}
function estimateHeight(e, charByName) {
  let h = 22;
  if (e.type) h += 18;
  h += 24;
  h += 18;
  const rel = (e.related || []).filter((n) => charByName[n]);
  if (rel.length) h += 8 + 20 * Math.ceil(rel.length / 2);
  if (e.desc) {
    const explicit = e.desc.split("\n").length;
    const approx = Math.ceil(e.desc.length / 15);
    h += 8 + 22 * Math.max(explicit, approx);
  }
  const links = (e.links || []);
  if (links.length) h += 10 + links.length * 36;
  return h;
}

/* ---------------- seed data ---------------- */
const seedChars = [

  { id: uid(), name: "凱恩·維斯", mode: "rel", year: 2, month: 3, day: 20, color: "#4b8b6e" },
];

  { id: uid(), title: "王國肇建", type: "建國史", mode: "rel", year: 1, month: 1, day: 1, related: [], desc: "三大氏族締結盟約，共立王國，訂為紀元元年。", links: [{ name: "維基：王國", url: "https://zh.wikipedia.org/wiki/王國" }] },
  { id: uid(), title: "艾德里安誕生", type: "人物", mode: "rel", year: 1, month: 1, day: 1, related: ["艾德里安"], desc: "開國之王的長子於立國同日降生。", links: [] },
  { id: uid(), title: "星隕之夜", type: "奇聞", mode: "rel", year: 2, month: 8, day: 3, related: ["露娜"], desc: "天穹落下流星雨，露娜於此夜首度覺醒魔力。\n傳說當夜的星光在湖面停留了整整一炷香。", links: [{ name: "維基：流星", url: "https://zh.wikipedia.org/wiki/流星" }, { name: "維基：星圖", url: "https://zh.wikipedia.org/wiki/星圖" }] },
  { id: uid(), title: "邊境戰役", type: "戰爭", mode: "rel", year: 4, month: 5, day: 10, related: ["凱恩·維斯", "艾德里安"], desc: "凱恩率殘部死守東境隘口，擋下入侵。", links: [] },
  { id: uid(), title: "王都大典", type: "慶典", mode: "rel", year: 6, month: 6, day: 15, related: ["艾德里安"], desc: "艾德里安於王都受封為儲君。", links: [{ name: "維基：加冕", url: "https://zh.wikipedia.org/wiki/加冕" }] },
  { id: uid(), title: "白塔之會", type: "會議", mode: "rel", year: 8, month: 11, day: 2, related: ["露娜", "凱恩·維斯"], desc: "各國法師齊聚白塔，露娜提出以魔力共治的構想。", links: [] },
];

/* ---------------- CSV <-> data ---------------- */
const CHAR_HEADERS = ["角色", "年份模式", "年", "月", "日", "顏色"];
const EVENT_HEADERS = ["事件", "類型", "年份模式", "年", "月", "日", "角色", "說明", "連結"];

function charsToCsv(chars) {
  const rows = chars.map((c) => ({
    角色: c.name, 年份模式: c.mode === "rel" ? "相對" : "絕對",
    年: c.year ?? "", 月: c.month ?? "", 日: c.day ?? "", 顏色: c.color || "",
  }));
  return Papa.unparse({ fields: CHAR_HEADERS, data: rows });
}
function eventsToCsv(events) {
  const rows = events.map((e) => ({
    事件: e.title, 類型: e.type || "", 年份模式: e.mode === "rel" ? "相對" : "絕對",
    年: e.year ?? "", 月: e.month ?? "", 日: e.day ?? "",
    角色: relatedToStr(e.related), 說明: e.desc || "", 連結: linksToStr(e.links),
  }));
  return Papa.unparse({ fields: EVENT_HEADERS, data: rows });
}
function csvToChars(text) {
  const out = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return out.data.map((r) => {
    const name = String(r["角色"] ?? "").trim();
    if (!name) return null;
    return {
      id: uid(), name, mode: normMode(r["年份模式"]),
      year: toInt(r["年"]) ?? 1, month: toInt(r["月"]), day: toInt(r["日"]),
      color: String(r["顏色"] ?? "").trim() || PALETTE[Math.floor(Math.random() * PALETTE.length)],
    };
  }).filter(Boolean);
}
function csvToEvents(text) {
  const out = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return out.data.map((r) => {
    const title = String(r["事件"] ?? "").trim();
    if (!title) return null;
    return {
      id: uid(), title, type: String(r["類型"] ?? "").trim(), mode: normMode(r["年份模式"]),
      year: toInt(r["年"]) ?? 1, month: toInt(r["月"]), day: toInt(r["日"]),
      related: parseRelated(r["角色"]),
      desc: String(r["說明"] ?? "").trim(),
      links: parseLinks(r["連結"]),
    };
  }).filter(Boolean);
}

/* ---------------- layout constants ---------------- */
const CARD_W = 216, LANE_GAP = 16, CONNECTOR = 24, BAND = 30, TOP_PAD = 22, BOT_PAD = 22;

/* ---------------- component ---------------- */
function App() {
  const [mode, setMode] = useState("view");
  const [chars, setChars] = useState(seedChars);
  const [events, setEvents] = useState(seedEvents);
  const [epoch, setEpoch] = useState(1);
  const [axisMode, setAxisMode] = useState("auto");
  const [slot, setSlot] = useState(160); // 事件間距（等距排列）
  const [fs, setFs] = useState(14);
  const [showBirthdays, setShowBirthdays] = useState(true);

  const [iframeUrl, setIframeUrl] = useState(null);
  const [csvOpen, setCsvOpen] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);

  const [charCsv, setCharCsv] = useState(() => charsToCsv(seedChars));
  const [eventCsv, setEventCsv] = useState(() => eventsToCsv(seedEvents));
  const [csvMsg, setCsvMsg] = useState("");

  const [heights, setHeights] = useState({});
  const cardRefs = useRef({});

  const charInputRef = useRef(null);
  const eventInputRef = useRef(null);

  const base = Math.max(13, fs);
  const T = {
    xs: Math.max(13, base - 1), sm: Math.max(13, base),
    md: base + 1, lg: base + 4, xl: base + 12,
  };

  const commit = (nextChars, nextEvents) => {
    setChars(nextChars);
    setEvents(nextEvents);
    setCharCsv(charsToCsv(nextChars));
    setEventCsv(eventsToCsv(nextEvents));
  };

  const addChar = () => commit([...chars, { id: uid(), name: "新角色", mode: "rel", year: 1, month: null, day: null, color: PALETTE[chars.length % PALETTE.length] }], events);
  const updateChar = (id, patch) => commit(chars.map((c) => (c.id === id ? { ...c, ...patch } : c)), events);
  const delChar = (id) => commit(chars.filter((c) => c.id !== id), events);

  const addEvent = () => commit(chars, [...events, { id: uid(), title: "新事件", type: "", mode: "rel", year: 1, month: null, day: null, related: [], desc: "", links: [] }]);
  const updateEvent = (id, patch) => commit(chars, events.map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const delEvent = (id) => commit(chars, events.filter((e) => e.id !== id));

  const charByName = useMemo(() => {
    const m = {};
    chars.forEach((c) => { m[c.name] = c; });
    return m;
  }, [chars]);

  const layout = useMemo(() => {
    if (events.length === 0) {
      return { width: 600, height: 200, empty: true, laid: [], groups: [], bdays: [], axisY: 100 };
    }
    const hOf = (e) => heights[e.id] || estimateHeight(e, charByName);

    // 事件依日期排序後「等距」排列（間距固定，不隨年份差距拉開）
    const withOrd = events.map((e) => ({ ...e, ord: ordinalOf(e, epoch) })).sort((a, b) => a.ord - b.ord);
    const n = withOrd.length;
    const leftPad = CARD_W / 2 + 34;
    const rightPad = CARD_W / 2 + 34;
    const width = leftPad + (n - 1) * slot + rightPad;
    const xAt = (i) => leftPad + i * slot;

    const laid = withOrd.map((e, i) => ({ ...e, x: xAt(i), side: i % 2 === 0 ? "above" : "below", h: hOf(e) }));

    // 依水平重疊分配 lane（避免同側相鄰卡片重疊）
    const laneRight = { above: [], below: [] };
    laid.forEach((e) => {
      const xLeft = e.x - CARD_W / 2, xRight = e.x + CARD_W / 2;
      const lanes = laneRight[e.side];
      let lane = 0;
      while (lane < lanes.length && !(xLeft > lanes[lane] + 12)) lane++;
      lanes[lane] = xRight; e.lane = lane;
    });

    const laneMaxH = { above: [], below: [] };
    laid.forEach((e) => { const arr = laneMaxH[e.side]; arr[e.lane] = Math.max(arr[e.lane] || 0, e.h); });
    const cum = (side) => {
      const arr = laneMaxH[side]; const off = []; let acc = CONNECTOR;
      for (let i = 0; i < arr.length; i++) { off[i] = acc; acc += (arr[i] || 0) + LANE_GAP; }
      return { off, total: arr.length ? acc : 30 };
    };
    const A = cum("above");
    const B = cum("below");
    const bandTop = TOP_PAD + A.total;
    const bandBottom = bandTop + BAND;
    const axisY = bandTop + BAND / 2;
    const height = bandBottom + B.total + BOT_PAD;

    laid.forEach((e) => {
      if (e.side === "above") {
        const bottom = bandTop - A.off[e.lane];
        e.top = bottom - e.h; e.connTop = bottom; e.connBottom = bandTop;
      } else {
        const top = bandBottom + B.off[e.lane];
        e.top = top; e.connTop = bandBottom; e.connBottom = top;
      }
    });

    // 年份群組：同一年的連續事件聚成一段色帶，寬度隨事件數變化
    const allRel = events.every((e) => e.mode === "rel") && chars.every((c) => c.mode === "rel");
    const rawGroups = [];
    withOrd.forEach((e, i) => {
      const iy = internalYear(e.mode, e.year, epoch);
      const last = rawGroups[rawGroups.length - 1];
      if (last && last.iy === iy) last.endIndex = i;
      else rawGroups.push({ iy, startIndex: i, endIndex: i });
    });
    const groups = rawGroups.map((g, gi) => {
      const left = Math.max(0, xAt(g.startIndex) - slot / 2);
      const right = Math.min(width, xAt(g.endIndex) + slot / 2);
      const label = axisMode === "rel" ? `第 ${g.iy - epoch + 1} 年`
        : axisMode === "abs" ? `${g.iy}`
        : (allRel ? `第 ${g.iy - epoch + 1} 年` : `${g.iy}`);
      return { left, width: right - left, center: (left + right) / 2, label, on: gi % 2 === 0 };
    });

    // 生日：在相鄰事件之間依日期內插定位
    const firstOrd = withOrd[0].ord, lastOrd = withOrd[n - 1].ord;
    const xForOrd = (o) => {
      if (o <= firstOrd) return xAt(0);
      if (o >= lastOrd) return xAt(n - 1);
      for (let i = 0; i < n - 1; i++) {
        const a = withOrd[i].ord, b = withOrd[i + 1].ord;
        if (o >= a && o <= b) { const t = b > a ? (o - a) / (b - a) : 0; return xAt(i) + t * (xAt(i + 1) - xAt(i)); }
      }
      return xAt(n - 1);
    };
    const bdays = showBirthdays
      ? chars.filter((c) => c.year != null).map((c) => {
          const o = ordinalOf(c, epoch);
          return { id: c.id, name: c.name, color: c.color, x: xForOrd(o), inRange: o >= firstOrd && o <= lastOrd };
        }).filter((b) => b.inRange)
      : [];

    return { width, height, bandTop, bandBottom, axisY, laid, groups, bdays, empty: false };
  }, [events, chars, epoch, slot, axisMode, showBirthdays, heights, charByName]);

  // 量測每張卡片實際高度，回饋給排版
  useLayoutEffect(() => {
    const next = {};
    let changed = false;
    events.forEach((e) => {
      const el = cardRefs.current[e.id];
      if (el) {
        const h = el.offsetHeight;
        next[e.id] = h;
        if (Math.abs((heights[e.id] || 0) - h) > 0.5) changed = true;
      }
    });
    if (Object.keys(next).length !== Object.keys(heights).length) changed = true;
    if (changed) setHeights(next);
  });

  useEffect(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => setHeights((h) => ({ ...h })));
    }
  }, []);

  const applyCsv = () => {
    try {
      const c = csvToChars(charCsv);
      const e = csvToEvents(eventCsv);
      commit(c, e);
      setCsvMsg(`已套用：角色 ${c.length} 位、事件 ${e.length} 筆。`);
    } catch (err) { setCsvMsg("CSV 解析失敗，請確認欄位與逗號格式。"); }
  };
  const regenCsv = () => {
    setCharCsv(charsToCsv(chars)); setEventCsv(eventsToCsv(events));
    setCsvMsg("已依目前時間軸資料重新產生 CSV。");
  };
  const download = (text, name) => {
    try {
      const blob = new Blob(["\uFEFF" + text], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (e) { setCsvMsg("此環境無法直接下載，請改用「複製」。"); }
  };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); setCsvMsg("已複製到剪貼簿。"); }
    catch (e) { setCsvMsg("複製失敗，請手動選取文字。"); }
  };
  const onFile = (ref, setter) => {
    const f = ref.current?.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { setter(String(r.result || "")); setCsvMsg(`已載入檔案：${f.name}（記得按「套用 CSV」）`); };
    r.readAsText(f, "utf-8");
  };

  const styleTag = `
    * { box-sizing: border-box; }
    .tl-root { font-family: 'Inter', system-ui, -apple-system, "Noto Sans TC", sans-serif; color: var(--ink); }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .tl-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper2);
      color:var(--ink); border-radius:8px; padding:7px 11px; cursor:pointer; font-size:13px; line-height:1; transition:background .15s,border-color .15s; }
    .tl-btn:hover { background:#fff; border-color:#b9beb4; }
    .tl-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .tl-btn.primary:hover { background:#0f5a54; }
    .tl-btn.danger:hover { background:#fbece9; border-color:#d99; color:#a33; }
    .tl-btn:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .tl-seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .tl-seg button { border:0; background:var(--paper2); color:var(--ink); padding:8px 16px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
    .tl-seg button.on { background:var(--accent); color:#fff; }
    .tl-card { position:absolute; width:${CARD_W}px; background:var(--paper2); border:1px solid var(--line);
      border-radius:10px; padding:10px 12px; box-shadow:0 1px 2px rgba(24,30,40,.05); text-align:left; }
    .tl-line { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .tl-scroll::-webkit-scrollbar { height:12px; }
    .tl-scroll::-webkit-scrollbar-thumb { background:#c7ccc2; border-radius:8px; border:3px solid var(--paper); }
    textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .ed-field { font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  `;

  const vars = {
    "--ink": "#1f2530", "--paper": "#f3f4f1", "--paper2": "#fbfbf9",
    "--line": "#d9dcd6", "--muted": "#67707b", "--accent": "#146b64",
  };

  return (
    <div className="tl-root" style={{ ...vars, background: "var(--paper)", minHeight: "100vh", fontSize: base }}>
      <style>{styleTag}</style>

      {/* Header */}
      <div style={{ padding: "18px 20px 12px", borderBottom: "1px solid var(--line)", background: "var(--paper2)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
            <h1 className="serif" style={{ margin: 0, fontSize: T.xl, fontWeight: 600, letterSpacing: "-.01em" }}>紀年時間軸</h1>
            <span style={{ fontSize: T.sm, color: "var(--muted)" }}>依序排列的橫向事件軸 · 角色年齡自動計算</span>
          </div>
          <div className="tl-seg" role="group" aria-label="模式切換">
            <button className={mode === "view" ? "on" : ""} onClick={() => setMode("view")}><Eye size={15} /> 檢視</button>
            <button className={mode === "edit" ? "on" : ""} onClick={() => setMode("edit")}><Pencil size={15} /> 編輯</button>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button className="tl-btn" onClick={() => setSlot((s) => Math.max(100, s - 20))} aria-label="縮小間距"><ZoomOut size={15} /></button>
            <span style={{ fontSize: T.xs, color: "var(--muted)", minWidth: 74, textAlign: "center" }}>間距 {slot}px</span>
            <button className="tl-btn" onClick={() => setSlot((s) => Math.min(320, s + 20))} aria-label="放大間距"><ZoomIn size={15} /></button>
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }}>
            <SlidersHorizontal size={14} /> 字級
            <input type="range" min={13} max={18} value={base} onChange={(e) => setFs(+e.target.value)} style={{ width: 90 }} />
            <span style={{ minWidth: 34 }}>{base}px</span>
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }}>
            年份標籤
            <select value={axisMode} onChange={(e) => setAxisMode(e.target.value)} className="ed-field">
              <option value="auto">自動</option>
              <option value="rel">第 N 年</option>
              <option value="abs">西元</option>
            </select>
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }}>
            <Cake size={14} />
            <input type="checkbox" checked={showBirthdays} onChange={(e) => setShowBirthdays(e.target.checked)} /> 顯示生日
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }} title="混用相對與絕對年份時，用來對齊：第一年 = 哪個西元年">
            第一年＝西元
            <input type="number" value={epoch} onChange={(e) => setEpoch(+e.target.value || 1)} className="ed-field" style={{ width: 74 }} />
          </label>
        </div>
      </div>

      {/* EDIT MODE panel */}
      {mode === "edit" && (
        <div style={{ padding: "16px 20px", borderBottom: "1px solid var(--line)", background: "#eef0ec" }}>
          <CharEditor chars={chars} onAdd={addChar} onUpdate={updateChar} onDelete={delChar} T={T} />
          <div style={{ height: 18 }} />
          <EventEditor events={events} chars={chars} onAdd={addEvent} onUpdate={updateEvent} onDelete={delEvent} T={T} />

          <div style={{ marginTop: 18, borderTop: "1px dashed var(--line)", paddingTop: 14 }}>
            <button className="tl-btn" onClick={() => setCsvOpen((v) => !v)}>
              <Table2 size={15} /> 批次匯入／匯出（CSV） {csvOpen ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
            </button>
            {csvOpen && (
              <div style={{ marginTop: 12 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(320px,1fr))", gap: 16 }}>
                  <CsvBox title="角色（含生日）" icon={<Users size={15} />} value={charCsv} onChange={setCharCsv}
                    onUpload={() => charInputRef.current?.click()} onDownload={() => download(charsToCsv(chars), "characters.csv")}
                    onCopy={() => copy(charsToCsv(chars))} inputRef={charInputRef} onFile={() => onFile(charInputRef, setCharCsv)}
                    headers={CHAR_HEADERS} T={T} />
                  <CsvBox title="事件" icon={<Calendar size={15} />} value={eventCsv} onChange={setEventCsv}
                    onUpload={() => eventInputRef.current?.click()} onDownload={() => download(eventsToCsv(events), "events.csv")}
                    onCopy={() => copy(eventsToCsv(events))} inputRef={eventInputRef} onFile={() => onFile(eventInputRef, setEventCsv)}
                    headers={EVENT_HEADERS} T={T} />
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 12 }}>
                  <button className="tl-btn primary" onClick={applyCsv}>套用 CSV（取代目前資料）</button>
                  <button className="tl-btn" onClick={regenCsv}>依目前資料重產 CSV</button>
                  <button className="tl-btn" onClick={() => setHelpOpen((v) => !v)}><Info size={14} /> 格式說明</button>
                  {csvMsg && <span style={{ fontSize: T.xs, color: "var(--accent)" }}>{csvMsg}</span>}
                </div>
                {helpOpen && (
                  <div style={{ marginTop: 12, fontSize: T.sm, background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 10, padding: "12px 14px", lineHeight: 1.7 }}>
                    <div style={{ marginBottom: 6 }}><b>排列方式</b>：事件依日期先後「等距」排列，年份差距不會拉開間距；同一年的事件會聚成一段色帶。</div>
                    <div style={{ marginBottom: 6 }}><b>類型</b>：自由填寫，如「日常」「劇本名稱」等，顯示在卡片上方。</div>
                    <div style={{ marginBottom: 6 }}><b>年份模式</b>：「相對」＝第 N 年、「絕對」＝西元年（也接受 rel／abs）。<b>月、日</b>可留空。</div>
                    <div style={{ marginBottom: 6 }}><b>角色（關聯）</b>：可多個，用「、」分隔，例如 <code>艾德里安、露娜</code>；會顯示在日期下方並附上年齡。</div>
                    <div style={{ marginBottom: 6 }}><b>說明</b>：可換行；每行照原樣顯示（要條列可自行加「▸」「•」）。</div>
                    <div><b>連結</b>：每筆寫成 <code>名稱|網址</code>，多筆用 <code>;</code> 分隔。</div>
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={{ marginTop: 14, fontSize: T.xs, color: "var(--muted)" }}>
            提醒：關聯是以「角色名稱」對應角色；改角色名時記得一併更新事件的關聯。資料存在此頁面，請用 CSV 下載保存。
          </div>
        </div>
      )}

      {/* Character legend */}
      {chars.length > 0 && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", padding: "10px 20px", borderBottom: "1px solid var(--line)" }}>
          <span style={{ fontSize: T.xs, color: "var(--muted)" }}>角色</span>
          {chars.map((c) => (
            <span key={c.id} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: T.sm }}>
              <span style={{ width: 11, height: 11, borderRadius: 3, background: c.color, display: "inline-block" }} />
              {c.name || "（未命名）"}
              {c.year != null && <span style={{ color: "var(--muted)", fontSize: T.xs }}>· 生於 {fmtDate(c)}</span>}
            </span>
          ))}
        </div>
      )}

      {mode === "edit" && (
        <div style={{ padding: "10px 20px 0", fontSize: T.xs, color: "var(--muted)" }}>即時預覽</div>
      )}

      {/* Timeline canvas */}
      <div className="tl-scroll" style={{ overflowX: "auto", overflowY: "hidden", padding: "6px 0 10px" }}>
        <div style={{ position: "relative", width: layout.width, height: layout.height, margin: "0 auto", minWidth: "100%" }}>
          {layout.empty ? (
            <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", color: "var(--muted)", fontSize: T.md }}>
              尚無事件。切到「編輯」模式，按「新增事件」加入資料。
            </div>
          ) : (
            <React.Fragment>
              {layout.groups.map((g, i) => (
                <React.Fragment key={i}>
                  <div style={{ position: "absolute", left: g.left, top: 6, width: g.width, bottom: 6, background: g.on ? "rgba(31,37,48,.04)" : "transparent" }} />
                  {i > 0 && <div style={{ position: "absolute", left: g.left, top: 6, width: 1, bottom: 6, background: "rgba(31,37,48,.08)" }} />}
                  <div style={{ position: "absolute", left: g.center, top: layout.axisY + 8, transform: "translateX(-50%)", fontSize: T.xs, color: "var(--muted)", whiteSpace: "nowrap" }}>{g.label}</div>
                </React.Fragment>
              ))}

              <div style={{ position: "absolute", left: 0, right: 0, top: layout.axisY - 1, height: 2, background: "linear-gradient(90deg, transparent, #9aa39b 6%, #9aa39b 94%, transparent)" }} />

              {layout.bdays.map((b) => (
                <div key={b.id} title={`${b.name} 生日`} style={{ position: "absolute", left: b.x, top: layout.axisY, transform: "translate(-50%,-50%) rotate(45deg)", width: 9, height: 9, background: b.color, border: "1.5px solid var(--paper2)", borderRadius: 2 }} />
              ))}

              {layout.laid.map((e) => {
                const related = e.related || [];
                const primary = related.length && charByName[related[0]] ? charByName[related[0]] : null;
                const accent = primary ? primary.color : "#146b64";
                return (
                  <div key={"c" + e.id} style={{ position: "absolute", left: e.x, top: e.connTop, width: 2, height: Math.max(0, e.connBottom - e.connTop), background: accent, opacity: 0.5, transform: "translateX(-1px)" }} />
                );
              })}
              {layout.laid.map((e) => {
                const related = e.related || [];
                const primary = related.length && charByName[related[0]] ? charByName[related[0]] : null;
                const accent = primary ? primary.color : "#146b64";
                return (
                  <div key={"d" + e.id} style={{ position: "absolute", left: e.x, top: layout.axisY, transform: "translate(-50%,-50%)", width: 12, height: 12, borderRadius: "50%", background: accent, border: "2px solid var(--paper2)", boxShadow: "0 0 0 1px rgba(31,37,48,.15)" }} />
                );
              })}

              {layout.laid.map((e) => {
                const related = e.related || [];
                const links = e.links || [];
                const relChars = related.map((n) => charByName[n]).filter(Boolean);
                const primary = relChars.length ? relChars[0] : null;
                const accent = primary ? primary.color : "#146b64";
                return (
                  <div key={e.id} ref={(el) => { if (el) cardRefs.current[e.id] = el; }} className="tl-card"
                    style={{ left: e.x - CARD_W / 2, top: e.top, borderLeft: `3px solid ${accent}` }}>

                    {e.type && <div className="tl-line" style={{ fontSize: 13, color: accent, fontWeight: 600, letterSpacing: ".02em", marginBottom: 2 }}>{e.type}</div>}

                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
                      <div className="serif tl-line" title={e.title} style={{ fontSize: T.md, fontWeight: 600, lineHeight: 1.2 }}>{e.title}</div>
                      {links.length > 0 && <Link2 size={14} style={{ color: accent, flexShrink: 0, marginTop: 2 }} />}
                    </div>

                    <div style={{ fontSize: T.xs, color: "var(--muted)", marginTop: 3 }}>{fmtDate(e)}</div>

                    {relChars.length > 0 && (
                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 12px", marginTop: 6 }}>
                        {relChars.map((c) => (
                          <span key={c.id} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: T.sm }}>
                            <span style={{ width: 11, height: 11, borderRadius: 3, background: c.color, display: "inline-block", flexShrink: 0 }} />
                            <span style={{ fontWeight: 600 }}>{c.name}</span>
                            <span style={{ color: "var(--muted)" }}>{ageLabel(c, e, epoch)}</span>
                          </span>
                        ))}
                      </div>
                    )}

                    {e.desc && <p style={{ margin: "8px 0 0", fontSize: T.sm, lineHeight: 1.6, whiteSpace: "pre-wrap", color: "var(--ink)" }}>{e.desc}</p>}

                    {links.length > 0 && (
                      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                        {links.map((l, i) => (
                          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <button className="tl-btn primary" style={{ padding: "6px 9px", maxWidth: "100%" }} onClick={() => setIframeUrl(l.url)}>
                              <ExternalLink size={13} /> <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name || l.url}</span>
                            </button>
                            <a className="tl-btn" style={{ padding: "6px 9px", textDecoration: "none", flexShrink: 0 }} href={l.url} target="_blank" rel="noreferrer" title="新分頁"><Link2 size={13} /></a>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
      </div>

      <div style={{ padding: "8px 20px 22px", fontSize: T.xs, color: "var(--muted)" }}>
        事件依日期先後等距排列，往右持續延伸；同一年聚成一段色帶。標題過長時，游標停在標題上會顯示完整文字。
      </div>

      {/* in-page link viewer */}
      {iframeUrl && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(20,24,32,.55)", zIndex: 100, display: "flex", flexDirection: "column", padding: "3vh 3vw" }} onClick={() => setIframeUrl(null)}>
          <div style={{ display: "flex", flexDirection: "column", flex: 1, background: "var(--paper2)", borderRadius: 12, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,.4)" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderBottom: "1px solid var(--line)" }}>
              <Link2 size={15} style={{ color: "var(--accent)" }} />
              <span style={{ fontSize: T.xs, color: "var(--muted)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{iframeUrl}</span>
              <a className="tl-btn" style={{ textDecoration: "none" }} href={iframeUrl} target="_blank" rel="noreferrer"><ExternalLink size={14} /> 新分頁</a>
              <button className="tl-btn" onClick={() => setIframeUrl(null)}><X size={14} /> 關閉</button>
            </div>
            <div style={{ position: "relative", flex: 1 }}>
              <iframe src={iframeUrl} title="連結檢視" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", border: 0 }} sandbox="allow-scripts allow-same-origin allow-popups allow-forms" />
              <div style={{ position: "absolute", bottom: 10, left: 0, right: 0, textAlign: "center", fontSize: 13, color: "var(--muted)", pointerEvents: "none" }}>
                若此處空白，代表該網站不允許被內嵌 — 請按右上「新分頁」開啟。
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Character editor ---------------- */
function CharEditor({ chars, onAdd, onUpdate, onDelete, T }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: T.md, fontWeight: 600, marginBottom: 8 }}>
        <Users size={15} /> 角色（{chars.length}）
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {chars.map((c) => (
          <div key={c.id} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 9, padding: "8px 10px" }}>
            <input className="ed-field" value={c.name} onChange={(e) => onUpdate(c.id, { name: e.target.value })} placeholder="名稱" style={{ flex: "1 1 120px", minWidth: 100 }} />
            <select className="ed-field" value={c.mode} onChange={(e) => onUpdate(c.id, { mode: e.target.value })}>
              <option value="rel">相對</option><option value="abs">絕對</option>
            </select>
            <input className="ed-field" type="number" value={c.year ?? ""} onChange={(e) => onUpdate(c.id, { year: toInt(e.target.value) })} placeholder="年" style={{ width: 64 }} />
            <input className="ed-field" type="number" value={c.month ?? ""} onChange={(e) => onUpdate(c.id, { month: toInt(e.target.value) })} placeholder="月" style={{ width: 56 }} />
            <input className="ed-field" type="number" value={c.day ?? ""} onChange={(e) => onUpdate(c.id, { day: toInt(e.target.value) })} placeholder="日" style={{ width: 56 }} />
            <input type="color" value={c.color || "#888888"} onChange={(e) => onUpdate(c.id, { color: e.target.value })} title="顏色" style={{ width: 38, height: 32, padding: 2, border: "1px solid var(--line)", borderRadius: 7, background: "#fff", cursor: "pointer" }} />
            <button className="tl-btn danger" onClick={() => onDelete(c.id)} title="刪除角色"><Trash size={13} /></button>
          </div>
        ))}
        {chars.length === 0 && <div style={{ fontSize: T.sm, color: "var(--muted)" }}>尚無角色。</div>}
      </div>
      <button className="tl-btn" style={{ marginTop: 8 }} onClick={onAdd}><Plus size={14} /> 新增角色</button>
    </div>
  );
}

/* ---------------- Event editor ---------------- */
function EventEditor({ events, chars, onAdd, onUpdate, onDelete, T }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: T.md, fontWeight: 600, marginBottom: 8 }}>
        <Calendar size={15} /> 事件（{events.length}）
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {events.map((e) => {
          const related = e.related || [];
          const links = e.links || [];
          const toggleRel = (name) => onUpdate(e.id, { related: related.includes(name) ? related.filter((n) => n !== name) : [...related, name] });
          const setLink = (idx, patch) => onUpdate(e.id, { links: links.map((l, i) => (i === idx ? { ...l, ...patch } : l)) });
          const addLink = () => onUpdate(e.id, { links: [...links, { name: "", url: "" }] });
          const delLink = (idx) => onUpdate(e.id, { links: links.filter((_, i) => i !== idx) });
          return (
            <div key={e.id} style={{ background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <input className="ed-field" value={e.title} onChange={(ev) => onUpdate(e.id, { title: ev.target.value })} placeholder="事件標題" style={{ flex: 1, fontSize: 14, fontWeight: 600 }} />
                <button className="tl-btn danger" onClick={() => onDelete(e.id)} title="刪除事件"><Trash size={13} /> 刪除</button>
              </div>

              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
                <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 13, color: "var(--muted)" }}>
                  類型
                  <input className="ed-field" value={e.type || ""} onChange={(ev) => onUpdate(e.id, { type: ev.target.value })} placeholder="如：日常、劇本名…" style={{ width: 150 }} />
                </label>
                <select className="ed-field" value={e.mode} onChange={(ev) => onUpdate(e.id, { mode: ev.target.value })}>
                  <option value="rel">相對</option><option value="abs">絕對</option>
                </select>
                <input className="ed-field" type="number" value={e.year ?? ""} onChange={(ev) => onUpdate(e.id, { year: toInt(ev.target.value) })} placeholder="年" style={{ width: 64 }} />
                <input className="ed-field" type="number" value={e.month ?? ""} onChange={(ev) => onUpdate(e.id, { month: toInt(ev.target.value) })} placeholder="月" style={{ width: 56 }} />
                <input className="ed-field" type="number" value={e.day ?? ""} onChange={(ev) => onUpdate(e.id, { day: toInt(ev.target.value) })} placeholder="日" style={{ width: 56 }} />
              </div>

              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
                <span style={{ fontSize: 13, color: "var(--muted)" }}>關聯角色</span>
                {chars.length === 0 && <span style={{ fontSize: 13, color: "var(--muted)" }}>（尚無角色）</span>}
                {chars.map((c) => {
                  const on = related.includes(c.name);
                  return (
                    <button key={c.id} onClick={() => toggleRel(c.name)}
                      style={{ fontSize: 13, padding: "4px 9px", borderRadius: 999, cursor: "pointer", border: `1px solid ${on ? c.color : "var(--line)"}`, background: on ? c.color : "#fff", color: on ? "#fff" : "var(--ink)" }}>
                      {c.name || "（未命名）"}
                    </button>
                  );
                })}
              </div>

              <textarea className="ed-field" value={e.desc} onChange={(ev) => onUpdate(e.id, { desc: ev.target.value })} placeholder="說明（可換行）" rows={3}
                style={{ width: "100%", marginTop: 8, resize: "vertical", lineHeight: 1.5 }} />

              <div style={{ marginTop: 8 }}>
                <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 4 }}>連結（可多筆，各自一行）</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {links.map((l, idx) => (
                    <div key={idx} style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                      <input className="ed-field" value={l.name} onChange={(ev) => setLink(idx, { name: ev.target.value })} placeholder="連結名稱" style={{ flex: "1 1 120px", minWidth: 90 }} />
                      <input className="ed-field" value={l.url} onChange={(ev) => setLink(idx, { url: ev.target.value })} placeholder="https://…" style={{ flex: "2 1 200px", minWidth: 140 }} />
                      <button className="tl-btn danger" onClick={() => delLink(idx)} title="刪除連結"><Trash size={13} /></button>
                    </div>
                  ))}
                </div>
                <button className="tl-btn" style={{ marginTop: 6 }} onClick={addLink}><Plus size={14} /> 新增連結</button>
              </div>
            </div>
          );
        })}
        {events.length === 0 && <div style={{ fontSize: T.sm, color: "var(--muted)" }}>尚無事件。</div>}
      </div>
      <button className="tl-btn" style={{ marginTop: 10 }} onClick={onAdd}><Plus size={14} /> 新增事件</button>
    </div>
  );
}

/* ---------------- CSV box ---------------- */
function CsvBox({ title, icon, value, onChange, onUpload, onDownload, onCopy, inputRef, onFile, headers, T }) {
  return (
    <div style={{ background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 10, padding: 12 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: T.md, fontWeight: 600 }}>{icon}{title}</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="tl-btn" onClick={onUpload}><Upload size={13} /> 上傳</button>
          <button className="tl-btn" onClick={onDownload}><Download size={13} /> 下載</button>
          <button className="tl-btn" onClick={onCopy}><Copy size={13} /> 複製</button>
          <input ref={inputRef} type="file" accept=".csv,text/csv" style={{ display: "none" }} onChange={onFile} />
        </div>
      </div>
      <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 6 }}>欄位：{headers.join("，")}</div>
      <textarea className="mono" value={value} onChange={(e) => onChange(e.target.value)} spellCheck={false}
        style={{ width: "100%", height: 150, fontSize: 13, lineHeight: 1.5, padding: 10, border: "1px solid var(--line)", borderRadius: 8, resize: "vertical", background: "#fff", color: "var(--ink)" }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
