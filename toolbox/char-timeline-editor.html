/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const PALETTE = ["#b5533a", "#2f6fb0", "#4b8b6e", "#8a5cc4", "#c08a2e", "#c2456b", "#3f7d7a", "#9a5b2f"];

function normMode(v) {
  const s = String(v ?? "").trim().toLowerCase();
  if (["rel", "r", "相對", "相对", "第", "relative"].includes(s)) return "rel";
  return "abs";
}
function toInt(v) {
  const s = String(v ?? "").trim();
  if (s === "") return null;
  const n = parseInt(s, 10);
  return Number.isFinite(n) ? n : null;
}
function internalYear(mode, year, epoch) {
  const y = year ?? 1;
  return mode === "rel" ? epoch + (y - 1) : y;
}
function ordinalOf(d, epoch) {
  const iy = internalYear(d.mode, d.year, epoch);
  const m = d.month ?? 1;
  const day = d.day ?? 1;
  return iy + (m - 1) / 12 + (day - 1) / 372;
}
function ageAt(birth, at, epoch) {
  if (!birth || birth.year == null) return null;
  const by = internalYear(birth.mode, birth.year, epoch);
  const ty = internalYear(at.mode, at.year, epoch);
  let age = ty - by;
  const bm = birth.month ?? 1, bd = birth.day ?? 1;
  const tm = at.month ?? 1, td = at.day ?? 1;
  if (tm < bm || (tm === bm && td < bd)) age -= 1;
  return age;
}
function ageLabel(c, e, epoch) {
  if (c.year == null) return "未設生日";
  const a = ageAt(c, e, epoch);
  return a < 0 ? "尚未出生" : `${a} 歲`;
}
function fmtDate(d) {
  const head = d.mode === "rel" ? `第 ${d.year ?? 1} 年` : `西元 ${d.year ?? 1} 年`;
  const m = d.month != null ? ` ${d.month} 月` : "";
  const day = d.day != null ? ` ${d.day} 日` : "";
  return head + m + day;
}
function parseRelated(v) {
  if (Array.isArray(v)) return v.map((s) => String(s).trim()).filter(Boolean);
  return String(v ?? "").split(/[、,;；\/]+/).map((s) => s.trim()).filter(Boolean);
}
function relatedToStr(arr) { return (arr || []).join("、"); }
function parseLinks(v) {
  if (Array.isArray(v)) return v.filter((l) => l && l.url).map((l) => ({ name: String(l.name || "").trim(), url: String(l.url).trim() }));
  const s = String(v ?? "").trim();
  if (!s) return [];
  return s.split(/[|\r\n]+/).map((part) => {
    const t = part.trim();
    if (!t) return null;
    const i = t.indexOf(",");
    if (i >= 0) return { name: t.slice(0, i).trim(), url: t.slice(i + 1).trim() };
    return { name: "", url: t };
  }).filter((l) => l && l.url);
}
function linksToStr(arr) {
  return (arr || []).filter((l) => l && l.url).map((l) => `${l.name || ""},${l.url}`).join("|");
}
// 顏色：把多個關聯角色的代表色混成中間色 / 做成漸層
function hexToRgb(h) {
  h = String(h || "").trim().replace("#", "");
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (h.length !== 6) return null;
  const n = parseInt(h, 16);
  if (!Number.isFinite(n)) return null;
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  const c = (x) => ("0" + Math.round(x).toString(16)).slice(-2);
  return "#" + c(r) + c(g) + c(b);
}
function blendColors(colors) {
  const rgbs = (colors || []).map(hexToRgb).filter(Boolean);
  if (!rgbs.length) return null;
  const s = rgbs.reduce((a, c) => ({ r: a.r + c.r, g: a.g + c.g, b: a.b + c.b }), { r: 0, g: 0, b: 0 });
  const n = rgbs.length;
  return rgbToHex(s.r / n, s.g / n, s.b / n);
}
function barGradient(colors) {
  const list = (colors || []).filter(Boolean);
  if (!list.length) return "#146b64";
  if (list.length === 1) return list[0];
  return `linear-gradient(180deg, ${list.join(", ")})`;
}
function estimateHeight(e, chars, editing) {
  if (editing) return 430;
  let h = 24;
  if (e.type) h += 18;
  h += 24;
  h += 18;
  if (chars.length) h += 8 + 20 * Math.ceil(chars.length / 2);
  if (e.desc) {
    const explicit = e.desc.split("\n").length;
    const approx = Math.ceil(e.desc.length / 15);
    h += 8 + 22 * Math.max(explicit, approx);
  }
  const links = (e.links || []);
  if (links.length) h += 10 + links.length * 34;
  const noteN = e.note ? e.note.split(/[|\r\n]+/).filter((s) => s.trim()).length : 0;
  if (noteN) h += 8 + 18 * noteN;
  if ((e.story && e.story.trim()) || (e.afterword && e.afterword.trim())) h += 10 + 34;
  const rel = (e.related || []).length;
  if (rel) h += 12 + 24 * Math.ceil(rel / 3);
  return h;
}

/* ---------------- 匯出檢視版 HTML（唯讀） ---------------- */
function buildExportHtml(boot, script) {
  const dataJson = JSON.stringify(boot).replace(/</g, "\\u003c");

  const pageTitle = rawTitle.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return [
    '<!DOCTYPE html>',
    '<html lang="zh-Hant"><head>',
    '<meta charset="UTF-8" />',
    '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
    '<title>' + pageTitle + '</title>',
    '<link rel="preconnect" href="https://fonts.googleapis.com" />',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />',
    '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />',
    '<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>',
    '<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>',
    '<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js" crossorigin><\/script>',
    '<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin><\/script>',
    '<style>html,body{margin:0;background:#f3f4f1}</style>',
    '</head><body>',
    '<div id="root"></div>',
    '<script>window.__CTE_BOOT__ = ' + dataJson + ';<\/script>',
    '<script type="text/babel">' + script + '<\/script>',
    '</body></html>'
  ].join("\n");
}

/* ---------------- 開機設定（檢視版由此帶入資料並鎖定編輯） ---------------- */
const BOOT = (typeof window !== "undefined" && window.__CTE_BOOT__) ? window.__CTE_BOOT__ : null;
const READONLY = !!(BOOT && BOOT.readOnly);
const INIT_CHARS = BOOT && Array.isArray(BOOT.chars) ? BOOT.chars : seedChars;
const INIT_EVENTS = BOOT && Array.isArray(BOOT.events) ? BOOT.events : seedEvents;
const INIT_SET = (BOOT && BOOT.settings) || {};

/* ---------------- CSV <-> data ---------------- */
const STORY_LABEL = "小記"; // 短篇故事欄位名稱（要改名改這裡即可）
const AFTER_LABEL = "後記"; // 小記後記欄位名稱
const CHAR_HEADERS = ["角色", "年份模式", "年", "月", "日", "顏色"];
const EVENT_HEADERS = ["事件", "類型", "年份模式", "年", "月", "日", "角色", "說明", "註記", "連結", STORY_LABEL, AFTER_LABEL];

function charsToCsv(chars) {
  const rows = chars.map((c) => ({
    角色: c.name, 年份模式: c.mode === "rel" ? "相對" : "絕對",
    年: c.year ?? "", 月: c.month ?? "", 日: c.day ?? "", 顏色: c.color || "",
  }));
  return Papa.unparse({ fields: CHAR_HEADERS, data: rows });
}
function eventsToCsv(events) {
  const rows = events.map((e) => ({
    事件: e.title, 類型: e.type || "", 年份模式: e.mode === "rel" ? "相對" : "絕對",
    年: e.year ?? "", 月: e.month ?? "", 日: e.day ?? "",
    角色: relatedToStr(e.related), 說明: e.desc || "", 註記: e.note || "", 連結: linksToStr(e.links), [STORY_LABEL]: e.story || "", [AFTER_LABEL]: e.afterword || "",
  }));
  return Papa.unparse({ fields: EVENT_HEADERS, data: rows });
}
function csvToChars(text) {
  const out = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return out.data.map((r) => {
    const name = String(r["角色"] ?? "").trim();
    if (!name) return null;
    return {
      id: uid(), name, mode: normMode(r["年份模式"]),
      year: toInt(r["年"]) ?? 1, month: toInt(r["月"]), day: toInt(r["日"]),
      color: String(r["顏色"] ?? "").trim() || PALETTE[Math.floor(Math.random() * PALETTE.length)],
    };
  }).filter(Boolean);
}
function csvToEvents(text) {
  const out = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return out.data.map((r) => {
    const title = String(r["事件"] ?? "").trim();
    if (!title) return null;
    return {
      id: uid(), title, type: String(r["類型"] ?? "").trim(), mode: normMode(r["年份模式"]),
      year: toInt(r["年"]) ?? 1, month: toInt(r["月"]), day: toInt(r["日"]),
      related: parseRelated(r["角色"]),
      desc: String(r["說明"] ?? "").trim(),
      note: String(r["註記"] ?? "").replace(/\r\n/g, "\n").trim(),
      links: parseLinks(r["連結"]),
      story: String(r[STORY_LABEL] ?? "").replace(/\r\n/g, "\n"),
      afterword: String(r[AFTER_LABEL] ?? "").replace(/\r\n/g, "\n"),
    };
  }).filter(Boolean);
}

  const [title, setTitle] = useState(INIT_SET.title ?? "紀年時間軸");

  const [editingId, setEditingId] = useState(null);
  const [tip, setTip] = useState(null);

  const [charsOpen, setCharsOpen] = useState(false);

  const [helpOpen, setHelpOpen] = useState(false);

  const [charCsv, setCharCsv] = useState(() => charsToCsv(INIT_CHARS));
  const [eventCsv, setEventCsv] = useState(() => eventsToCsv(INIT_EVENTS));
  const [csvMsg, setCsvMsg] = useState("");

  const [heights, setHeights] = useState({});
  const cardRefs = useRef({});
  const scrollRef = useRef(null);
  const dragRef = useRef(null);
  const charInputRef = useRef(null);
  const eventInputRef = useRef(null);

  const base = Math.max(13, fs);
  const T = {
    xs: Math.max(13, base - 1), sm: Math.max(13, base),
    md: base + 1, lg: base + 4, xl: base + 12,
  };

  const commit = (nextChars, nextEvents) => {
    setChars(nextChars);
    setEvents(nextEvents);
    setCharCsv(charsToCsv(nextChars));
    setEventCsv(eventsToCsv(nextEvents));
  };

  const addChar = () => commit([...chars, { id: uid(), name: "新角色", mode: "rel", year: 1, month: null, day: null, color: PALETTE[chars.length % PALETTE.length] }], events);

  const delChar = (id) => commit(chars.filter((c) => c.id !== id), events);

  const addEvent = () => {
    const ne = { id: uid(), title: "新事件", type: "", mode: "rel", year: 1, month: null, day: null, related: [], desc: "", note: "", links: [], story: "", afterword: "" };
    commit(chars, [...events, ne]);
    setEditingId(ne.id);
  };
  const updateEvent = (id, patch) => commit(chars, events.map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const delEvent = (id) => { if (editingId === id) setEditingId(null); commit(chars, events.filter((e) => e.id !== id)); };

  const downloadBlob = (text, name, mime) => {
    try {
      const blob = new Blob([mime.indexOf("csv") >= 0 ? "\uFEFF" + text : text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (e) { setCsvMsg("此環境無法直接下載，請改用「複製」。"); }
  };
  const exportView = () => {
    try {
      const boot = { readOnly: true, chars, events, settings: { epoch, axisMode, slot, fs, showBirthdays, title } };
      const el = document.querySelector('script[type="text/babel"]');
      const script = el ? el.textContent : "";
      const html = buildExportHtml(boot, script);
      downloadBlob(html, "char-timeline-view.html", "text/html;charset=utf-8");
      setCsvMsg("已匯出檢視版 HTML（char-timeline-view.html）。");
    } catch (e) { setCsvMsg("匯出失敗。"); }
  };

  const charByName = useMemo(() => {
    const m = {};
    chars.forEach((c) => { m[c.name] = c; });
    return m;
  }, [chars]);

  const layout = useMemo(() => {
    if (events.length === 0) {
      return { width: 600, height: 200, empty: true, laid: [], groups: [], bdays: [], axisY: 100, bandTop: 40 };
    }
    const hOf = (e) => heights[e.id] || estimateHeight(e, chars, editingId === e.id);
    const wOf = (e) => (editingId === e.id ? EDIT_W : CARD_W);

    const withOrd = events.map((e) => ({ ...e, ord: ordinalOf(e, epoch) })).sort((a, b) => a.ord - b.ord);
    const n = withOrd.length;
    const maxW = EDIT_W;
    const leftPad = maxW / 2 + 20;
    const rightPad = maxW / 2 + 20;
    const width = leftPad + (n - 1) * slot + rightPad;
    const xAt = (i) => leftPad + i * slot;

    const laid = withOrd.map((e, i) => ({ ...e, x: xAt(i), h: hOf(e), w: wOf(e) }));
    const laneRight = [];
    laid.forEach((e) => {
      const xLeft = e.x - e.w / 2, xRight = e.x + e.w / 2;
      let lane = 0;
      while (lane < laneRight.length && !(xLeft > laneRight[lane] + 12)) lane++;
      laneRight[lane] = xRight; e.lane = lane;
    });
    const laneMaxH = [];
    laid.forEach((e) => { laneMaxH[e.lane] = Math.max(laneMaxH[e.lane] || 0, e.h); });
    const off = []; let acc = CONNECTOR;
    for (let i = 0; i < laneMaxH.length; i++) { off[i] = acc; acc += (laneMaxH[i] || 0) + LANE_GAP; }
    const belowTotal = laneMaxH.length ? acc : 30;

    const aboveArea = 30;
    const bandTop = TOP_PAD + aboveArea;
    const bandBottom = bandTop + BAND;
    const axisY = bandTop + BAND / 2;
    const height = bandBottom + belowTotal + BOT_PAD;

    laid.forEach((e) => {
      const top = bandBottom + off[e.lane];
      e.top = top; e.connTop = bandBottom; e.connBottom = top;
    });

    const allRel = events.every((e) => e.mode === "rel") && chars.every((c) => c.mode === "rel");
    const rawGroups = [];
    withOrd.forEach((e, i) => {
      const iy = internalYear(e.mode, e.year, epoch);
      const last = rawGroups[rawGroups.length - 1];
      if (last && last.iy === iy) last.endIndex = i;
      else rawGroups.push({ iy, startIndex: i, endIndex: i });
    });
    const groups = rawGroups.map((g, gi) => {
      const first = laid[g.startIndex];
      const left = Math.max(0, xAt(g.startIndex) - slot / 2);
      const right = Math.min(width, xAt(g.endIndex) + slot / 2);
      const label = axisMode === "rel" ? `第 ${g.iy - epoch + 1} 年`
        : axisMode === "abs" ? `${g.iy}`
        : (allRel ? `第 ${g.iy - epoch + 1} 年` : `${g.iy}`);
      return { left, width: right - left, on: gi % 2 === 0, label, labelCenter: first.x, labelTop: 24 };
    });

    const firstOrd = withOrd[0].ord, lastOrd = withOrd[n - 1].ord;
    const xForOrd = (o) => {
      if (o <= firstOrd) return xAt(0);
      if (o >= lastOrd) return xAt(n - 1);
      for (let i = 0; i < n - 1; i++) {
        const a = withOrd[i].ord, b = withOrd[i + 1].ord;
        if (o >= a && o <= b) { const t = b > a ? (o - a) / (b - a) : 0; return xAt(i) + t * (xAt(i + 1) - xAt(i)); }
      }
      return xAt(n - 1);
    };
    const bdays = showBirthdays
      ? chars.filter((c) => c.year != null).map((c) => {
          const o = ordinalOf(c, epoch);
          return { id: c.id, name: c.name, color: c.color, x: xForOrd(o), inRange: o >= firstOrd && o <= lastOrd };
        }).filter((b) => b.inRange)
      : [];

    return { width, height, bandTop, bandBottom, axisY, laid, groups, bdays, empty: false };
  }, [events, chars, epoch, slot, axisMode, showBirthdays, heights, editingId]);

  useLayoutEffect(() => {
    const next = {};
    let changed = false;
    events.forEach((e) => {
      const el = cardRefs.current[e.id];
      if (el) {
        const h = el.offsetHeight;
        next[e.id] = h;
        if (Math.abs((heights[e.id] || 0) - h) > 0.5) changed = true;
      }
    });
    if (Object.keys(next).length !== Object.keys(heights).length) changed = true;
    if (changed) setHeights(next);
  });

  useEffect(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => setHeights((h) => ({ ...h })));
    }
  }, []);

  useEffect(() => { document.title = (title && title.trim()) ? title : "紀年時間軸"; }, [title]);

  // 拖曳平移：在卡片以外的空白處按住左鍵拖曳，左右平移時間軸
  const onCanvasMouseDown = (e) => {
    if (e.button !== 0) return;
    const t = e.target;
    if (t && t.closest && t.closest(".tl-card, button, a, input, textarea, select")) return;
    const el = scrollRef.current;
    if (!el) return;
    dragRef.current = { startX: e.clientX, startLeft: el.scrollLeft };
    el.classList.add("dragging");
    e.preventDefault();
  };
  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current, el = scrollRef.current;
      if (!d || !el) return;
      el.scrollLeft = d.startLeft - (e.clientX - d.startX);
    };
    const onUp = () => {
      if (!dragRef.current) return;
      dragRef.current = null;
      const el = scrollRef.current;
      if (el) el.classList.remove("dragging");
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, []);

  // 即時提示（僅在文字被截斷時顯示，無瀏覽器預設延遲）
  const showTip = (ev, text) => {
    const el = ev.currentTarget;
    if (el && el.scrollWidth > el.clientWidth + 1) setTip({ text, x: ev.clientX, y: ev.clientY });
  };
  const hideTip = () => setTip(null);

  const applyCsv = () => {
    try {
      const c = csvToChars(charCsv);
      const e = csvToEvents(eventCsv);
      setEditingId(null);
      commit(c, e);
      setCsvMsg(`已套用：角色 ${c.length} 位、事件 ${e.length} 筆。`);
    } catch (err) { setCsvMsg("CSV 解析失敗，請確認欄位與逗號格式。"); }
  };
  const regenCsv = () => {
    setCharCsv(charsToCsv(chars)); setEventCsv(eventsToCsv(events));
    setCsvMsg("已依目前時間軸資料重新產生 CSV。");
  };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); setCsvMsg("已複製到剪貼簿。"); }
    catch (e) { setCsvMsg("複製失敗，請手動選取文字。"); }
  };
  const onFile = (ref, setter) => {
    const f = ref.current?.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { setter(String(r.result || "")); setCsvMsg(`已載入檔案：${f.name}（記得按「套用 CSV」）`); };
    r.readAsText(f, "utf-8");
  };

  const styleTag = `
    * { box-sizing: border-box; }
    .tl-root { font-family: 'Inter', system-ui, -apple-system, "Noto Sans TC", sans-serif; color: var(--ink); }
    .serif { font-family: 'Newsreader', Georgia, serif; }
    .tl-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper2);
      color:var(--ink); border-radius:8px; padding:7px 11px; cursor:pointer; font-size:13px; line-height:1; transition:background .15s,border-color .15s; }
    .tl-btn:hover { background:#fff; border-color:#b9beb4; }
    .tl-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .tl-btn.primary:hover { background:#0f5a54; }
    .tl-btn.danger { color:#a33; }
    .tl-btn.danger:hover { background:#fbece9; border-color:#d99; color:#a33; }
    .tl-btn:focus-visible, .tl-icon:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .tl-icon { border:0; background:transparent; color:var(--muted); cursor:pointer; padding:3px; border-radius:6px; display:inline-flex; flex-shrink:0; }
    .tl-icon:hover { color:var(--accent); background:rgba(20,107,100,.10); }
    .tl-title-input { margin:0; border:0; background:transparent; padding:2px 6px; border-radius:7px; border-bottom:1px dashed transparent; max-width:100%; }
    .tl-title-input:hover { border-bottom-color:var(--line); }
    .tl-title-input:focus { outline:none; border-bottom-color:var(--accent); background:#fff; }
    .tl-card { position:absolute; background:var(--paper2); border:1px solid var(--line);
      border-radius:10px; padding:10px 12px; box-shadow:0 1px 2px rgba(24,30,40,.05); text-align:left; cursor:default; }
    .tl-scroll { cursor:grab; }
    .tl-scroll.dragging { cursor:grabbing; user-select:none; }
    .tl-card.editing { box-shadow:0 12px 34px rgba(24,30,40,.20); z-index:30; }
    .tl-line { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .tl-scroll::-webkit-scrollbar { height:12px; }
    .tl-scroll::-webkit-scrollbar-thumb { background:#c7ccc2; border-radius:8px; border:3px solid var(--paper); }
    textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .ed-field { font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  `;

  const vars = {
    "--ink": "#1f2530", "--paper": "#f3f4f1", "--paper2": "#fbfbf9",
    "--line": "#d9dcd6", "--muted": "#67707b", "--accent": "#146b64",
  };

  return (
    <div className="tl-root" style={{ ...vars, background: "var(--paper)", minHeight: "100vh", fontSize: base }}>
      <style>{styleTag}</style>

      {/* Header */}
      <div style={{ padding: "18px 20px 12px", borderBottom: "1px solid var(--line)", background: "var(--paper2)" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          {READONLY ? (
            <h1 className="serif" style={{ margin: 0, fontSize: T.xl, fontWeight: 600, letterSpacing: "-.01em" }}>{title || "紀年時間軸"}</h1>
          ) : (
            <input className="serif tl-title-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="網頁名稱" aria-label="網頁名稱"
              title="自訂網頁名稱"
              style={{ fontSize: T.xl, fontWeight: 600, letterSpacing: "-.01em", color: "var(--ink)", width: Math.max(140, (title || "").length * T.xl + 34) }} />
          )}
          <span style={{ fontSize: T.sm, color: "var(--muted)" }}>{READONLY ? "檢視版（唯讀）" : "依序排列 · 全員年齡自動計算"}</span>
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 12 }}>
          {!READONLY && (
            <React.Fragment>
              <button className="tl-btn primary" onClick={addEvent}><Plus size={15} /> 新增事件</button>
              <button className="tl-btn" onClick={() => setCharsOpen((v) => !v)}><Users size={15} /> 角色 {charsOpen ? <ChevronUp size={14} /> : <ChevronDown size={14} />}</button>
              <button className="tl-btn" onClick={() => setCsvOpen((v) => !v)}><Table2 size={15} /> CSV {csvOpen ? <ChevronUp size={14} /> : <ChevronDown size={14} />}</button>
              <button className="tl-btn" onClick={exportView}><FileDown size={15} /> 匯出檢視版</button>
              <span style={{ width: 1, height: 22, background: "var(--line)", margin: "0 2px" }} />
            </React.Fragment>
          )}

          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button className="tl-btn" onClick={() => setSlot((s) => Math.max(150, s - 20))} aria-label="縮小間距"><ZoomOut size={15} /></button>
            <span style={{ fontSize: T.xs, color: "var(--muted)", minWidth: 74, textAlign: "center" }}>間距 {slot}px</span>
            <button className="tl-btn" onClick={() => setSlot((s) => Math.min(380, s + 20))} aria-label="放大間距"><ZoomIn size={15} /></button>
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }}>
            <SlidersHorizontal size={14} /> 字級
            <input type="range" min={13} max={18} value={base} onChange={(e) => setFs(+e.target.value)} style={{ width: 84 }} />
            <span style={{ minWidth: 34 }}>{base}px</span>
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }}>
            年份標籤
            <select value={axisMode} onChange={(e) => setAxisMode(e.target.value)} className="ed-field">
              <option value="auto">自動</option>
              <option value="rel">第 N 年</option>
              <option value="abs">西元</option>
            </select>
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }}>
            <Cake size={14} />
            <input type="checkbox" checked={showBirthdays} onChange={(e) => setShowBirthdays(e.target.checked)} /> 生日
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: T.xs, color: "var(--muted)" }} title="混用相對與絕對年份時，用來對齊：第一年 = 哪個西元年">
            第一年＝西元
            <input type="number" value={epoch} onChange={(e) => setEpoch(+e.target.value || 1)} className="ed-field" style={{ width: 70 }} />
          </label>
        </div>
      </div>

      {/* Characters panel */}
      {!READONLY && charsOpen && (
        <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--line)", background: "#eef0ec" }}>
          <CharEditor chars={chars} onAdd={addChar} onUpdate={updateChar} onDelete={delChar} T={T} />
        </div>
      )}

      {/* CSV panel */}
      {!READONLY && csvOpen && (
        <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--line)", background: "#eef0ec" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(320px,1fr))", gap: 16 }}>
            <CsvBox title="角色（含生日）" icon={<Users size={15} />} value={charCsv} onChange={setCharCsv}
              onUpload={() => charInputRef.current?.click()} onDownload={() => downloadBlob(charsToCsv(chars), "characters.csv", "text/csv;charset=utf-8;")}
              onCopy={() => copy(charsToCsv(chars))} inputRef={charInputRef} onFile={() => onFile(charInputRef, setCharCsv)}
              headers={CHAR_HEADERS} T={T} />
            <CsvBox title="事件" icon={<Calendar size={15} />} value={eventCsv} onChange={setEventCsv}
              onUpload={() => eventInputRef.current?.click()} onDownload={() => downloadBlob(eventsToCsv(events), "events.csv", "text/csv;charset=utf-8;")}
              onCopy={() => copy(eventsToCsv(events))} inputRef={eventInputRef} onFile={() => onFile(eventInputRef, setEventCsv)}
              headers={EVENT_HEADERS} T={T} />
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 12 }}>
            <button className="tl-btn primary" onClick={applyCsv}>套用 CSV（取代目前資料）</button>
            <button className="tl-btn" onClick={regenCsv}>依目前資料重產 CSV</button>
            <button className="tl-btn" onClick={() => setHelpOpen((v) => !v)}><Info size={14} /> 格式說明</button>
            {csvMsg && <span style={{ fontSize: T.xs, color: "var(--accent)" }}>{csvMsg}</span>}
          </div>
          {helpOpen && (
            <div style={{ marginTop: 12, fontSize: T.sm, background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 10, padding: "12px 14px", lineHeight: 1.7 }}>
              <div style={{ marginBottom: 6 }}><b>類型</b>：自由填寫，如「日常」「劇本名稱」等。</div>
              <div style={{ marginBottom: 6 }}><b>年份模式</b>：「相對」＝第 N 年、「絕對」＝西元年（也接受 rel／abs）。<b>月、日</b>可留空。</div>
              <div style={{ marginBottom: 6 }}><b>角色（關聯）</b>：可多個，用「、」分隔；以小標籤顯示在卡片最下方。年齡則一律列出全部角色。</div>
              <div style={{ marginBottom: 6 }}><b>說明</b>：可換行，照原樣顯示。</div>
              <div style={{ marginBottom: 6 }}><b>註記</b>：事件的追加備註，多筆用 <code>|</code> 分隔，以 12px 小字（前綴▸）逐筆顯示，與說明有所區別。</div>
              <div><b>連結</b>：每筆寫成 <code>名稱,網址</code>，多筆用 <code>|</code> 分隔；點擊一律開新視窗。</div>
              <div style={{ marginTop: 6 }}><b>{STORY_LABEL}</b>：短篇故事（可換行）。有填寫時，卡片會出現「閱讀{STORY_LABEL}」按鈕，點擊以頁內視窗閱讀；留空則不顯示按鈕。</div>
              <div style={{ marginTop: 6 }}><b>{AFTER_LABEL}</b>：顯示於{STORY_LABEL}內文最後的後記（可換行），以分隔線與斜體淡色呈現。</div>
            </div>
          )}
        </div>
      )}

      {/* Character legend */}
      {chars.length > 0 && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", padding: "10px 20px", borderBottom: "1px solid var(--line)" }}>
          <span style={{ fontSize: T.xs, color: "var(--muted)" }}>角色</span>
          {chars.map((c) => (
            <span key={c.id} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: T.sm }}>
              <span style={{ width: 11, height: 11, borderRadius: 3, background: c.color, display: "inline-block" }} />
              {c.name || "（未命名）"}
              {c.year != null && <span style={{ color: "var(--muted)", fontSize: T.xs }}>· 生於 {fmtDate(c)}</span>}
            </span>
          ))}
        </div>
      )}

      {/* Timeline canvas */}
      <div className="tl-scroll" ref={scrollRef} onMouseDown={onCanvasMouseDown} style={{ overflowX: "auto", overflowY: "hidden", padding: "6px 0 10px" }}>
        <div style={{ position: "relative", width: layout.width, height: layout.height, margin: "0 auto", minWidth: "100%" }}>
          {layout.empty ? (
            <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", color: "var(--muted)", fontSize: T.md }}>
              {READONLY ? "尚無事件。" : "尚無事件。點左上「新增事件」開始。"}
            </div>
          ) : (
            <React.Fragment>
              {layout.groups.map((g, i) => (
                <React.Fragment key={i}>
                  <div style={{ position: "absolute", left: g.left, top: 6, width: g.width, bottom: 6, background: g.on ? "rgba(31,37,48,.04)" : "transparent" }} />
                  {i > 0 && <div style={{ position: "absolute", left: g.left, top: 6, width: 1, bottom: 6, background: "rgba(31,37,48,.08)" }} />}
                </React.Fragment>
              ))}

              <div style={{ position: "absolute", left: 0, right: 0, top: layout.axisY - 1, height: 2, background: "linear-gradient(90deg, transparent, #9aa39b 4%, #9aa39b 96%, transparent)" }} />

              {layout.bdays.map((b) => (
                <div key={b.id} title={`${b.name} 生日`} style={{ position: "absolute", left: b.x, top: layout.axisY, transform: "translate(-50%,-50%) rotate(45deg)", width: 9, height: 9, background: b.color, border: "1.5px solid var(--paper2)", borderRadius: 2 }} />
              ))}

              {/* 年份：顯示在時間軸橫線上方 */}
              {layout.groups.map((g, i) => (
                <div key={"y" + i} style={{ position: "absolute", left: g.labelCenter, top: g.labelTop, transform: "translateX(-50%)", fontSize: T.sm, color: "var(--muted)", fontWeight: 700, whiteSpace: "nowrap" }}>{g.label}</div>
              ))}

              {layout.laid.map((e) => {
                const relColors = (e.related || []).map((n) => charByName[n]).filter(Boolean).map((c) => c.color);
                const accent = blendColors(relColors) || "#146b64";
                return (
                  <div key={"c" + e.id} style={{ position: "absolute", left: e.x, top: e.connTop, width: 2, height: Math.max(0, e.connBottom - e.connTop), background: accent, opacity: 0.5, transform: "translateX(-1px)" }} />
                );
              })}
              {layout.laid.map((e) => {
                const relColors = (e.related || []).map((n) => charByName[n]).filter(Boolean).map((c) => c.color);
                const accent = blendColors(relColors) || "#146b64";
                return (
                  <div key={"d" + e.id} style={{ position: "absolute", left: e.x, top: layout.axisY, transform: "translate(-50%,-50%)", width: 12, height: 12, borderRadius: "50%", background: accent, border: "2px solid var(--paper2)", boxShadow: "0 0 0 1px rgba(31,37,48,.15)" }} />
                );
              })}

              {layout.laid.map((e) => {
                const editing = !READONLY && editingId === e.id;
                const related = e.related || [];
                const links = e.links || [];
                const relChars = related.map((n) => charByName[n]).filter(Boolean);
                const relColors = relChars.map((c) => c.color);
                const accent = blendColors(relColors) || "#146b64";
                const barBg = barGradient(relColors);
                const noteLines = (e.note || "").split(/[|\r\n]+/).map((s) => s.trim()).filter(Boolean);
                return (
                  <div key={e.id} ref={(el) => { if (el) cardRefs.current[e.id] = el; }}
                    className={"tl-card" + (editing ? " editing" : "")}
                    style={{ left: e.x - e.w / 2, top: e.top, width: e.w, overflow: "hidden" }}>
                    <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: 4, background: barBg }} />
                    {editing ? (
                      <EventCardForm e={e} chars={chars} onUpdate={updateEvent}
                        onDelete={() => delEvent(e.id)} onDone={() => setEditingId(null)} T={T} />
                    ) : (
                      <React.Fragment>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
                          <div style={{ minWidth: 0, flex: 1 }}>
                            {e.type && <div className="tl-line" style={{ fontSize: 13, color: accent, fontWeight: 600, letterSpacing: ".02em", marginBottom: 2 }}>{e.type}</div>}
                            <div className="serif tl-line" onMouseEnter={(ev) => showTip(ev, e.title)} onMouseLeave={hideTip} style={{ fontSize: T.md, fontWeight: 600, lineHeight: 1.2 }}>{e.title}</div>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 2, flexShrink: 0 }}>
                            {links.length > 0 && <Link2 size={14} style={{ color: accent, marginTop: 2 }} />}
                            {!READONLY && <button className="tl-icon" onClick={() => setEditingId(e.id)} title="編輯此事件"><Pencil size={15} /></button>}
                          </div>
                        </div>

                        <div style={{ fontSize: T.xs, color: "var(--muted)", marginTop: 3 }}>{fmtDate(e)}</div>

                        {relChars.length > 0 && (
                          <div style={{ marginTop: 6, display: "flex", flexWrap: "wrap", gap: 6 }}>
                            {relChars.map((c) => (
                              <span key={c.id} style={{ fontSize: 13, padding: "2px 9px", borderRadius: 999, border: `1px solid ${c.color}`, color: c.color, background: "var(--paper2)" }}>{c.name}</span>
                            ))}
                          </div>
                        )}

                        {e.desc && <p style={{ margin: "8px 0 0", fontSize: T.sm, lineHeight: 1.6, whiteSpace: "pre-wrap", color: "var(--ink)" }}>{e.desc}</p>}

                        {noteLines.length > 0 && (
                          <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 2 }}>
                            {noteLines.map((ln, i) => (
                              <div key={i} style={{ fontSize: 12, color: "var(--muted)", lineHeight: 1.5, display: "flex", gap: 5, alignItems: "flex-start" }}>
                                <span style={{ color: accent, flexShrink: 0, fontWeight: 700 }}>▸</span>
                                <span style={{ whiteSpace: "pre-wrap" }}>{ln}</span>
                              </div>
                            ))}
                          </div>
                        )}

                        {((e.story && e.story.trim()) || (e.afterword && e.afterword.trim())) && (
                          <button className="tl-btn" style={{ marginTop: 10, padding: "6px 10px", borderColor: accent, color: accent }} onClick={() => setStory({ title: e.title, text: e.story, afterword: e.afterword })}>
                            <BookOpen size={14} /> 閱讀{STORY_LABEL}
                          </button>
                        )}

                        {links.length > 0 && (
                          <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                            {links.map((l, i) => (
                              <a key={i} className="tl-btn" style={{ padding: "6px 9px", textDecoration: "none", justifyContent: "flex-start", maxWidth: "100%" }} href={l.url} target="_blank" rel="noreferrer">
                                <ExternalLink size={13} style={{ flexShrink: 0 }} /> <span onMouseEnter={(ev) => showTip(ev, l.name || l.url)} onMouseLeave={hideTip} style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0 }}>{l.name || l.url}</span>
                              </a>
                            ))}
                          </div>
                        )}

                        {chars.length > 0 && (
                          <div style={{ marginTop: 10, paddingTop: 8, borderTop: "1px dashed var(--line)", display: "flex", flexWrap: "wrap", gap: "4px 12px" }}>
                            {chars.map((c) => (
                              <span key={c.id} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: T.sm }}>
                                <span style={{ width: 11, height: 11, borderRadius: 3, background: c.color, display: "inline-block", flexShrink: 0 }} />
                                <span style={{ fontWeight: 600 }}>{c.name}</span>
                                <span style={{ color: "var(--muted)" }}>{ageLabel(c, e, epoch)}</span>
                              </span>
                            ))}
                          </div>
                        )}
                      </React.Fragment>
                    )}
                  </div>
                );
              })}
            </React.Fragment>
          )}
        </div>
      </div>

      <div style={{ padding: "8px 20px 22px", fontSize: T.xs, color: "var(--muted)" }}>
        {READONLY
          ? "檢視版：資料唯讀，無法編輯。年份標示於時間軸橫線上方；日期下方小標籤為關聯角色，卡片最下方列出全部角色的當時年齡；連結開新視窗。"
          : "年份標示於時間軸橫線上方；日期下方小標籤為關聯角色，卡片最下方列出全部角色的當時年齡。點卡片右上鉛筆鈕就地編輯；連結一律開新視窗。"}
      </div>

      {story && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(20,24,32,.55)", zIndex: 150, display: "flex", padding: "4vh 4vw" }} onClick={() => setStory(null)}>
          <div style={{ display: "flex", flexDirection: "column", margin: "auto", width: "100%", maxWidth: 640, maxHeight: "88vh", background: "var(--paper2)", borderRadius: 14, overflow: "hidden", boxShadow: "0 24px 70px rgba(0,0,0,.42)" }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 18px", borderBottom: "1px solid var(--line)" }}>
              <BookOpen size={17} style={{ color: "var(--accent)", flexShrink: 0 }} />
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontSize: T.xs, color: "var(--muted)" }}>{STORY_LABEL}</div>
                <div className="serif" style={{ fontSize: T.lg, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{story.title}</div>
              </div>
              <button className="tl-btn" onClick={() => setStory(null)}><X size={14} /> 關閉</button>
            </div>
            <div style={{ padding: "20px 22px", overflowY: "auto" }}>
              {story.text && story.text.trim() && <div style={{ fontSize: T.md, lineHeight: 1.9, whiteSpace: "pre-wrap", color: "var(--ink)" }}>{story.text}</div>}
              {story.afterword && story.afterword.trim() && (
                <div style={{ marginTop: (story.text && story.text.trim()) ? 24 : 0, paddingTop: (story.text && story.text.trim()) ? 16 : 0, borderTop: (story.text && story.text.trim()) ? "1px solid var(--line)" : "none" }}>
                  <div style={{ fontSize: T.xs, color: "var(--muted)", fontWeight: 600, letterSpacing: ".08em", marginBottom: 8 }}>{AFTER_LABEL}</div>
                  <div style={{ fontSize: T.sm, lineHeight: 1.85, whiteSpace: "pre-wrap", color: "var(--muted)", fontStyle: "italic" }}>{story.afterword}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {tip && (() => {
        const vw = typeof window !== "undefined" ? window.innerWidth : 1200;
        const vh = typeof window !== "undefined" ? window.innerHeight : 800;
        const maxW = 340;
        let left = tip.x + 14;
        if (left + maxW > vw - 8) left = Math.max(8, tip.x - maxW - 14);
        let top = tip.y + 18;
        if (top > vh - 60) top = Math.max(8, tip.y - 40);
        return (
          <div style={{ position: "fixed", left, top, maxWidth: maxW, background: "var(--ink)", color: "#fff", fontSize: 13, lineHeight: 1.4, padding: "6px 9px", borderRadius: 7, boxShadow: "0 6px 20px rgba(0,0,0,.28)", zIndex: 200, pointerEvents: "none", whiteSpace: "normal", wordBreak: "break-word" }}>{tip.text}</div>
        );
      })()}
    </div>
  );
}

/* ---------------- in-card event edit form ---------------- */
function EventCardForm({ e, chars, onUpdate, onDelete, onDone, T }) {
  const related = e.related || [];
  const links = e.links || [];
  const toggleRel = (name) => onUpdate(e.id, { related: related.includes(name) ? related.filter((n) => n !== name) : [...related, name] });
  const setLink = (idx, patch) => onUpdate(e.id, { links: links.map((l, i) => (i === idx ? { ...l, ...patch } : l)) });
  const addLink = () => onUpdate(e.id, { links: [...links, { name: "", url: "" }] });
  const delLink = (idx) => onUpdate(e.id, { links: links.filter((_, i) => i !== idx) });
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 13, color: "var(--accent)", fontWeight: 600 }}>編輯事件</span>
        <button className="tl-btn primary" style={{ padding: "5px 10px" }} onClick={onDone}><Check size={14} /> 完成</button>
      </div>
      <input className="ed-field" value={e.title} onChange={(ev) => onUpdate(e.id, { title: ev.target.value })} placeholder="事件標題" style={{ fontSize: 14, fontWeight: 600 }} />
      <input className="ed-field" value={e.type || ""} onChange={(ev) => onUpdate(e.id, { type: ev.target.value })} placeholder="類型（如：日常、劇本名…）" />
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        <select className="ed-field" value={e.mode} onChange={(ev) => onUpdate(e.id, { mode: ev.target.value })}>
          <option value="rel">相對</option><option value="abs">絕對</option>
        </select>
        <input className="ed-field" type="number" value={e.year ?? ""} onChange={(ev) => onUpdate(e.id, { year: toInt(ev.target.value) })} placeholder="年" style={{ width: 66 }} />
        <input className="ed-field" type="number" value={e.month ?? ""} onChange={(ev) => onUpdate(e.id, { month: toInt(ev.target.value) })} placeholder="月" style={{ width: 58 }} />
        <input className="ed-field" type="number" value={e.day ?? ""} onChange={(ev) => onUpdate(e.id, { day: toInt(ev.target.value) })} placeholder="日" style={{ width: 58 }} />
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        <span style={{ fontSize: 13, color: "var(--muted)" }}>關聯角色</span>
        {chars.length === 0 && <span style={{ fontSize: 13, color: "var(--muted)" }}>（尚無角色）</span>}
        {chars.map((c) => {
          const on = related.includes(c.name);
          return (
            <button key={c.id} onClick={() => toggleRel(c.name)}
              style={{ fontSize: 13, padding: "4px 9px", borderRadius: 999, cursor: "pointer", border: `1px solid ${on ? c.color : "var(--line)"}`, background: on ? c.color : "#fff", color: on ? "#fff" : "var(--ink)" }}>
              {c.name || "（未命名）"}
            </button>
          );
        })}
      </div>
      <textarea className="ed-field" value={e.desc} onChange={(ev) => onUpdate(e.id, { desc: ev.target.value })} placeholder="說明（可換行）" rows={3} style={{ resize: "vertical", lineHeight: 1.5 }} />
      <textarea className="ed-field" value={e.note || ""} onChange={(ev) => onUpdate(e.id, { note: ev.target.value })} placeholder="註記（每筆用 | 分隔，12px 小字顯示）" rows={2} style={{ resize: "vertical", lineHeight: 1.5, fontSize: 12 }} />
      <div>
        <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 4 }}>連結（可多筆）</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {links.map((l, idx) => (
            <div key={idx} style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input className="ed-field" value={l.name} onChange={(ev) => setLink(idx, { name: ev.target.value })} placeholder="名稱" style={{ flex: "1 1 80px", minWidth: 60 }} />
              <input className="ed-field" value={l.url} onChange={(ev) => setLink(idx, { url: ev.target.value })} placeholder="https://…" style={{ flex: "2 1 120px", minWidth: 100 }} />
              <button className="tl-icon" onClick={() => delLink(idx)} title="刪除連結"><Trash size={14} /></button>
            </div>
          ))}
        </div>
        <button className="tl-btn" style={{ marginTop: 6 }} onClick={addLink}><Plus size={14} /> 新增連結</button>
      </div>
      <div>
        <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 4 }}>{STORY_LABEL}（短篇故事；填了才會在卡片顯示閱讀按鈕）</div>
        <textarea className="ed-field" value={e.story || ""} onChange={(ev) => onUpdate(e.id, { story: ev.target.value })} placeholder="在此填寫短篇故事…（留空則不顯示按鈕）" rows={4} style={{ width: "100%", resize: "vertical", lineHeight: 1.6 }} />
      </div>
      <div>
        <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 4 }}>{AFTER_LABEL}（顯示於{STORY_LABEL}內文最後，可換行）</div>
        <textarea className="ed-field" value={e.afterword || ""} onChange={(ev) => onUpdate(e.id, { afterword: ev.target.value })} placeholder="在此填寫後記…" rows={3} style={{ width: "100%", resize: "vertical", lineHeight: 1.6, fontStyle: "italic" }} />
      </div>
      <button className="tl-btn danger" onClick={onDelete} style={{ justifyContent: "center", marginTop: 2 }}><Trash size={14} /> 刪除此事件</button>
    </div>
  );
}

/* ---------------- Character editor ---------------- */
function CharEditor({ chars, onAdd, onUpdate, onDelete, T }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: T.md, fontWeight: 600, marginBottom: 8 }}>
        <Users size={15} /> 角色（{chars.length}）
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {chars.map((c) => (
          <div key={c.id} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 9, padding: "8px 10px" }}>
            <input className="ed-field" value={c.name} onChange={(e) => onUpdate(c.id, { name: e.target.value })} placeholder="名稱" style={{ flex: "1 1 120px", minWidth: 100 }} />
            <select className="ed-field" value={c.mode} onChange={(e) => onUpdate(c.id, { mode: e.target.value })}>
              <option value="rel">相對</option><option value="abs">絕對</option>
            </select>
            <input className="ed-field" type="number" value={c.year ?? ""} onChange={(e) => onUpdate(c.id, { year: toInt(e.target.value) })} placeholder="年" style={{ width: 64 }} />
            <input className="ed-field" type="number" value={c.month ?? ""} onChange={(e) => onUpdate(c.id, { month: toInt(e.target.value) })} placeholder="月" style={{ width: 56 }} />
            <input className="ed-field" type="number" value={c.day ?? ""} onChange={(e) => onUpdate(c.id, { day: toInt(e.target.value) })} placeholder="日" style={{ width: 56 }} />
            <input type="color" value={c.color || "#888888"} onChange={(e) => onUpdate(c.id, { color: e.target.value })} title="顏色" style={{ width: 38, height: 32, padding: 2, border: "1px solid var(--line)", borderRadius: 7, background: "#fff", cursor: "pointer" }} />
            <button className="tl-btn danger" onClick={() => onDelete(c.id)} title="刪除角色"><Trash size={13} /></button>
          </div>
        ))}
        {chars.length === 0 && <div style={{ fontSize: T.sm, color: "var(--muted)" }}>尚無角色。</div>}
      </div>
      <button className="tl-btn" style={{ marginTop: 8 }} onClick={onAdd}><Plus size={14} /> 新增角色</button>
    </div>
  );
}

/* ---------------- CSV box ---------------- */
function CsvBox({ title, icon, value, onChange, onUpload, onDownload, onCopy, inputRef, onFile, headers, T }) {
  return (
    <div style={{ background: "var(--paper2)", border: "1px solid var(--line)", borderRadius: 10, padding: 12 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: T.md, fontWeight: 600 }}>{icon}{title}</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="tl-btn" onClick={onUpload}><Upload size={13} /> 上傳</button>
          <button className="tl-btn" onClick={onDownload}><Download size={13} /> 下載</button>
          <button className="tl-btn" onClick={onCopy}><Copy size={13} /> 複製</button>
          <input ref={inputRef} type="file" accept=".csv,text/csv" style={{ display: "none" }} onChange={onFile} />
        </div>
      </div>
      <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 6 }}>欄位：{headers.join("，")}</div>
      <textarea className="mono" value={value} onChange={(e) => onChange(e.target.value)} spellCheck={false}
        style={{ width: "100%", height: 150, fontSize: 13, lineHeight: 1.5, padding: 10, border: "1px solid var(--line)", borderRadius: 8, resize: "vertical", background: "#fff", color: "var(--ink)" }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
